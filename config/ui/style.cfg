uiopencmd "uiopen"
uiclosecmd "uiclose"

// sizing styles
deffvarp ui_text $fvaridxnonzero 1.1 $fvaridxmax
deffvarp ui_textxlarge $fvaridxnonzero 2.25 $fvaridxmax
deffvarp ui_textsmall $fvaridxnonzero 1.0 $fvaridxmax
deffvarp ui_textsmaller $fvaridxnonzero 0.9 $fvaridxmax
deffvarp ui_texttiny $fvaridxnonzero 0.85 $fvaridxmax
deffvarp ui_textxtiny $fvaridxnonzero 0.8 $fvaridxmax
deffvarp ui_textsub $fvaridxnonzero 0.5 $fvaridxmax
deffvarp ui_textcompass $fvaridxnonzero 0.7 $fvaridxmax
deffvarp ui_textradar $fvaridxnonzero 0.5 $fvaridxmax
deffvarp ui_textradarlarge $fvaridxnonzero 0.6 $fvaridxmax
deffvarp ui_padhud $fvaridxnonzero 0.010 $fvaridxmax
deffvarp ui_padlarge $fvaridxnonzero 0.020 $fvaridxmax
deffvarp ui_padnormal $fvaridxnonzero 0.006 $fvaridxmax
deffvarp ui_padsmall $fvaridxnonzero 0.004 $fvaridxmax
deffvarp ui_padsmaller $fvaridxnonzero 0.00225 $fvaridxmax
deffvarp ui_padtiny $fvaridxnonzero 0.001 $fvaridxmax
deffvarp ui_padinside $fvaridxnonzero 0.001 $fvaridxmax

deffvarp ui_slidersize $fvaridxnonzero 0.0205 $fvaridxmax

deffvarp ui_texborder $fvaridxnonzero 0.15 1
deffvarp ui_screenborder $fvaridxnonzero 0.002 $fvaridxmax

// colour styles
defhvarp ui_menu 0 0xFF000000 0xFFFFFFFF        // window background
deffvarp ui_menu_s $fvaridxmin 0.001 $fvaridxmax // shadow
defhvarp ui_line 0 0xFF202020 0xFFFFFFFF        // all-around line
defhvarp ui_bline 0 0xFF606060 0xFFFFFFFF       // all-around bright line
defhvarp ui_main1 0 0xFF383838 0xFFFFFFFF       // main colour 1
defhvarp ui_main2 0 0xFF303030 0xFFFFFFFF       // main colour 2
defhvarp ui_main3 0 0xFF282828 0xFFFFFFFF       // main colour 3

defhvarp ui_transor 0 0xA0000000 0xFFFFFFFF

// timings
defvarp ui_tooltipdelay 0 250 $varidxmax
defvarp ui_tooltipblend 0 100 $varidxmax

// textures
deftvarp exittex "<grey>textures/hud/exit"
deftvarp skintex "<grey>textures/hud/uiskin"
deftvarp skinalphatex "<grey>textures/hud/uiskinalpha"
deftvarp skinshadowtex "<grey>textures/hud/uiskinshadow"
deftvarp skinshadowhoriztex "<grey>textures/hud/uiskinshadowhoriz"
deftvarp blurskintex "<grey>textures/hud/blurskin"
deftvarp skinbordertex "<grey>textures/hud/uiskinborder"
deftvarp playerbliptex "<grey>textures/hud/playerblip"
deftvarp bliptex "<grey>textures/hud/blip"
deftvarp glowtex "<grey>textures/hud/glow"
deftvarp radarcircletex "<grey>textures/hud/radarcircle"
deftvarp radarsquaretex "<grey>textures/hud/radarsquare"
deftvarp burntex "<grey>textures/icons/burn"
deftvarp bleedtex "<grey>textures/icons/bleed"
deftvarp shocktex "<grey>textures/icons/shock"
deftvarp corrodetex "<grey>textures/icons/corrode"
deftvarp winnertex "<grey>textures/icons/winner"
deftvarp infotex "<grey>textures/icons/info"

deftvarp hinttex "<comp:0,0.25,2>hint"
deftvarp hintenttex "<comp:0,0.25,2>hintent"
deftvarp hintboldtex "<comp:0,0.25,2>hintbold"

deftvarp pointsharptex "<grey>textures/hud/pointsharp"
deftvarp arrowsharptex "<grey><rotate:2>textures/hud/pointsharp"

deftvarp startex "<grey>textures/icons/star"
deftvarp dottex "<grey>textures/icons/dot"

newuistyle = [
    [ui_style_@arg1] = [@arg2]
]

uistyle = [
    [ui_style_@arg1] [@arg2] [@arg3] [@arg4] [@arg5] [@arg6] [@arg7] [@arg8] [@arg9] [@arg10] [@arg11] [@arg12] [@arg13] [@arg14] [@arg15] [@arg16] [@arg17] [@arg18] [@arg19] [@arg20] [@arg21] [@arg22] [@arg23] [@arg24] [@arg25]
]

newuistyle clampxy      [uiclamp 1 1 1 1]
newuistyle clampx       [uiclamp 1 1 0 0]
newuistyle clampy       [uiclamp 0 0 1 1]

newuistyle lefttop      [uialign -1 -1]
newuistyle leftmiddle   [uialign -1 0]
newuistyle leftbottom   [uialign -1 1]

newuistyle centertop    [uialign 0 -1]
newuistyle centermiddle [uialign 0 0]
newuistyle centerbottom [uialign 0 1]

newuistyle righttop     [uialign 1 -1]
newuistyle rightmiddle  [uialign 1 0]
newuistyle rightbottom  [uialign 1 1]
