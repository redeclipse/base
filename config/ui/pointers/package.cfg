// Pointers: the Crosshair, cursors, the Clip, the Indicator and the circle bar, drawn as signed distance fields
// Every Crosshair and cursor shape is compiled into one shader, and every Round shape into another, so a shape can Morph into the next

defvarp showcrosshair 0 2 2 // 0 = off, 1 = on, 2 = blend depending on current accuracy level
defvarp crosshairweapons 0 1 3 // 0 = off, &1 = crosshair-specific weapons, &2 = also apply colour
deffvarp crosshairsize 0 0.05 1000
deffvarp crosshairscale 0 1 4
deffvarp crosshairblend 0 0.75 1
deffvarp crosshairaccamt 0 0 1
defvarp crosshairflash 0 1 3 // 0 = off, &1 = flash red when below spawn health, &2 = colour by health
deffvarp crosshairthrob 0 0 1000
defhvarp crosshairtone (- 0 $CTONE_MAX) 0 0xFFFFFF
defsvarp crosshair "cross-01"
defvarp crosshairhitspeed 0 250 $varidxmax
defhvarp hitcrosshairtone (- 0 $CTONE_MAX) 0 0xFFFFFF
deffvarp crosshairhitthick 0 0.05 1 // how much the Hit effect thickens the Crosshair
defvarp showhitmarker 0 1 1 // the Hit marker, ticks bursting out from the Crosshair as your damage lands
defvarp hitmarkertime 1 100 1000
deffvarp hitmarkersize 0 0.2 1
defhvarp hitmarkercolour 0 0xFF4040 0xFFFFFF
defhvarp hitmarkercore 0 0xFFEE40 0xFFFFFF
deffvarp pointeroutline 0 4 25 // width of the dark outline around Pointers and Rounds, in percent of their size
deffvarp pointeroutlinefade 0 3 25 // how far the outline fades out, in percent of their size
deffvarp pointeroutlineblend 0 0.75 1
defvarp crosshairdemo 0 0 1
defvarp crosshairdistance 0 0 1 // 0 = off, 1 = shows distance to crosshair target
deffvarp crosshairdistblend 0 1 1
deffvarp crosshairdistancex -1 0.15 1 // offset from the crosshair
deffvarp crosshairdistancey -1 0.075 1
deffvarp pointergap 0 0.004 0.1 // space left between the Crosshair, the Indicator, the circle bar and the Clip
defvarp pointermorphtime 0 150 10000 // how long a pointer takes to Morph into another, except when switching weapons

pointer_weapcrosshairs = [
    claw "claw" 0.045 pistol "pistol" 0.045 sword "sword" 0.045 shotgun "shotgun" 0.045 smg "smg" 0.045 flamer "flamer" 0.0625
    plasma "plasma" 0.0625 zapper "zapper" 0.0625 rifle "rifle" 0.075 corroder "corroder" 0.075 trident "trident" 0.045 grenade "grenade" 0.05
    mine "mine" 0.05 rocket "rocket" 0.045 minigun "minigun" 0.045 jetsaw "jetsaw" 0.045 eclipse "eclipse" 0.0625 melee "melee" 0.045
]
looplist3 w s z $pointer_weapcrosshairs [
    deffvarp (concatword $w crosshairsize) 0 $z 1000
    deffvarp (concatword $w crosshairblend) 0 1 1
    defsvarp (concatword $w crosshair) $s
]

deffvarp editcursorsize 0 0.05 1000
deffvarp editcursorblend 0 1 1
defsvarp editcursor "cross-01"
deffvarp speccursorsize 0 0.05 1000
deffvarp speccursorblend 0 1 1
defsvarp speccursor "cross-01"
deffvarp tvcursorsize 0 0.05 1000
deffvarp tvcursorblend 0 1 1
defsvarp tvcursor ""
deffvarp teamcrosshairsize 0 0.06 1000
deffvarp teamcrosshairblend 0 0.5 1
defsvarp teamcrosshair "warning"
defhvarp teamcrosshaircolour 0 0xFF0000 0xFFFFFF
defsvarp zoomcrosshair "simple-01"
deffvarp zoomcrosshairsize 0 0.04 1000
deffvarp zoomcrosshairblend 0 1 1

deffvarp cursorblend 0 1 1
defsvarp cursorpointer "cursor"
defhvarp cursoraccent 0 0x606060 0xFFFFFF
defhvarp cursorhoveraccent 0 0xC01010 0xFFFFFF
deffvarp cursorhoverscale 0 1.1 4

defvarp showindicator 0 31 31 // bitwise flags: 1 = show ammo, 2 = show reload, 4 = show attack, 8 = show primary/secondary attack, 16 = show impulse
deffvarp indicatorsize 0 0.0275 1000
deffvarp indicatorblend 0 1 1
defvarp indicatorminattack 0 250 $varidxmax
defvarp indicatorminimpulse 0 250 $varidxmax

defvarp showcirclebar 0 0 1
defvarp circlebartype 0 7 7 // 0 = off, &1 = health, &2 = impulse, &4 = ammo
deffvarp circlebarsize 0 0.04 1000
deffvarp circlebarblend 0 1 1
defhvarp circlebarhealthtone (- 0 $CTONE_MAX) 0x88FF88 0xFFFFFF
defhvarp circlebarimpulsetone (- 0 $CTONE_MAX) 0xFF88FF 0xFFFFFF
defvarp circlebarammocolour 0 1 1
defhvarp circlebarammotone (- -1 $CTONE_MAX) 0xFFAA66 0xFFFFFF

defvarp showclips 0 1 1
defvarp clipanims 0 2 2
deffvarp clipsize 0 0.025 1000
deffvarp clipoffset 0 0.05 1000
deffvarp clipminscale 0 0.25 1000
deffvarp clipgroupscale 0 0.8 1000 // when Rounds would be drawn smaller than this, the Clip gains rings, or groups them with clipgroup
defvarp clipgroup 0 0 1 // 0 = more rings for large clips, 1 = each Round stands for several rounds instead
defvarp clipmaxrings 1 2 10 // rings a large clip may use before its Rounds shrink
deffvarp clipmaxscale 0 1 1000
deffvarp clipblend 0 0.5 1
deffvarp clipcolour 0 1 1
defhvarp clipstone (- 0 $CTONE_MAX) 0 0xFFFFFF
defvarp clipstore 0 1 1
deffvarp clipstoreblend 0 0.2 1

// weapon, Round shape, offset, skew, rotate ("round-the-clock" rotation, 0 = off, &1 = flip x, &2 = flip y, &4 = angle, &8 = spin)
pointer_weapclips = [
    claw claw 0.25 0.75 12 pistol pistol 0.1 0.65 12 sword sword 0.25 1 12 shotgun shotgun 0.125 0.7 12 smg smg 0.35 0.55 12
    flamer flamer 0.5 0.4 12 plasma plasma 0.1 0.5 12 zapper zapper 0.3 0.5 12 rifle rifle 0.25 0.9 12 corroder corroder 0.25 0.7 12
    trident trident 0.25 1 12 grenade grenade 0 1 11 mine mine 0 1 11 rocket rocket 0 1 12 minigun minigun 0.35 0.55 12
    jetsaw jetsaw 0.25 1 12 eclipse eclipse 0.1 0.5 12 melee melee 0.25 0.75 12
]
looplist w $W_NAMES [
    local _i
    _i = (listfind c $pointer_weapclips [=s $c $w])
    if (>= $_i 0) [
        defsvarp (concatword $w clip) (at $pointer_weapclips (+ $_i 1))
        deffvarp (concatword $w clipoffset) 0 (at $pointer_weapclips (+ $_i 2)) 0.5
        deffvarp (concatword $w clipskew) 0 (at $pointer_weapclips (+ $_i 3)) 10
        defvarp (concatword $w cliprotate) 0 (at $pointer_weapclips (+ $_i 4)) 15
    ]
]

// Shape registry: `pointer name helpers body [anchorx anchory]` adds a Crosshair or cursor shape, `pointer_round name helpers body` adds a Round
// The body sets outval to the shape's distance at coord (-1 to 1 across the Pointer, +y down) and may set accent to a second field coloured separately
// The anchor is the point in the shape that sits on the aim point or the mouse

// sdf_dot and sdf_rotate are always included since other helpers need them
pointer_names = []
pointer_helpers = [sdf_dot sdf_rotate]
pointer_funcs = []
pointer_dispatch = []
pointer_extents = []
pointer_anchors = []
pointer_round_names = []
pointer_round_helpers = [sdf_dot sdf_rotate]
pointer_round_funcs = []
pointer_round_dispatch = []

pointer_addhelpers = [
    looplist h $arg2 [
        if (< (indexof $$arg1 $h) 0) [ append $arg1 $h ]
    ]
]

pointer = [
    local _id _ax _ay
    _id = (listlen $pointer_names)
    _ax = (? (>= $numargs 4) $arg4 0)
    _ay = (? (>= $numargs 5) $arg5 0)
    append pointer_names $arg1
    append pointer_extents (+f 1 (maxf (absf $_ax) (absf $_ay)))
    append pointer_anchors $_ax
    append pointer_anchors $_ay
    pointer_addhelpers pointer_helpers $arg2
    pointer_funcs = (format "%1^nvec2 pointer%2(vec2 coord)^n{^nfloat outval = 1e3;^nfloat accent = 1e3;^n%3^nreturn vec2(outval, accent);^n}" $pointer_funcs $_id $arg3)
    pointer_dispatch = (format "%1^nif(id == %2) return min(pointer%2(coord + vec2(%3, %4)), vec2(2.0));" $pointer_dispatch $_id $_ax $_ay)
]

pointer_round = [
    local _id
    _id = (listlen $pointer_round_names)
    append pointer_round_names $arg1
    pointer_addhelpers pointer_round_helpers $arg2
    pointer_round_funcs = (format "%1^nfloat round%2(vec2 coord)^n{^nfloat outval = 1e3;^n%3^nreturn outval;^n}" $pointer_round_funcs $_id $arg3)
    pointer_round_dispatch = (format "%1^nif(id == %2) return round%2(coord);" $pointer_round_dispatch $_id)
]

pointer_helpertext = [
    local _text
    _text = []
    looplist h $arg1 [ _text = (format "%1^n%2" $_text (do $h)) ]
    result $_text
]

loopfiles f "config/ui/pointers/crosshairs" "cfg" [ exec (concatword "config/ui/pointers/crosshairs/" $f ".cfg") ]
loopfiles f "config/ui/pointers/cursors" "cfg" [ exec (concatword "config/ui/pointers/cursors/" $f ".cfg") ]
loopfiles f "config/ui/pointers/rounds" "cfg" [ exec (concatword "config/ui/pointers/rounds/" $f ".cfg") ]

pointer_vertex = [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
]

// shades a field: solid inside, ringed by a dark outline, with the accent field in its own colour and a dark line where it meets the rest
// outline is x: width and y: fade in the field's units, so they scale with the shape, z: opacity
// aa is the size of a pixel in the field's units, taken from the coordinates since the field has creases; edges always blend over one pixel
pointer_shade = [
    result [
        vec4 pointershade(float outval, float accent, vec3 base, vec3 accentcolour, vec3 outline, float aa)
        {
            float fill = clamp(0.5 - outval / aa, 0.0, 1.0);
            float fade = max(outline.y, aa);
            float edge = clamp((outline.x + fade * 0.5 - outval) / fade, 0.0, 1.0) * outline.z;
            vec3 inner = mix(base, accentcolour, clamp(0.5 - accent / aa, 0.0, 1.0));
            inner *= 1.0 - outline.z * clamp(1.0 - abs(accent) / aa, 0.0, 1.0);
            float alpha = fill + (1.0 - fill) * edge;
            return vec4(inner * (fill / max(alpha, 1e-4)), alpha);
        }
    ]
]

shader $SHADER_DEFAULT "pointer" $pointer_vertex (format [
    varying vec2 texcoord0;
    varying vec4 colorscale;
    uniform ivec3 pointershapes;
    uniform vec4 pointermorph;
    uniform vec4 pointerextent;
    uniform vec4 pointercolour;
    uniform vec4 pointeraccent;
    uniform vec4 pointerhit;

    %1
    %2
    %3

    vec2 pointershape(int id, vec2 coord)
    {
        %4
        return vec2(2.0);
    }

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 coord = (texcoord0 * 2.0 - 1.0) * pointerextent.x;
        vec2 d;
        if(pointermorph.y >= 1.0) d = pointershape(pointershapes.z, coord);
        else
        {
            d = pointershape(pointershapes.y, coord);
            if(pointermorph.x < 1.0) d = mix(pointershape(pointershapes.x, coord), d, pointermorph.x);
            if(pointermorph.y > 0.0) d = mix(d, pointershape(pointershapes.z, coord), pointermorph.y);
        }
        d -= pointermorph.z;
        vec4 outcolor = pointershade(min(d.x, d.y), d.y, mix(pointercolour.rgb, pointerhit.rgb, pointerhit.a), pointeraccent.rgb, pointerextent.yzw, max(length(fwidth(coord)) * 0.7071068, 1e-5));
        if(outcolor.a <= 0.0) discard;
        fragcolor = outcolor * vec4(1.0, 1.0, 1.0, pointercolour.a) * colorscale;
    }
] (pointer_helpertext $pointer_helpers) (pointer_shade) $pointer_funcs $pointer_dispatch) 1

shader $SHADER_DEFAULT "pointerclip" $pointer_vertex (format [
    varying vec2 texcoord0;
    varying vec4 colorscale;
    uniform ivec2 clipshapes;
    uniform vec4 clipmorph;
    uniform vec4 clipoutline;
    uniform vec4 clipa0, clipa1, clipa2, clipa3, clipa4, clipacolour;
    uniform vec4 clipb0, clipb1, clipb2, clipb3, clipb4, clipbcolour;

    %1
    %2
    %3

    float clipround(int id, vec2 coord)
    {
        %4
        return 1e3;
    }

    vec2 cliplayer(int id, vec2 p, float a, float radius, float size, float spin, int rotate, float alpha, vec2 best)
    {
        if(alpha <= 0.0 || size <= 0.0) return best;
        vec2 c = radius * vec2(sin(radians(a)), -cos(radians(a)));
        float rot = 0.0;
        if((rotate & 8) != 0) rot += spin;
        if((rotate & 4) != 0) rot += a;
        float na = mod(a, 360.0);
        vec2 l = sdf_rotate(p - c, -radians(rot)) / (size * 0.5);
        if((rotate & 2) != 0 && na > 90.0 && na <= 180.0) l.y = -l.y;
        if((rotate & 1) != 0 && na >= 180.0) l.x = -l.x;
        float d = clipround(id, l) * size * 0.5;
        return d < best.x ? vec2(d, alpha) : best;
    }

    // x: Rounds, y: angle the first slot starts from, z: radius of the inner ring, w: Round size
    // g1: first loaded slot, first and end of loading slots, first stored slot
    // g2: end of stored slots, first and end of firing slots, rotate flags
    // g3: fade, firing amount, loading amount, spin
    // g4: stored fade, animations, rings, space between rings
    vec2 cliplayout(int id, vec2 p, vec4 g0, vec4 g1, vec4 g2, vec4 g3, vec4 g4)
    {
        vec2 best = vec2(clipmorph.y, 0.0);
        if(g0.x < 1.0) return best;
        float rings = max(g4.z, 1.0), each = floor(g0.x / rings), spare = g0.x - each * rings;
        int rotate = int(g2.w);
        float fa = g4.y > 0.0 ? g3.y : 1.0, la = g4.y > 0.0 ? g3.z * 0.75 : 1.0;
        float fspin = g4.y >= 2.0 ? 360.0 * g3.y : 0.0, lspin = g4.y >= 2.0 ? 360.0 * g3.z : 0.0;
        float along = g4.w > 0.0 ? (length(p) - g0.z) / g4.w : 0.0;
        float k0 = clamp(floor(along + 0.5), 0.0, rings - 1.0);
        for(int r = 0; r < 2; r++)
        {
            // the nearest ring and the next nearest, since Rounds can reach across
            float k = r == 0 ? k0 : k0 + (along > k0 ? 1.0 : -1.0);
            if(k < 0.0 || k >= rings) continue;
            // the outer ring empties first, and the Rounds are shared out so each ring is evenly filled
            float order = rings - 1.0 - k, count = each + (order < spare ? 1.0 : 0.0), first = order * each + min(order, spare);
            if(count < 1.0) continue;
            float slice = 360.0 / count, radius = g0.z + k * g4.w;
            float top = g0.y - mod(k, 2.0) * slice * 0.5; // alternate rings are staggered
            if(count <= ((rotate & 4) != 0 ? 4.0 : 3.0) && mod(count, 2.0) < 1.0) top -= slice * 0.5;
            float j0 = floor((top - degrees(atan(p.x, -p.y))) / slice + 0.5);
            int n = int(min(count, 3.0));
            for(int i = 0; i < 3; i++)
            {
                if(i >= n) break;
                float l = mod(j0 + float(i) - (n >= 3 ? 1.0 : 0.0), count);
                float a = top - l * slice;
                float j = first + l;
                // amounts can be fractions of a slot when each Round stands for several, so a part filled slot shows a smaller Round
                float have = clamp(j + 1.0 - g1.x, 0.0, 1.0);
                if(j + 1.0 > g1.y && j < g1.z) best = cliplayer(id, p, a, radius * la, g0.w * la, lspin, rotate, g3.z, best);
                else if(have > 0.0) best = cliplayer(id, p, a, radius, g0.w * have, g3.w, rotate, g3.x, best);
                if(j + 1.0 > g1.w && j < g2.x && have < 1.0) best = cliplayer(id, p, a, radius, g0.w, g3.w, rotate, g3.x * g4.x, best);
                if(j + 1.0 > g2.y && j < g2.z) best = cliplayer(id, p, a, radius * fa, g0.w * fa, fspin, rotate, g3.y, best);
            }
        }
        return best;
    }

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 p = (texcoord0 * 2.0 - 1.0) * clipmorph.y;
        vec2 d = cliplayout(clipshapes.x, p, clipa0, clipa1, clipa2, clipa3, clipa4);
        vec4 colour = clipacolour;
        if(clipmorph.x > 0.0)
        {
            d = mix(d, cliplayout(clipshapes.y, p, clipb0, clipb1, clipb2, clipb3, clipb4), clipmorph.x);
            colour = mix(colour, clipbcolour, clipmorph.x);
        }
        vec4 outcolor = pointershade(d.x, 1e3, colour.rgb, colour.rgb, clipoutline.xyz, max(length(fwidth(p)) * 0.7071068, 1e-5));
        outcolor.a *= d.y * colour.a;
        if(outcolor.a <= 0.0) discard;
        fragcolor = outcolor * colorscale;
    }
] (pointer_helpertext $pointer_round_helpers) (pointer_shade) $pointer_round_funcs $pointer_round_dispatch) 1

// an arc of a ring with round ends, centred on the middle of the quad unless moved, in turns anticlockwise from the top
shader $SHADER_DEFAULT "pointerarc" $pointer_vertex (format [
    varying vec2 texcoord0;
    varying vec4 colorscale;
    uniform vec4 arcparams;
    uniform vec4 arccentre;
    uniform vec4 arccolour;

    %1

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 p = (texcoord0 * 2.0 - 1.0) - arccentre.xy;
        float ra = (arcparams.z + arcparams.w) * 0.5, rb = (arcparams.w - arcparams.z) * 0.5;
        float mid = (arcparams.x + arcparams.y * 0.5) * 6.2831853;
        vec2 dir = vec2(-sin(mid), -cos(mid));
        float ha = arcparams.y >= 1.0 ? 3.1415927 : max(arcparams.y * 3.1415927 - rb / ra, 0.0); // the round ends finish where the arc would have
        float d = sdf_arc(vec2(dot(p, vec2(dir.y, -dir.x)), dot(p, dir)), vec2(sin(ha), cos(ha)), ra, rb);
        float aa = max(length(fwidth(p)) * 0.7071068, 1e-5);
        float alpha = arccolour.a * clamp(0.5 - d / aa, 0.0, 1.0);
        if(alpha <= 0.0) discard;
        fragcolor = vec4(arccolour.rgb, alpha) * colorscale;
    }
] (sdf_arc)) 1

// the Hit marker, four long diamonds along the diagonals with a core of a second colour
shader $SHADER_DEFAULT "pointerhitmarker" $pointer_vertex (format [
    varying vec2 texcoord0;
    varying vec4 colorscale;
    uniform vec4 hitmarkerparams;
    uniform vec4 hitmarkercolour;
    uniform vec4 hitmarkercore;
    uniform vec4 hitmarkeroutline;

    %1
    %2

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 coord = (texcoord0 * 2.0 - 1.0) * hitmarkerparams.w;
        vec2 q = abs(coord);
        // along and across the diagonal, from the middle of the diamond
        vec2 p = vec2((q.x + q.y) * 0.7071068 - (hitmarkerparams.x + hitmarkerparams.y * 0.5), (q.y - q.x) * 0.7071068);
        vec2 b = vec2(hitmarkerparams.y * 0.5 + hitmarkerparams.z, hitmarkerparams.z);
        float diamond = sdf_rhombus(p, b);
        float core = sdf_rhombus(p, b * vec2(0.75, 0.45));
        vec4 outcolor = pointershade(diamond, core, hitmarkercolour.rgb, hitmarkercore.rgb, hitmarkeroutline.xyz, max(length(fwidth(coord)) * 0.7071068, 1e-5));
        outcolor.a *= hitmarkercolour.a;
        if(outcolor.a <= 0.0) discard;
        fragcolor = outcolor * colorscale;
    }
] (concat (sdf_dot) (sdf_rhombus)) (pointer_shade)) 1

// 1:how far through the Hit marker is, from 0 to 1 2:size
pointer_hitmarker = [
    local _t
    _t = (clampf $arg1 0 1)
    uirender "pointerhitmarker" (*f $arg2 1.5) (*f $arg2 1.5) [
        uirenderparam hitmarkerparams (lerpf 0.35 0.85 $_t) (lerpf 0.1 0.45 $_t) (lerpf 0.08 0.03 $_t) 1.5
        uirenderpmcol hitmarkercolour $hitmarkercolour (-f 1 (*f $_t $_t))
        uirenderpmcol hitmarkercore $hitmarkercore 1
        // the marker is much larger than other Pointers, so its outline is a fifth as wide to stay thin
        uirenderparam hitmarkeroutline (divf $pointeroutline 250) (divf $pointeroutlinefade 250) $pointeroutlineblend 0
    ]
]

// 1:start 2:length 3:inner 4:outer (fractions of the radius) 5:colour 6:blend 7:radius
pointer_arc = [
    if (&& (>f $arg2 0) (>f $arg6 0)) [
        uirender "pointerarc" (*f $arg7 2) (*f $arg7 2) [
            uirenderparam arcparams $arg1 $arg2 $arg3 $arg4
            uirenderpmcol arccolour $arg5 $arg6
        ]
    ] [
        uifill (*f $arg7 2) (*f $arg7 2)
    ]
]

// a weapon's variable, such as (pointer_weapvar pistol ammoclip)
pointer_weapvar = [
    local _n
    _n = (concatword $arg1 $arg2)
    result $$_n
]

pointer_mulcolour = [
    local _r _g _b
    _r = (*f (divf (& (>> $arg1 16) 0xFF) 255) (divf (& (>> $arg2 16) 0xFF) 255))
    _g = (*f (divf (& (>> $arg1 8) 0xFF) 255) (divf (& (>> $arg2 8) 0xFF) 255))
    _b = (*f (divf (& $arg1 0xFF) 255) (divf (& $arg2 0xFF) 255))
    result (| (<< (toint (*f $_r 255)) 16) (<< (toint (*f $_g 255)) 8) (toint (*f $_b 255)))
]

pointer_skew = [
    if (< $arg2 0) [ result (pointer_mulcolour $arg1 (getclientcolour $focusedplayer)) ] [
        result (pointer_mulcolour $arg1 $arg2)
    ]
]

// the colours an Indicator fades through as amt goes from 0 to 1
pointer_colourskew = [
    local _skew _r _g _b
    _skew = $arg1
    _r = 1; _g = 1; _b = 1
    if (>=f $_skew 0.5) [
        _g = (+f 0.5 (-f $_skew 0.5))
        _b = (*f (-f $_skew 0.5) 2)
    ] [
        _g = $_skew
        _b = 0
    ]
    result (| 0xFF0000 (<< (toint (*f $_g 255)) 8) (toint (*f $_b 255)))
]

pointer_lerpcolour = [
    local _t _r _g _b
    _t = (clampf $arg3 0 1)
    _r = (lerpf (& (>> $arg1 16) 0xFF) (& (>> $arg2 16) 0xFF) $_t)
    _g = (lerpf (& (>> $arg1 8) 0xFF) (& (>> $arg2 8) 0xFF) $_t)
    _b = (lerpf (& $arg1 0xFF) (& $arg2 0xFF) $_t)
    result (| (<< (toint $_r) 16) (<< (toint $_g) 8) (toint $_b))
]

pointer_shapeid = [
    local _id
    _id = (indexof $pointer_names $arg1)
    result (? (>= $_id 0) $_id (indexof $pointer_names "plus"))
]

// Morph state: the shape shown is mix(mix(a, b, u), c, v), with v rising from 0 to 1 over the Morph
pointer_slots = [0 0 0]
pointer_u = 1
pointer_v = 1
pointer_start = 0
pointer_time = 0
pointer_from = [0.05 0xFFFFFF 1 0 0]
pointer_shown = [0.05 0xFFFFFF 1 0 0]
pointer_lastweap = -1

// 1:shape 2:Morph time
pointer_target = [
    local _id
    _id = (pointer_shapeid $arg1)
    if (!= $_id (at $pointer_slots 2)) [
        pointer_slots = (concat (at $pointer_slots 1) (at $pointer_slots 2) $_id)
        pointer_u = (smoothstep $pointer_v)
        pointer_v = 0
        pointer_start = $totalmillis
        pointer_time = $arg2
        pointer_from = $pointer_shown
    ]
