// 1:radius
pointer_circlebar = [
    local _num _slice _pos _val _colour _fade _weap _w _interval _wait _state _load _next _extra _amt
    _num = 0
    loop i 3 [
        if (& $circlebartype (<< 1 $i)) [
            if (|| (!= $i 1) $impulsecostmeter) [ _num = (+ $_num 1) ]
        ]
    ]
    if $_num [
        _slice = (divf 1 $_num)
        _pos = (? (mod $_num 2) (*f $_slice 0.5) 0)
        uigroup [
            loop i 3 [
                if (&& (& $circlebartype (<< 1 $i)) (|| (!= $i 1) $impulsecostmeter)) [
                    _val = 0
                    _extra = 0
                    _colour = 0xFFFFFF
                    _fade = $circlebarblend
                    _amt = 1
                    case $i 0 [
                        _val = (minf 1 (divf (getclienthealth $focusedplayer) (max (getclientspawnhealth $focusedplayer) 1)))
                        if $circlebarhealthtone [ _colour = (pointer_skew $_colour $circlebarhealthtone) ]
                    ] 1 [
                        _val = (-f 1 (clampf (divf (getclientimpulse $focusedplayer $IM_METER) $impulsecostmeter) 0 1))
                        if $circlebarimpulsetone [ _colour = (pointer_skew $_colour $circlebarimpulsetone) ]
                    ] 2 [
                        _weap = (getclientweapselect $focusedplayer)
                        if (&& (>= $_weap 0) (< $_weap $W_MAX)) [
                            _w = (at $W_NAMES $_weap)
                            _interval = (- $lastmillis (getclientweaptime $focusedplayer $_weap))
                            _wait = (getclientweapwait $focusedplayer $_weap)
                            _state = (getclientweapstate $focusedplayer $_weap)
                            _load = (getclientweapload $focusedplayer $_weap 0)
                            _val = (divf (getclientweapclip $focusedplayer $_weap) (pointer_weapvar $_w ammoclip))
                            if (|| $circlebarammotone $circlebarammocolour) [ _colour = (pointer_skew $_colour (? $circlebarammocolour (pointer_weapvar $_w colour) $circlebarammotone)) ]
                            if (<= $_interval $_wait) [
                                if (&& (|| (= $_state $W_S_RELOAD) (= $_state $W_S_USE)) (> $_load 0)) [
                                    _val = (-f $_val (divf $_load (pointer_weapvar $_w ammoclip)))
                                    if (>= $_interval (div $_wait 2)) [
                                        _amt = (clampf (divf (- $_interval (div $_wait 2)) (div $_wait 2)) 0 1)
                                        _extra = (*f (divf $_load (pointer_weapvar $_w ammoclip)) $_amt)
                                    ]
                                ] [
                                    if (|| (= $_state $W_S_SWITCH) (= $_state $W_S_USE)) [
                                        _amt = (clampf (divf $_interval $_wait) 0 1)
                                        _fade = (*f $_fade $_amt)
                                        _val = (*f $_val $_amt)
                                        _amt = 1
                                    ]
                                    if (|| (= $_state $W_S_PRIMARY) (= $_state $W_S_SECONDARY)) [
                                        _amt = (-f 1 (clampf (divf $_interval $_wait) 0 1))
                                        _extra = (*f (divf (max (getclientweapshot $focusedplayer $_weap) 1) (pointer_weapvar $_w ammoclip)) $_amt)
                                    ]
                                ]
                            ]
                        ]
                    ]
                    pointer_arc $_pos $_slice 0.83 0.96 (modcolour $_colour 0.25) (*f $circlebarblend 0.65) $arg1
                    pointer_arc $_pos (*f $_val $_slice) 0.83 0.96 $_colour $_fade $arg1
                    pointer_arc (+f $_pos (*f $_val $_slice)) (*f $_extra $_slice) 0.83 0.96 $_colour (*f $circlebarblend $_amt) $arg1
                    _pos = (+f $_pos $_slice)
                ]
            ]
        ]
    ]
]

newui "pointer" $SURFACE_FOREGROUND [
    local _index _weap _ind _bar _out
    uiwinstyle $WINSTYLE_CROSSHAIR
    uizindex 100
    uigroup [
        _index = (pointer_crosshair)
        if (&& (>= $_index 4) (= (getclientstate $focusedplayer) $CS_ALIVE)) [
            // each ring sits outside the last, so they grow with the Crosshair instead of covering it
            _weap = (getclientweapselect $focusedplayer)
            _ind = (maxf $indicatorsize (divf (+f (*f (at $pointer_shown 0) 0.5) $pointergap) 0.85))
            _out = (*f $_ind 0.98)
            if $showcirclebar [
                _bar = (maxf $circlebarsize (divf (+f $_out $pointergap) 0.83))
                _out = (*f $_bar 0.96)
                pointer_circlebar $_bar
            ]
            if (getclienthasweap $focusedplayer $_weap) [
                if $showclips [ pointer_clip $_weap 0 $clipblend (+f $_out $pointergap) ]
                if $showindicator [ pointer_indicator $_weap $_ind ]
            ] [
                if (& $showindicator 16) [ pointer_indicator -1 $_ind ]
            ]
        ]
        if (&& $showhitmarker (>= $_index 4) $lastdamagetick (< (- $lastmillis $lastdamagetick) $hitmarkertime)) [
            pointer_hitmarker (divf (- $lastmillis $lastdamagetick) $hitmarkertime) $hitmarkersize
        ]
        if (&& (= $_index 2) $crosshairdistance) [
            uioffset $crosshairdistancex $crosshairdistancey [
                uicolourtext (format "^fa%1^fwm" (precf (aimdistance) 1)) 0xFFFFFF $ui_texttiny [ uicolourblend $crosshairdistblend ]
            ]
        ]
    ]
]
