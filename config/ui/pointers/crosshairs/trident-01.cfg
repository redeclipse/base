pointer "trident-01" "sdf_rounded_box sdf_segment" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = max(abs(sdf_rounded_box(q - vec2(0.8, 0.0), vec2(0.185, 0.43), vec4(0.2))) - 0.017, 0.8 - q.x);
    float b2 = (sdf_segment(q, vec2(0.905, -0.2), vec2(0.905, 0.2)) - 0.024);
    float b3 = max(abs(sdf_rounded_box(coord, vec2(0.175, 0.13), vec4(0.07))) - 0.022, 0.1 - q.x);
    float b4 = max(abs(sdf_rounded_box(coord, vec2(0.095, 0.075), vec4(0.05))) - 0.022, 0.03 - q.x);
    outval = min(min(b1, b2), min(b3, b4));
]
