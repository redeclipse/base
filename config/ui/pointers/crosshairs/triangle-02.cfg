pointer "triangle-02" "sdf_box sdf_oriented_box" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = sdf_box(coord - vec2(0.0, -0.495), vec2(0.058, 0.29));
    float b2 = sdf_oriented_box(q, vec2(0.175, 0.155), vec2(0.655, 0.59), 0.117);
    outval = min(b1, b2);
]
