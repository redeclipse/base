pointer "triangle-03" "sdf_rotate sdf_box sdf_circle sdf_oriented_box sdf_tapered_arc" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = sdf_box(coord - vec2(0.0, -0.495), vec2(0.058, 0.29));
    float b2 = sdf_oriented_box(q, vec2(0.175, 0.155), vec2(0.655, 0.59), 0.117);
    float b3 = sdf_tapered_arc(vec2(coord.x, -coord.y), 0.46, 0.63, 0.03);
    float b4 = sdf_tapered_arc(vec2(1.0, -1.0) * sdf_rotate(q, -2.36), 0.46, 0.6, 0.03);
    outval = min(min(min(b1, b2), min(b3, b4)), sdf_circle(coord, 0.07));
]
