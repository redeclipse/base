// close quarters: a dot with four short diagonal ticks
pointer "melee" "sdf_rotate sdf_polar sdf_segment sdf_circle" [
    const float th = 0.04;
    const float dot = 0.056;
    vec2 q = sdf_polar(sdf_rotate(coord, 0.7853982), 4.0);
    outval = min(sdf_segment(q, vec2(0.0, -0.28), vec2(0.0, -0.5)) - th, sdf_circle(coord, dot));
]
