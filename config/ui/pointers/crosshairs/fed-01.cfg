pointer "fed-01" "sdf_rotate sdf_box sdf_circle sdf_segment" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = min((abs(sdf_circle(coord, 0.935)) - 0.06), (abs(sdf_circle(coord - vec2(0.0, 0.03), 0.28)) - 0.055));
    float b2 = (sdf_segment(q, vec2(0.32, 0.1), vec2(0.95, 0.2)) - 0.024);
    float an = 0.1745329;
    float a = atan(coord.x, -coord.y);
    vec2 r = sdf_rotate(coord, -floor(a / an + 0.5) * an);
    float b3 = max(sdf_box(r - vec2(0.0, -0.78), vec2(0.026)), abs(a) - 1.75);
    outval = min(min(b1, b2), b3);
]
