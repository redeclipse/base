pointer "fed-03" "sdf_dot sdf_bezier sdf_box sdf_circle sdf_triangle" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = (abs(sdf_circle(coord, 0.935)) - 0.06);
    float b2 = sdf_bezier(q, vec2(0.14, 0.35), vec2(0.12, -0.05), vec2(0.5, -0.2)) - 0.05;
    float b3 = sdf_box(q - vec2(0.12, 0.6), vec2(0.09, 0.34));
    float b4 = sdf_triangle(coord, vec2(0.0, -0.12), vec2(0.075, 0.6), vec2(-0.075, 0.6));
    outval = min(min(b1, b2), min(b3, b4));
]
