pointer "square-02" "sdf_rotate sdf_box sdf_polar sdf_segment" [
    float b1 = (sdf_segment(sdf_polar(coord, 4.0), vec2(0.0, -0.185), vec2(0.0, -0.9)) - 0.043);
    outval = min(b1, abs(sdf_box(coord, vec2(0.548))) - 0.018);
]
