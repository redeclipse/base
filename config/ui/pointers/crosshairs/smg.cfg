// rapid fire: a small ring in an open cross whose lower tick is longer, to catch the climb
pointer "smg" "sdf_segment sdf_circle" [
    const float th = 0.04;
    const float dot = 0.056;
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = min(sdf_segment(q, vec2(0.38, 0.0), vec2(0.66, 0.0)), sdf_segment(coord, vec2(0.0, -0.38), vec2(0.0, -0.66)));
    float b2 = sdf_segment(coord, vec2(0.0, 0.38), vec2(0.0, 0.9));
    outval = min(min(b1, b2) - th, abs(sdf_circle(coord, 0.15)) - th);
]
