// long range: fine hairlines with range ticks and a dot
pointer "rifle" "sdf_rotate sdf_polar sdf_segment sdf_circle" [
    const float th = 0.024;
    const float dot = 0.034;
    vec2 q = sdf_polar(coord, 4.0);
    float b1 = sdf_segment(q, vec2(0.0, -0.22), vec2(0.0, -0.95)) - th;
    float b2 = sdf_segment(vec2(abs(q.x), q.y), vec2(0.0, -0.55), vec2(0.12, -0.55)) - th;
    outval = min(min(b1, b2), sdf_circle(coord, dot));
]
