// close and continuous: a small ring between two side bars
pointer "jetsaw" "sdf_segment sdf_circle" [
    const float th = 0.04;
    const float dot = 0.056;
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = abs(sdf_circle(coord, 0.3)) - th;
    float b2 = sdf_segment(q, vec2(0.58, -0.28), vec2(0.58, 0.28)) - th;
    outval = min(min(b1, b2), sdf_circle(coord, dot));
]
