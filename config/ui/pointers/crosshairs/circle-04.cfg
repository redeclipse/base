pointer "circle-04" "sdf_circle sdf_oriented_box" [
    vec2 q = abs(coord);
    float b1 = sdf_oriented_box(q, vec2(0.31, 0.31), vec2(0.67, 0.67), 0.088);
    outval = min(min(b1, (abs(sdf_circle(coord, 0.72)) - 0.022)), sdf_circle(coord, 0.037));
]
