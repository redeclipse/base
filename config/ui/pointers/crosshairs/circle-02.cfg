pointer "circle-02" "sdf_rotate sdf_circle sdf_polar" [
    vec2 q = sdf_polar(coord, 4.0);
    float b1 = max(max(length(q) - 0.81, 0.575 - length(q)), dot(vec2(abs(q.x), q.y), vec2(cos(0.56), sin(0.56))));
    outval = min(b1, sdf_circle(coord, 0.09));
]
