pointer "fed-04" "sdf_circle sdf_trapezoid" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = (abs(sdf_circle(coord - vec2(0.0, 0.03), 0.29)) - 0.05);
    float b2 = sdf_trapezoid(q - vec2(0.78, 0.12), 0.2, 0.24, 0.18);
    outval = min(b1, b2);
]
