pointer "cross-02" "sdf_rotate sdf_box sdf_polar sdf_segment" [
    vec2 q = sdf_polar(coord, 4.0);
    float b1 = (sdf_segment(q, vec2(0.0, -0.19), vec2(0.0, -0.88)) - 0.047);
    outval = min(b1, sdf_box(q - vec2(0.0, -0.895), vec2(0.225, 0.045)));
]
