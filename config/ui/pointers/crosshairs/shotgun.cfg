// spread: a ring for the pellet spread with ticks around it
pointer "shotgun" "sdf_rotate sdf_polar sdf_segment sdf_circle" [
    const float th = 0.04;
    const float dot = 0.056;
    vec2 q = sdf_polar(coord, 4.0);
    float b1 = abs(sdf_circle(coord, 0.62)) - th;
    float b2 = sdf_segment(q, vec2(0.0, -0.72), vec2(0.0, -0.95)) - th;
    outval = min(min(b1, b2), sdf_circle(coord, dot));
]
