pointer "fed-05" "sdf_circle sdf_trapezoid" [
    float b1 = min((abs(sdf_circle(coord, 0.94)) - 0.05), (abs(sdf_circle(coord - vec2(0.0, 0.08), 0.8)) - 0.05));
    float b2 = (abs(sdf_circle(coord, 0.31)) - 0.04);
    float b3 = sdf_trapezoid(coord - vec2(0.0, 0.62), 0.05, 0.17, 0.28);
    outval = min(b1, min(b2, b3));
]
