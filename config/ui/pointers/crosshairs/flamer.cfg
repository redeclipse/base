// short range stream: four broad arcs close around the aim point
pointer "flamer" "sdf_rotate sdf_polar sdf_circle sdf_arc" [
    const float th = 0.029;
    const float dot = 0.041;
    vec2 q = sdf_polar(sdf_rotate(coord, 0.7853982), 4.0);
    outval = min(sdf_arc(vec2(q.x, -q.y), vec2(sin(0.5), cos(0.5)), 0.5, th), sdf_circle(coord, dot));
]
