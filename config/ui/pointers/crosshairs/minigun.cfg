// sustained fire: a dashed ring for the wide spray
pointer "minigun" "sdf_rotate sdf_polar sdf_circle" [
    const float th = 0.04;
    const float dot = 0.056;
    vec2 q = sdf_polar(sdf_rotate(coord, 0.2617994), 12.0);
    outval = min(max(abs(sdf_circle(coord, 0.72)) - th, abs(q.x) - 0.1), sdf_circle(coord, dot));
]
