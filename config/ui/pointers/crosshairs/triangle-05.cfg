pointer "triangle-05" "sdf_circle sdf_triangle" [
    vec2 a = vec2(0.0, -0.845);
    vec2 b = vec2(-0.865, 0.505);
    vec2 c = vec2(0.865, 0.505);
    float b1 = max(abs(sdf_triangle(coord, a, b, c)) - 0.036, min(min(length(coord - a), length(coord - b)), length(coord - c)) - 0.31);
    outval = min(b1, sdf_circle(coord, 0.059));
]
