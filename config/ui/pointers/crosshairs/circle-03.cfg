pointer "circle-03" "sdf_rotate sdf_circle sdf_tapered_arc" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = sdf_tapered_arc(vec2(coord.x, -coord.y), 0.46, 0.63, 0.03);
    float b2 = sdf_tapered_arc(vec2(1.0, -1.0) * sdf_rotate(q, -2.36), 0.46, 0.6, 0.03);
    outval = min(min(b1, b2), sdf_circle(coord, 0.07));
]
