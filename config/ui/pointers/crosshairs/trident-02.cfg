pointer "trident-02" "sdf_rotate sdf_arc sdf_polar sdf_rounded_box sdf_segment" [
    vec2 q = sdf_polar(sdf_rotate(coord, 0.7853982), 4.0);
    vec2 h = vec2(abs(q.x), q.y);
    float b1 = min(sdf_arc(vec2(q.x, -q.y), vec2(sin(0.42), cos(0.42)), 0.585, 0.016), (sdf_segment(h, vec2(0.238, -0.534), vec2(0.24, -0.44)) - 0.016));
    b1 = min(b1, sdf_arc(vec2(q.x, -q.y), vec2(sin(0.25), cos(0.25)), 0.5, 0.014));
    float b2 = max(abs(sdf_rounded_box(coord, vec2(0.225, 0.145), vec4(0.08))) - 0.024, 0.14 - abs(coord.x));
    float b3 = max(abs(sdf_rounded_box(coord, vec2(0.135, 0.085), vec4(0.06))) - 0.024, 0.04 - abs(coord.x));
    outval = min(b1, min(b2, b3));
]
