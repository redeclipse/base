pointer "fed-02" "sdf_circle sdf_segment" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = (abs(sdf_circle(coord, 0.935)) - 0.06);
    float b2 = (sdf_segment(q, vec2(0.14, -0.5), vec2(0.47, 0.88)) - 0.018);
    float b3 = min((sdf_segment(q, vec2(0.14, -0.48), vec2(0.14, 0.0)) - 0.022), (sdf_segment(q, vec2(0.0, 0.0), vec2(0.14, 0.0)) - 0.03));
    outval = min(b1, min(b2, b3));
]
