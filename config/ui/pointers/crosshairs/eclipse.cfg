// guided beams: a diamond of corner marks around a dot
pointer "eclipse" "sdf_rotate sdf_polar sdf_segment sdf_circle" [
    const float th = 0.029;
    const float dot = 0.041;
    vec2 q = sdf_polar(coord, 4.0);
    vec2 h = vec2(abs(q.x), q.y);
    outval = min(sdf_segment(h, vec2(0.0, -0.75), vec2(0.28, -0.47)) - th, sdf_circle(coord, dot));
]
