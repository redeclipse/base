pointer "square-01" "sdf_box sdf_rounded_box" [
    float b1 = abs(sdf_rounded_box(coord, vec2(0.5625), vec4(0.06))) - 0.032;
    float b2 = min(sdf_box(coord, vec2(0.074, 0.018)), sdf_box(coord, vec2(0.018, 0.074)));
    outval = min(b1, b2);
]
