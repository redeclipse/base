// slow, heavy projectiles: a thick broken ring with a dot
pointer "plasma" "sdf_rotate sdf_polar sdf_circle" [
    const float th = 0.029;
    const float dot = 0.041;
    vec2 q = sdf_polar(coord, 3.0);
    outval = min(max(abs(sdf_circle(coord, 0.55)) - th * 1.2, 0.16 - abs(q.x)), sdf_circle(coord, dot));
]
