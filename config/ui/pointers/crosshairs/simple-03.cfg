pointer "simple-03" "sdf_rounded_box" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = sdf_rounded_box(q - vec2(0.478, 0.0), vec2(0.268, 0.063), vec4(0.063, 0.063, 0.0, 0.0));
    float b2 = sdf_rounded_box(coord.yx - vec2(0.48, 0.0), vec2(0.268, 0.063), vec4(0.063, 0.063, 0.0, 0.0));
    outval = min(b1, b2);
]
