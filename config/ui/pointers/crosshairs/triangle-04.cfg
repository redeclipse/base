pointer "triangle-04" "sdf_rotate sdf_circle sdf_ellipse sdf_segment" [
    float b1 = (sdf_segment(coord, vec2(0.0, -0.03), vec2(0.0, -0.45)) - 0.031);
    float b2 = sdf_ellipse(coord - vec2(0.0, -0.5), vec2(0.078, 0.041));
    float b3 = sdf_ellipse(coord - vec2(0.0, -0.585), vec2(0.113, 0.051));
    float b4 = sdf_ellipse(coord - vec2(0.0, -0.708), vec2(0.137, 0.088));
    vec2 q = sdf_rotate(vec2(abs(coord.x), coord.y), -2.262);
    float b5 = (sdf_segment(q, vec2(0.0, -0.11), vec2(0.0, -0.6)) - 0.031);
    float b6 = sdf_ellipse(q - vec2(0.0, -0.625), vec2(0.072, 0.042));
    float b7 = sdf_ellipse(q - vec2(0.0, -0.69), vec2(0.095, 0.05));
    float b8 = sdf_circle(q - vec2(0.0, -0.82), 0.118);
    outval = min(min(min(b1, b2), min(b3, b4)), min(min(b5, b6), min(b7, b8)));
]
