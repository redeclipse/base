// thrown: a short cross with a ladder of drop marks below it
pointer "grenade" "sdf_segment sdf_circle sdf_box" [
    const float th = 0.036;
    const float dot = 0.05;
    vec2 q = vec2(abs(coord.x), coord.y);
    float b1 = min(sdf_segment(q, vec2(0.22, 0.0), vec2(0.45, 0.0)), sdf_segment(coord, vec2(0.0, -0.22), vec2(0.0, -0.45))) - th;
    float b2 = min(sdf_box(coord - vec2(0.0, 0.42), vec2(0.3, th)), sdf_box(coord - vec2(0.0, 0.64), vec2(0.2, th)));
    float b3 = sdf_box(coord - vec2(0.0, 0.86), vec2(0.1, th));
    outval = min(min(min(b1, b2), b3), sdf_circle(coord, dot));
]
