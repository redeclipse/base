// precise: a small cross with a gap around a dot
pointer "pistol" "sdf_rotate sdf_polar sdf_segment sdf_circle" [
    const float th = 0.04;
    const float dot = 0.056;
    vec2 q = sdf_polar(coord, 4.0);
    outval = min(sdf_segment(q, vec2(0.0, -0.28), vec2(0.0, -0.6)) - th, sdf_circle(coord, dot));
]
