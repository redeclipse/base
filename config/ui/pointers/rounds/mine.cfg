// a mine seen from above: rings around its hub, crossed by four struts
pointer_round "mine" "sdf_circle sdf_segment" [
    float rings = min(abs(sdf_circle(coord, 0.595)) - 0.085, abs(sdf_circle(coord, 0.365)) - 0.085);
    float struts = sdf_segment(abs(coord), vec2(0.21, 0.21), vec2(0.56, 0.56)) - 0.1;
    outval = min(min(rings, sdf_circle(coord, 0.2)), struts);
]
