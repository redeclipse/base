// a tongue of flame
pointer_round "flamer" "sdf_circle sdf_triangle smin_quadratic" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float body = sdf_circle(coord - vec2(0.0, 0.35), 0.5);
    body = smin_quadratic(body, sdf_triangle(coord, vec2(0.08, -0.98), vec2(0.42, 0.15), vec2(-0.38, 0.15)), 0.1);
    outval = smin_quadratic(body, sdf_triangle(q, vec2(0.62, -0.45), vec2(0.5, 0.4), vec2(0.15, 0.2)), 0.1);
]
