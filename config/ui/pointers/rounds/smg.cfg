// a slim cartridge with a pointed nose
pointer_round "smg" "sdf_box sdf_triangle" [
    float nose = min(sdf_triangle(coord, vec2(0.0, -0.9), vec2(0.2, -0.3), vec2(-0.2, -0.3)), sdf_box(coord - vec2(0.0, -0.22), vec2(0.2, 0.1)));
    float rcase = sdf_box(coord - vec2(0.0, 0.38), vec2(0.21, 0.42));
    outval = max(min(nose, rcase), 0.03 - abs(coord.y + 0.07));
]
