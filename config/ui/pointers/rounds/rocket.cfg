// a rocket with a pointed nose and swept fins
pointer_round "rocket" "sdf_box sdf_triangle sdf_egg" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float body = sdf_box(coord - vec2(0.0, 0.08), vec2(0.17, 0.52));
    float nose = sdf_triangle(coord, vec2(0.0, -0.98), vec2(0.17, -0.42), vec2(-0.17, -0.42));
    float fins = sdf_triangle(q, vec2(0.17, 0.12), vec2(0.5, 0.72), vec2(0.17, 0.6));
    float flame = sdf_triangle(coord, vec2(0.0, 0.98), vec2(0.11, 0.62), vec2(-0.11, 0.62));
    outval = min(min(body, nose), min(fins, flame));
]
