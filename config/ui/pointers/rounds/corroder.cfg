// a drop of acid with a bubble in it
pointer_round "corroder" "sdf_circle sdf_triangle" [
    float drop = min(sdf_circle(coord - vec2(0.0, 0.2), 0.68), sdf_triangle(coord, vec2(0.0, -1.0), vec2(-0.48, -0.25), vec2(0.48, -0.25)));
    outval = max(drop, -sdf_circle(coord - vec2(-0.22, 0.12), 0.16));
]
