// an energy blade with its guard and hilt
pointer_round "sword" "sdf_box sdf_triangle" [
    float blade = sdf_triangle(coord, vec2(0.0, -0.98), vec2(0.17, 0.35), vec2(-0.17, 0.35));
    float guard = sdf_box(coord - vec2(0.0, 0.42), vec2(0.38, 0.07));
    float hilt = sdf_box(coord - vec2(0.0, 0.7), vec2(0.08, 0.24));
    outval = min(blade, min(guard, hilt));
]
