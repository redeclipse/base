// a clenched fist, knuckles outward, with the thumb folded across the fingers
pointer_round "melee" "sdf_rounded_box" [
    vec2 f = vec2(mod(coord.x + 0.44, 0.22) - 0.11, coord.y + 0.3);
    float fingers = max(sdf_rounded_box(f, vec2(0.095, 0.19), vec4(0.09)), abs(coord.x) - 0.44);
    float palm = sdf_rounded_box(coord - vec2(0.0, 0.3), vec2(0.44, 0.36), vec4(0.2, 0.06, 0.2, 0.06));
    float thumb = sdf_rounded_box(coord - vec2(-0.04, 0.0), vec2(0.34, 0.1), vec4(0.1));
    float hand = max(min(fingers, palm), 0.025 - abs(coord.y + 0.09));
    outval = min(max(hand, 0.035 - thumb), thumb);
]
