// a shotgun shell with a crimped top and a brass base
pointer_round "shotgun" "sdf_box sdf_rounded_box sdf_triangle" [
    float hull = sdf_rounded_box(coord - vec2(0.0, -0.17), vec2(0.36, 0.6), vec4(0.0, 0.08, 0.0, 0.08));
    float crimp = sdf_triangle(coord, vec2(0.0, -0.58), vec2(0.18, -0.8), vec2(-0.18, -0.8));
    float base = sdf_box(coord - vec2(0.0, 0.62), vec2(0.4, 0.22));
    outval = max(max(min(hull, base), -crimp), 0.03 - abs(coord.y - 0.39));
]
