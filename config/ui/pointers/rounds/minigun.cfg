// a long, bottlenecked belt round with its link
pointer_round "minigun" "sdf_box sdf_triangle sdf_trapezoid" [
    float tip = min(sdf_triangle(coord, vec2(0.0, -0.98), vec2(0.12, -0.6), vec2(-0.12, -0.6)), sdf_box(coord - vec2(0.0, -0.5), vec2(0.12, 0.12)));
    float neck = sdf_trapezoid(coord - vec2(0.0, -0.22), 0.13, 0.22, 0.16);
    float rcase = sdf_box(coord - vec2(0.0, 0.42), vec2(0.22, 0.48));
    float link = sdf_box(coord - vec2(0.0, 0.3), vec2(0.38, 0.07));
    outval = min(max(min(min(tip, neck), rcase), 0.03 - abs(coord.y + 0.4)), link);
]
