// an eclipsed sun, a dark disc in front of its corona
pointer_round "eclipse" "sdf_rotate sdf_polar sdf_circle sdf_triangle" [
    vec2 q = sdf_polar(coord, 12.0);
    float rays = sdf_triangle(q, vec2(0.0, -0.98), vec2(0.08, -0.6), vec2(-0.08, -0.6));
    outval = min(max(sdf_circle(coord, 0.68), -sdf_circle(coord - vec2(0.2, -0.12), 0.6)), rays);
]
