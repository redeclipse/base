// a laser cell, its charge marked in bands
pointer_round "rifle" "sdf_box sdf_rounded_box" [
    float cell = sdf_rounded_box(coord - vec2(0.0, 0.1), vec2(0.3, 0.75), vec4(0.08));
    float cap = sdf_box(coord - vec2(0.0, -0.75), vec2(0.13, 0.1));
    float bands = step(-0.55, coord.y) * step(coord.y, 0.7) * (0.035 - abs(mod(coord.y + 0.55, 0.25) - 0.125));
    outval = min(max(cell, bands), cap);
]
