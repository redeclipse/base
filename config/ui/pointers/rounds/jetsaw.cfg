// a saw blade
pointer_round "jetsaw" "sdf_rotate sdf_polar sdf_circle sdf_triangle" [
    vec2 q = sdf_polar(coord, 10.0);
    float teeth = sdf_triangle(q, vec2(-0.14, -0.62), vec2(0.18, -0.62), vec2(-0.14, -0.95));
    outval = max(min(sdf_circle(coord, 0.66), teeth), -sdf_circle(coord, 0.2));
]
