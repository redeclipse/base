// a stubby sidearm cartridge with a round nose
pointer_round "pistol" "sdf_box sdf_rounded_box" [
    float nose = sdf_rounded_box(coord - vec2(0.0, -0.3), vec2(0.27, 0.32), vec4(0.0, 0.27, 0.0, 0.27));
    float rcase = sdf_box(coord - vec2(0.0, 0.42), vec2(0.3, 0.36));
    float rim = sdf_box(coord - vec2(0.0, 0.8), vec2(0.34, 0.06));
    outval = min(max(min(nose, rcase), 0.035 - abs(coord.y - 0.04)), rim);
]
