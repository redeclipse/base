// a round grenade with the grooves either side of its cap's band
pointer_round "grenade" "sdf_circle" [
    vec2 c = coord - vec2(0.535, -0.585);
    float groove = abs(sdf_circle(c, 1.0)) - 0.035;
    groove = min(groove, max(abs(sdf_circle(c, 0.41)) - 0.025, -0.5 - coord.y));
    outval = max(sdf_circle(coord, 0.62), -groove);
]
