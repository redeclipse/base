// a trident's head with barbed prongs
pointer_round "trident" "sdf_box sdf_segment sdf_triangle" [
    vec2 q = vec2(abs(coord.x), coord.y);
    float shaft = sdf_segment(coord, vec2(0.0, -0.55), vec2(0.0, 0.92)) - 0.08;
    float prongs = sdf_segment(q, vec2(0.42, -0.5), vec2(0.42, -0.05)) - 0.07;
    float tips = min(sdf_triangle(q, vec2(0.42, -0.98), vec2(0.58, -0.5), vec2(0.26, -0.5)), sdf_triangle(coord, vec2(0.0, -0.98), vec2(0.17, -0.5), vec2(-0.17, -0.5)));
    float bar = sdf_box(coord - vec2(0.0, -0.05), vec2(0.49, 0.08));
    outval = min(min(shaft, prongs), min(tips, bar));
]
