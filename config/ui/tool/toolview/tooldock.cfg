// Docks: the left and right edges of the edit view, each holding Tool panels as tabs, one shown at a time

// Tool panels shown as Dock tabs: panel, action that opens it, tab label, default Dock (0 left, 1 right)
tooldock_tabs = [
    [ tool_textures      ta_textures      "Textures"    0 ]
    [ tool_texpaint      ta_tex_paint     "Paint"       0 ]
    [ tool_materials     ta_mats          "Materials"   0 ]
    [ tool_ent           ta_ents          "Entities"    0 ]
    [ tool_env           ta_env           "Environment" 1 ]
    [ tool_phys          ta_physics       "Physics"     1 ]
    [ tool_ai            ta_ai            "AI"          1 ]
    [ tool_edit_settings ta_edit_settings "Settings"    1 ]
    [ tool_edit_bindings ta_edit_bindings "Bindings"    1 ]
]

// Panels opened from a Dock tab that stay in its Dock: panel, tab panel
tooldock_followers = [
    tool_texeditslot tool_textures
    tool_texreplace  tool_textures
]

// Most tabs in a row of the tab strip
TOOLDOCK_TAB_COLUMNS = 5

// The Dock each tab's panel is in, 0 left, 1 right
looplist _tab $tooldock_tabs [
    defvarp (concatword tooldock_ (at $_tab 0)) 0 (at $_tab 3) 1
]

defvarp tooldockleftcollapsed 0 0 1
defvarp tooldockrightcollapsed 0 0 1

// 1:<panel>
tooldock_isslot = [
    || [=s $arg1 left] [=s $arg1 right]
]

// The tab entry of a panel, or nothing for panels that aren't tabs
// 1:<name>
tooldock_tab = [
    local _found
    _found = []
    looplist _tab $tooldock_tabs [
        if (=s (at $_tab 0) $arg1) [
            _found = $_tab
        ]
    ]
    result $_found
]

// The tab panel a panel belongs to: itself when it's a tab, the tab it follows, or nothing
// 1:<name>
tooldock_tab_panel = [
    local _followed
    _followed = (listassoc=s $tooldock_followers $arg1)
    result (? (!=s $_followed) $_followed (? (!=s (tooldock_tab $arg1)) $arg1 []))
]

// The Dock (left or right) a panel opens in, or nothing for panels outside the Docks
// 1:<name>
tooldock_slot = [
    local _tab
    _tab = (tooldock_tab_panel $arg1)
    result (? (!=s $_tab) (? (getvar (concatword tooldock_ $_tab)) right left) [])
]

// The tabs in a Dock
// 1:<slot>
tooldock_slot_tabs = [
    local _side _tabs
    _side = (=s $arg1 right)
    _tabs = []
    looplist _tab $tooldock_tabs [
        if (= (getvar (concatword tooldock_ (at $_tab 0))) $_side) [
            _tabs = (concat $_tabs (concatword "[" $_tab "]"))
        ]
    ]
    result $_tabs
]

// The tab shown in a Dock, or nothing
// 1:<slot>
tooldock_slot_active = [
    tooldock_tab_panel $(toolpanel_attr $arg1 name)
]

// 1:<slot>
tooldock_collapsed = [
    && [tooldock_isslot $arg1] [getvar (concatword tooldock $arg1 collapsed)]
]

// 1:<slot> 2:<collapsed>
tooldock_set_collapsed = [
    if (tooldock_isslot $arg1) [
        (concatword tooldock $arg1 collapsed) $arg2
    ]
]

// Shows a tab's panel in its Dock, opening the Dock if it is collapsed
// 1:<panel>
tooldock_select = [
    local _slot _tab
    _slot = (tooldock_slot $arg1)
    _tab  = (tooldock_tab $arg1)
    tooldock_set_collapsed $_slot 0
    if (!=s (tooldock_slot_active $_slot) $arg1) [
        toolpanel_close_panel $_slot
        tool_do_action (at $_tab 1)
    ]
]

// Moves a tab to the other Dock, and shows it there if it was shown
// 1:<panel>
tooldock_move = [
    local _var _slot _shown
    _var   = (concatword tooldock_ $arg1)
    _slot  = (tooldock_slot $arg1)
    _shown = (=s (tooldock_slot_active $_slot) $arg1)
    if $_shown [
        toolpanel_close_panel $_slot
    ]
    $_var (! (getvar $_var))
    if $_shown [
        tooldock_select $arg1
    ]
]

// Height of a Dock's tab strip
// 1:<slot>
tooldock_tabs_height = [
    if (tooldock_isslot $arg1) [
        local _rows
        _rows = (div (+ (listlen (tooldock_slot_tabs $arg1)) (- $TOOLDOCK_TAB_COLUMNS 1)) $TOOLDOCK_TAB_COLUMNS)
        result (+f (*f $_rows (+f $ui_tool_button_height_m $ui_tool_elem_space_s)) $ui_tool_elem_space_m $ui_tool_elem_space_m)
    ] [
        result 0
    ]
]

// Tab strip of a Dock, shown under its title bar
// 1:<slot>
ui_tooldock_tabs = [
    local _tabs _active _rows _columns _width
    _tabs    = (tooldock_slot_tabs $arg1)
    _active  = (tooldock_slot_active $arg1)
    _rows    = (div (+ (listlen $_tabs) (- $TOOLDOCK_TAB_COLUMNS 1)) $TOOLDOCK_TAB_COLUMNS)
    _columns = (div (+ (listlen $_tabs) (- $_rows 1)) (max $_rows 1))
    // The tabs fill the Dock's content width, unscaled for the buttons, which scale it
    _width   = (divf (-f (maxf (*f $ui_toolpanel_width $uitoolscale) (tooldock_minw $arg1)) (*f $ui_toolpanel_pad_x 2)) $uitoolscale)
    _width   = (divf (-f $_width (*f (- $_columns 1) $ui_tool_elem_space_s_unscaled)) (max $_columns 1))

    uigrid $_columns $ui_tool_elem_space_s $ui_tool_elem_space_s [
        looplist _tab $_tabs [
            if (=s (at $_tab 0) $_active) [
                ui_tool_interactable_colour = $ui_tool_select_colour
            ]
            ui_tool_button [
                p_label       = (at $_tab 2)
                p_label_align = 0
                p_width       = $_width
                p_height      = $ui_tool_button_height_m_unscaled
                p_colour      = (? (=s (at $_tab 0) $_active) $ui_tool_accent_colour $ui_tool_mid_accent_colour)
                p_tip_action  = (at $_tab 1)
                p_noonline    = (& (at (getalias (at $_tab 1)) $TA_PROP_FLAGS) $TA_FLAG_NOONLINE)
                p_on_click      = [tooldock_select (at $_tab 0)]
                p_on_rightclick = [tooldock_move (at $_tab 0)]
            ]
        ]
    ]
    uiprev [uialign -1 -1]
]

// Buttons in a Dock's title bar: move to the other Dock and collapse
// 1:<slot>
ui_tooldock_bar_buttons = [
    local _tab _toright
    _tab     = (tooldock_slot_active $arg1)
    _toright = (=s $arg1 left)

    if (!=s $_tab) [
        ui_toolpanel_bar_button (? $_toright "<grey><rotate:1>textures/icons/arrow" "<grey><rotate:3>textures/icons/arrow") (? $_toright "Move to the right Dock" "Move to the left Dock") (format "tooldock_move %1" $_tab)
    ]
    ui_toolpanel_bar_button "<grey><rotate:2>textures/icons/arrow" "Collapse the Dock to a strip" (format "tooldock_set_collapsed %1 1" $arg1)
]

// A collapsed Dock: a thin strip with a button to open it and one per tab
// 1:<slot>
ui_tooldock_strip = [
    local _active
    _active = (tooldock_slot_active $arg1)

    uipad 0 0 (+f $ui_toolpanel_offset $toolmenubar_offset) $ui_toolinfo_status_height [
        uialign (? (=s $arg1 left) -1 1) -1
        uistyle clampy
        uicolour $ui_tool_base_opaque_colour 0 0 [
            uistyle clampy
            uivlist $ui_tool_elem_space_s [
                uialign 0 -1
                uiskin $ui_tool_button_height_l $ui_tool_button_height_l 0x666666 0x999999 0xcccccc [
                    uiimage "<grey>textures/icons/arrow" 0xffffff 0 $ui_tool_icon_size_m $ui_tool_icon_size_m
                    uirelease [tooldock_set_collapsed $arg1 0]
                    ui_tool_tip [
                        p_tip_simple = "Open the Dock"
                    ]
                ] 1
                looplist _tab (tooldock_slot_tabs $arg1) [
                    if (=s (at $_tab 0) $_active) [
                        ui_tool_interactable_colour = $ui_tool_select_colour
                    ]
                    ui_tool_button [
                        p_icon       = (at (getalias (at $_tab 1)) $TA_PROP_ICON)
                        p_icon_align = 0
                        p_width      = $ui_tool_button_height_l_unscaled
                        p_height     = $ui_tool_button_height_l_unscaled
                        p_tip_action = (at $_tab 1)
                        p_on_click   = [tooldock_select (at $_tab 0)]
                    ]
                ]
            ]
        ]
    ]
]

// Width the left Dock took when last drawn, 0 when it showed nothing
tooldock_drawn_left = 0
tooldock_drawn_right = 0

// The widest each Dock has been; both Docks keep the wider of the two, so neither changes width between tabs and they match
tooldock_maxw_left  = 0
tooldock_maxw_right = 0

tooldock_reset_widths = [
    tooldock_maxw_left  = 0
    tooldock_maxw_right = 0
]
tool_calc_ui_dimensions_handler tooldock_reset_widths

// 1:<slot>
tooldock_minw = [
    // the wider of the two, but not so wide that less than 30% of the screen is left between them
    ? (tooldock_isslot $arg1) (minf (maxf $tooldock_maxw_left $tooldock_maxw_right) (*f $uiaspect 0.35)) 0
]
