toolinfo_calc_dimensions = [
    ui_toolinfo_action_offset = (*f 0.025 $uitoolscale)
    ui_toolinfo_action_height = (*f 0.05 $uitoolscale)
    ui_toolinfo_action_image_size = (*f 0.06 $uitoolscale)
    ui_toolinfo_status_height = (*f 0.026 $uitoolscale)
]
tool_calc_ui_dimensions_handler toolinfo_calc_dimensions
toolinfo_calc_dimensions

tool_info_text = ""
tool_info_subtext = ""
tool_info_right_content = []
tool_info_time = 0

defvarp toolinfoactionsound 0 1 1
defvarp toolinfoactionlength 1000 5000 60000

defvarp toolinfoextendedstatus 0 0 1

tool_info_show_props = [
    [ p_subtext "" ]
    [ p_children [] ]
    [ p_sound S_ACTION ]
]

// 1:<text> 2:<props>
tool_info_show = [
    @(props $tool_info_show_props arg2)

    tool_info_text = $arg1
    tool_info_subtext = $p_subtext
    tool_info_right_content = $p_children
    tool_info_time = $totalmillis

    if $toolinfoactionsound [
        soundbyname $p_sound
    ]
]

// 1:<text> 2:<action> 3:<props>
tool_info_show_action = [
    @(props $tool_info_show_props arg3)

    local _icon
    _icon = (at $$arg2 $TA_PROP_ICON)

    tool_info_show $arg1 [
        p_subtext = [@@p_subtext]
        p_sound = @p_sound
        p_children = [
            uiimage @_icon $ui_tool_accent_colour 0 $ui_toolinfo_action_image_size $ui_toolinfo_action_image_size
            @@p_children
        ]
    ]
]

ui_toolinfo_action = [
    local _colour
    _colour = (ui_tool_flash $ui_tool_dark_colour $tool_info_time)

    uipad 0 $ui_toolinfo_action_offset 0 $ui_toolinfo_action_offset [
        uiskin 0 $ui_toolinfo_action_height $_colour 0 0 [
            uispace $ui_tool_elem_pad_l $ui_tool_elem_pad_m [
                uistyle clampxy
                uihlist $ui_tool_elem_space_xl [
                    uistyle clampx
                    uivlist 0 [
                        uistyle clampx
                        uitext $tool_info_text $ui_tool_text_size_m
                        if (!=s $tool_info_subtext) [
                            uicolourtext $tool_info_subtext $ui_tool_dark_accent_colour $ui_tool_text_size_s
                        ]
                        uipropchild [uialign -1]
                    ]
                    uiprev [uialign -1]
                    doargs $tool_info_right_content
                    uialign 1
                ]
            ]

            ui_tool_fadeout $tool_info_time $toolinfoactionlength
        ]
    ]
    uiprev [uialign 1 1]
]

// A label and value in the status line
// 1:<label> 2:<value>
ui_toolinfo_stat = [
    uihlist $ui_tool_elem_space_m [
        uicolourtext $arg1 $ui_tool_dark_accent_colour $ui_tool_text_size_xs
        uitext $arg2 $ui_tool_text_size_xs
    ]
]

ui_toolinfo_status = [
    local _sel_ents
    _sel_ents = (getenginestat 15)

    uiskin $uiaspect $ui_toolinfo_status_height $ui_tool_base_colour 0 0 [
        uispace $ui_padsmall 0 [
            uistyle clampxy
            // Clipped short of the frame rate on the right
            uiclip (-f $uiaspect (*f 0.32 $uitoolscale)) 0 0 0 [
            uihlist (*f $ui_tool_elem_space_xl 1.5) [
                uialign -1
                ui_toolinfo_stat "Camera" (format "%1, %2, %3" (getenginestat 21) (getenginestat 22) (getenginestat 23))
                ui_toolinfo_stat "Yaw" (getenginestat 24)
                ui_toolinfo_stat "Pitch" (getenginestat 25)
                ui_toolinfo_stat "Entities" (concat (getenginestat 14) (? (> $_sel_ents 0) (format "(%1 selected)" $_sel_ents) ""))
                ui_toolinfo_stat "Waypoints" (getenginestat 16)
                ui_toolinfo_stat "Triangles" (format "%1k (%2%% drawn)" (getenginestat 0) (getenginestat 1))
                ui_toolinfo_stat "Vertices" (format "%1k (%2%% drawn)" (getenginestat 2) (getenginestat 3))
                ui_toolinfo_stat "Extra vertices" (format "%1k (%2k in arrays)" (getenginestat 4) (getenginestat 5))
                ui_toolinfo_stat "Particles" $numenvparts
                if $toolinfoextendedstatus [
                    ui_toolinfo_stat "Octree nodes" (getenginestat 6)
                    ui_toolinfo_stat "Vertex arrays" (getenginestat 7)
                    ui_toolinfo_stat "Draw calls" (format "%1 (%2 batches)" (getenginestat 8) (getenginestat 9))
                    ui_toolinfo_stat "Occlusion queries" (getenginestat 10)
                ]
            ]
            ]
            uiprev [uialign -1]
            uihlist (*f $ui_tool_elem_space_xl 1.5) [
                ui_toolinfo_stat "FPS" (getenginestat 11)
                ui_toolinfo_stat "Slowest frame" (concatword (div 1000 (max 1 (- (getenginestat 11) (getenginestat 13)))) " ms")
            ]
            uiprev [uialign 1]
        ]
    ]
    uiprev [uialign -1 1]
]

ui_toolinfo = [
    if (< (- $totalmillis $tool_info_time) $toolinfoactionlength) [
        @@ui_toolinfo_action
    ]

    @ui_toolinfo_status
]
