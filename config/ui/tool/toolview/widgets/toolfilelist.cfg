tool_filelist_filter_query = ""

tool_filelist_curdir       = ""
tool_filelist_dirs         = []
tool_filelist_files        = []
tool_filelist_numdirs      = 0
tool_filelist_numfiles     = 0
tool_filelist_sel_type     = 0
tool_filelist_sel_index    = -1
tool_filelist_sel_path     = ""
tool_filelist_active_path  = ""
tool_filelist_preview      = 1

// Widget state that p_instance swaps in and out, and each variable's value
// for an instance that has never been shown. The search query is not in it:
// see tool_filelist_query_var.
tool_filelist_state_vars     = [curdir dirs files numdirs numfiles sel_type sel_index sel_path active_path]
tool_filelist_state_defaults = [[] [] [] 0 0 0 -1 [] []]

// The variable the search field edits, per instance. Swapping its value is
// not enough: the engine keeps one text editor, and one focus, per variable
// name, so two browsers on screen sharing one would type into and show each
// other's query.
// 1:<instance, or "">
tool_filelist_query_var = [
    ? (=s $arg1) tool_filelist_filter_query (concatword tool_filelist_ $arg1 _filter_query)
]

// Makes tool_filelist_<instance>_* the widget's state, stashing the current
// one. The UI is immediate-mode, so everything the widget runs happens between
// this and tool_filelist_instance_leave. A handler inside an instanced widget
// must not open another file picker: the picker's setup would be undone on leave.
// 1:<instance>
tool_filelist_instance_enter = [
    local _var _inst
    loop i (listlen $tool_filelist_state_vars) [
        _var  = (at $tool_filelist_state_vars $i)
        _inst = (concatword "tool_filelist_" $arg1 "_" $_var)
        set (concatword "tool_filelist_saved_" $_var) (getalias (concatword "tool_filelist_" $_var))
        if (identexists $_inst) [
            set (concatword "tool_filelist_" $_var) (getalias $_inst)
        ] [
            set (concatword "tool_filelist_" $_var) (at $tool_filelist_state_defaults $i)
        ]
    ]
]

// 1:<instance>
tool_filelist_instance_leave = [
    looplist _var $tool_filelist_state_vars [
        set (concatword "tool_filelist_" $arg1 "_" $_var) (getalias (concatword "tool_filelist_" $_var))
        set (concatword "tool_filelist_" $_var) (getalias (concatword "tool_filelist_saved_" $_var))
    ]
]

// Path of an item in the current directory, relative to the root
// 1:<name>
tool_filelist_relpath = [
    ? (=s $tool_filelist_curdir) $arg1 (concatword $tool_filelist_curdir "/" $arg1)
]

// The current directory as listfiles takes it
// 1:<root>
tool_filelist_dirpath = [
    ? (=s $tool_filelist_curdir) $arg1 (concatword $arg1 "/" $tool_filelist_curdir)
]

// What a file item reports to p_on_select, p_on_activate and p_on_item_menu
// 1:<name>
tool_filelist_item_value = [
    tool_filelist_relpath (? $p_strip_ext (filenoext $arg1) $arg1)
]

// listfiles merges the working, home and package directories, so one name can
// come back more than once
// 1:<list>
tool_filelist_dedup = [
    local _out
    _out = []
    looplist _item $arg1 [
        if (listhas $_out $_item) [] [
            append _out (escape $_item)
        ]
    ]
    result $_out
]

tool_filelist_updir = [
    local _path
    _path = (strreplace $tool_filelist_curdir "/" " ")
    _path = (listsplice $_path "" (- (listlen $_path) 1) 1)
    tool_filelist_curdir = (strreplace $_path " " "/")

    tool_filelist_fetchdir
]

// 1:<var>
tool_filelist_get_active = [
    if (= $p_file_type $TOOL_FILE_IMAGE) [
        tool_filelist_active_path = (tool_path_striptexcmds (filenoext (p_get $$arg1)))
    ] [
        tool_filelist_active_path = (p_get $$arg1)
    ]
]

// 1:<var>
tool_filelist_select = [
    local _selname
    _selname = ""

    if (= $tool_filelist_sel_type 0) [
        _selname = (at $tool_filelist_files $tool_filelist_sel_index)
    ] [
        _selname = (at $tool_filelist_dirs $tool_filelist_sel_index)
    ]

    if (!=s $tool_filelist_curdir) [
        _selname = (concatword $tool_filelist_curdir "/" $_selname)
    ]

    if $p_strip_ext [
        _selname = (filenoext $_selname)
    ]

    tool_param_set $arg1 (p_set $_selname) $p_on_change
    tool_filelist_get_active $arg1
]

// 1:<index> 2:<name> 3:<selected> 4:<dir> 5:<var>
ui_tool_filelist_item = [
    local _icon_size
    _icon_size = (*f $p_sel_size 0.8)

    uitarget $p_sel_size $p_sel_size [
        if $uidrawn [
            local _fullfname

            if $p_strip_ext [
                _fullfname = (filenoext $arg2)
            ] [
                _fullfname = $arg2
            ]

            uivlist 0 [
                local _text_area _fname
                _text_area = (*f $p_sel_size 0.8)
                _fname = (filename $arg2)

                caseif [!= $arg4 0] [
                    uiimage "<grey>textures/icons/action" 0xffffff 0 $_icon_size $_icon_size
                ] [= $p_file_type $TOOL_FILE_PREFAB] [
                    uiprefabpreview (concatword $p_root "/" (tool_filelist_relpath (filenoext $arg2))) 0xFFFFFF 1 $_icon_size $_icon_size [
                        uipreviewyaw (mod (div $totalmillis 10) 360)
                    ]
                ] [tool_file_isimage $arg2] [
                    uithumbnailclamped (concatword "<thumbnail:64,-1>" $tool_filelist_curdir "/" $arg2) $_icon_size $_icon_size
                ] [&& (=s $_fname "textures") [= $p_file_type $TOOL_FILE_ASSETPACK]] [
                    uiimage "<grey>textures/icons/edit/texture" 0xffffff 0 $_icon_size $_icon_size
                ] [&& (=s $_fname "decals") [= $p_file_type $TOOL_FILE_ASSETPACK]] [
                    uiimage "<grey>textures/icons/edit/decal" 0xffffff 0 $_icon_size $_icon_size
                ] [&& (=s $_fname "models") [= $p_file_type $TOOL_FILE_ASSETPACK]] [
                    uiimage "<grey>textures/icons/edit/cube" 0xffffff 0 $_icon_size $_icon_size
                ] [&& (=s $_fname "sounds") [= $p_file_type $TOOL_FILE_ASSETPACK]] [
                    uiimage "<grey>textures/icons/edit/sound" 0xffffff 0 $_icon_size $_icon_size
                ] () [
                    uiimage "<grey>textures/icons/edit/new" 0xffffff 0 $_icon_size $_icon_size
                ]

                ui_tool_autoscroll_text $_fullfname [
                    p_width = @_text_area
                ]
            ]

            uipress [
                local _selname
                _selname = (? (= $arg4 0) (at $tool_filelist_files $arg1) (at $tool_filelist_dirs $arg1))
                tool_filelist_sel_type = $arg4
                tool_filelist_sel_index = $arg1
                if (!=s $tool_filelist_curdir) [
                    tool_filelist_sel_path = (concatword $tool_filelist_curdir "/" $_selname)
                ] [
                    tool_filelist_sel_path = $_selname
                ]

                if (&& $tool_filelist_preview [! $arg4] [= $p_file_type $TOOL_FILE_SOUND]) [
                    previewsound $tool_filelist_sel_path 0.5
                ]

                if (= $arg4 0) [
                    p_on_select (tool_filelist_item_value $arg2)
                ]
            ]

            // The id is global: the instance keeps a click here and one on the
            // same index in another browser from making a double-click
            uidoublepress (concatword tool_filelist_item_ (? (=s $p_instance) "" (concatword $p_instance _)) (at ["f" "d"] $arg4) _ $arg1) [
                if (!= $arg4 0) [
                    if (!=s $tool_filelist_curdir) [
                        appendword tool_filelist_curdir (concatword "/" $_fullfname)
                    ] [
                        tool_filelist_curdir = $_fullfname
                    ]
                    tool_filelist_fetchdir
                ] [
                    if (=s $p_on_activate) [
                        tool_filelist_select $arg5
                    ] [
                        p_on_activate (tool_filelist_item_value $arg2)
                    ]
                ]
            ]

            if (&& [= $arg4 0] [!=s $p_on_item_menu]) [
                uialtrelease [
                    p_on_item_menu (tool_filelist_item_value $arg2)
                ]

                uihover [
                    tool_rightclickable
                ]
            ]

            if (&& (= $tool_filelist_sel_type $arg4) [= $tool_filelist_sel_index $arg1]) [
                uicolour $ui_tool_skyboxlist_sel_colour 0 0 [
                    uipropagate [uicolourblend 0.2]
                ]
                uiprev [uistyle clampxy]
            ]

            if (=s $tool_filelist_active_path (concatword $tool_filelist_curdir "/" $_fullfname)) [
                uioutline $ui_tool_skyboxlist_sel_colour
                uiprev [uistyle clampxy]
            ]
        ]
    ]
]

// 1:<list>
tool_filelist_rem_hidden = [
    local _done _index
    _index = -1
    _done = 0

    while [(= $_done 0)] [
        _index = (listfind i $$arg1 [
            tool_file_ishidden $i
        ])

        if (>= $_index 0) [
            $arg1 = (listsplice $$arg1 "" $_index 1)
        ] [
            _done = 1
        ]
    ]
]

tool_filelist_filter_type = [
    local _done _index
    _index = -1
    _done = 0

    if (!= $p_file_type @TOOL_FILE_ANY) [
        while [(= $_done 0)] [
            _index = (listfind i $tool_filelist_files [
                ! (tool_file_is_type $i $p_file_type)
            ])

            if (>= $_index 0) [
                tool_filelist_files = (listsplice $tool_filelist_files "" $_index 1)
            ] [
                _done = 1
            ]
        ]
    ]
]

tool_filelist_asset_types = [
    textures
    sounds
    models
    decals
]

// 1:<dir>
tool_filelist_assetscan = [
    local _dirs _files _assetname
    _files = []
    _dirs = (listfiles (concatword "data/" $arg1) "" 2)

    looplist dir $_dirs [
        if (!=s (substr $dir 0 1) ".") [
            tool_filelist_assetscan $dir
            _files = (listfiles (concatword "data/" $arg1 "/" $dir) "" 1)

            looplist type $tool_filelist_asset_types [
                if (>= (listfind=s $_files (concatword $type ".cfg")) 0) [
                    if (=s $arg1) [
                        _assetname = (concatword $dir "/" $type)
                    ] [
                        _assetname = (concatword $arg1 "/" $dir "/" $type)
                    ]
                    append tool_filelist_files $_assetname
                    tool_filelist_numfiles = (+ $tool_filelist_numfiles 1)
                ]
            ]
        ]
    ]
]

tool_filelist_fetchdir = [
    // Fetch dirs and files only when not scanning for asset packs
    if (!= $p_file_type $TOOL_FILE_ASSETPACK) [
        tool_filelist_dirs  = (listfiles (tool_filelist_dirpath $p_root) "" 2)
        tool_filelist_files = (listfiles (tool_filelist_dirpath $p_root) "" 1)

        tool_filelist_rem_hidden tool_filelist_dirs
        tool_filelist_rem_hidden tool_filelist_files

        tool_filelist_dirs  = (tool_filelist_dedup $tool_filelist_dirs)
        tool_filelist_files = (tool_filelist_dedup $tool_filelist_files)

        tool_filelist_filter_type

        tool_filelist_numdirs  = (listlen $tool_filelist_dirs)
        tool_filelist_numfiles = (listlen $tool_filelist_files)
    ] [
        tool_filelist_files    = []
        tool_filelist_numdirs  = 0
        tool_filelist_numfiles = 0
        tool_filelist_assetscan $tool_filelist_curdir
    ]

    tool_filelist_sel_type  = 0
    tool_filelist_sel_index = -1
]

// 1:<item> 2:<query>
tool_filelist_filter = [
    result (|| [=s $arg2] [!= (strcasestr $arg1 $arg2) -1])
]

tool_filelist_props = [
    [ p_sel_size            0.08                      ]
    [ p_sel_area            0.45                      ]
    [ p_sel_space           0.0035                    ]
    [ p_filter_query_length 32                        ]
    [ p_columns             5                         ]
    [ p_slider_size         $ui_toolpanel_slider_size ]
    [ p_file_type           $TOOL_FILE_ANY            ]
    [ p_on_change           []                        ]
    [ p_get                 [[result $arg1]]          ]
    [ p_set                 [[result $arg1]]          ]
    [ p_width               0                         ]
    [ p_can_deselect        1                         ]
    [ p_strip_ext           1                         ]
    [ p_root                "data"                    ]
    [ p_footer              1                         ]
    [ p_refetch             0                         ]
    [ p_instance            ""                        ]
    [ p_on_select           []                        ]
    [ p_on_activate         []                        ]
    [ p_on_item_menu        []                        ]
]

// 1:<var> 2:<props>
ui_tool_filelist = [
    @(props $tool_filelist_props arg2)

    @(tool_ui_scale p_sel_size)
    @(tool_ui_scale p_sel_space)
    @(tool_ui_scale p_slider_size)
    @(tool_ui_scale p_width)

    if (!=s $p_instance) [
        tool_filelist_instance_enter $p_instance
    ]

    local _query_var _query
    _query_var = (tool_filelist_query_var $p_instance)
    // uifield would only create an unknown ident, which $-lookups complain about
    if (identexists $_query_var) [] [
        set $_query_var ""
    ]
    _query     = (getalias $_query_var)

    if (|| $toolpanel_this_isinit $p_refetch) [
        tool_filelist_get_active $arg1
        tool_filelist_fetchdir
    ]

    uivlist 0 [
        uistyle clampx

        ui_tool_textinput $_query_var $p_filter_query_length [
            p_label = "Search:"
        ]

        uifill 0 $ui_tool_elem_space_l

        uihlist $ui_tool_elem_space_s [
            ui_tool_button [
                p_icon       = "<grey>textures/icons/shock"
                p_tip_simple = "Refresh"
                p_icon_size  = 0.015
                p_on_click   = [
                    tool_filelist_fetchdir
                ]
            ]

            if (!= $p_file_type $TOOL_FILE_ASSETPACK) [
                ui_tool_button [
                    p_disabled   = (=s $tool_filelist_curdir)
                    p_icon       = "<grey>textures/icons/arrow"
                    p_tip_simple = "Go up"
                    p_icon_size  = 0.015
                    p_on_click   = [
                        tool_filelist_updir
                    ]
                ]
                uitext "^fADirectory: " $ui_tool_text_size_s
                ui_tool_autoscroll_text $tool_filelist_curdir [
                    p_width     = @(*f $p_width 0.7)
                    p_text_size = $ui_tool_text_size_s
                ]
            ] [
                uitext "Assets packs:" $ui_tool_text_size_s
            ]

            uialign -1
        ]

        uifill 0 $ui_tool_elem_space_l
        uiline $ui_tool_dark_accent_colour 0 0 [ uistyle clampx ]
        uifill 0 $ui_tool_elem_space_l

        local _item_name _visible
        _item_name = ""
        // A scroll region with zero visible rows has zero natural AND zero
        // clamped height, so the engine's ScrollBar::vscale() (h / max(virth,
        // h)) divides 0 by 0 and the scrollbar's rect goes NaN. Count matches
        // first and skip uiscroll/uivscroll entirely when there are none, so
        // that never happens (an empty directory or a search with no hits).
        _visible = 0
        loop i $tool_filelist_numdirs [
            if (tool_filelist_filter (at $tool_filelist_dirs $i) $_query) [ _visible = (+ $_visible 1) ]
        ]
        loop i $tool_filelist_numfiles [
            if (tool_filelist_filter (at $tool_filelist_files $i) $_query) [ _visible = (+ $_visible 1) ]
        ]

        uihlist 0 [
            uistyle clampx
            if $_visible [
                uiscroll 0 $p_sel_area [
                    uistyle lefttop
                    uigrid $p_columns $p_sel_space $p_sel_space [
                        loop i $tool_filelist_numdirs [
                            _item_name = (at $tool_filelist_dirs $i)
                            if (tool_filelist_filter $_item_name $_query) [
                                ui_tool_filelist_item $i $_item_name 0 1 $arg1
                            ]
                        ]
                        loop i $tool_filelist_numfiles [
                            _item_name = (at $tool_filelist_files $i)
                            if (tool_filelist_filter $_item_name $_query) [
                                ui_tool_filelist_item $i $_item_name 0 0 $arg1
                            ]
                        ]
                    ]
                ]
                uivscroll $p_slider_size $p_sel_area 1
            ] [
                // uifill, not uispace: uispace pads above AND below, which
                // made an empty list twice as tall and pushed the footer
                // (OK/Cancel) out of the panel
                uifill 0 $p_sel_area [ uistyle clampx ]
            ]
            uialign 1
        ]

        if $p_footer [
            uifill 0 $ui_tool_elem_space_l
            uiline $ui_tool_dark_accent_colour 0 0 [ uistyle clampx ]
            uifill 0 $ui_tool_elem_space_l

            uivlist $ui_tool_elem_space_l [
                uistyle clampx
                uigrid 2 0 $ui_tool_elem_space_s [
                    uitext "^fASelected: " $ui_tool_text_size_s
                    ui_tool_autoscroll_text $tool_filelist_sel_path [
                        p_width     = @(*f $p_width 0.8)
                        p_text_size = $ui_tool_text_size_s
                    ]

                    uitext "^fACurrent: " $ui_tool_text_size_s
                    ui_tool_autoscroll_text $tool_filelist_active_path [
                        p_width     = @(*f $p_width 0.8)
                        p_text_size = $ui_tool_text_size_s
                    ]

                    uialign -1
                ]

                if (= $p_file_type $TOOL_FILE_SOUND) [
                    ui_tool_checkbox tool_filelist_preview [
                        p_label = "Enable preview"
                    ]
                    uiprev [uialign -1]
                ]

                uihlist $ui_tool_elem_space_l [
                    if $p_can_deselect [
                        ui_tool_button [
                            p_icon       = $exittex
                            p_icon_size  = 0.015
                            p_on_click   = [
                                tool_param_set @arg1 "" [@@p_on_change]
                            ]
                            p_tip_simple = "Clear selection"
                        ]
                    ]

                    ui_tool_button [
                        p_label    = "Ok"
                        p_width    = 0.18
                        p_on_click = [
                            tool_filelist_select @arg1
                        ]
                    ]
                    ui_tool_button [
                        p_label    = "Cancel"
                        p_width    = 0.18
                        p_on_click = [
                            toolpanel_pop_close_this
                        ]
                    ]
                ]
            ]
        ]
    ]

    if (!=s $p_instance) [
        tool_filelist_instance_leave $p_instance
    ]
]
