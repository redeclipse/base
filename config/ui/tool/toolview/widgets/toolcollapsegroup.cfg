tool_collapsegroup_props = [
    [ p_disabled   0                             ]
    [ p_label      ""                            ]
    [ p_label_size $ui_tool_text_size_s_unscaled ]
    [ p_force_open 0                             ]
    [ p_id         []                            ]
]

// 1:<id> 2:<children> 3:<props>
ui_tool_collapsegroup = [
    @(props $tool_collapsegroup_props arg3)

    @(tool_ui_scale p_label_size)

    local _show
    _show = (|| $p_force_open [? (getalias $arg1) 1 0])

    uitablerow [] [
        uistyle clampx
        @(ui_tool_interactable 0 0 [
            tool_control_highlight
            uistyle clampx

            uispace $ui_padsmall $ui_padsmaller [
                uialign -1
                uihlist $ui_tool_elem_space_m [
                    uitriangle $ui_tool_hl_colour (*f 0.005 $uitoolscale) (*f 0.005 $uitoolscale) (? $_show 180 90)
                    uicolourtext $p_label $ui_tool_hl_colour $p_label_size
                ]
            ]

            uirelease [
                $arg1 = (! $_show)
            ]
        ])
    ]

    if $_show [
        doargs $arg2
    ]
]