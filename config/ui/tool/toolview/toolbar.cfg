toolbar_calc_dimensions = [
    ui_toolbar_height = (+f $ui_tool_button_height_ml $ui_tool_elem_space_m)
    ui_toolbar_map_button_width = (uiwidth 0.175)
    ui_toolbar_button_space = $ui_tool_elem_space_l
]
tool_calc_ui_dimensions_handler toolbar_calc_dimensions
toolbar_calc_dimensions

// Dynamically calculated
ui_toolbar_tools_width = 0

toolbar_actions_left = []
toolbar_actions_right = []

// Actions whose button lights up while their panel is open, paired with that panel
toolbar_action_panels = [
    ta_edit_settings tool_edit_settings
    ta_edit_bindings tool_edit_bindings
    ta_search        tool_search
    ta_textures      tool_textures
    ta_tex_paint     tool_texpaint
    ta_env           tool_env
    ta_ents          tool_ent
    ta_mats          tool_materials
    ta_shapes        tool_shapes
    ta_ai            tool_ai
    ta_physics       tool_phys
]

// 1:<action>
tool_toolbar_action_active = [
    local _panel
    _panel = (listassoc=s $toolbar_action_panels $arg1)
    && [!=s $_panel] [toolpanel_isopen_stacked $_panel]
]

ui_toolbar_left = [
    uifill $ui_toolbar_tools_width 0 [
        uistyle clampxy
        uihlist $ui_toolbar_button_space [
            uistyle leftmiddle
            uistyle clampy

            looplist action $toolbar_actions_left [
                if (tool_toolbar_action_active $action) [
                    ui_tool_interactable_colour = $ui_tool_select_colour
                ]

                ui_tool_button [
                    p_icon = (at $$action $TA_PROP_ICON)
                    p_icon_size = $ui_tool_icon_size_m_unscaled
                    p_icon_align = 0
                    p_width = $ui_tool_button_height_ml_unscaled
                    p_height = $ui_tool_button_height_ml_unscaled
                    p_tip_action = $action
                    p_on_click = [
                        tool_do_action $action
                    ]
                    p_noonline = (& (at $$action $TA_PROP_FLAGS) $TA_FLAG_NOONLINE)
                ]
            ]

            uipropchild [uialign 0 0]
        ]
    ]
]

ui_toolbar_right = [
    uifill $ui_toolbar_tools_width 0 [
        uistyle clampxy
        uihlist $ui_toolbar_button_space [
            uistyle rightmiddle
            uistyle clampy

            looplist action $toolbar_actions_right [
                if (tool_toolbar_action_active $action) [
                    ui_tool_interactable_colour = $ui_tool_select_colour
                ]

                ui_tool_button [
                    p_icon = (at $$action $TA_PROP_ICON)
                    p_icon_size = $ui_tool_icon_size_m_unscaled
                    p_icon_align = 0
                    p_width = $ui_tool_button_height_ml_unscaled
                    p_height = $ui_tool_button_height_ml_unscaled
                    p_tip_action = $action
                    p_on_click = [
                        tool_do_action $action
                    ]
                    // right click moves the panel to the other dock
                    p_on_rightclick = [
                        tooldock_move (listassoc=s $toolbar_action_panels $action)
                    ]
                    p_noonline = (& (at $$action $TA_PROP_FLAGS) $TA_FLAG_NOONLINE)
                ]
            ]

            uipropchild [uialign 0 0]
        ]
    ]
]

ui_toolbar_map = [
    ui_tool_button [
        p_width = $ui_toolbar_map_button_width
        p_height = $ui_tool_button_height_ml_unscaled
        p_tip_simple = "Map settings"
        p_children = [
            local _variant
            _variant = (at $MPV_NAMES (? (= $forcemapvariant 2) 2 1))

            uihlist $ui_tool_elem_space_m [
                uiimage "<grey>textures/icons/editing" $ui_tool_accent_colour 0 $ui_tool_icon_size_s $ui_tool_icon_size_s
                uitext $mapname $ui_tool_text_size_s
                uicolourtext (concatword "r" $maprevision) $ui_tool_dark_accent_colour $ui_tool_text_size_xs
                uicolourtext (concat $_variant "variant") $ui_tool_dark_accent_colour $ui_tool_text_size_xs
            ]
        ]
        p_on_click = [
            tool_do_action ta_mapsettings
        ]
    ]
]

ui_toolbar_controls_settings_contents = []

ui_toolbar_controls_wireframe = [
    tool_edit_outline_sync

    uivlist $ui_tool_elem_space_s [
        ui_tool_section [
            p_label  = "Outline mode"
            p_page   = Interface
            p_anchor = "view-toggles"
        ]

        uihlist $ui_tool_elem_space_l [
            uivlist $ui_tool_elem_space_s [
                ui_tool_dropdown tool_edit_outline [
                    "None"
                    "Wireframe"
                    "Outline"
                ] [
                    p_on_change = [
                        tool_edit_outline_set
                    ]
                ]

                ui_tool_checkbox dtoutline [
                    p_label = "Outline depth test"
                ]
            ]

            ui_tool_colour outlinecolour [
                p_label_size = $ui_tool_text_size_xs_unscaled
                p_val_format = i
            ]
        ]

        ui_tool_button [
            p_label = "Close"
            p_width = $ui_tool_button_width_l_unscaled
            p_on_click = [
                ui_toolbar_controls_settings_contents = []
            ]
        ]
    ]
]

tool_toolbar_showmat_mask_substs = 0
tool_toolbar_showmat_mask_clips = 0
tool_toolbar_showmat_mask_flags = 0

ui_toolbar_controls_showmat = [
    uivlist $ui_tool_elem_space_s [
        ui_tool_section [
            p_label  = "Material volume overlay"
            p_page   = Interface
            p_anchor = "view-toggles"
        ]

        ui_tool_switch showmat [
            p_label = "Enable overlay"
        ]

        uifill 0 $ui_tool_elem_space_s
        uiline $ui_tool_dark_accent_colour 0 0 [ uistyle clampx ]
        uifill 0 $ui_tool_elem_space_s

        ui_tool_section [
            p_label = "Material visibility"
        ]

        ui_tool_switch vismatmask [
            p_label = "Substances"
            p_get = [= (& $vismatmask 0x1C) 0x1C]
            p_set = [^ $vismatmask 0x1C]
        ]

        ui_tool_switch vismatmask [
            p_label = "Clips"
            p_get = [= (& $arg1 0xE0) 0xE0]
            p_set = [^ $vismatmask 0xE0]
        ]

        ui_tool_switch vismatmask [
            p_label = "Other"
            p_get = [= (& $arg1 0xFF00) 0xFF00]
            p_set = [^ $vismatmask 0xFF00]
        ]

        uifill 0 $ui_tool_elem_space_s
        uiline $ui_tool_dark_accent_colour 0 0 [ uistyle clampx ]
        uifill 0 $ui_tool_elem_space_s

        ui_tool_button [
            p_label = "Close"
            p_width = $ui_tool_button_width_l_unscaled
            p_on_click = [
                ui_toolbar_controls_settings_contents = []
            ]
        ]
    ]
]

ui_toolbar_controls_settings = [
    if $ui_toolbar_controls_settings_contents [
        uiskin 0 0 $ui_tool_base_colour 0 0 [
            uispace $ui_tool_elem_space_l $ui_tool_elem_space_l [
                ui_toolbar_controls_settings_contents
            ]
        ]

        @@(ui_tool_allowinput)
    ]
]

tool_toolbar_focus_wireframe = [
    ui_toolbar_controls_settings_contents = ui_toolbar_controls_wireframe
]

tool_toolbar_focus_showmat = [
    ui_toolbar_controls_settings_contents = ui_toolbar_controls_showmat
]

// The view toggles under the Selection box: label, action, whether it is on
toolbar_view_toggles = [
    [ "Outline"        ta_cycle_outline         [|| $outline $wireframe] ]
    [ "Fullbright"     ta_toggle_fullbright     [$fullbright]            ]
    [ "No textures"    ta_toggle_blankgeom      [$blankgeom]             ]
    [ "Physics layers" ta_toggle_showphyslayers [$showphyslayers]        ]
    [ "Materials"      ta_toggle_showmat        [$showmat]               ]
]

// One view toggle, filling its cell so rows of toggles line up
// 1:<toggle>
ui_toolbar_toggle = [
    local _on
    _on = (do (at $arg1 2))
    if $_on [
        ui_tool_interactable_colour = $ui_tool_select_colour
    ]
    ui_tool_button [
        p_label      = (at $arg1 0)
        p_label_size = $ui_tool_text_size_xs_unscaled
        p_colour     = (? $_on $ui_tool_accent_colour $ui_tool_dark_accent_colour)
        p_tip_action = (at $arg1 1)
        p_height     = $ui_tool_button_height_m_unscaled
        p_on_click   = [
            tool_do_action (at $arg1 1)
        ]
    ]
    uiprev [uistyle clampx]
]

ui_toolbar_controls = [
    local _num _cols _gridnum
    _num     = (listlen $toolbar_view_toggles)
    // in rows of two when narrow, an odd one left over on a row of its own
    _cols    = (? $toolbar_narrow 2 $_num)
    _gridnum = (- $_num (mod $_num $_cols))

    uitarget 0 0 [
        uivlist $ui_tool_elem_space_s [
            uigrid $_cols $ui_tool_elem_space_s $ui_tool_elem_space_s [
                loop i $_gridnum [
                    ui_toolbar_toggle (at $toolbar_view_toggles $i)
                ]
            ]
            uiprev [uistyle clampx]
            loop i (- $_num $_gridnum) [
                ui_toolbar_toggle (at $toolbar_view_toggles (+ $_gridnum $i))
            ]
        ]

        @(ui_tool_allowinput)
    ]
    uiprev [uialign -1 1]
]

// The selected side, as the axis it faces
TOOLBAR_SEL_SIDES = ["-X" "+X" "-Y" "+Y" "-Z (bottom)" "+Z (top)"]

// A row of the Selection box
// 1:<label> 2:<value>
ui_toolbar_sel_row = [
    uifill (*f 0.18 $uitoolscale) 0 [
        uicolourtext $arg1 $ui_tool_mid_accent_colour $ui_tool_text_size_xs
        uiprev [uialign -1]
        uitext $arg2 $ui_tool_text_size_xs
        uiprev [uialign 1]
    ]
]

ui_toolbar_sel = [
    local _mat _matname _grid

    uiskin 0 0 $ui_tool_base_colour 0 0 [
        @(ui_tool_allowinput)

        uispace $ui_padsmall $ui_padsmall [
            uistyle clampx

            uivlist $ui_tool_elem_space_s [
                uistyle clampx

                ui_tool_section [
                    p_label  = "Selection"
                    p_page   = Interface
                    p_anchor = "selection-and-status"
                ]

                _grid = (getenginestat 41)
                ui_toolbar_sel_row "Grid" (format "%1 (%2)" $_grid (? (< $_grid 16) (concatword (divf $_grid 0.16) " cm") (concatword (divf $_grid 16) " m")))
                ui_toolbar_sel_row "Side" (at $TOOLBAR_SEL_SIDES (getenginestat 40))
                ui_toolbar_sel_row "Size" (format "%1 x %2 x %3" (getenginestat 30) (getenginestat 31) (getenginestat 32))
                ui_toolbar_sel_row "Position" (format "%1, %2, %3" (getenginestat 27) (getenginestat 28) (getenginestat 29))

                if (> $tool_mat_numselmats 0) [
                    uifill 0 $ui_tool_elem_space_s
                    uicolourtext "Material volumes" $ui_tool_mid_accent_colour $ui_tool_text_size_xs
                    uiprev [uialign -1]

                    loop i $tool_mat_numselmats [
                        _mat = (at $tool_mat_selmats $i)
                        _matname = (at $tool_mat_selmats_names $i)

                        uitarget 0 0 [
                            uistyle clampx
                            uitext $_matname $ui_tool_text_size_xs
                            uiprev [uialign -1]

                            uihover [
                                ui_tool_button [
                                    p_icon       = $exittex
                                    p_icon_size  = $ui_tool_icon_size_s_unscaled
                                    p_tip_simple = "Remove this material from the selection"
                                    p_seledit    = 1
                                    p_pad        = 0
                                    p_on_click   = [
                                        editmat air $_mat
                                    ]
                                ]
                                uiprev [uialign 1]
                            ]
                        ]
                    ]
                ]
            ]
        ]
    ]
]

// Height of the Selection box when last drawn
toolbar_sel_height = 0.1

// The axis gizmo, as tall as the Selection box was when last drawn
ui_toolbar_gizmo = [
    uiskin $toolbar_sel_height $toolbar_sel_height $ui_tool_base_colour 0 0 [
        uiaxisview
        uiprev [uistyle clampxy]
    ]
]

// Whether the room between the docks is too narrow for the gizmo and view toggles side by side
toolbar_narrow = 0

ui_toolbar_bottom = [
    toolbar_narrow = (<f (-f $uiaspect $tooldock_drawn_left $tooldock_drawn_right) (*f 0.42 $uitoolscale))

    uivlist $ui_tool_elem_space_l [
        uistyle leftbottom

        @@ui_toolbar_controls_settings

        // The gizmo left of the Selection box, or above it when narrow
        if $toolbar_narrow [
            uivlist $ui_tool_elem_space_l [
                ui_toolbar_gizmo
                ui_toolbar_sel
                toolbar_sel_height = (maxf $uilasthprev (*f 0.05 $uitoolscale))
                uipropchild [uialign -1]
            ]
        ] [
            uihlist $ui_tool_elem_space_l [
                ui_toolbar_gizmo
                ui_toolbar_sel
                toolbar_sel_height = (maxf $uilasthprev (*f 0.05 $uitoolscale))
                uipropchild [uialign -2 1]
            ]
        ]
        uipropchild [uialign -1]
    ]
]

toolbar_calc_layout = [
    ui_toolbar_tools_width = (-f $uiaspect (*f $ui_toolbar_map_button_width $uitoolscale))
    ui_toolbar_tools_width = (*f $ui_toolbar_tools_width 0.5)
    // less the spacing between the three groups and the margin at each end
    ui_toolbar_tools_width = (-f $ui_toolbar_tools_width (*f $ui_tool_elem_space_m 1.5))
]

ui_toolbar = [
    toolbar_calc_layout

    // Below the menu bar while it is shown
    uipad 0 0 $toolmenubar_offset 0 [
        uistyle clampx
        uistyle centertop
        // One solid strip across the top
        uicolour $ui_tool_dark_colour $uiaspect $ui_toolbar_height [
            uistyle centertop
            // As much room at the ends as above and below the buttons
            uispace (*f $ui_tool_elem_space_m 0.5) 0 [
                uistyle clampx
                uihlist $ui_tool_elem_space_m [
                    @@@@@ui_toolbar_left
                    @@@@@ui_toolbar_map
                    @@@@@ui_toolbar_right
                ]
            ]

            @@@(ui_tool_allowinput)
        ]
    ]

    local _space_bottom
    _space_bottom = (+f $ui_tool_elem_space_l 0.02)

    // Kept clear of the left dock
    uipad (+f $ui_tool_elem_space_l $tooldock_drawn_left) 0 0 $_space_bottom [
        uistyle leftbottom

        uihlist $ui_tool_elem_space_l [
            uivlist 0 [
                uistyle leftbottom

                @ui_toolbar_bottom
                // the view toggles set apart below the gizmo and Selection box
                uifill 0 $ui_tool_elem_space_xl
                @ui_toolbar_controls
            ]
            ui_gameui_chat
        ]
    ]
]

toolbar_init = [
    // Left toolbar
    append toolbar_actions_left ta_menu
    append toolbar_actions_left ta_save
    append toolbar_actions_left ta_save_as
    append toolbar_actions_left ta_undo
    append toolbar_actions_left ta_redo
    append toolbar_actions_left ta_copy
    append toolbar_actions_left ta_paste
    append toolbar_actions_left ta_search
    append toolbar_actions_left ta_help

    // Right toolbar: the panel buttons, one per panel the docks hold, in the order of tooldock_tabs
    looplist _tab $tooldock_tabs [
        append toolbar_actions_right (at $_tab 1)
    ]
]
