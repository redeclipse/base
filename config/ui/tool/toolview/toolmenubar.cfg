// Menu bar: File, Edit, Select, View, Tools and Help across the top of the edit view, shown when the cursor touches
// the top edge in cursor mode or on a lone Alt press, and hidden once the cursor leaves it with no menu open

toolmenubar_calc_dimensions = [
    ui_toolmenubar_height = $ui_tool_button_height_l
    ui_toolmenubar_reveal = (*f 0.005 $uitoolscale)
]
tool_calc_ui_dimensions_handler toolmenubar_calc_dimensions
toolmenubar_calc_dimensions

// Each menu's items: an action, "-" for a divider, or [label code] for anything else
toolmenubar_menus = [File Edit Select View Tools Help]

toolmenubar_File = [
    ta_map_new ta_save ta_save_as - ta_getmap ta_map_reload - ta_mapsettings ta_map_enlarge ta_map_shrink - ta_menu
]

toolmenubar_Edit = [
    ta_undo ta_redo - ta_copy ta_paste ta_delete ta_flip ta_rotate_90 -
    ta_tex_apply ta_tex_apply_allfaces ta_tex_get ta_tex_replace - ta_setmat -
    ta_ent_add ta_ent_add_on_camera ta_ent_delete ta_ent_chain_link ta_ent_star_link ta_ent_unlink ta_ent_unify ta_ent_cycle_snapmode
]

toolmenubar_Select = [
    ta_focus_axis_x ta_focus_axis_y ta_focus_axis_z -
    ta_ent_selinsel ta_ent_sel_links ta_ent_deselect ta_ent_search ta_ent_cyclefocus
]

toolmenubar_View = [
    ta_cursor_mode ta_cycle_outline ta_cycle_gridview - ta_toggle_fullbright ta_toggle_blankgeom ta_toggle_showmat ta_toggle_showphyslayers -
    ["Collapse the left dock" [tooldockleftcollapsed (! $tooldockleftcollapsed)]]
    ["Collapse the right dock" [tooldockrightcollapsed (! $tooldockrightcollapsed)]]
]

toolmenubar_Tools = [
    ta_textures ta_tex_paint ta_mats ta_shapes ta_ents ta_ent_placer ta_env ta_physics ta_ai -
    ta_ai_wpdrop ta_ai_wpseldelete ta_ai_wpdelete ta_ai_wpdeleteall -
    ta_recalc ta_tex_cull ta_newslot ta_newdecal -
    ta_edit_settings ta_edit_bindings ta_search
]

// Help lists the editing pages that exist: page, title
toolmenubar_help_pages = [
    Basics     "Basics"
    Interface  "Interface"
    Geometry   "Geometry"
    Textures   "Textures"
    Blendmap   "Blendmap"
    Materials  "Materials"
    Entities   "Entities"
    Models     "Models"
    Fx         "Effects"
    Waypoints  "Waypoints"
    Environment "Environment"
    Physics    "Physics"
    Map        "Map"
]

toolmenubar_Help = [
    ta_help -
]

// The Help menu's items, built when it opens
toolmenubar_help_items = [
    local _items
    _items = $toolmenubar_Help
    looplist2 _page _title $toolmenubar_help_pages [
        if (exists (concatword "docs/editing/" $_page ".md")) [
            _items = (concat $_items (format "[%1 [tool_help_open %2]]" (escape (concat $_title "page")) (escape (concatword "docs/editing/" $_page ".md"))))
        ]
    ]
    result (concat $_items "- ta_search")
]

toolmenubar_shown  = 0
// How far the menu bar pushes the toolbar, docks and HUD down
toolmenubar_offset = 0
toolmenubar_alt    = 0
toolmenubar_cursor = 0
toolmenubar_open   = -1

// What the open menu holds, for the list menu to read
toolmenubar_cur_actions = []
toolmenubar_cur_names   = []
toolmenubar_cur_extras  = []
toolmenubar_cur_codes   = []
toolmenubar_cur_divs    = []

// 1:<menu index>
toolmenubar_build = [
    local _menu _items _n _key
    _menu  = (at $toolmenubar_menus $arg1)
    _items = (? (=s $_menu Help) (toolmenubar_help_items) (getalias (concatword toolmenubar_ $_menu)))
    _n     = 0
    toolmenubar_cur_actions = []
    toolmenubar_cur_names   = []
    toolmenubar_cur_extras  = []
    toolmenubar_cur_codes   = []
    toolmenubar_cur_divs    = []

    looplist _item $_items [
        if (=s $_item "-") [
            append toolmenubar_cur_divs (- $_n 1)
        ] [
            if (= (listlen $_item) 1) [
                _key = (? (tool_action_has_bind_info $_item) (tool_action_pretty_bind_info $_item) "")
                toolmenubar_cur_actions = (concat $toolmenubar_cur_actions $_item)
                toolmenubar_cur_names   = (concat $toolmenubar_cur_names [""])
                toolmenubar_cur_codes   = (concat $toolmenubar_cur_codes "[]")
            ] [
                _key = ""
                toolmenubar_cur_actions = (concat $toolmenubar_cur_actions [""])
                toolmenubar_cur_names   = (concat $toolmenubar_cur_names (escape (at $_item 0)))
                toolmenubar_cur_codes   = (concat $toolmenubar_cur_codes (concatword "[" (at $_item 1) "]"))
            ]
            toolmenubar_cur_extras = (concat $toolmenubar_cur_extras (concatword "[" (? (!=s $_key) (format "uicolourtext %1 $ui_tool_dark_accent_colour $ui_tool_text_size_xs" (escape $_key)) "") "]"))
            _n = (+ $_n 1)
        ]
    ]
]

// 1:<menu index> 2:<x position>
toolmenubar_open_menu = [
    toolmenubar_build $arg1
    toolmenubar_open = $arg1
    toolpanel_open_menu [
        p_position = [@@arg2 @@ui_toolmenubar_height]
        p_width    = 0.22
        p_item_actions  = $toolmenubar_cur_actions
        p_item_names    = $toolmenubar_cur_names
        p_item_extras   = $toolmenubar_cur_extras
        p_item_dividers = $toolmenubar_cur_divs
        p_on_select     = [
            toolmenubar_alt = 0
            do (at $toolmenubar_cur_codes $arg1)
        ]
    ]
]

toolmenubar_isopen = [
    && [>= $toolmenubar_open 0] [=s $toolpanel_name_ctxmenu toolpanel_menu]
]

// A lone Alt press (no action run while it was held) shows or hides the menu bar
toolmenubar_alt_press = 0
toolmenubar_alt_used  = 0

toolmenubar_alt_down = [
    toolmenubar_alt_press = $totalmillis
    toolmenubar_alt_used  = 0
]

toolmenubar_alt_up = [
    if (&& [! $toolmenubar_alt_used] [< (- $totalmillis $toolmenubar_alt_press) 500]) [
        toolmenubar_alt = (! $toolmenubar_alt)
        if (&& $toolmenubar_alt [! $ui_freecursor]) [
            ui_freecursor = $clockmillis
            toolmenubar_cursor = 1
        ]
    ]
]

// Decides each frame whether the menu bar is shown
toolmenubar_update = [
    local _y _over
    _y    = (at (uicursorpos) 1)
    _over = (&& $ui_freecursor [<f $_y $ui_toolmenubar_height])

    if (! (toolmenubar_isopen)) [
        toolmenubar_open = -1
    ]

    if (&& $ui_freecursor [<f $_y $ui_toolmenubar_reveal]) [
        toolmenubar_shown = 1
    ]
    if (&& $toolmenubar_shown [! $_over] [! $toolmenubar_alt] [< $toolmenubar_open 0]) [
        toolmenubar_shown = 0
    ]
    if $toolmenubar_alt [
        toolmenubar_shown = 1
    ]

    // Cursor mode turned on by Alt goes back off with the menu bar
    toolmenubar_offset = (? $toolmenubar_shown $ui_toolmenubar_height 0)

    // With a menu open, the open menu's list catches the cursor, so the title under it is found by position
    if (&& [>= $toolmenubar_open 0] $_over) [
        local _x
        _x = (at (uicursorpos) 0)
        loop i (listlen $toolmenubar_menus) [
            local _tx _tw
            _tx = (getalias (concatword toolmenubar_x_ $i))
            _tw = (getalias (concatword toolmenubar_w_ $i))
            if (&& [!= $i $toolmenubar_open] [>=f $_x $_tx] [<f $_x (+f $_tx $_tw)]) [
                toolmenubar_open_menu $i $_tx
            ]
        ]
    ]

    if (&& $toolmenubar_cursor [! $toolmenubar_shown]) [
        toolmenubar_cursor = 0
        ui_freecursor = 0
    ]
    if (! $ui_freecursor) [
        toolmenubar_alt = 0
    ]
]

ui_toolmenubar = [
    if $toolmenubar_shown [
        uiskin $uiaspect $ui_toolmenubar_height $ui_tool_base_opaque_colour 0 0 [
            uistyle lefttop
            uihlist 0 [
                uistyle leftmiddle
                uifill $ui_tool_elem_space_l 0
                loop i (listlen $toolmenubar_menus) [
                    uitarget 0 $ui_toolmenubar_height [
                        (concatword toolmenubar_x_ $i) = $uilastsx
                        (concatword toolmenubar_w_ $i) = $uilastw
                        if (= $i $toolmenubar_open) [
                            uicolour $ui_tool_select_colour 0 0 [uistyle clampxy]
                        ] [
                            uihover [
                                uicolour $ui_tool_highlight_colour 0 0 [uistyle clampxy]
                            ]
                        ]
                        uispace $ui_tool_elem_space_l 0 [
                            uitext (at $toolmenubar_menus $i) $ui_tool_text_size_s
                        ]
                        uirelease [
                            if (= $i $toolmenubar_open) [
                                toolpanel_close_panel ctxmenu
                                toolmenubar_open = -1
                            ] [
                                toolmenubar_open_menu $i $uilastsx
                            ]
                        ]
                    ]
                ]
            ]
            uitext "^fAF1: help for the panel under the cursor" $ui_tool_text_size_xs
            uiprev [uialign 1 0]
            uifill $ui_tool_elem_space_l 0
            uiprev [uialign 1 0]
            @(ui_tool_allowinput)
        ]
    ]
]
