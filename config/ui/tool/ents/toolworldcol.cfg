// a worldcol's flags and select attr as they are being edited
# tool_ent_worldcol_flags = [result $#(tool_ent_attr worldcol flags)]
# tool_ent_worldcol_select = [result $#(tool_ent_attr worldcol select)]

// the flags that pick through select: palette, and the material colours after it
tool_ent_worldcol_selflags = (- $WORLDCOL_F_ALL (- (<< 1 $WORLDCOL_F_PALETTE) 1))
tool_ent_worldcol_palsel = (- (<< 1 $WORLDCOL_S_PALETTES) 1)
tool_ent_worldcol_matsel = (<< (- (<< 1 $WORLDCOL_MATINDEXES) 1) $WORLDCOL_SEL_MATERIAL1)

tool_ent_worldcol_nopalette = [
    && [& (tool_ent_worldcol_flags) (<< 1 $WORLDCOL_F_PALETTE)] [! (& (tool_ent_worldcol_select) $tool_ent_worldcol_palsel)]
]

tool_ent_worldcol_nomaterial = [
    && [& (tool_ent_worldcol_flags) (- $tool_ent_worldcol_selflags (<< 1 $WORLDCOL_F_PALETTE))] [! (& (tool_ent_worldcol_select) $tool_ent_worldcol_matsel)]
]

// the WORLDCOL_S slots the worldcol being edited changes
tool_ent_worldcol_slots = [
    local _flags _sel _slots
    _flags = (tool_ent_worldcol_flags)
    _sel = (tool_ent_worldcol_select)
    _slots = []
    loop k $WORLDCOL_F_PALETTE [
        if (& $_flags (<< 1 $k)) [append _slots $k]
    ]
    if (& $_flags (<< 1 $WORLDCOL_F_PALETTE)) [
        loop p $WORLDCOL_S_PALETTES [
            if (& $_sel (<< 1 (+ $WORLDCOL_SEL_PALETTE1 $p))) [append _slots (+ $WORLDCOL_S_PALETTE $p)]
        ]
    ]
    loop t $WORLDCOL_F_MATERIALS [
        if (& $_flags (<< 1 (+ $WORLDCOL_F_MATERIAL $t))) [
            loop m $WORLDCOL_MATINDEXES [
                if (& $_sel (<< 1 (+ $WORLDCOL_SEL_MATERIAL1 $m))) [append _slots (+ $WORLDCOL_S_MATERIAL (* $t $WORLDCOL_MATINDEXES) $m)]
            ]
        ]
    ]
    result $_slots
]

# ui_tool_ent_worldcol = [
    ui_tool_ent_param_group "Type" [
        ui_tool_dropdown #(tool_ent_attr worldcol type) (sublist $WORLDCOL_NAMES 0 $WORLDCOL_MAX) [
            #(ui_tool_ent_attr_props worldcol type)
        ]
    ]

    ui_tool_ent_param_group "Strength" [
        ui_tool_numinput #(tool_ent_attr worldcol value) 0 100 1 [
            #(ui_tool_ent_attr_props worldcol value [] 1)
            p_val_format = i
        ]
    ]

    @(ui_tool_ent_flags_group worldcol (sublist $WORLDCOL_F_LIST 0 $WORLDCOL_F_MAX) (sublist $WORLDCOL_F_NAMES 0 $WORLDCOL_F_MAX))
    @(ui_tool_ent_flags_group worldcol (sublist $WORLDCOL_SEL_LIST 0 $WORLDCOL_SEL_MAX) (sublist $WORLDCOL_SEL_NAMES 0 $WORLDCOL_SEL_MAX) select "Palettes and materials" [
        p_disabled = (! (& (tool_ent_worldcol_flags) $tool_ent_worldcol_selflags))
    ])

    if (|| [tool_ent_worldcol_nopalette] [tool_ent_worldcol_nomaterial]) [
        uivlist 0 [
            if (tool_ent_worldcol_nopalette) [uicolourtext "Palette is set, but no palette is picked" $ui_tool_warn_colour $ui_tool_text_size_xs]
            if (tool_ent_worldcol_nomaterial) [uicolourtext "Material colours are set, but no material is picked" $ui_tool_warn_colour $ui_tool_text_size_xs]
        ]
        #ui_tool_divider
    ]

    ui_tool_ent_param_group "Result" [
        local _slots
        _slots = (tool_ent_worldcol_slots)
        if (listlen $_slots) [
            uivlist $ui_tool_elem_space_s [
                looplist s $_slots [
                    uihlist $ui_tool_elem_space_s [
                        uialign 1
                        uitext (at $WORLDCOL_S_NAMES $s) $ui_tool_text_size_xs
                        uicolour (| (getworldcol $s) 0xFF000000) 0.012 0.012
                    ]
                ]
            ]
        ] [
            uicolourtext "No colours picked" $ui_tool_disabled_colour $ui_tool_text_size_xs
        ]
    ]

    @(ui_tool_ent_gamemode_group worldcol)
    @(ui_tool_ent_variant_group worldcol)
]
