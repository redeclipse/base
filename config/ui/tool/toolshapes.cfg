// A size of a shape in cubes, 1:<var> 2:<label> 3:<tip> 4:<minimum>
ui_tool_shape_param = [
    ui_tool_numinput $arg1 $arg4 1024 0.5 [
        p_label      = [@@arg2]
        p_tip_simple = [@@arg3]
        p_val_format = f
    ]
]

// A build button, greyed with the reason in its tip when it can't build, 1:<label> 2:<problem> 3:<tip> 4:<on click>
ui_tool_shape_build_button = [
    ui_tool_button [
        p_label      = [@@arg1]
        p_width      = $ui_tool_button_width_s_unscaled
        p_height     = $ui_tool_button_height_ml_unscaled
        p_disabled   = @(!=s $arg2 "")
        p_tip_simple = [@@(? (!=s $arg2 "") $arg2 $arg3)]
        p_on_click   = [@@arg4]
    ]
]

# ui_tool_shapes = [
    uivlist $ui_toolpanel_elem_space [
        uistyle clampx

        ui_tool_section [
            p_label  = "Shape"
            p_page   = Geometry
            p_anchor = shapes
        ]

        ui_tool_dropdown tool_shape_type $TOOL_SHAPE_NAMES [
            p_label     = "Shape"
            p_can_reset = 0
            p_id        = #(tool_get_id)
        ]
        #(tool_shape_register_control "Shape" "sphere cylinder tunnel pipe bend torus paraboloid octahedron helix box cone")

        ui_tool_section [ p_label = "Size" ]

        case $tool_shape_type $TOOL_SHAPE_SPHERE [
            ui_tool_shape_param tool_shape_radius "Radius" "How far the sphere reaches from its middle, in cubes" 0
            ui_tool_shape_param tool_shape_scalex "Stretch X" "How much longer the sphere is along X, which makes it an ellipsoid" 0.1
            ui_tool_shape_param tool_shape_scaley "Stretch Y" "How much longer the sphere is along Y" 0.1
            ui_tool_shape_param tool_shape_scalez "Stretch Z" "How much longer the sphere is along Z" 0.1
        ] $TOOL_SHAPE_CYLINDER [
            ui_tool_shape_param tool_shape_radius "Radius" "How far the cylinder reaches from its middle, in cubes" 0
            ui_tool_shape_param tool_shape_height "Height" "How tall the cylinder is, in cubes" 0
        ] $TOOL_SHAPE_TUNNEL [
            ui_tool_shape_param tool_shape_radius "Radius" "How far the tunnel reaches from its middle, in cubes" 0
            ui_tool_shape_param tool_shape_height "Length" "How long the tunnel is along Y, in cubes" 0
        ] $TOOL_SHAPE_PIPEBEND [
            ui_tool_shape_param tool_shape_radius "Bend radius" "How wide the bend sweeps, in cubes" 0
            ui_tool_shape_param tool_shape_minor "Pipe radius" "How thick the pipe is, in cubes" 0
        ] $TOOL_SHAPE_TORUS [
            ui_tool_shape_param tool_shape_radius "Ring radius" "How wide the ring is, in cubes" 0
            ui_tool_shape_param tool_shape_minor "Tube radius" "How thick the ring is, in cubes" 0
        ] $TOOL_SHAPE_HELIX [
            ui_tool_shape_param tool_shape_radius "Tube radius" "How thick the coil is, in cubes" 0
            ui_tool_shape_param tool_shape_coil "Coil radius" "How wide the coil winds, in cubes" 0
        ] $TOOL_SHAPE_BOX [
            ui_tool_shape_param tool_shape_sizex "Size X" "How long the box is along X, in cubes" 0
            ui_tool_shape_param tool_shape_sizey "Size Y" "How long the box is along Y, in cubes" 0
            ui_tool_shape_param tool_shape_sizez "Size Z" "How tall the box is, in cubes" 0
            ui_tool_shape_param tool_shape_round "Rounding" "How far the edges and corners are rounded, in cubes" 0
        ] $TOOL_SHAPE_CONE [
            ui_tool_shape_param tool_shape_radius "Radius" "How wide the cone's base reaches from its middle, in cubes" 0
            ui_tool_shape_param tool_shape_height "Height" "How tall the cone is up to its point, in cubes" 0
        ] () [
            // paraboloid and octahedron
            ui_tool_shape_param tool_shape_radius "Radius" "How far the shape reaches from its middle, in cubes" 0
        ]

        ui_tool_section [ p_label = "Placement" ]

        if (tool_shape_has_offset) [
            ui_tool_shape_param tool_shape_offx "Offset X" "How far the shape sits from the selection's corner along X, in cubes" -1024
            ui_tool_shape_param tool_shape_offy "Offset Y" "How far the shape sits from the selection's corner along Y, in cubes" -1024
            ui_tool_shape_param tool_shape_offz "Offset Z" "How far the shape sits from the selection's corner along Z, in cubes" -1024
        ]

        ui_tool_numinput tool_shape_detail 0 12 1 [
            p_label      = "Detail"
            p_tip_simple = "How many times the cubes the surface crosses are halved, for a smoother surface; never smaller than the smallest cube"
            p_val_format = i
            p_id         = #(tool_get_id)
        ]
        #(tool_shape_register_control "shape detail" "smooth subdivide")

        uitext (concat "Builds over" (strreplace (tool_shape_box) " " " x ") "cubes from the selection's corner") $ui_tool_text_size_xs
        uiprev [uialign -1]

        ui_tool_section [ p_label = "Mode" ]

        ui_tool_switch tool_shape_carve [
            p_label   = "Mode"
            p_options = ["Add" "Carve"]
            p_tip_simple = "Add the shape to the geometry already there, or carve it out"
            p_id      = #(tool_get_id)
        ]
        #(tool_shape_register_control "Add or carve" "subtract remove dig")

        ui_tool_shape_build_button "Build" (tool_shape_problem) "Build the shape over the selection" [tool_shape_build]

        ui_tool_section [
            p_label  = "Terrain"
            p_page   = Geometry
            p_anchor = terrain-from-a-heightmap
        ]

        ui_tool_fileselect tool_shape_terrain [
            p_label        = "Heightmap"
            p_file_type    = $TOOL_FILE_IMAGE
            p_strip_ext    = 0
            p_can_imgedit  = 0
            p_default_text = "No image"
            p_id           = #(tool_get_id)
        ]
        #(tool_shape_register_control "Terrain heightmap" "image height terrain")

        ui_tool_numinput tool_shape_terrain_height 1 2048 1 [
            p_label      = "Height"
            p_tip_simple = "How tall the brightest part of the heightmap stands, in cubes"
            p_val_format = f
            p_id         = #(tool_get_id)
        ]

        ui_tool_shape_build_button "Build terrain" (tool_shape_terrain_problem) "Build terrain from the heightmap over the selection" [
            buildterrain $tool_shape_terrain $tool_shape_terrain_height $tool_shape_carve
        ]

        ui_tool_section [
            p_label  = "Import"
            p_page   = Geometry
            p_anchor = importing-cubes
        ]

        ui_tool_fileselect tool_shape_smc [
            p_label        = "SMC file"
            p_strip_ext    = 0
            p_can_imgedit  = 0
            p_default_text = "No file"
            p_id           = #(tool_get_id)
        ]
        #(tool_shape_register_control "Import SMC file" "import marching cubes")

        ui_tool_checkbox tool_shape_smc_voxel [
            p_label      = "Solid cubes"
            p_tip_simple = "Make each listed cube solid rather than shaping it from its corners"
        ]

        ui_tool_shape_build_button "Import" (tool_shape_smc_problem) "Import the file's cubes from the selection's corner" [
            importsmc $tool_shape_smc $tool_shape_smc_voxel
        ]

        uipropchild [uialign -1]
    ]
]
