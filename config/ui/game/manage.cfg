// A control action on the picked player
// 1:<-1 to kick, or control type> 2:<label> 3:<tip> 4:<id>
ui_gameui_manage_controlbutton = [
    local _type _need _why
    _type = $arg1
    _need = (gameui_manage_lock $_type)
    // the server lets anyone except, but only those above the player may act against them
    if (!= $_type $CONTROL_EXCEPT) [_need = (max $_need (gameui_manage_targetpriv $gameui_manage_player))]
    caseif (= $gameui_manage_player $playercn) [
        _why = "You can't do this to yourself"
    ] (! (gameui_manage_can $_need)) [
        _why = (gameui_manage_needs $_need)
    ] 1 [
        _why = ""
    ]
    ui_gameui_manage_button $arg2 0.13 $arg3 $_why (concat gameui_manage_ask $_type) $arg4
]

# ui_gameui_manage_playerdetails = [
    local _cn _host _speclock _spec _teamlock _tpriv _reset _ctlbase _teambase _privbase
    _cn       = $gameui_manage_player
    _ctlbase  = #(gameui_get_id button (+ $CONTROL_MAX 1))
    _teambase = #(gameui_get_id button 2)
    _privbase = #(gameui_get_id button (+ (- $PRIV_ADMINISTRATOR $PRIV_SUPPORTER) 1))

    uivlist 0.008 [
        uialign -1 -1

        uitext (getclientname $_cn 0 0) 1.8 [uialign -1]

        uigrid 2 0.03 0.005 [
            uialign -1
            if (strlen (getclienthandle $_cn)) [
                ui_gameui_manage_field "Account" (getclienthandle $_cn)
            ]
            ui_gameui_manage_field "Privilege" (concat (gameui_manage_privname (getclientprivilege $_cn)) (? (getclientprivlocal $_cn) "(local)" ""))
            _host = (getclienthost $_cn)
            if (&& [strlen $_host] [!=s $_host "*"]) [
                ui_gameui_manage_field "Address" $_host
            ]
            if (! (hasmut $G_M_FFA)) [
                ui_gameui_manage_field "Team" (getteamname (getclientteam $_cn))
            ]
        ]

        uifill 0 0.01
        uicolourtext "Moderate" 0xaaaaaa 1.2 [uialign -1]
        uigrid 3 0.01 0.01 [
            uialign -1
            ui_gameui_manage_controlbutton -1 "Kick" "Remove them from the server" $_ctlbase
            loop i $CONTROL_MAX [
                ui_gameui_manage_controlbutton $i (at $CONTROL_NAMES $i) (at $gameui_manage_control_tips $i) (+ $_ctlbase $i 1)
            ]
        ]

        uifill 0 0.01
        uicolourtext "Play" 0xaaaaaa 1.2 [uialign -1]
        _speclock = (max (? (= $gamemode $G_EDITING) $spawneditlock $spawnlock) $speclock)
        _spec     = (isspectator $_cn)
        uihlist 0.01 [
            uialign -1
            ui_gameui_manage_button (? $_spec "Return to play" "Spectate") 0.18 (
                ? $_spec "Put them back into the game" "Make them a spectator"
            ) (? (gameui_manage_can $_speclock) "" (gameui_manage_needs $_speclock)) (
                concat spectator $_cn (! $_spec)
            ) #(gameui_get_id button)
            if (! (hasmut $G_M_FFA)) [
                // spectators have no team, so they're brought into the game first and then moved
                _teamlock = (? $_spec (max $_speclock $teamlock) $teamlock)
                loop i 2 [
                    local _team
                    _team = (+ $T_ALPHA $i)
                    ui_gameui_manage_button (getteamname $_team) 0.13 (
                        concat (? $_spec "Bring them into the game on team" "Move them to team") (getteamname $_team)
                    ) (? (gameui_manage_can $_teamlock) "" (gameui_manage_needs $_teamlock)) (
                        concat (? $_spec (concat spectator $_cn 0 ";") "") setteam $_cn $_team
                    ) (+ $_teambase $i) (= (getclientteam $_cn) $_team) (getteamcolour $_team)
                ]
            ]
        ]

        uifill 0 0.01
        uicolourtext "Privilege" 0xaaaaaa 1.2 [uialign -1]
        // resetting needs more than they have, unless we're an administrator
        _tpriv = (getclientprivilege $_cn)
        _reset = (min (+ $_tpriv 1) $PRIV_ADMINISTRATOR)
        uihlist 0.01 [
            uialign -1
            loop i (+ (- $PRIV_ADMINISTRATOR $PRIV_SUPPORTER) 1) [
                local _level
                _level = (+ $PRIV_SUPPORTER $i)
                ui_gameui_manage_button (at $PRIV_NAMES $_level) 0.15 (concat "Give them" (gameui_manage_privname $_level) "on this server") (
                    ? (gameui_manage_can $_level) "" (gameui_manage_needs $_level)
                ) (concat addpriv $_cn $_level) (+ $_privbase $i)
            ]
            ui_gameui_manage_button "Reset" 0.1 "Take away the privilege given to them here" (
                ? (gameui_manage_can $_reset) "" (gameui_manage_needs $_reset)
            ) (concat resetpriv $_cn) #(gameui_get_id button)
        ]
    ]
]

