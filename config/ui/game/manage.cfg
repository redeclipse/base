// 1:<entry index>
ui_gameui_manage_entrydetails = [
    local _idx _source _remaining _addhandle _addip
    _idx       = $arg1
    _source    = (controlinfo $_idx 3)
    _remaining = (controlinfo $_idx 5)

    uivlist 0.008 [
        uialign -1 -1

        uitext (gameui_manage_entryname $_idx) 1.8 [uialign -1]

        uigrid 2 0.03 0.005 [
            uialign -1
            if (strlen (controlinfo $_idx 9)) [
                ui_gameui_manage_field "Account" (controlinfo $_idx 9)
            ]
            if (strlen (controlinfo $_idx 6)) [
                ui_gameui_manage_field "Address" (controlinfo $_idx 6)
            ]
            ui_gameui_manage_field "Reason" (? (strlen (controlinfo $_idx 7)) (controlinfo $_idx 7) "None given")
            ui_gameui_manage_field "Scope" (at $CSCOPE_NAMES (controlinfo $_idx 2))
            ui_gameui_manage_field "Added" (concat (gameui_manage_duration (controlinfo $_idx 4)) "ago")
            ui_gameui_manage_field "Expires" (? (>= $_remaining 0) (concat "in" (gameui_manage_duration $_remaining)) "Never")
        ]

        uifill 0 0.01
        uicolourtext "Added by" 0xaaaaaa 1.2 [uialign -1]
        if (= $_source $CSRC_PLAYER) [
            _addhandle = (controlinfo $_idx 11)
            _addip     = (controlinfo $_idx 12)
            uigrid 2 0.03 0.005 [
                uialign -1
                ui_gameui_manage_field "Player" (controlinfo $_idx 10)
                if (strlen $_addhandle) [
                    ui_gameui_manage_field "Account" $_addhandle
                ]
                if (strlen $_addip) [
                    ui_gameui_manage_field "Address" $_addip
                ]
                ui_gameui_manage_field "Privilege" (gameui_manage_privname (controlinfo $_idx 13))
            ]
        ] [
            uihlist 0.01 [
                uialign -1
                ui_gameui_manage_source $_source
                uicolourtext (case $_source $CSRC_SERVER [
                    result "The server's operator, from its config or console"
                ] $CSRC_AUTO [
                    result "The server itself, for breaking its rules"
                ] $CSRC_MASTER [
                    result "The master server, for every server"
                ]) 0xcccccc
            ]
        ]
    ]
]

ui_gameui_manage_controls_dims = 1.35

ui_gameui_manage_controls_on_open = [
    gameui_manage_entry = -1
    gameui_manage_refresh
]

# ui_gameui_manage_controls = [
    local _types _lock _idx _typebase
    _types    = (controltypes)
    _lock     = (gameui_manage_lock $gameui_manage_control)
    _idx      = (gameui_manage_findentry $gameui_manage_entry)
    _typebase = #(gameui_get_id button $CONTROL_MAX)

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_gameui_decortext "Controls" [
                p_width = $gameui_panel_new_size
            ]
            ui_gameui_shadowhoriz
        ]

        uispace 0.05 0 [
            uistyle clampx

            uivlist 0.02 [
                uistyle clampx

                uihlist 0.01 [
                    uialign -1
                    loop i $CONTROL_MAX [
                        local _tlock
                        _tlock = (gameui_manage_lock $i)
                        ui_gameui_manage_button (
                            concat (at $gameui_manage_control_plurals $i) (? (>= $_types 0) (format "(%1)" (gameui_manage_numentries $i)) "")
                        ) 0.17 (at $gameui_manage_control_tips $i) (
                            ? (|| [< $_types 0] [& $_types (<< 1 $i)]) "" (gameui_manage_needs $_tlock)
                        ) (concat gameui_manage_control "=" $i ";" gameui_manage_entry "= -1") (+ $_typebase $i) (= $gameui_manage_control $i)
                    ]
                ]

                uihlist 0.02 [
                    uistyle clampx

                    ui_gameui_group [
                        ui_gameui_vscrollarea [
                            uivlist 0 [
                                uialign 0 -1
                                local _row
                                _row = 0
                                loop i (controlinfo -1) [
                                    if (= (controlinfo $i 1) $gameui_manage_control) [
                                        ui_gameui_manage_entry $i $_row
                                        _row = (+ $_row 1)
                                    ]
                                ]
                                caseif (< $_types 0) [
                                    uicolourtext "Asking the server..." 0x888888 1.2
                                ] (! (& $_types (<< 1 $gameui_manage_control))) [
                                    uicolourtext (gameui_manage_needs $_lock) 0x888888 1.2
                                ] (= $_row 0) [
                                    uicolourtext (concat "No" (strlower (at $gameui_manage_control_plurals $gameui_manage_control))) 0x888888 1.2
                                ]
                            ]
                        ] [
                            p_width  = $GAMEUI_MANAGE_LIST_W
                            p_height = $GAMEUI_MANAGE_H
                        ]
                    ]

                    ui_gameui_group [
                        uifill $GAMEUI_MANAGE_INFO_W $GAMEUI_MANAGE_H [
                            if (>= $_idx 0) [
                                ui_gameui_manage_entrydetails $_idx
                            ] [
                                uivlist 0.01 [
                                    uialign -1 -1
                                    uicolourtext "Nothing selected" 0xcccccc 1.4 [uialign -1]
                                    uicolourtext "Pick an entry from the list." 0x888888 1 [uialign -1]
                                ]
                            ]
                        ]
                    ]
                ]

                uihlist 0.01 [
                    uialign -1

                    ui_gameui_manage_button "Remove" 0.13 "Remove the selected entry" (
                        caseif (< $_idx 0) [
                            result "Pick an entry first"
                        ] (= (controlinfo $_idx 2) $CSCOPE_GLOBAL) [
                            result "Entries from the master server can't be removed here"
                        ] 1 [
                            result ""
                        ]
                    ) [
                        delcontrol $gameui_manage_entry
                        gameui_manage_entry = -1
                        gameui_manage_refresh
                    ] #(gameui_get_id button)

                    ui_gameui_manage_button "Clear" 0.13 "Remove every entry added since the server started, keeping those from its config and the master server" (
                        ? (gameui_manage_can $_lock) "" (gameui_manage_needs $_lock)
                    ) [
                        gameui_confirm (concat "Clear the" (strlower (at $gameui_manage_control_plurals $gameui_manage_control)) "added since the server started?") (
                            concat gameui_manage_clear $gameui_manage_control
                        )
                    ] #(gameui_get_id button)

                    ui_gameui_manage_button "Refresh" 0.13 "Ask the server for its lists again" "" [gameui_manage_refresh] #(gameui_get_id button)
                ]
            ]
        ]

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]

    #(ui_gameui_backbutton)
]
