gameui_begin_ids

///////////
// STATE //
///////////

// Client number of the player picked in the player list
gameui_manage_player   = -1

// Control type shown in the control list, and the id of the picked entry
gameui_manage_control  = $CONTROL_BAN
gameui_manage_entry    = -1

// Action waiting on its confirmation, -1 to kick or a control type, and the reason given for it
gameui_manage_action   = -1
gameui_manage_reason   = ""

// Password typed to claim privilege
gameui_manage_password = ""

// Fixed sizes of the lists and the details beside them
GAMEUI_MANAGE_LIST_W = 0.45
GAMEUI_MANAGE_INFO_W = 0.7
GAMEUI_MANAGE_H      = 0.48

// Inner width of the groups on the server info panel
GAMEUI_MANAGE_GROUP_W = 0.86

// Indexed by control type
gameui_manage_control_locks   = "allowlock banlock mutelock limitlock exceptlock"
gameui_manage_control_plurals = "Allows Bans Mutes Limits Excepts"
gameui_manage_control_tips    = [
    "Let them join while the server is locked or private"
    "Ban them from the server"
    "Stop them sending chat messages"
    "Stop them changing team"
    "Protect them from bans, mutes and limits"
]

// Indexed by control source, the tag colours of those that aren't players
gameui_manage_source_colours = [0xcc8844 0 0x8888cc 0x88cc88]


/////////////
// HELPERS //
/////////////

// 1:<privilege level>
gameui_manage_privname = [
    if (>= $arg1 $PRIV_MAX) [result "nobody"] [at $PRIV_NAMES $arg1]
]

// Whether we have a privilege level
// 1:<privilege level>
gameui_manage_can = [
    getclientpriv $playercn $arg1
]

// Why an action needing a privilege level can't be done
// 1:<privilege level>
gameui_manage_needs = [
    if (>= $arg1 $PRIV_MAX) [
        result "Nobody may do this on this server"
    ] [
        result (concat "Requires" (gameui_manage_privname $arg1))
    ]
]

// The level a control type needs
// 1:<-1 to kick, or control type>
gameui_manage_lock = [
    local _name
    _name = (? (< $arg1 0) kicklock (at $gameui_manage_control_locks $arg1))
    result $$_name
]

// The level needed to act on a player, as the server compares it
// 1:<client number>
gameui_manage_targetpriv = [
    ? (getclientprivlocal $arg1) $PRIV_ADMINISTRATOR (getclientprivilege $arg1)
]

// 1:<seconds>
gameui_manage_duration = [
    caseif (>= $arg1 86400) [
        format "%1d %2h" (div $arg1 86400) (div (mod $arg1 86400) 3600)
    ] (>= $arg1 3600) [
        format "%1h %2m" (div $arg1 3600) (div (mod $arg1 3600) 60)
    ] (>= $arg1 60) [
        format "%1m" (div $arg1 60)
    ] 1 [
        format "%1s" $arg1
    ]
]

// Players connected, not counting bots
gameui_manage_numplayers = [
    local _num
    _num = 0
    loopclientsif 0 0 i [= (getclientactortype $i) $A_PLAYER] [_num = (+ $_num 1)]
    result $_num
]

// The index of the control entry with an id, or -1
// 1:<id>
gameui_manage_findentry = [
    local _idx
    _idx = -1
    loop i (controlinfo -1) [
        if (= (controlinfo $i 0) $arg1) [_idx = $i]
    ]
    result $_idx
]

// Number of entries of a control type
// 1:<control type>
gameui_manage_numentries = [
    local _num
    _num = 0
    loop i (controlinfo -1) [
        if (= (controlinfo $i 1) $arg1) [_num = (+ $_num 1)]
    ]
    result $_num
]

// Who an entry was applied to, as far as it's known
// 1:<entry index>
gameui_manage_entryname = [
    caseif (strlen (controlinfo $arg1 8)) [
        controlinfo $arg1 8
    ] (strlen (controlinfo $arg1 6)) [
        controlinfo $arg1 6
    ] 1 [
        result "Unknown player"
    ]
]

gameui_manage_refresh = [
    getcontrols
]

// Asks before doing a control action to the picked player
// 1:<-1 to kick, or control type>
gameui_manage_ask = [
    gameui_manage_action = $arg1
    gameui_manage_reason = ""
    gameui_open ui_gameui_manage_confirm
]

gameui_manage_act = [
    local _cn _reason
    _cn     = $gameui_manage_player
    _reason = $gameui_manage_reason
    case $gameui_manage_action -1 [
        kick $_cn $_reason
    ] $CONTROL_ALLOW [
        allow $_cn $_reason
    ] $CONTROL_BAN [
        ban $_cn $_reason
    ] $CONTROL_MUTE [
        mute $_cn $_reason
    ] $CONTROL_LIMIT [
        limit $_cn $_reason
    ] $CONTROL_EXCEPT [
        except $_cn $_reason
    ]
    gameui_manage_refresh
]

// 1:<control type>
gameui_manage_clear = [
    case $arg1 $CONTROL_ALLOW [
        clearallows
    ] $CONTROL_BAN [
        clearbans
    ] $CONTROL_MUTE [
        clearmutes
    ] $CONTROL_LIMIT [
        clearlimits
    ] $CONTROL_EXCEPT [
        clearexcepts
    ]
    gameui_manage_entry = -1
    gameui_manage_refresh
]

manageserver = [
    if $isconnected [
        gameui_open ui_gameui_manage
    ] [
        error "Not connected to a server"
    ]
]


//////////////
// PANEL UI //
//////////////

// A label and its value, as two cells of a grid
// 1:<label> 2:<value>
# ui_gameui_manage_field = [
    uicolourtext $arg1 0xaaaaaa 1 [uialign -1]
    uicolourtext $arg2 0xffffff 1 [uitextwrap #(-f $GAMEUI_MANAGE_INFO_W 0.2); uitextalign -1; uialign -1]
]

// What added an entry, shown as a filled tag that no player name can look like
// 1:<source>
ui_gameui_manage_source = [
    uicolour (| (at $gameui_manage_source_colours $arg1) 0xff000000) 0 0 [
        uispace 0.006 0.002 [
            uicolourtext (at $CSRC_NAMES $arg1) 0x101010 0.9
        ]
    ]
]

// A small button for the panels below
// 1:<label> 2:<width> 3:<tip> 4:<disabled tip, empty when enabled> 5:<action> 6:<id> 7:<highlight> 8:<colour>
ui_gameui_manage_button = [
    local _label _width _tip _why _action _id _highlight _colour
    _label     = $arg1
    _width     = $arg2
    _tip       = $arg3
    _why       = $arg4
    _action    = $arg5
    _id        = $arg6
    _highlight = (? (>= $numargs 7) $arg7 0)
    _colour    = (? (>= $numargs 8) $arg8 0xcccccc)

    ui_gameui_button [
        p_label        = $_label
        p_label_size   = 1.2
        p_width        = $_width
        p_height       = 0.035
        p_colour       = $_colour
        p_highlight    = $_highlight
        p_tip          = $_tip
        p_disabled     = (strlen $_why)
        p_disabled_tip = $_why
        p_on_click     = $_action
        p_id           = $_id
    ]
]

