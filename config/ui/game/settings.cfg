    spec [
        gameui_settings_pointer_caption = "While spectating"
        if (=s $speccursor "") [ uicolourtext "None" 0x888888 ] [ ui_gameui_settings_pointer_closeup $speccursor $speccursorsize 0xFFFFFF $speccursorblend ]
