// rebuilt from the setting rows registered below, see gameui_setting
gameui_setting_rows = []

# ui_gameui_settings_game_content = [
    #(gameui_setting_begin settings_game)

    ui_gameui_vscrollarea [
        gameui_settings_scroll game

        uispace $GAMEUI_SETTINGS_CONTENT_PAD 0 [
            uistyle clampx

            uivlist 0.025 [
                uistyle clampx

                #(gameui_section "Weapon handling") [
                    #(gameui_setting "Auto reload" toggle weapautoreload [
                        p_tip = "Automatically reloads weapons when empty"
                        p_get = [= $arg1 4]
                        p_set = [? $arg1 4 2]
                    ])
                    #(gameui_setting "Auto reload delay" slider weapautoreloaddelay [
                        p_tip = "How long to wait before automatically reloading"
                        p_max      = 2000
                        p_val_text = [concatword (toint $arg1) "ms"]
                    ])
                    #(gameui_setting "Auto switch" toggle weapautoswitch [
                        p_tip = "Automatically switches to another weapon when out of ammo"
                    ])
                    #(gameui_setting "Skip empty" toggle weapskipempty [
                        p_tip = "Skip weapons without ammo when scrolling through them"
                    ])
                    #(gameui_setting "Loadout on match start" toggle showloadoutmenu [
                        p_tip = "Show loadout menu on match start"
                    ])
                    #(gameui_setting "Number keys" switch weapselectslot [
                        p_tip = "What the number keys select; each weapon, your loadout slots, or your weapon list"
                        p_options = ["Weapon" "Slot" "List"]
                    ])
                    #(gameui_setting "Zoom wraps around" toggle zoomscroll [
                        p_tip = "Changing the zoom level past the end goes around to the other end"
                    ])
                    #(gameui_setting "Default zoom" slider zoomdefault [
                        p_tip = "Zoom level each time you zoom in, or the last one you used"
                        p_max      = $zoomlevels
                        p_val_text = [? (< $arg1 0) "Last" $arg1]
                    ])
                ]

                #(gameui_section "Movement") [
                    #(gameui_setting "Crouch" switch crouchstyle [
                        p_tip = "Hold the key to crouch, double-tap it to stay crouched, or press it to toggle"
                        p_options = ["Hold" "Double-tap" "Toggle"]
                    ])
                    #(gameui_setting "Walk" switch walkstyle [
                        p_tip = "Hold the key to walk, double-tap it to keep walking, or press it to toggle"
                        p_options = ["Hold" "Double-tap" "Toggle"]
                    ])
                    #(gameui_setting "Wall grab" switch grabstyle [
                        p_tip = "Which way grabbing a wall throws you; where you look, the opposite of it, or upwards"
                        p_options = ["Look" "Inverted" "Always up"]
                    ])
                    #(gameui_setting "Player grab" switch grabplayerstyle [
                        p_tip = "Which way grabbing a player throws you; where you look, the opposite of it, upwards, or at them"
                        p_options = ["Look" "Inverted" "Always up" "Toward them"]
                    ])
                    #(gameui_settingtoggles [
                        ["Slide" impulsemethod [
                            p_tip = "Crouch while moving to slide"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $impulsemethod 2) (&~ $impulsemethod 2)]
                        ]]
                        ["Launch" impulsemethod [
                            p_tip = "Jump out of a slide to launch forwards"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $impulsemethod 1) (&~ $impulsemethod 1)]
                        ]]
                        ["Impulse jump" impulseaction [
                            p_tip = "Jump in the air to impulse jump"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $impulseaction 1) (&~ $impulseaction 1)]
                        ]]
                        ["Impulse boost" impulseaction [
                            p_tip = "Press the impulse key to boost"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $impulseaction 2) (&~ $impulseaction 2)]
                        ]]
                    ])
                ]

                #(gameui_section "Match") [
                    #(gameui_setting "Respawn delay" slider deathbuttonmash [
                        p_tip = "How long after dying before pressing a button respawns you"
                        p_max      = 3000
                        p_val_text = [concatword (toint $arg1) "ms"]
                    ])
                    #(gameui_setting "Team change" switch showteamchange [
                        p_tip = "When to show which team you are on; never, when you change teams, or also when you join"
                        p_options = ["Never" "Switching" "Always"]
                    ])
                ]

            ]
        ]
    ] [
        p_width  = (-f $gameui_settings_content_w 0.015)
        p_height = $gameui_settings_content_h
    ]
]

# ui_gameui_settings_camera_content = [
    #(gameui_setting_begin settings_camera)

    ui_gameui_vscrollarea [
        gameui_settings_scroll camera

        uispace $GAMEUI_SETTINGS_CONTENT_PAD 0 [
            uistyle clampx

            uivlist 0.025 [
                uistyle clampx

                #(gameui_section "Field of vision") [
                    #(gameui_setting "First-person" slider firstpersonfov [
                        p_tip = "First-person field of vision in degrees"
                    ])
                    #(gameui_setting "Third-person" slider thirdpersonfov [
                        p_tip = "Third-person field of vision in degrees"
                    ])
                    #(gameui_setting "Spectator" slider specfov [
                        p_tip = "Spectator field of vision in degrees"
                    ])
                    #(gameui_setting "Editor" slider editfov [
                        p_tip = "Editing field of vision in degrees"
                    ])
                ]

                #(gameui_section "Third person") [
                    #(gameui_setting "Enabled" toggle thirdperson [
                        p_tip = "Play with the camera behind your player"
                    ])
                    #(gameui_setting "Distance" slider thirdpersondist [
                        p_tip = "How far behind your player the third person camera sits"
                        p_min        = 1
                        p_round      = 0.5
                        p_val_text   = [round $arg1 0.5]
                    ])
                    #(gameui_setting "Side" slider thirdpersonside [
                        p_tip = "How far to the side the third person camera sits, negative is to the left"
                        p_round      = 0.5
                        p_val_text   = [round $arg1 0.5]
                    ])
                ]

                #(gameui_section "First person") [
                    #(gameui_setting "Weapon" toggle firstpersonmodel [
                        p_tip = "Show your hands and weapon in first person"
                        p_get = [& $arg1 1]
                        p_set = [? $arg1 (| $firstpersonmodel 1) (&~ $firstpersonmodel 1)]
                    ])
                    #(gameui_setting "Body" toggle firstpersonmodel [
                        p_tip = "Show your body when you look down in first person"
                        p_get = [& $arg1 2]
                        p_set = [? $arg1 (| $firstpersonmodel 2) (&~ $firstpersonmodel 2)]
                    ])
                    #(gameui_setting "Head camera" toggle firstpersoncamera [
                        p_tip = "Move the view with the head of your player"
                    ])
                    #(gameui_setting "Camera bob" toggle firstpersonbob [
                        p_tip = "First person camera bob animation"
                    ])
                    #(gameui_setting "Gun sway" toggle firstpersonsway [
                        p_tip = "First person gun sway animation"
                    ])
                    #(gameui_setting "Gun kicks" slider firstpersonkick [
                        p_tip = "How far landing, jumping, impulses and hits jolt your gun, with gun sway on"
                        p_max      = 2
                        p_val_text = [precf $arg1 2]
                    ])
                ]

                #(gameui_section "Camera roll") [
                    #(gameui_setting "Bob" slider firstpersonbobroll [
                        p_tip = "How far the view tilts as it bobs"
                        p_max        = 2
                        p_round      = 0.1
                        p_val_text   = [round $arg1 0.1]
                    ])
                    #(gameui_setting "Slide" slider firstpersonslideroll [
                        p_tip = "How far the view tilts while sliding, negative tilts the other way"
                        p_min        = -30
                        p_max        = 30
                        p_round      = 1
                        p_val_text   = [round $arg1]
                    ])
                    #(gameui_setting "Wall run" slider impulseturnroll [
                        p_tip = "How far the view tilts while running along a wall"
                        p_max        = 45
                        p_round      = 1
                        p_val_text   = [round $arg1]
                    ])
                ]

                #(gameui_section "Death and spectating") [
                    #(gameui_setting "Death camera" switch deathcamstyle [
                        p_tip = "Who the camera follows after you die"
                        p_options = ["Off" "Killer" "Self"]
                    ])
                    #(gameui_setting "Death camera speed" slider deathcamspeed [
                        p_tip = "How long the death camera takes to turn towards who it follows"
                        p_max        = 1000
                        p_val_text   = [concatword (toint $arg1) "ms"]
                    ])
                    #(gameui_setting "Spectating" switch specmode [
                        p_tip = "Spectator camera; Free lets you fly around, TV follows the action"
                        p_options = ["Free" "TV"]
                    ])
                    #(gameui_setting "Waiting to spawn" switch waitmode [
                        p_tip = "Camera while waiting to spawn; Free lets you fly around, TV follows the action"
                        p_options = ["Free" "TV"]
                    ])
                    #(gameui_setting "Intermission" switch intermmode [
                        p_tip = "Camera at the end of a match; Free lets you fly around, TV follows the action"
                        p_options = ["Free" "TV"]
                    ])
                    #(gameui_setting "Follow in third person" toggle followthirdperson [
                        p_tip = "Watch the player you follow from behind them"
                    ])
                ]

            ]
        ]
    ] [
        p_width  = (-f $gameui_settings_content_w 0.015)
        p_height = $gameui_settings_content_h
    ]
]

# ui_gameui_settings_effects_content = [
    #(gameui_setting_begin settings_effects)

    ui_gameui_vscrollarea [
        gameui_settings_scroll effects

        uispace $GAMEUI_SETTINGS_CONTENT_PAD 0 [
            uistyle clampx

            uivlist 0.025 [
                uistyle clampx

                #(gameui_section "Gore and death") [
                    #(gameui_setting "No gore" toggle nogore [
                        p_tip = "Replace blood and gibs with something less gory"
                    ])
                    #(gameui_setting "Blood amount" slider bloodscale [
                        p_tip = "How much blood is shed when a player is hurt"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Blood sparks" toggle bloodsparks [
                        p_tip = "Add sparks to the blood, or in place of it with no gore"
                    ])
                    #(gameui_setting "Dead bodies" switch deathanim [
                        p_tip = "What happens to dead players; hidden, an old death animation, ragdolls, or ragdolls hidden in duel and survivor"
                        p_options = ["Hide" "Fall" "Ragdoll" "Not in duel"]
                    ])
                    #(gameui_setting "Fade dead players" toggle deathfade [
                        p_tip = "Fade dead players out"
                    ])
                ]

                #(gameui_section "Content") [
                    #(gameui_setting "Vanities" toggle vanitymodels [
                        p_tip = "Show the hats and other vanities players wear"
                    ])
                    #(gameui_setting "Muzzle flash" switch muzzleflash [
                        p_tip = "Who shows a muzzle flash when firing; nobody, other players, yourself or whoever you are watching, or everyone"
                        p_options = ["Off" "Others" "Self" "All"]
                    ])
                    #(gameui_setting "Spawn effect" toggle playereffect [
                        p_tip = "Shimmer on players as they spawn and while protected"
                    ])
                    #(gameui_setting "Regen effect" toggle playerregeneffects [
                        p_tip = "Shimmer on players as they regenerate health"
                    ])
                    #(gameui_setting "Item effect" toggle entityeffect [
                        p_tip = "Effect on items as they spawn"
                    ])
                ]

                #(gameui_section "Prize effects") [
                    #(gameui_settingtoggles [
                        ["Sound" prizeeffects [
                            p_tip = "Sound for other players carrying a prize"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $prizeeffects 1) (&~ $prizeeffects 1)]
                        ]]
                        ["Light" prizeeffects [
                            p_tip = "Light on other players carrying a prize"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $prizeeffects 2) (&~ $prizeeffects 2)]
                        ]]
                        ["Tone" prizeeffects [
                            p_tip = "Tone on other players carrying a prize"
                            p_get = [& $arg1 4]
                            p_set = [? $arg1 (| $prizeeffects 4) (&~ $prizeeffects 4)]
                        ]]
                    ] "Others")
                    #(gameui_settingtoggles [
                        ["Sound" prizeeffectsself [
                            p_tip = "Sound while you carry a prize"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $prizeeffectsself 1) (&~ $prizeeffectsself 1)]
                        ]]
                        ["Light" prizeeffectsself [
                            p_tip = "Light on you while you carry a prize"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $prizeeffectsself 2) (&~ $prizeeffectsself 2)]
                        ]]
                    ] "Self")
                ]

                #(gameui_section "Screen effects") [
                    #(gameui_setting "Damage" slider visorfxdamage [
                        p_tip = "How much taking damage drains the colour from the view"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Critical health" slider visorfxcritical [
                        p_tip = "How much being close to death drains the colour and glitches the view"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Desaturate" slider visorfxdesaturate [
                        p_tip = "How far damage drains the colour from the view"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Glitch" slider visorfxglitch [
                        p_tip = "How much the view glitches when close to death"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Overhealth" slider visorfxoverhealth [
                        p_tip = "How much extra health brightens the colour of the view"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Protection" slider visorfxsaturate [
                        p_tip = "How much spawn protection brightens the colour of the view"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Narrowing" slider visorfxnarrow [
                        p_tip = "How much the edges of the view curve inwards"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Blur" slider visorfxblur [
                        p_tip = "How much the view blurs when moving fast"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Running" slider visorfxrun [
                        p_tip = "How much running widens and blurs the view"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Sprinting" slider visorfxsprint [
                        p_tip = "How much sprinting widens and blurs the view"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Impulse" slider visorfximpulse [
                        p_tip = "How much impulse moves widen and blur the view"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "HUD curve" slider visorcurve [
                        p_tip = "How much the HUD curves like a visor in front of your eyes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "HUD glow" slider visorglow [
                        p_tip = "How brightly the HUD's light spreads around it"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "HUD glow spread" slider visorglowsize [
                        p_tip = "How far the HUD's glow spreads, as a share of the screen height"
                        p_max        = 0.05
                        p_val_text   = [concatword (precf (*f $arg1 100) 1) "^%" ]
                    ])
                ]

            ]
        ]
    ] [
        p_width  = (-f $gameui_settings_content_w 0.015)
        p_height = $gameui_settings_content_h
    ]
]

# ui_gameui_settings_visibility_content = [
    #(gameui_setting_begin settings_visibility)

    ui_gameui_vscrollarea [
        gameui_settings_scroll visibility

        uispace $GAMEUI_SETTINGS_CONTENT_PAD 0 [
            uistyle clampx

            uivlist 0.025 [
                uistyle clampx

                #(gameui_section "Player visibility") [
                    #(gameui_setting "Player brightening" slider fullbrightmodels [
                        p_tip = "Brightness boost of the players"
                        p_val_text   = [concatword (toint (round (*f $arg2 100))) "^%" ]
                    ])
                    #(gameui_setting "Speedrun player opacity" slider playerghostblend [
                        p_tip = "Opacity of other players in speedrun mode"
                        p_val_text   = [concatword (toint (round (*f $arg2 100))) "^%" ]
                    ])
                ]

                #(gameui_section "Auras and rim lights") [
                    #(gameui_setting "Auras" toggle auras [
                        p_tip = "Glow around players and items"
                    ])
                    #(gameui_settingtoggles [
                        ["Self" playerauras [
                            p_tip = "Glow around yourself in third person"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $playerauras 1) (&~ $playerauras 1)]
                        ]]
                        ["First person" playerauras [
                            p_tip = "Glow around your hands and weapon in first person"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $playerauras 2) (&~ $playerauras 2)]
                        ]]
                        ["Others" playerauras [
                            p_tip = "Glow around other players"
                            p_get = [& $arg1 4]
                            p_set = [? $arg1 (| $playerauras 4) (&~ $playerauras 4)]
                        ]]
                        ["Items" entityauras [
                            p_tip = "Glow around items"
                        ]]
                    ] "Auras on")
                    #(gameui_setting "Rim lights" toggle rimlights [
                        p_tip = "Light catching the edges of players and items"
                    ])
                    #(gameui_settingtoggles [
                        ["Self" playerrimlights [
                            p_tip = "Rim light on yourself in third person"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $playerrimlights 1) (&~ $playerrimlights 1)]
                        ]]
                        ["First person" playerrimlights [
                            p_tip = "Rim light on your hands and weapon in first person"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $playerrimlights 2) (&~ $playerrimlights 2)]
                        ]]
                        ["Others" playerrimlights [
                            p_tip = "Rim light on other players"
                            p_get = [& $arg1 4]
                            p_set = [? $arg1 (| $playerrimlights 4) (&~ $playerrimlights 4)]
                        ]]
                        ["Items" entityrimlights [
                            p_tip = "Rim light on items"
                        ]]
                    ] "Rim lights on")
                    #(gameui_setting "Opacity" slider aurablend [
                        p_tip = "Opacity of the glow"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Width" slider aurasize [
                        p_tip = "Width of the glow as a percentage of the screen height"
                        p_min        = 0.002
                        p_max        = 0.03
                        p_val_text   = [concatword (round (*f $arg1 100) 0.1) "^%" ]
                    ])
                    #(gameui_setting "Brightness" slider aurabright [
                        p_tip = "How quickly the glow reaches full brightness near the model"
                        p_min        = 0.5
                        p_max        = 4
                    ])
                    #(gameui_setting "Distance" slider auradist [
                        p_tip = "Distance at which the glow has faded out"
                        p_max        = 4096
                    ])
                    #(gameui_setting "Hidden teammates" slider aurahidden [
                        p_tip = "Fill teammates hidden behind walls with their colour"
                        p_val_text   = [? (=f $arg1 0) "Off" (concatword (toint (round (*f $arg1 100))) "^%")]
                    ])
                    #(gameui_setting "Rim brightness" slider rimlightbright [
                        p_tip = "Strength of the light catching the edges"
                        p_max        = 2
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Rim sharpness" slider rimlightsharp [
                        p_tip = "How tightly the light hugs the edges"
                        p_min        = 1
                        p_max        = 12
                    ])
                    #(gameui_setting "Rim glow" slider rimlightglow [
                        p_tip = "How much the edges glow, more washes the colour out towards white"
                        p_max        = 1
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Rim distance" slider rimlightdist [
                        p_tip = "Distance at which the rim light has faded out"
                        p_max        = 4096
                    ])
                ]


                #(gameui_section "Tones") [
                    #(gameui_setting "Body" switch playertonebody [
                        p_tip = "The colour of most of a player; Team uses their team, Mix blends their colour with it, Team only in team games, Alone only without teams"
                        p_options = (sublist $CTONE_NAMES 0 $CTONE_MAX)
                        p_custom  = [result "Body"]
                    ])
                    #(gameui_setting "Body team blend" slider playertonebodymix [
                        p_tip = "How far the body tone blends towards the team colour when it mixes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Accent" switch playertoneaccent [
                        p_tip = "The colour of the details of a player; Team uses their team, Mix blends their colour with it, Team only in team games, Alone only without teams"
                        p_options = (sublist $CTONE_NAMES 0 $CTONE_MAX)
                        p_custom  = [result "Body"]
                    ])
                    #(gameui_setting "Accent team blend" slider playertoneaccentmix [
                        p_tip = "How far the accent tone blends towards the team colour when it mixes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Team" switch playertoneteam [
                        p_tip = "The colour of the lights on a player; Team uses their team, Mix blends their colour with it, Team only in team games, Alone only without teams"
                        p_options = (sublist $CTONE_NAMES 0 $CTONE_MAX)
                        p_custom  = [result "Body"]
                    ])
                    #(gameui_setting "Team team blend" slider playertoneteammix [
                        p_tip = "How far the team tone blends towards the team colour when it mixes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Display" switch playertonedisplay [
                        p_tip = "The colour of a player on the radar and scoreboard; Team uses their team, Mix blends their colour with it, Team only in team games, Alone only without teams"
                        p_options = (sublist $CTONE_NAMES 0 $CTONE_MAX)
                        p_custom  = [result "Body"]
                    ])
                    #(gameui_setting "Display team blend" slider playertonedisplaymix [
                        p_tip = "How far the display tone blends towards the team colour when it mixes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Aura" switch playerauratone [
                        p_tip = "The colour of the glow around a player; Team uses their team, Mix blends their colour with it, Team only in team games, Alone only without teams"
                        p_options = (sublist $CTONE_NAMES 0 $CTONE_MAX)
                        p_custom  = [result "Body"]
                    ])
                    #(gameui_setting "Aura team blend" slider playerauratonemix [
                        p_tip = "How far the aura tone blends towards the team colour when it mixes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                    #(gameui_setting "Rim light" switch playerrimlighttone [
                        p_tip = "The colour of the light catching the edges of a player; Team uses their team, Mix blends their colour with it, Team only in team games, Alone only without teams"
                        p_options = (sublist $CTONE_NAMES 0 $CTONE_MAX)
                        p_custom  = [result "Body"]
                    ])
                    #(gameui_setting "Rim light team blend" slider playerrimlighttonemix [
                        p_tip = "How far the rim light tone blends towards the team colour when it mixes"
                        p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                    ])
                ]

            ]
        ]
    ] [
        p_width  = (-f $gameui_settings_content_w 0.015)
        p_height = $gameui_settings_content_h
    ]
]



gameui_settings_controls_buttons = [
    [
        "Movement"
        [
            [ "Forward"  [forward]  ]
            [ "Backward" [backward] ]
            [ "Left"     [left]     ]
            [ "Right"    [right]    ]
            [ "Jump"     [jump]     ]
            [ "Crouch"   [crouch]   ]
            [ "Special"  [special]  ]
        ]
    ]
    [
        "Weapons"
        [
            [ "Primary fire"     [primary]                          ]
            [ "Secondary fire"   [secondary]                        ]
            [ "Reload"           [reload]                           ]
            [ "Next weapon"      [universaldelta 1]                 ]
            [ "Previous weapon"  [universaldelta -1]                ]
            [ "Primary weapon"   [weapon (weapload 0) 1]            ]
