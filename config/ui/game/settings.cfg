    ]
    indicator [
        gameui_settings_pointer_caption = "Counting down"
        pointer_demo $_weap (divf (mod $totalmillis 3000) 3000)
    ]
    circlebar [
        gameui_settings_pointer_caption = "Showing health, impulse and ammo"
        pointer_demo $_weap (divf (mod $totalmillis 6000) 6000)
    ]
    cursor [
