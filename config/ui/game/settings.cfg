// The page open in Settings, an index into gameui_settings_pages
gameui_settings_page = 0

// Size of the area a page is drawn in, for the page to fit itself to
gameui_settings_content_w = 0
gameui_settings_content_h = 0

// The page whose scroll position was last kept, see gameui_settings_scroll
gameui_settings_scroll_page = ""

// Space kept clear either side of the page list and the page beside it
GAMEUI_SETTINGS_MARGIN      = 0.04
GAMEUI_SETTINGS_GAP         = 0.03

// Widest and narrowest the page list gets, narrowing on narrower screens so the page keeps its width
GAMEUI_SETTINGS_LIST_MAX    = 0.2
GAMEUI_SETTINGS_LIST_MIN    = 0.16

// Size of the page list's labels, and the space before them, kept small enough that no page's name makes its button wider than the
// list, so the names line up and stay put when hovered
GAMEUI_SETTINGS_LIST_TEXT   = 1.4
GAMEUI_SETTINGS_LIST_PAD    = 0.012

// Space between a page's Sections and the sides of its scroll area
GAMEUI_SETTINGS_CONTENT_PAD = 0.01

// Opens a page of Settings, as if newly opened, see gameui_open
// 1:<index into gameui_settings_pages>
# gameui_settings_open_page = [
    local _handler
    if (!=s $gameui_settings_query "") [
        gameui_settings_query = ""
        gameui_settings_search_build
        gameui_settings_page  = -1
    ]
    if (!= $gameui_settings_page $arg1) [
        gameui_settings_page = $arg1

        loop i $gameui_num_states [
            #(gameui_get_anim_var i) = []
        ]
        gameui_hover_id       = -1
        gameui_hover_sound_id = -1

        _handler = (getalias (concatword ui_gameui_settings_ (at $gameui_settings_pages $arg1 1) _on_open))
        if (!=s $_handler "") [_handler]
    ]
]

// Keeps each page's scroll position while Settings is open, called first in a page's scroll area so the scroller is being built
// 1:<page>
gameui_settings_scroll = [
    local _var
    _var = (concatword gameui_settings_scroll_ $arg1)
    if (=s $gameui_settings_scroll_page $arg1) [
        // read back multiplied by uiscale and set multiplied by it again, so divided by it twice to set back the same
        $_var = (divf $uiclipoffsety (*f $uiscale $uiscale))
    ] [
        gameui_settings_scroll_page = $arg1
        uiclipoffsety (+f (getalias $_var) 0)
    ]
]

// What Settings is searched for, how many setting rows match, and the code drawing them, see gameui_settings_search_build
gameui_settings_query        = ""
gameui_settings_search_count = 0
gameui_settings_search_rows  = []

// Height of the search box above the pages
GAMEUI_SETTINGS_SEARCH_H     = 0.055

// A page's name in the page list
// 1:<page, as a setting row has it>
gameui_settings_page_name = [
    local _name
    _name = ""
    looplist _page $gameui_settings_pages [
        if (=s (concatword settings_ (at $_page 1)) $arg1) [_name = (at $_page 0)]
    ]
    result $_name
]

// Whether a setting row's label or tip has a word starting with each word searched for
// 1:<setting row, see gameui_setting_rows>
gameui_settings_search_matches = [
    local _text _match
    _text  = (concat "" (strreplace (strreplace (strreplace (concat (at $arg1 2) (at $arg1 3)) "," " ") ";" " ") "-" " "))
    _match = 1
    looplist _word $gameui_settings_query [
        if (< (strcasestr $_text (concat "" $_word)) 0) [_match = 0]
    ]
    result $_match
]

// Writes the code drawing every setting row matching the search, by page, each row's label followed by its Section; run only when
// the search changes, so nothing is rebuilt each frame
# gameui_settings_search_build = [
    local _code _rows _cur _n _label _graphics
    _code     = []
    _rows     = []
    _cur      = ""
    _n        = 0
    _graphics = 0
    gameui_settings_search_count = 0

    gameui_begin_ids
    gameui_last_id        = (- $GAMEUI_SETTING_ID_BASE 1)
    gameui_last_id_stride = 1
    loop i $gameui_num_states [
        #(gameui_get_anim_var i) = []
    ]

    if (!=s $gameui_settings_query "") [
        gameui_settings_controls_update_cache

        looplist _row $gameui_setting_rows [
            if (gameui_settings_search_matches $_row) [
                if (!=s (at $_row 0) $_cur) [
                    if (!=s $_cur "") [_code = (concatword $_code (format [ui_gameui_section %1 [%2]] (escape (gameui_settings_page_name $_cur)) $_rows) "^n")]
                    _cur  = (at $_row 0)
                    _rows = []
                    _n    = 0
                ]
                _label = (concatword (at $_row 2) "^fa  " (at $_row 1))
                if (=s (at $_row 4) bind) [
                    _rows = (concatword $_rows (format [ui_gameui_settings_search_bind %1 %2 %3 %4] (at $_row 5) (escape $_label) (escape (at $_row 6)) (mod $_n 2)) "^n")
                ] [
                    _rows = (concatword $_rows (format [ui_gameui_settingrow %1 [%2] %3] (escape $_label) (gameui_setting_control (at $_row 4) (at $_row 5) (at $_row 6)) (mod $_n 2)) "^n")
                ]
                if (=s (at $_row 0) settings_graphics) [_graphics = 1]
                _n = (+ $_n 1)
                gameui_settings_search_count = (+ $gameui_settings_search_count 1)
            ]
        ]
        if (!=s $_cur "") [_code = (concatword $_code (format [ui_gameui_section %1 [%2]] (escape (gameui_settings_page_name $_cur)) $_rows) "^n")]

        // graphics settings wait for Apply, so offer it beneath them, with what they're set to loaded first
        if $_graphics [
            if (! $gameui_settings_graphics_dirty) [gameui_settings_graphics_init]
            _code = (concatword $_code (format [ui_gameui_settings_search_apply %1 %2] (gameui_get_id button) (gameui_get_id button)) "^n")
        ]
    ]

    // the weapon the Crosshair page's weapon settings are for
    gameui_settings_search_rows = (concatword [local _wname; _wname = (at $W_NAMES $gameui_settings_pointer_weap)] "^n" $_code)
    gameui_settings_scroll_search = 0
    gameui_settings_scroll_page   = ""
]

// A binding found by search, drawn as on the Controls page
// 1:<number of its action> 2:<label> 3:<command> 4:<banded>
ui_gameui_settings_search_bind = [
    local action _action_num
    _action_num = $arg1
    action      = (concat (escape $arg2) (escape $arg3))
    ui_gameui_settings_controls_entry $arg4
]

// Reset and Apply for graphics settings found by search
// 1:<Reset widget id> 2:<Apply widget id>
# ui_gameui_settings_search_apply = [
    local _reset _apply
    _reset = $arg1
    _apply = $arg2
    uihlist 0 [
        ui_gameui_button [
            p_label    = "Reset"
            p_tip      = "Reset graphics settings"
            p_disabled = (! $gameui_settings_graphics_dirty)
            p_on_click = [
                gameui_settings_graphics_reset
            ]
            p_id       = $_reset
        ]

        ui_gameui_button [
            p_label     = "Apply"
            p_tip       = "Apply graphics settings"
            p_disabled  = (! $gameui_settings_graphics_dirty)
            p_on_click  = [
                gameui_settings_graphics_apply
            ]
            p_colour    = #(hsvtohex 8 0.3 1)
            p_highlight = 1
            p_id        = $_apply
        ]
    ]
]

// The setting rows matching the search, in place of a page
ui_gameui_settings_search_content = [
    if $gameui_settings_search_count [
        ui_gameui_vscrollarea [
            gameui_settings_scroll search

            uispace $GAMEUI_SETTINGS_CONTENT_PAD 0 [
                uistyle clampx

                uivlist 0.025 [
                    uistyle clampx

                    gameui_settings_search_rows
                ]
            ]
        ] [
            p_width  = (-f $gameui_settings_content_w 0.015)
            p_height = $gameui_settings_content_h
        ]
    ] [
        uicolourtext "No settings match" 0x888888 1.2
        uiprev [uialign -1 -1]
    ]
]

ui_gameui_settings_on_open = [
    gameui_settings_query       = ""
    gameui_settings_search_build
    gameui_settings_scroll_page = ""
    looplist _page $gameui_settings_pages [
        alias (concatword gameui_settings_scroll_ (at $_page 1)) 0
    ]

    local _handler
    _handler = (getalias (concatword ui_gameui_settings_ (at $gameui_settings_pages $gameui_settings_page 1) _on_open))
    if (!=s $_handler "") [_handler]
]

ui_gameui_settings_dims = $GAMEUI_PANEL_WIDE
ui_gameui_settings_title = "Settings"

# ui_gameui_settings = [
    #(gameui_begin_ids)

    local _listw _page
    _listw = (clampf (*f (-f $gameui_panel_new_size 0.9) 0.5) $GAMEUI_SETTINGS_LIST_MIN $GAMEUI_SETTINGS_LIST_MAX)
    _page  = (at $gameui_settings_pages $gameui_settings_page 1)
    gameui_settings_content_w = (-f $gameui_panel_new_size (*f $GAMEUI_SETTINGS_MARGIN 2) $_listw $GAMEUI_SETTINGS_GAP)
    gameui_settings_content_h = (-f $GAMEUI_SETTING_PAGE_H $GAMEUI_SETTINGS_SEARCH_H)

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        ui_gameui_paneltitle

        uispace $GAMEUI_SETTINGS_MARGIN 0 [
            uistyle clampx

            uifill 0 (-f $GAMEUI_SETTINGS_SEARCH_H 0.025) [
                uistyle clampx

                uihlist 0.02 [
                    uialign -1

                    uicolourtext "Search" 0xaaaaaa 1.2
                    ui_gameui_textinput gameui_settings_query 32 [
                        p_text_size = 1.2
                        p_prompt    = "[Search every setting]"
                        p_immediate = 1
                        p_on_change = [gameui_settings_search_build]
                    ]
                    if (!=s $gameui_settings_query "") [
                        uicolourtext (format "^fw%1 ^fa%2" $gameui_settings_search_count (? (= $gameui_settings_search_count 1) "match" "matches")) 0xaaaaaa
                    ]
                ]
            ]
        ]

        uispace $GAMEUI_SETTINGS_MARGIN 0 [
            uistyle clampx

            uihlist $GAMEUI_SETTINGS_GAP [
                uialign -1 -1

                uifill $_listw $gameui_settings_content_h [
                    uivlist 0 [
                        uialign -1 -1

                        local _id
                        _id = #(gameui_get_id prettybutton (listlen $gameui_settings_pages))
                        loop i (listlen $gameui_settings_pages) [
                            ui_gameui_prettybutton [
                                p_label       = (at $gameui_settings_pages $i 0)
                                p_label_size  = $GAMEUI_SETTINGS_LIST_TEXT
                                p_label_align = -1
                                p_pad_h       = $GAMEUI_SETTINGS_LIST_PAD
                                p_pad_h_shift = 0
                                p_width       = $_listw
                                p_highlight   = (&& [=s $gameui_settings_query ""] [= $i $gameui_settings_page])
                                p_tip         = (at $gameui_settings_pages $i 2)
                                p_on_click    = (concat gameui_settings_open_page $i) // runs after this frame, when i is gone
                                p_id          = (+ $_id $i)
                            ]
                        ]
                    ]
                ]
                uiprev [uialign -1 -1]

                uifill $gameui_settings_content_w $gameui_settings_content_h [
                    if (=s $gameui_settings_query "") [
                        (concatword ui_gameui_settings_ $_page _content)
                    ] [
                        ui_gameui_settings_search_content
                    ]
                    uiprev [uialign -1 -1]
                ]
            ]
        ]

        uispace $GAMEUI_SETTINGS_MARGIN 0 [
            ui_gameui_autoscrollh [
                uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
            ] [
                p_width = (-f $gameui_panel_new_size (*f $GAMEUI_SETTINGS_MARGIN 2))
                p_start = $gameui_tip_millis
            ]
        ]
    ]

    #(ui_gameui_backbutton)
]
