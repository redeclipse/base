    _shape  = (at $_hair 0)
    _size   = (at $_hair 1)
    _colour = (at $_hair 2)
    _blend  = (at $_hair 3)

    looplist2 _name _code $gameui_settings_pointer_previews [
        if (=s $_name $_mode) [ do $_code ]
    ]
]

