ui_gameui_settings_game_dims = 0.85

# ui_gameui_settings_game = [
    #(gameui_begin_ids)

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_gameui_decortext "Game settings" [
                p_width = $gameui_panel_new_size
            ]
            ui_gameui_shadowhoriz
        ]

        uispace 0.05 0 [
            uivlist 0.025 [
                ui_gameui_group [
                    uistyle clampx

                    uigrid 4 0.03 0.005 [
                        uistyle clampx

                        uicolourtext "Auto reload" 0xaaaaaa
                        ui_gameui_compactswitch weapautoreload [
                            p_tip = "Automatically reloads weapons when empty"
                            p_get = [= $arg1 4]
                            p_set = [? $arg1 4 2]
                            p_id  = #(gameui_get_id compactswitch)
                        ]
                        uicolourtext "Auto reload delay" 0xaaaaaa
                        ui_gameui_slider weapautoreloaddelay [
                            p_tip        = "How long to wait before automatically reloading"
                            p_width      = 0.17
                            p_max        = 2000
                            p_val_text   = [concatword (toint $arg1) "ms"]
                            p_id         = #(gameui_get_id slider)
                        ]

                        uicolourtext "Auto switch" 0xaaaaaa
                        ui_gameui_compactswitch weapautoswitch [
                            p_tip = "Automatically switches to another weapon when out of ammo"
                            p_id  = #(gameui_get_id compactswitch)
                        ]
                        uicolourtext "Skip empty" 0xaaaaaa
                        ui_gameui_compactswitch weapskipempty [
                            p_tip = "Skip weapons without ammo when scrolling through them"
                            p_id  = #(gameui_get_id compactswitch)
                        ]

                        uicolourtext "Loadout on match start" 0xaaaaaa
                        ui_gameui_compactswitch showloadoutmenu [
                            p_tip = "Show loadout menu on match start"
                            p_id  = #(gameui_get_id compactswitch)
                        ]
                        uicolourtext "Number keys" 0xaaaaaa
                        ui_gameui_switch weapselectslot [
                            p_width   = 0.17
                            p_options = ["Weapon" "Slot" "List"]
                            p_tip     = "What the number keys select; each weapon, your loadout slots, or your weapon list"
                            p_id      = #(gameui_get_id switch)
                        ]

                        uicolourtext "Zoom wraps around" 0xaaaaaa
                        ui_gameui_compactswitch zoomscroll [
                            p_tip = "Changing the zoom level past the end goes around to the other end"
                            p_id  = #(gameui_get_id compactswitch)
                        ]
                        uicolourtext "Default zoom" 0xaaaaaa
                        ui_gameui_slider zoomdefault [
                            p_tip        = "Zoom level each time you zoom in, or the last one you used"
                            p_width      = 0.17
                            p_max        = $zoomlevels
                            p_val_text   = [? (< $arg1 0) "Last" $arg1]
                            p_id         = #(gameui_get_id slider)
                        ]
                    ]
                ] [
                    p_label = "Weapon handling"
                ]

                ui_gameui_group [
                    uistyle clampx

                    uigrid 2 0.05 0.005 [
                        uistyle clampx

                        uicolourtext "Crouch" 0xaaaaaa
                        ui_gameui_switch crouchstyle [
                            p_options = ["Hold" "Double-tap" "Toggle"]
                            p_tip     = "Hold the key to crouch, double-tap it to stay crouched, or press it to toggle"
                            p_id      = #(gameui_get_id switch)
                        ]

                        uicolourtext "Walk" 0xaaaaaa
                        ui_gameui_switch walkstyle [
                            p_options = ["Hold" "Double-tap" "Toggle"]
                            p_tip     = "Hold the key to walk, double-tap it to keep walking, or press it to toggle"
                            p_id      = #(gameui_get_id switch)
                        ]

                        uicolourtext "Wall grab" 0xaaaaaa
                        ui_gameui_switch grabstyle [
                            p_options = ["Look" "Inverted" "Always up"]
                            p_tip     = "Which way grabbing a wall throws you; where you look, the opposite of it, or upwards"
                            p_id      = #(gameui_get_id switch)
                        ]

                        uicolourtext "Player grab" 0xaaaaaa
                        ui_gameui_switch grabplayerstyle [
                            p_options = ["Look" "Inverted" "Always up" "Toward them"]
                            p_tip     = "Which way grabbing a player throws you; where you look, the opposite of it, upwards, or at them"
                            p_id      = #(gameui_get_id switch)
                        ]
                    ]

                    uifill 0 0.01

                    uihlist 0.01 [
                        uialign -1 0

                        uicolourtext "Slide" 0xaaaaaa
                        ui_gameui_compactswitch impulsemethod [
                            p_tip = "Crouch while moving to slide"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $impulsemethod 2) (&~ $impulsemethod 2)]
                            p_id  = #(gameui_get_id compactswitch)
                        ]

                        uifill 0.02

                        uicolourtext "Launch" 0xaaaaaa
                        ui_gameui_compactswitch impulsemethod [
                            p_tip = "Jump out of a slide to launch forwards"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $impulsemethod 1) (&~ $impulsemethod 1)]
                            p_id  = #(gameui_get_id compactswitch)
                        ]

                        uifill 0.02

                        uicolourtext "Impulse jump" 0xaaaaaa
                        ui_gameui_compactswitch impulseaction [
                            p_tip = "Jump in the air to impulse jump"
                            p_get = [& $arg1 1]
                            p_set = [? $arg1 (| $impulseaction 1) (&~ $impulseaction 1)]
                            p_id  = #(gameui_get_id compactswitch)
                        ]

                        uifill 0.02

                        uicolourtext "Impulse boost" 0xaaaaaa
                        ui_gameui_compactswitch impulseaction [
                            p_tip = "Press the impulse key to boost"
                            p_get = [& $arg1 2]
                            p_set = [? $arg1 (| $impulseaction 2) (&~ $impulseaction 2)]
                            p_id  = #(gameui_get_id compactswitch)
                        ]
                    ]
                ] [
                    p_label = "Movement"
                ]

                ui_gameui_group [
                    uistyle clampx

                    uigrid 4 0.03 0.005 [
                        uistyle clampx

                        uicolourtext "Respawn delay" 0xaaaaaa
                        ui_gameui_slider deathbuttonmash [
                            p_tip        = "How long after dying before pressing a button respawns you"
                            p_width      = 0.17
                            p_max        = 3000
                            p_val_text   = [concatword (toint $arg1) "ms"]
                            p_id         = #(gameui_get_id slider)
                        ]
                        uicolourtext "Team change" 0xaaaaaa
                        ui_gameui_switch showteamchange [
                            p_width   = 0.17
                            p_options = ["Never" "Switching" "Always"]
                            p_tip     = "When to show which team you are on; never, when you change teams, or also when you join"
                            p_id      = #(gameui_get_id switch)
                        ]
                    ]
                ] [
                    p_label = "Match"
                ]
            ]
        ]

        uifill 0 0.025

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ]
    ]

    #(ui_gameui_backbutton)
]

ui_gameui_settings_camera_dims = 0.85

# ui_gameui_settings_camera = [
    #(gameui_begin_ids)

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_gameui_decortext "Camera" [
                p_width = $gameui_panel_new_size
            ]
            ui_gameui_shadowhoriz
        ]

        uispace 0.05 0 [
            uivlist 0.025 [
                ui_gameui_group [
                    uistyle clampx

                    uigrid 4 0.03 0 [
                        uistyle clampx

                        uicolourtext "First-person" 0xaaaaaa
                        ui_gameui_slider firstpersonfov [
                            p_tip        = "First-person field of vision in degrees"
                            p_width      = 0.17
                            p_id         = #(gameui_get_id slider)
                        ]
                        uicolourtext "Third-person" 0xaaaaaa
                        ui_gameui_slider thirdpersonfov [
                            p_tip        = "Third-person field of vision in degrees"
                            p_width      = 0.17
                            p_id         = #(gameui_get_id slider)
                        ]

                        uicolourtext "Spectator" 0xaaaaaa
                        ui_gameui_slider specfov [
                            p_tip        = "Spectator field of vision in degrees"
                            p_width      = 0.17
                            p_id         = #(gameui_get_id slider)
                        ]
                        uicolourtext "Editor" 0xaaaaaa
                        ui_gameui_slider editfov [
                            p_tip        = "Editing field of vision in degrees"
                            p_width      = 0.17
                            p_id         = #(gameui_get_id slider)
                        ]
                    ]
                ] [
                    p_label = "Field of vision"
                ]

                uihlist 0 [
                    uistyle clampx

                    ui_gameui_group [
                        uistyle clampx

                        uigrid 2 0.05 0 [
                            uistyle clampx

                            uicolourtext "Enabled" 0xaaaaaa
                            ui_gameui_compactswitch thirdperson [
                                p_tip = "Play with the camera behind your player"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Distance" 0xaaaaaa
                            ui_gameui_slider thirdpersondist [
                                p_tip        = "How far behind your player the third person camera sits"
                                p_width      = 0.17
                                p_min        = 1
                                p_round      = 0.5
                                p_val_text   = [round $arg1 0.5]
                                p_id         = #(gameui_get_id slider)
                            ]

                            uicolourtext "Side" 0xaaaaaa
                            ui_gameui_slider thirdpersonside [
                                p_tip        = "How far to the side the third person camera sits, negative is to the left"
                                p_width      = 0.17
                                p_round      = 0.5
                                p_val_text   = [round $arg1 0.5]
                                p_id         = #(gameui_get_id slider)
                            ]
                        ]
                    ] [
                        p_label = "Third person"
                    ]
                    uiprev [uialign -1 -1]

                    uifill

                    ui_gameui_group [
                        uistyle clampx

                        uigrid 2 0.05 0 [
                            uistyle clampx

                            uicolourtext "Weapon" 0xaaaaaa
                            ui_gameui_compactswitch firstpersonmodel [
                                p_tip = "Show your hands and weapon in first person"
                                p_get = [& $arg1 1]
                                p_set = [? $arg1 (| $firstpersonmodel 1) (&~ $firstpersonmodel 1)]
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Body" 0xaaaaaa
                            ui_gameui_compactswitch firstpersonmodel [
                                p_tip = "Show your body when you look down in first person"
                                p_get = [& $arg1 2]
                                p_set = [? $arg1 (| $firstpersonmodel 2) (&~ $firstpersonmodel 2)]
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Head camera" 0xaaaaaa
                            ui_gameui_compactswitch firstpersoncamera [
                                p_tip = "Move the view with the head of your player"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Camera bob" 0xaaaaaa
                            ui_gameui_compactswitch firstpersonbob [
                                p_tip = "First person camera bob animation"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Gun sway" 0xaaaaaa
                            ui_gameui_compactswitch firstpersonsway [
                                p_tip = "First person gun sway animation"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Gun kicks" 0xaaaaaa
                            ui_gameui_slider firstpersonkick [
                                p_tip      = "How far landing, jumping, impulses and hits jolt your gun, with gun sway on"
                                p_width    = 0.15
                                p_max      = 2
                                p_val_text = [precf $arg1 2]
                                p_id       = #(gameui_get_id slider)
                            ]
                        ]
                    ] [
                        p_label = "First person"
                    ]
                    uiprev [uialign -2 -1]
                ]

                ui_gameui_group [
                    uistyle clampx

                    uigrid 6 0.03 0 [
                        uistyle clampx

                        uicolourtext "Bob" 0xaaaaaa
                        ui_gameui_slider firstpersonbobroll [
                            p_tip        = "How far the view tilts as it bobs"
                            p_width      = 0.12
                            p_max        = 2
                            p_round      = 0.1
                            p_val_text   = [round $arg1 0.1]
                            p_id         = #(gameui_get_id slider)
                        ]
                        uicolourtext "Slide" 0xaaaaaa
                        ui_gameui_slider firstpersonslideroll [
                            p_tip        = "How far the view tilts while sliding, negative tilts the other way"
                            p_width      = 0.12
                            p_min        = -30
                            p_max        = 30
                            p_round      = 1
                            p_val_text   = [round $arg1]
                            p_id         = #(gameui_get_id slider)
                        ]
                        uicolourtext "Wall run" 0xaaaaaa
                        ui_gameui_slider impulseturnroll [
                            p_tip        = "How far the view tilts while running along a wall"
                            p_width      = 0.12
                            p_max        = 45
                            p_round      = 1
                            p_val_text   = [round $arg1]
                            p_id         = #(gameui_get_id slider)
                        ]
                    ]
                ] [
                    p_label = "Camera roll"
                ]

                ui_gameui_group [
                    uistyle clampx

                    uigrid 4 0.03 0.005 [
                        uistyle clampx

                        uicolourtext "Death camera" 0xaaaaaa
                        ui_gameui_switch deathcamstyle [
                            p_width   = 0.15
                            p_options = ["Off" "Killer" "Self"]
                            p_tip     = "Who the camera follows after you die"
                            p_id      = #(gameui_get_id switch)
                        ]
                        uicolourtext "Death camera speed" 0xaaaaaa
                        ui_gameui_slider deathcamspeed [
                            p_tip        = "How long the death camera takes to turn towards who it follows"
                            p_width      = 0.15
                            p_max        = 1000
                            p_val_text   = [concatword (toint $arg1) "ms"]
                            p_id         = #(gameui_get_id slider)
                        ]

                        uicolourtext "Spectating" 0xaaaaaa
                        ui_gameui_switch specmode [
                            p_width   = 0.15
                            p_options = ["Free" "TV"]
                            p_tip     = "Spectator camera; Free lets you fly around, TV follows the action"
                            p_id      = #(gameui_get_id switch)
                        ]
                        uicolourtext "Waiting to spawn" 0xaaaaaa
                        ui_gameui_switch waitmode [
                            p_width   = 0.15
                            p_options = ["Free" "TV"]
                            p_tip     = "Camera while waiting to spawn; Free lets you fly around, TV follows the action"
                            p_id      = #(gameui_get_id switch)
                        ]

                        uicolourtext "Intermission" 0xaaaaaa
                        ui_gameui_switch intermmode [
                            p_width   = 0.15
                            p_options = ["Free" "TV"]
                            p_tip     = "Camera at the end of a match; Free lets you fly around, TV follows the action"
                            p_id      = #(gameui_get_id switch)
                        ]
                        uicolourtext "Follow in third person" 0xaaaaaa
                        ui_gameui_compactswitch followthirdperson [
                            p_tip = "Watch the player you follow from behind them"
                            p_id  = #(gameui_get_id compactswitch)
                        ]
                    ]
                ] [
                    p_label = "Death and spectating"
                ]
            ]
        ]

        uifill 0 0.025

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ]
    ]

    #(ui_gameui_backbutton)
]

ui_gameui_settings_effects_dims = 0.85

# ui_gameui_settings_effects = [
    #(gameui_begin_ids)

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_gameui_decortext "Effects" [
                p_width = $gameui_panel_new_size
            ]
            ui_gameui_shadowhoriz
        ]

        uispace 0.05 0 [
            uivlist 0.025 [
                uihlist 0 [
                    uistyle clampx

                    ui_gameui_group [
                        uistyle clampx

                        uigrid 2 0.03 0.005 [
                            uistyle clampx

                            uicolourtext "No gore" 0xaaaaaa
                            ui_gameui_compactswitch nogore [
                                p_tip = "Replace blood and gibs with something less gory"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Blood amount" 0xaaaaaa
                            ui_gameui_slider bloodscale [
                                p_tip        = "How much blood is shed when a player is hurt"
                                p_width      = 0.17
                                p_max        = 2
                                p_val_text   = [concatword (toint (round (*f $arg1 100))) "^%" ]
                                p_id         = #(gameui_get_id slider)
                            ]

                            uicolourtext "Blood sparks" 0xaaaaaa
                            ui_gameui_compactswitch bloodsparks [
                                p_tip = "Add sparks to the blood, or in place of it with no gore"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Dead bodies" 0xaaaaaa
                            ui_gameui_switch deathanim [
                                p_width   = 0.17
                                p_options = ["Hide" "Fall" "Ragdoll" "Not in duel"]
                                p_tip     = "What happens to dead players; hidden, an old death animation, ragdolls, or ragdolls hidden in duel and survivor"
                                p_id      = #(gameui_get_id switch)
                            ]

                            uicolourtext "Fade dead players" 0xaaaaaa
                            ui_gameui_compactswitch deathfade [
                                p_tip = "Fade dead players out"
                                p_id  = #(gameui_get_id compactswitch)
                            ]
                        ]
                    ] [
                        p_label = "Gore and death"
                    ]
                    uiprev [uialign -1 -1]

                    uifill

                    ui_gameui_group [
                        uistyle clampx

                        uigrid 2 0.03 0.005 [
                            uistyle clampx

                            uicolourtext "Vanities" 0xaaaaaa
                            ui_gameui_compactswitch vanitymodels [
                                p_tip = "Show the hats and other vanities players wear"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Muzzle flash" 0xaaaaaa
                            ui_gameui_switch muzzleflash [
                                p_width   = 0.17
                                p_options = ["Off" "Others" "Self" "All"]
                                p_tip     = "Who shows a muzzle flash when firing; nobody, other players, yourself or whoever you are watching, or everyone"
                                p_id      = #(gameui_get_id switch)
                            ]

                            uicolourtext "Spawn effect" 0xaaaaaa
                            ui_gameui_compactswitch playereffect [
                                p_tip = "Shimmer on players as they spawn and while protected"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Regen effect" 0xaaaaaa
                            ui_gameui_compactswitch playerregeneffects [
                                p_tip = "Shimmer on players as they regenerate health"
                                p_id  = #(gameui_get_id compactswitch)
                            ]

                            uicolourtext "Item effect" 0xaaaaaa
                            ui_gameui_compactswitch entityeffect [
                                p_tip = "Effect on items as they spawn"
                                p_id  = #(gameui_get_id compactswitch)
                            ]
