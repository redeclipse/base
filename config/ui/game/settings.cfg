    tv [
        gameui_settings_pointer_caption = "While watching spectator TV"
        if (=s $tvcursor "") [ uicolourtext "None" 0x888888 ] [ ui_gameui_settings_pointer_closeup $tvcursor $tvcursorsize 0xFFFFFF $tvcursorblend ]
    ]
]

ui_gameui_settings_pointer_preview = [
    local _modes _mode _weap _wname _hair _shape _size _colour _blend _t _amt _health _next _period _elapsed
    _modes = (at $gameui_settings_pointer_modes $gameui_settings_pointer_section)
    _mode  = (? (>= (indexof $_modes $gameui_settings_pointer_focus) 0) $gameui_settings_pointer_focus (at $_modes 0))
