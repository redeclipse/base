gameui_settings_pointer_swatches = [0xFFFFFF 0xFF4040 0xFF9020 0xFFEE40 0x40FF60 0x40E0FF 0x4080FF 0xB060FF 0xFF60C0]

gameui_pointercolour_props = [
    [ p_none  0 ]
    [ p_width 0.3 ]
    [ p_tip   "" ]
    [ p_id    [] ]
]

// A row of colour swatches for a colour variable, each as big as fits in the width
// 1:<var> 2:<props, p_none also offering none and the player's own colour>
ui_gameui_pointercolour = [
    @(props $gameui_pointercolour_props arg2)

    local _cvar _cid _ctip _cvals _csize
    _cvar  = $arg1
    _cid   = $p_id
    _ctip  = $p_tip
    _cvals = (? $p_none (concat 0 -1 $gameui_settings_pointer_swatches) $gameui_settings_pointer_swatches)
    _csize = (minf 0.026 (divf (-f $p_width (*f (- (listlen $_cvals) 1) 0.004)) (listlen $_cvals)))
    uihlist 0.004 [
        uialign -1
        looplist _cval $_cvals [
            ui_gameui_button [
                p_width     = $_csize
                p_height    = $_csize
                p_highlight = (= $$_cvar $_cval)
                p_on_click  = (concat set $_cvar $_cval) // runs after this frame, when these locals are gone
                p_children  = [
                    caseif (= $_cval 0) [
                        uitext "-" 0.8
                    ] (< $_cval 0) [
                        uiimage $playertex (getclientcolour $playercn) 0 (*f $_csize 0.7) (*f $_csize 0.7)
                    ] () [
                        uicolour $_cval (*f $_csize 0.6) (*f $_csize 0.6)
                    ]
                ]
                p_tip       = (caseif (= $_cval 0) [result "None"] (< $_cval 0) [result "Your own colour"] () [result $_ctip])
                p_id        = $_cid
            ]
            _cid = (+ $_cid 1)
        ]
    ]
]
gameui_widget_register pointercolour 11

gameui_pointershape_props = [
    [ p_shapes [] ]
    [ p_none   0  ]
    [ p_width  0.3 ]
    [ p_tip    "" ]
    [ p_id     [] ]
]

// A switch through Pointer shapes, for a variable holding a shape's name
// 1:<var> 2:<props, p_none also offering none>
ui_gameui_pointershape = [
    @(props $gameui_pointershape_props arg2)

    local _pshapes _pnone
    _pshapes = $p_shapes
    _pnone   = $p_none
    ui_gameui_switch $arg1 [
        p_width   = $p_width
        p_options = (? $_pnone (concat "None" $_pshapes) $_pshapes)
        p_custom  = [result "Custom"]
        p_get     = [result (? $_pnone (? (=s $arg1 "") 0 (? (< (indexof $_pshapes $arg1) 0) -1 (+ (indexof $_pshapes $arg1) 1))) (indexof $_pshapes $arg1))]
        p_set     = [result (? $_pnone (? $arg1 (at $_pshapes (- $arg1 1)) "") (at $_pshapes $arg1))]
        p_tip     = $p_tip
        p_id      = $p_id
    ]
]
gameui_widget_register pointershape 3

// The preview shows whatever the setting last pointed at is about, picked from the modes of the current section
gameui_settings_pointer_focus   = ""
gameui_settings_pointer_caption = ""
gameui_settings_pointer_modes   = [[hair fade health throb morph outline] [weaphair weapon round hit hitmarker team zoom] [clip indicator circlebar] [cursor hover edit spec tv]]

// A setting row on the Crosshair and cursor page, its control pointing the preview at a mode while hovered, see gameui_setting
// 1:<preview mode> 2:<label> 3:<control type> 4:<var> 5:<control props, with its p_tip>
gameui_pointersetting = [
    gameui_setting_register $arg2 $arg3 $arg4 $arg5
    format [ui_gameui_settingrow %1 [ui_gameui_settings_pointer_cell %2 [%3]] %4] (escape $arg2) $arg1 (gameui_setting_control $arg3 $arg4 $arg5) (gameui_setting_banded)
]

// 1:<preview mode> 2:<widget>
ui_gameui_settings_pointer_cell = [
    uigroup [
        uialign -1
        arg2
        uihover [gameui_settings_pointer_focus = $arg1]
    ]
]

// a shape at the size it's drawn at, beside a close up of it
// 1:<shape> 2:<size> 3:<colour> 4:<opacity> 5:<accent colour> 6:<Hit effect amount> 7:<Hit effect colour>
ui_gameui_settings_pointer_closeup = [
    local _accent _hit _hitcolour _real _closew _close
    _accent    = (? (>= $numargs 5) $arg5 $cursoraccent)
    _hit       = (? (>= $numargs 6) $arg6 0)
    _hitcolour = (? (>= $numargs 7) $arg7 0xFFFFFF)
    // a narrow cell for the real size and the rest for the close up, both clipped so the box keeps its size
    _real   = (maxf (*f $arg2 1.3) 0.05)
    _closew = (-f 0.28 $_real)
    _close  = (minf (*f $arg2 3) (*f $_closew 0.75))
    uihlist 0.01 [
        uiclip $_real 0.28 0 0 [ pointer_preview $arg1 $arg2 $arg3 $_accent $arg1 0 $arg4 $_hit $_hitcolour ]
        uiclip $_closew 0.28 0 0 [ pointer_preview $arg1 $_close $arg3 $_accent $arg1 0 $arg4 $_hit $_hitcolour ]
    ]
]

// rises from 0 to 1 and back over a period; 1:<period in milliseconds> 2:<offset>
gameui_settings_pointer_wave = [
    local _t
    _t = (divf (mod (+ $totalmillis (? (>= $numargs 2) $arg2 0)) $arg1) $arg1)
    result (-f 1 (absf (-f (*f $_t 2) 1)))
]

// What the preview draws for each of its modes, as pairs of the mode's name and the code drawing it
gameui_settings_pointer_previews = [
    hair [
        gameui_settings_pointer_caption = "In play and close up"
        ui_gameui_settings_pointer_closeup $_shape $_size $_colour $_blend
    ]
    weaphair [
        gameui_settings_pointer_caption = (concat (pointer_weapvar $_wname longname) "in play and close up")
        ui_gameui_settings_pointer_closeup $_shape $_size $_colour $_blend
    ]
    fade [
        gameui_settings_pointer_caption = "Fading as your aim wavers"
        _amt = (*f (+f 0.5 (*f (gameui_settings_pointer_wave 3000) 1.5)) $crosshairaccamt)
        if (&& (>= $showcrosshair 2) (>f $_amt 0)) [ _blend = (minf (divf $_blend $_amt) 1) ]
        if $showcrosshair [ ui_gameui_settings_pointer_closeup $_shape $_size $_colour $_blend ]
    ]
    health [
        _health = (toint (lerpf 10 150 (gameui_settings_pointer_wave 6000)))
        gameui_settings_pointer_caption = (concatword "At " $_health "% health")
        ui_gameui_settings_pointer_closeup $_shape $_size (pointer_hairtone $_wname $_health 100 150) $_blend
    ]
    throb [
        gameui_settings_pointer_caption = "Pulsing as you regain health"
        _t = (clampf (divf (mod $totalmillis 1000) 500) 0 2)
        ui_gameui_settings_pointer_closeup $_shape (+f $_size (*f $_size (? (>f $_t 1) (-f 1 $_t) $_t) $crosshairthrob)) $_colour $_blend
    ]
    morph [
        gameui_settings_pointer_caption = "Changing to the next weapon and back"
        _next = (pointer_demo_hair (mod (+ $_weap 1) $W_MAX))
        _period = (+ $pointermorphtime 800)
        _elapsed = (mod $totalmillis (* $_period 2))
        _amt = (smoothstep (? $pointermorphtime (divf (mod $_elapsed $_period) $pointermorphtime) 1))
        if (>= $_elapsed $_period) [ _amt = (-f 1 $_amt) ]
        uifill 0.15 0.15 [ pointer_preview $_shape (lerpf $_size (at $_next 1) $_amt) $_colour $cursoraccent (at $_next 0) $_amt $_blend ]
    ]
    outline [
        gameui_settings_pointer_caption = "Close up, to show the outline"
        pointer_preview $_shape 0.24 $_colour $cursoraccent $_shape 0 $_blend
    ]
    weapon [
        gameui_settings_pointer_caption = (concat (pointer_weapvar $_wname longname) "as it looks in play")
        pointer_demo $_weap
    ]
    round [
        gameui_settings_pointer_caption = (concat (pointer_weapvar $_wname longname) "ammo, and its clip")
        uihlist 0.02 [
            pointer_round_preview (pointer_weapvar $_wname clip) 0.1 (? (>f $clipcolour 0) (pointer_weapvar $_wname colour) 0xFFFFFF)
            uifill 0.15 0.15 [ pointer_clip $_weap 1 $clipblend ]
        ]
    ]
    hit [
        gameui_settings_pointer_caption = "Showing a hit"
        _period = (+ $crosshairhitspeed 800)
        _elapsed = (mod $totalmillis $_period)
        _amt = (? (&& $crosshairhitspeed (< $_elapsed $crosshairhitspeed)) (-f 1 (smoothstep (divf $_elapsed $crosshairhitspeed))) 0)
        ui_gameui_settings_pointer_closeup $_shape $_size $_colour $_blend $cursoraccent $_amt (? $hitcrosshairtone (pointer_skew 0xFFFFFF $hitcrosshairtone) $_colour)
    ]
    hitmarker [
        gameui_settings_pointer_caption = "Landing damage"
        _period = (+ $hitmarkertime 700)
        _elapsed = (mod $totalmillis $_period)
        uigroup [
            pointer_preview $_shape $_size $_colour $cursoraccent $_shape 0 $_blend
            if (&& $showhitmarker (< $_elapsed $hitmarkertime)) [ pointer_hitmarker (divf $_elapsed $hitmarkertime) $hitmarkersize ]
        ]
    ]
    team [
        gameui_settings_pointer_caption = "Aiming at a team-mate"
        ui_gameui_settings_pointer_closeup $teamcrosshair $teamcrosshairsize $teamcrosshaircolour $teamcrosshairblend
    ]
    zoom [
        gameui_settings_pointer_caption = "Zoomed in"
        ui_gameui_settings_pointer_closeup $zoomcrosshair (*f $zoomcrosshairsize $crosshairscale) 0xFFFFFF $zoomcrosshairblend
    ]
    clip [
        gameui_settings_pointer_caption = "Emptying and reloading"
