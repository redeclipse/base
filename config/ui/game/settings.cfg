    ]
    hover [
        gameui_settings_pointer_caption = "Moving on and off something to click"
        _amt = (smoothstep (clampf (*f (-f (gameui_settings_pointer_wave 2000) 0.25) 2) 0 1))
        ui_gameui_settings_pointer_closeup $cursorpointer (*f $cursorsize (lerpf 1 $cursorhoverscale $_amt)) 0xFFFFFF $cursorblend (pointer_lerpcolour $cursoraccent $cursorhoveraccent $_amt)
    ]
    edit [
