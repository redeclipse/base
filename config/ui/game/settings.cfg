// Crosshair and cursor settings, a section at a time beside a preview of the result

gameui_settings_pointer_section  = 0
gameui_settings_pointer_weap     = 1
gameui_settings_pointer_swatches = [0xFFFFFF 0xFF4040 0xFF9020 0xFFEE40 0x40FF60 0x40E0FF 0x4080FF 0xB060FF 0xFF60C0]

// A row of colour swatches for a colour variable
// 1:<var> 2:<first widget id> 3:<also offer none and the player's own colour> 4:<tip>
ui_gameui_settings_pointer_colour = [
    local _cvar _cid _ctip _cvals
    _cvar  = $arg1
    _cid   = $arg2
    _ctip  = $arg4
    _cvals = (? $arg3 (concat 0 -1 $gameui_settings_pointer_swatches) $gameui_settings_pointer_swatches)
    uihlist 0.004 [
        uialign -1
        looplist _cval $_cvals [
            ui_gameui_button [
                p_width     = 0.026
                p_height    = 0.026
                p_highlight = (= $$_cvar $_cval)
                p_on_click  = (concat set $_cvar $_cval) // runs after this frame, when these locals are gone
                p_children  = [
                    caseif (= $_cval 0) [
                        uitext "-" 0.8
                    ] (< $_cval 0) [
                        uiimage $playertex (getclientcolour $playercn) 0 0.018 0.018
                    ] () [
                        uicolour $_cval 0.016 0.016
                    ]
                ]
                p_tip       = (caseif (= $_cval 0) [result "None"] (< $_cval 0) [result "Your own colour"] () [result $_ctip])
                p_id        = $_cid
            ]
            _cid = (+ $_cid 1)
        ]
    ]
]

// A switch through Pointer shapes, for a variable holding a shape's name
// 1:<var> 2:<shapes> 3:<widget id> 4:<also offer none> 5:<tip>
ui_gameui_settings_pointer_shape = [
    local _pshapes _pnone
    _pshapes = $arg2
    _pnone   = $arg4
    ui_gameui_switch $arg1 [
        p_width   = 0.27
        p_options = (? $_pnone (concat "None" $_pshapes) $_pshapes)
        p_custom  = [result "Custom"]
        p_get     = [result (? $_pnone (? (=s $arg1 "") 0 (? (< (indexof $_pshapes $arg1) 0) -1 (+ (indexof $_pshapes $arg1) 1))) (indexof $_pshapes $arg1))]
        p_set     = [result (? $_pnone (? $arg1 (at $_pshapes (- $arg1 1)) "") (at $_pshapes $arg1))]
        p_tip     = $arg5
        p_id      = $arg3
    ]
]

// A toggle for one bit of a variable
// 1:<var> 2:<bit> 3:<widget id> 4:<tip>
ui_gameui_settings_pointer_bit = [
    local _bvar _bit
    _bvar = $arg1
    _bit  = $arg2
    ui_gameui_compactswitch $arg1 [
        p_get = [result (!= (& $arg1 $_bit) 0)]
        p_set = [result (? $arg1 (| $$_bvar $_bit) (& $$_bvar (- 0x7FFFFFFF $_bit)))]
        p_tip = $arg4
        p_id  = $arg3
    ]
]

