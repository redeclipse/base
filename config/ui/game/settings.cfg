    ["Graphics"   graphics   "Graphics and display settings"]
    ["Sound"      sound      "Sound and music settings"]
    ["Controls"   controls   "Keyboard and mouse settings"]
    ["Gameplay"   game       "Gameplay settings"]
    ["Camera"     camera     "Field of vision, third and first person, and spectating"]
    ["HUD"        interface  "User interface settings"]
    ["Crosshair"  pointers   "Crosshairs, ammo clip, indicator and cursors"]
    ["Visibility" visibility "How players and items stand out, their auras and rim lights, and which colours you see on them"]
    ["Effects"    effects    "Gore, death, prize and screen effects"]
    ["Variables"  variables  "Search, edit, and save game variables"]
]

