// when people usually play: the master's peak players averaged for each weekday and hour in our own time,
// brighter the more were on, on a square root so the few on a quiet hour still show, faint where nothing is known, the hour now outlined;
// the cells are skinned like the rest of the menus, each inside a border that keeps them apart, white for the hour now and lit when hovered,
// and stretch to fill the width they're given;
// hovering one shows its day, hour and players in place of the summary, noted as the cells are built and shown the frame after
// 1:<server, -1 for the whole game> 2:<smallest cell width> 3:<cell height, taller than the day names at 0.8 of the text size, or rows part> 4:<text size> 5:<day names, Monday first> 6:<day name width>
ui_gameui_online_heatgap = 0.002 // how far a cell's fill sits inside its border, the border's width

ui_gameui_online_heatmap = [
    local _top _now _max _v _a _cell _day _hour _tipvar _tip
    _tipvar = (? (< $arg1 0) gameui_online_heat_tip_game gameui_online_heat_tip_server)
    _tip = (getalias $_tipvar)
    alias $_tipvar ""
    _top = (getserverhistorytop $arg1)
    _now = (serverhistorynow)
    _max = (maxf (at $_top 2) 0.001)
    uivlist 0 [
        uistyle clampx
        uitext (? (!=s $_tip "") $_tip (? (>=f (at $_top 2) 0.5) (format "Busiest on %1 around %2:00, about %3 on" (at "Mondays Tuesdays Wednesdays Thursdays Fridays Saturdays Sundays" (at $_top 0)) (? (< (at $_top 1) 10) (concatword 0 (at $_top 1)) (at $_top 1)) (toint (round (at $_top 2)))) "Usually quiet")) $arg4
        uiprev [uialign -1]
        uifill 0 0.005
        // each row is the day's name then its 24 hours, so every column gets the same share of any room left over
        loop _day 7 [
            uihlist 0 [
                uistyle clampx
                uifill $arg6 $arg3 [
                    uicolourtext (at $arg5 $_day) 0xaaaaaa (*f $arg4 0.8)
                    uiprev [uialign -1]
                ]
                uiprev [uialign -1]
                loop _hour 24 [
                    _v = (getserverhistory $arg1 $_day $_hour)
                    _a = (? (<f $_v 0) 0 (+ 0x30 (toint (*f 0xCF (sqrt (divf $_v $_max))))))
                    _cell = (? (<f $_v 0) 0x18FFFFFF (| (<< $_a 24) 0xE04848))
                    uiborderedimageclamped $skinbordertex (? (&& [= $_day (at $_now 0)] [= $_hour (at $_now 1)]) 0xFFFFFFFF 0xC0000000) 0 $ui_texborder $ui_screenborder $arg2 $arg3 [
                        uistyle clampx
                        ui_gameui_online_heattip
                        uispace $ui_gameui_online_heatgap $ui_gameui_online_heatgap [
                            uistyle clampxy
                            uiborderedimageclamped $skintex $_cell 0 $ui_texborder $ui_screenborder 0 0 [uistyle clampxy]
                        ]
                    ]
                ]
            ]
        ]
        uihlist 0 [
            uistyle clampx
            uifill $arg6 0
            uiprev [uialign -1]
            loop _hour 24 [
                uifill $arg2 0 [
                    uistyle clampx
                    if (! (mod $_hour 6)) [
                        uicolourtext (concatword (? (< $_hour 10) "0" "") $_hour) 0xaaaaaa (*f $arg4 0.8)
                        uiprev [uialign -1]
                    ]
                ]
            ]
        ]
    ]
]

// the hovered cell lit by a border over its own, and its day, hour and players noted, for ui_gameui_online_heatmap, which has the cell's _day, _hour, _v and _tipvar
ui_gameui_online_heattip = [
    uihover [
        uiborderedimageclamped $skinbordertex 0xFFFF9090 0 $ui_texborder $ui_screenborder 0 0 [uistyle clampxy]
        alias $_tipvar (format "%1 %2:00: %3" (at "Monday Tuesday Wednesday Thursday Friday Saturday Sunday" $_day) (? (< $_hour 10) (concatword 0 $_hour) $_hour) (? (<f $_v 0) "no record" (? (<f $_v 0.05) "usually empty" (format "about %1 on" (precf $_v 1)))))
    ]
]

ui_gameui_online_entry_mapshot = [
