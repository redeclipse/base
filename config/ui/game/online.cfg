                                    ui_gameui_online_heatmap $_idx 0.018 0.017 1 "Mon Tue Wed Thu Fri Sat Sun" 0.04
                                    uiprev [uialign -1 -1]
                                ] [
                                    uicolourtext "No history yet" 0xaaaaaa 1 [uialign -1 -1]
                                ]
                            ]
                            ui_gameui_online_details_feed
                        ]
                    ] [
                        p_width = #(+f $GAMEUI_ONLINE_DETAILS_W 0.04)
                    ]
                ]

                ui_gameui_vscrollarea [
                    uivlist 0.01 [
                        uialign -1 -1
                        caseif (< $_idx 0) [
                            uicolourtext "This server is no longer listed" 0xcccccc 1.2 [uialign -1]
                        ] (< $_state 0) [
                            uicolourtext "This server doesn't share who is playing" 0xcccccc 1.2 [uialign -1]
                        ] (< $_state 2) [
                            uihlist 0.01 [
                                uialign -1
                                uiimage $uiloadtex 0xffffff 0 0.04 0.04
                                uitext "Fetching details..." 1.2
                            ]
                        ] 1 [
                            _objectives = (gameui_online_details_objectives)
