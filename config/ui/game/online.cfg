# ui_gameui_online_entry = [
    local _sig _bg _size _extra_anim _sel _prevsel

    _sig        = (gameui_online_server_sig $arg1)
    _size       = 0.1
    _sel        = (=s $_sig $gameui_online_entry_selected)
    _prevsel    = (=s $_sig $gameui_online_entry_selected_prev)
    _bg         = (? (& $gameui_online_entry_counter 1) 0x555555 0x888888)
    _extra_anim = 0

    caseif $_sel [
        _extra_anim = (smoothstep $gameui_online_entry_anim)
        _size = (lerpf 0.1 0.15 $_extra_anim)
    ] $_prevsel [
        _extra_anim = (smoothstep (-f 1 $gameui_online_entry_anim))
        _size = (lerpf 0.1 0.15 $_extra_anim)
    ]

    uiborderedimageclamped $skintex $_bg 0 $ui_texborder $ui_screenborder 0.9 $_size [
        if (|| $_sel $uidrawn) [
            uialign -1 -1

            local _desc _ping _ping_color _mapname _maptitle _mapshot _gamemodeinfo _gamemode _gamemuts _maxp _nump _lastping _stat _stat_icon _stat_color _compatible
            _desc     = (getserver $arg1 0 3)
            _ping     = (getserver $arg1 0 6)
            _mapname  = (getserver $arg1 0 4)
            _maptitle = (getserver $arg1 0 12)
            if (=s $_maptitle "") [_maptitle = (getmaptitle $_mapname)]
            // the server's own preview of a map we don't have, once it's fetched
            _mapshot  = (getservermapshot $arg1)
            if (=s $_mapshot "") [_mapshot = (concatword "maps/" $_mapname)]
            _gamemode = (modename (getserver $arg1 1 1) (getserver $arg1 1 2))
            _gamemuts = (mutsname (getserver $arg1 1 1) (getserver $arg1 1 2) 0 64)
            _maxp     = (getserver $arg1 1 4)
            _nump     = (getserver $arg1 0 5)
            _lastping = (getserver $arg1 0 7)
            _stat     = (getserver $arg1 0 0)
            _ver_diff = (- (getserver $arg1 1 0) (getversion 1))

            uihover [
                uiinteractive 1
                gameui_online_entry_hover = 1

                uipropagate [uicolourblend 0.66]
            ] [
                uipropagate [uicolourblend 0.33]
            ]

            if (! $_sel) [
                uirelease [
                    sleep 1 [
                        gameui_online_entry_selected_millis = $totalmillis
                        gameui_online_entry_selected_prev   = $gameui_online_entry_selected
                        gameui_online_entry_selected        = @_sig

                        soundbyname S_UI_TICK
                        soundbyname S_UI_ANIM2 255 0 2
                    ]
                ]
            ]

            caseif (< $_ping 150) [
                _ping_color = #(hsvtohex 120 0.66 1)
            ] (< $_ping 300) [
                _ping_color = #(hsvtohex 60 0.66 1)
            ] (1) [
                _ping_color = #(hsvtohex 0 0.66 1)
            ]

            if $_ver_diff [
                _stat_icon  = "<grey>textures/servers/unknown"
                _stat_color = #(hsvtohex 15 0.66 0.75)
            ] [
                case $_stat 1 [
                    _stat_icon  = "<grey>textures/servers/locked"
                    _stat_color = #(hsvtohex 60 0.66 0.75)
                ] 2 [
                    _stat_icon  = "<grey>textures/servers/locked"
                    _stat_color = #(hsvtohex 0 0.66 0.75)
                ]
            ]

            ui_gameui_online_entry_mapshot

            uifill (-f 0.9 0.2 0.02) 0 [
                uistyle clampy
                uialign 1

                ui_gameui_online_entry_info $arg1

                if $_stat_icon [
                    uipad 0.27 0 0 0 [
                        uicroppedimage $_stat_icon $_stat_color 0 (*f $_size 2) $_size 0 0.25 1 0.5 [
                            uipropagate [uicolourblend 0.25]
                        ]
                    ]
                ]
            ]

            if (!=f $_extra_anim 0) [
                uihlist 0 [
                    uialign 1 1

                    ui_gameui_button [
                        p_label = "Details"
                        p_tip   = "See who is playing and the scores"
                        p_on_click = [
                            gameui_online_details_addr = (getserver #1 arg1 0 1)
                            gameui_online_details_port = (getserver #1 arg1 0 2)
                            gameui_online_details_desc = [#3 _desc]
                            gameui_open ui_gameui_online_details
                        ]
                        p_width  = 0.1
                        p_height = 0.04
                        p_id = #(gameui_get_id button)
                    ]
                    ui_gameui_button [
                        p_label = "Join"
                        p_on_click = [
                            gameui_online_entry_selected = -1
                            if #3 _ver_diff [] [
                                local _addr _port
                                _addr = (getserver #1 arg1 0 1)
                                _port = (getserver #1 arg1 0 2)

                                gameui_online_connect_desc = [#3 _desc]
                                gameui_online_connect_addr = $_addr
                                gameui_online_connect_port = $_port
                                gameui_online_connect_pswd = ""

                                if (= #3 _stat 2) [
                                    gameui_open ui_gameui_online_private
                                ] [
                                    gameui_online_connect
                                ]
                            ]
                        ]
                        p_width  = 0.1
                        p_height = 0.04
                        p_id = #(gameui_get_id button)
                    ]
                    uiprev [
                        uipropagate [
                            uicolourblend $_extra_anim
                        ]
                    ]
                ]
            ]
        ]

        ui_gameui_shadow

        if (!=f $_extra_anim 0) [
            uiborderedimageclamped $skinshadowtex #(hsvtohex 8 0.5 1) 0 $ui_texborder $ui_screenborder 0 0 [
                uiclamp 1 1 1 1
                uicolourblend $_extra_anim
            ]
        ]
    ]
]

/////////////
// DETAILS //
/////////////

// Name, account, points, frags, deaths, ping and privilege
GAMEUI_ONLINE_DETAILS_COLS = [0.34 0.22 0.1 0.1 0.1 0.1 0.14]
GAMEUI_ONLINE_DETAILS_W    = 1.12
GAMEUI_ONLINE_DETAILS_HEAT_W = 0.54 // the heatmap's share, the match feed has the rest
GAMEUI_ONLINE_DETAILS_FEED_H = 0.132 // with its label, as tall as the heatmap

// 1:<address> 2:<port>, the server's place in the list as it's sorted now, or -1 once it's gone
gameui_online_details_find = [
    local _found
    _found = -1
    loopservers i [
        if (&& [=s (getserver $i 0 1) $arg1] [= (getserver $i 0 2) $arg2]) [_found = $i]
    ] []
    result $_found
]

// 1:<team name from the server>, its index, or -1
gameui_online_details_team = [
    listfind t $T_NAMES [=s $t $arg1]
]

// 1:<team name from the server>, in its team's colour
gameui_online_details_teamname = [
    local _ti
    _ti = (gameui_online_details_team $arg1)
    if (>= $_ti 0) [getteamname $_ti 1] [result $arg1]
]

// 1:<flags|balls> 2:<index>, who carries it, or where it lies
gameui_online_details_affinity = [
    local _s
    _s = (getserverdetail $arg1 $arg2 state)
    if (=s $_s "taken") [
        concat "taken by" (getserverdetailname $arg1 $arg2 carrier)
    ] [
        ? (=s $_s "dropped") "dropped" "at home"
    ]
]

// What every player's HUD shows of the match's objectives, as one line: each flag or ball and who carries it,
// and each point, who holds it and who is taking it
gameui_online_details_objectives = [
    local _text _part _enemy
    _text = ""
    loop f (getserverdetail flags) [
        _part = (concat (gameui_online_details_teamname (getserverdetail flags $f team)) "flag" (gameui_online_details_affinity flags $f))
        _text = (concatword $_text (? (strlen $_text) "    " "") $_part)
    ]
    loop b (getserverdetail balls) [
        _part = (concat "Ball" (gameui_online_details_affinity balls $b))
        _text = (concatword $_text (? (strlen $_text) "    " "") $_part)
    ]
    loop p (getserverdetail points) [
        // by the letter the HUD shows, and the map's own name for it when it has one
        _part = (getserverdetail points $p id)
        if (!=s (getserverdetail points $p name) "Point") [_part = (concat $_part (getserverdetail points $p name))]
        _part = (concatword $_part ": " (? (=s (getserverdetail points $p owner) "neutral") "nobody" (gameui_online_details_teamname (getserverdetail points $p owner))))
        _enemy = (getserverdetail points $p enemy)
        if (strlen $_enemy) [
            _part = (concatword $_part ", " (gameui_online_details_teamname $_enemy) " taking " (getserverdetail points $p progress) "%")
        ]
        _text = (concatword $_text (? (strlen $_text) "    " "") $_part)
    ]
    result $_text
]

// What's happening there now, newest first, from the server's Event feed while its details are open
ui_gameui_online_details_feed = [
    uivlist 0.003 [
        uialign -1 -1
        uicolourtext "Match feed" 0xaaaaaa 1 [uialign -1]
        uiclip (-f $GAMEUI_ONLINE_DETAILS_W $GAMEUI_ONLINE_DETAILS_HEAT_W 0.04) $GAMEUI_ONLINE_DETAILS_FEED_H 0 0 [
            uialign -1 -1
            uivlist 0 [
                uialign -1 -1
                if (getserverevents) [
                    loop i (getserverevents) [
                        uitext (getserverevent $i) 0.85 [uialign -1]
                    ]
                ] [
                    uicolourtext (? (serverfeedopen) "Waiting for something to happen..." "Connecting to the match feed...") 0x888888 0.85 [uialign -1]
                ]
            ]
        ]
    ]
]

// The teams the players are on, as a team's score only appears once it has one
gameui_online_details_teams = [
    local _teams _tn
    _teams = ""
    loop p (getserverdetail players) [
        _tn = (getserverdetail players $p team)
        if (&& [!=s $_tn "neutral"] [!=s (getserverdetail players $p state) "Spectator"] [< (listfind x $_teams [=s $x $_tn]) 0]) [
            _teams = (concat $_teams (escape $_tn))
        ]
    ]
    result $_teams
]

// 1:<team name from the server>
gameui_online_details_score = [
    local _score
    _score = 0
    loop t (getserverdetail teams) [
        if (=s (getserverdetail teams $t team) $arg1) [_score = (getserverdetail teams $t score)]
    ]
    result $_score
]

// 1:<label> 2:<value> 3:<width the value wraps at, or none>
ui_gameui_online_details_field = [
    uicolourtext $arg1 0xaaaaaa 1 [uialign -1 -1]
    uicolourtext $arg2 0xffffff 1 [
        uialign -1 -1
        if (>f $arg3 0) [uitextwrap $arg3; uitextalign -2]
    ]
]
GAMEUI_ONLINE_DETAILS_LEFT_W  = 0.36 // where the server and map facts wrap
GAMEUI_ONLINE_DETAILS_RIGHT_W = 0.3  // where the match facts wrap

// A row of cells as wide as the columns, which never grow
// 1:<list of texts> 2:<colour> 3:<background>
ui_gameui_online_details_cells = [
    uicolour $arg3 $GAMEUI_ONLINE_DETAILS_W 0.032 [
        uihlist 0 [
            uialign -1
            uifill 0.015
            loop c (listlen $GAMEUI_ONLINE_DETAILS_COLS) [
                local _w
                _w = (at $GAMEUI_ONLINE_DETAILS_COLS $c)
                uifill $_w 0.032 [
                    uiclip $_w 0.032 0 0 [
                        uialign -1
                        uicolourtext (at $arg1 $c) $arg2 1 [uialign -1]
                    ]
                ]
            ]
        ]
    ]
]

// 1:<player index> 2:<row>
ui_gameui_online_details_player = [
    local _handle
    _handle = (getserverdetail players $arg1 handle)
    ui_gameui_online_details_cells [
        @(escape (getserverdetailname players $arg1))
        @(escape (? (strlen $_handle) $_handle "-"))
        @(escape (getserverdetail players $arg1 points))
        @(escape (getserverdetail players $arg1 frags))
        @(escape (getserverdetail players $arg1 deaths))
        @(escape (getserverdetail players $arg1 ping))
        @(escape (getserverdetail players $arg1 privilege))
    ] 0xffffff (? (& $arg2 1) 0x55555555 0x55888888)
]

// The players on a team, or every player when it's empty; spectators are listed apart
// 1:<team name>
ui_gameui_online_details_players = [
    local _row
    _row = 0
    loop p (getserverdetail players) [
        if (&& [!=s (getserverdetail players $p state) "Spectator"] [|| [=s $arg1 ""] [=s $arg1 (getserverdetail players $p team)]]) [
            ui_gameui_online_details_player $p $_row
            _row = (+ $_row 1)
        ]
    ]
    if (! $_row) [
        uicolourtext "Nobody" 0x888888 1 [uialign -1]
    ]
]

