                    p_label       = "Disagree"
                    p_width       = 0.2
                    p_colour      = #(hsvtohex 0 0.5 1)
                    p_highlight   = 1
                    p_on_click    = [
                        gameui_close
                    ]
                    p_id          = #(gameui_get_id button)
                ]

                ui_gameui_button [
                    p_label       = "Agree"
                    p_width       = 0.2
                    p_colour      = #(hsvtohex 120 0.5 1)
                    p_highlight   = 1
                    p_on_click    = [
                        connectguidelines 1
                        gameui_close

                        if (!=s $guidelinesaction []) [
