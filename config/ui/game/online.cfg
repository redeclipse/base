                                uicolourtext $_objectives 0xffffff 1 [uitextwrap $GAMEUI_ONLINE_DETAILS_W; uitextalign -2; uialign -1]
                            ]
                            ui_gameui_online_details_cells "Name Account Points Frags Deaths Ping Privilege" 0xaaaaaa 0
                            _teams = (gameui_online_details_teams)
                            if (listlen $_teams) [
                                looplist _tn $_teams [
                                    local _ti
                                    _ti = (gameui_online_details_team $_tn)
                                    uihlist 0.01 [
                                        uialign -1
                                        uicolourtext (? (>= $_ti 0) (getteamname $_ti) $_tn) (? (>= $_ti 0) (getteamcolour $_ti) 0xffffff) 1.4
                                        uicolourtext (gameui_online_details_score $_tn) 0xffffff 1.4
                                    ]
                                    ui_gameui_online_details_players $_tn
                                ]
                            ] [
                                ui_gameui_online_details_players ""
                            ]
                            _spec = ""
                            loop p (getserverdetail players) [
                                if (=s (getserverdetail players $p state) "Spectator") [
                                    _spec = (concatword $_spec (? (strlen $_spec) ", " "") (getserverdetailname players $p))
                                ]
