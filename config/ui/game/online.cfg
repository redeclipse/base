                                        _secs = (getserver $_idx 1 3)
                                        _gstate = (getserver $_idx 1 13)
                                        // the match's time left in play, and how long until the next state while waiting, in intermission or voting
                                        _left = (? (&& (>= $_gstate $G_S_PLAYING) (<= $_gstate $G_S_OVERTIME)) (* $_secs 1000) (getserver $_idx 1 14))
                                        ui_gameui_online_details_field "Match" (concat (at $G_S_NAMES $_gstate) (? (> $_left 0) (timestr $_left $showtimestyle) "")) $GAMEUI_ONLINE_DETAILS_RIGHT_W
                                        ui_gameui_online_details_field "Players" (format "%1 of %2" (getserver $_idx 0 5) (getserver $_idx 1 4)) $GAMEUI_ONLINE_DETAILS_RIGHT_W
