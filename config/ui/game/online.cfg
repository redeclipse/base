    #(gameui_begin_ids)

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        ui_gameui_paneltitle

        ui_gameui_horizgroup [
            uitext "You must agree to these guidelines before playing on this server:"

            uifill 0 0.025

            ui_gameui_vscrollarea [
                ui_gameui_group [
                    uicolourtext $ui_gameui_online_guidelines_text 0xcccccc 1 [
