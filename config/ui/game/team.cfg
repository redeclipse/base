gameui_begin_ids

ui_gameui_team_dims = $GAMEUI_PANEL_STANDARD
ui_gameui_team_title = "Pick your team"

// 1:<team> 2:<width> 3:<height> 4:<icon size> 5:<widget id>
// A button to join a team, the game or spectate, its icon named beneath it, or beside it when the button is too short
// 1:<team, below T_NEUTRAL to spectate> 2:<width> 3:<height> 4:<icon size> 5:<widget id>
ui_gameui_team_button = [
    local _team_name _team_colour _icon _label _tip _disabled _beside

    if (< $arg1 $T_NEUTRAL) [
        _team_colour = 0xaaaaaa
        _icon        = "textures/modes/demo"
        _label       = "Spectate"
        _tip         = "Spectate"
        _disabled    = $isspectator
    ] [
        _team_name   = (at $T_NAMES $arg1)
        _team_colour = (getteamcolour $arg1)
        _icon        = $(concatword team $_team_name tex)
        _disabled    = (&& [! $isspectator] [= $getclientteam $arg1])

        if (!= $arg1 $T_NEUTRAL) [
            _label = (getteamname $arg1)
            _tip   = (concatword "Join " $_label)
        ] [
            _label = "Join game"
            _tip   = "Join game"
        ]
    ]
    _beside = (<f $arg3 (+f $arg4 0.05))

    ui_gameui_button [
        p_width     = $arg2
        p_height    = $arg3
        p_colour    = $_team_colour
        p_icon_size = $arg4
        p_children  = [
            if $_beside [
                uihlist 0.015 [
                    uiimage $_icon $_colour 0 $_icon_size $_icon_size
                    uicolourtext $_label $_colour 1.4
                    uipropagate [uicolourblend (lerpf 0.8 1 $_anim_state_hover)]
                ]
            ] [
                uivlist 0.005 [
                    uiimage $_icon $_colour 0 $_icon_size $_icon_size
                    uicolourtext $_label $_colour 1.4
                    uipropagate [uicolourblend (lerpf 0.8 1 $_anim_state_hover)]
                ]
            ]
        ]
        p_tip       = $_tip
        p_disabled  = $_disabled
        p_id        = $arg5
        p_on_click  = [
            caseif (< @arg1 $T_NEUTRAL) [
                spectate 1
            ] (= @arg1 $T_NEUTRAL) [
                spectate 0
            ] 1 [
                team @@arg1
            ]

            gameui_close_all
        ]
    ]
]

