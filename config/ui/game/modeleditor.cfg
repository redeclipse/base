gameui_begin_ids

// The Model editor: a host model with attachments on its tags, each model's placement and tags tuned while they're on screen.
// The host, attachments, animation and save file are kept in modeledithost, modeleditattached (model and tag pairs),
// modeleditanim and modeleditfile; every change is dropped again when the Panel closes.

modeleditor_sel     = -1 // -1 for the host model, otherwise which attachment is being tuned
modeleditor_tag     = "" // the tag of the selected model being tuned
modeleditor_step    = 1  // 0 fine, 1 normal, 2 coarse
modeleditor_play    = 1  // the animation plays, or is held at modeleditor_time
modeleditor_time    = 0
modeleditor_hud     = 0  // seen through the first person camera
modeleditor_reset   = 0  // put the view back next frame
modeleditor_picker  = "" // what the list on the left picks: host, attach, attachtag, vanity, anim, bone, tagname
modeleditor_filter  = ""
modeleditor_pending = "" // the model chosen as an attachment while its tag is picked
modeleditor_bone    = "" // the bone chosen for a new tag
modeleditor_tagname = ""

MODELEDITOR_PRESETS = [
    ["Male body"        "actors/player/male"]
    ["Female body"      "actors/player/female"]
    ["Male hands (HUD)" "actors/player/male/hwep"]
    ["Female hands (HUD)" "actors/player/female/hwep"]
    ["Janitor"          "actors/janitor"]
]

// Steps for fine, normal and coarse: distances, angles and scale in percent
MODELEDITOR_STEPS  = [[0.01 0.1 1] [1 5 15] [1 5 25]]
// What the sliders span for each of those
MODELEDITOR_RANGES = [[-10 10] [-360 360] [1 1000]]
MODELEDITOR_LIST_H = 0.032
MODELEDITOR_SIDE_W = 0.42

// Opens the Model editor, on a host model when given one
// 1:<host model>
modeleditor = [
    if $isonline [
        echo "The Model Editor can't be used while connected to a server"
    ] [
        if (!=s $arg1 "") [modeleditor_sethost $arg1]
        modeleditor_sel    = -1
        modeleditor_tag    = ""
        modeleditor_picker = ""
        modeleditor_reset  = 1
        gameui_open ui_gameui_modeleditor
    ]
]

modeleditor_count = [div (listlen $modeleditattached) 2]

// The model being tuned
modeleditor_model = [
    if (< $modeleditor_sel 0) [result $modeledithost] [result (at $modeleditattached (* $modeleditor_sel 2))]
]

// Every model on screen once, for saving
modeleditor_models = [
    local _list _mdl
    _list = (escape $modeledithost)
    loop i (modeleditor_count) [
        _mdl = (at $modeleditattached (* $i 2))
        if (< (listfind=s $_list $_mdl) 0) [append _list (escape $_mdl)]
    ]
    result $_list
]

// 1:<model> 2:<tag>
modeleditor_attach = [
    modeleditattached = (concat $modeleditattached (escape $arg1) (escape $arg2))
    modeleditor_sel   = (- (modeleditor_count) 1)
    modeleditor_tag   = ""
]

// 1:<attachment>
modeleditor_detach = [
    local _list
    _list = []
    loop i (modeleditor_count) [
        if (!= $i $arg1) [
            _list = (concat $_list (escape (at $modeleditattached (* $i 2))) (escape (at $modeleditattached (+ (* $i 2) 1))))
        ]
    ]
    modeleditattached = $_list
    modeleditor_sel   = -1
    modeleditor_tag   = ""
]

// 1:<model>
modeleditor_sethost = [
    modeledithost      = $arg1
    modeleditanim      = (? (>= (listfind=s (modeleditanims $arg1) "idle") 0) "idle" "")
    modeleditor_sel    = -1
    modeleditor_tag    = ""
    modeleditor_reset  = 1
]

// The body a vanity is drawn on, from the host model
modeleditor_body = [
    cond [>= (strstr $modeledithost "female") 0] [result "female"] [>= (strstr $modeledithost "janitor") 0] [result "janitor"] [result "male"]
]

// 1:<kind: 0 distance, 1 angle, 2 scale>
modeleditor_stepfor = [at (at $MODELEDITOR_STEPS $arg1) $modeleditor_step]

// A placement value, or a tag's when the field starts with "tag"
// 1:<field>
modeleditor_get = [
    if (=s (substr $arg1 0 3) "tag") [
        modeledittagget (modeleditor_model) $modeleditor_tag (substr $arg1 3)
    ] [
        modeleditget (modeleditor_model) $arg1
    ]
]

// 1:<field> 2:<value>
modeleditor_set = [
    if (=s (substr $arg1 0 3) "tag") [
        modeledittagset (modeleditor_model) $modeleditor_tag (substr $arg1 3) $arg2
    ] [
        modeleditset (modeleditor_model) $arg1 $arg2
    ]
]

// 1:<picker>
modeleditor_pick = [
    modeleditor_picker = (? (=s $modeleditor_picker $arg1) "" $arg1)
    modeleditor_filter = ""
]

// Whether an item shows under the filter
// 1:<text>
modeleditor_shown = [
    || [=s $modeleditor_filter ""] [>= (strstr (strlower $arg1) (strlower $modeleditor_filter)) 0]
]

// One line of a list, chosen by clicking it
// 1:<label> 2:<action> 3:<selected> 4:<width>
ui_modeleditor_row = [
    uitarget $arg4 $MODELEDITOR_LIST_H [
        uihover [
            uiinteractive 1
            uicolour 0x34ffffff 0 0 [uistyle clampxy]
        ] [
            if $arg3 [uicolour 0x30801010 0 0 [uistyle clampxy]]
        ]
        uirelease $arg2
        uispace 0.006 0 [
            uistyle clampx
            uicolourtext $arg1 (? $arg3 0xffffff 0xbbbbbb) 0.9
            uiprev [uialign -1]
        ]
    ]
]

// A small button
// 1:<label> 2:<action> 3:<width> 4:<highlight> 5:<disabled>
ui_modeleditor_button = [
    uitarget $arg3 $MODELEDITOR_LIST_H [
        uicolour (? $arg5 0x18ffffff (? $arg4 0x50801010 0x28ffffff)) 0 0 [uistyle clampxy]
        if (! $arg5) [
            uihover [
                uiinteractive 1
                uicolour 0x24ffffff 0 0 [uistyle clampxy]
            ]
            uirelease $arg2
        ]
        uicolourtext $arg1 (? $arg5 0x777777 0xdddddd) 0.9
    ]
]

// A heading over part of a column
// 1:<text>
ui_modeleditor_heading = [
    uicolour 0x33010101 0 0 [
        uistyle clampx
        uispace 0.008 0.004 [
            uistyle clampx
            uicolourtext $arg1 0xcccccc 1.1
            uiprev [uialign -1]
        ]
    ]
]

// One value with a slider, steps either side of it and a field to type it in
// 1:<label> 2:<field> 3:<kind: 0 distance, 1 angle, 2 scale>
ui_modeleditor_value = [
    local _field _var _step _range _set
    _field = $arg2
    _var   = (concatword "modeleditor_v_" $arg2)
    _step  = (modeleditor_stepfor $arg3)
    _range = (at $MODELEDITOR_RANGES $arg3)
    _set   = (format [modeleditor_set %1 $%2] $_field $_var)
    alias $_var (round (modeleditor_get $_field) 0.0001)

    uihlist 0.006 [
        uifill 0.06 $MODELEDITOR_LIST_H [
            uicolourtext $arg1 0xdddddd 0.9
            uiprev [uialign -1]
        ]
        ui_modeleditor_button "-" [modeleditor_set $_field (-f (getalias $_var) $_step)] 0.03
        uihslider $_var (at $_range 0) (at $_range 1) $_step $_set [
            uicolour 0x30ffffff 0.15 0.01
            uisliderbutton [uicolour 0xccdddddd 0.008 0.026]
        ]
        ui_modeleditor_button "+" [modeleditor_set $_field (+f (getalias $_var) $_step)] 0.03
        uiborderedimageclamped $skintex 0x222222 0 $ui_texborder $ui_screenborder 0.08 0 [
            uifield $_var 8 $_set 0.9 0 [] "0123456789.-"
        ]
    ]
]

// The list on the left, for whatever is being picked
ui_modeleditor_picker = [
    local _w _name _tag
    _w = (-f $MODELEDITOR_SIDE_W 0.03)

    if (=s $modeleditor_picker "tagname") [
        ui_modeleditor_heading (concat "New tag on bone" $modeleditor_bone)
        ui_gameui_textinput modeleditor_tagname 20 [
            p_prompt    = "[Tag name]"
            p_width     = @_w
            p_text_size = 1
            p_immediate = 1
        ]
        uihlist 0.01 [
            ui_modeleditor_button "Add tag" [
                if (modeledittagadd (modeleditor_model) $modeleditor_bone $modeleditor_tagname) [
                    modeleditor_tag    = $modeleditor_tagname
                    modeleditor_picker = ""
                ]
            ] 0.15 0 (=s $modeleditor_tagname "")
            ui_modeleditor_button "Cancel" [modeleditor_picker = ""] 0.12
        ]
    ] [
        ui_modeleditor_heading (cases $modeleditor_picker "host" [result "Choose the host model"] "attach" [result "Choose a model to attach"] "attachtag" [concat "Choose a tag for" $modeleditor_pending] "vanity" [result "Choose a vanity"] "anim" [result "Choose an animation"] "bone" [result "Choose a bone for the new tag"])
        uihlist 0.01 [
            ui_gameui_textinput modeleditor_filter 30 [
                p_prompt    = (? (|| [=s $modeleditor_picker "host"] [=s $modeleditor_picker "attach"]) "[Filter, or a model's path]" "[Filter]")
                p_width     = @(-f $_w 0.13)
                p_text_size = 1
                p_immediate = 1
            ]
            ui_modeleditor_button "Cancel" [modeleditor_picker = ""] 0.12
        ]
        ui_gameui_vscrollarea [
            uivlist 0 [
                uistyle lefttop
                cases $modeleditor_picker "host" [
                    if (!=s $modeleditor_filter "") [
                        ui_modeleditor_row (concat "Load" $modeleditor_filter) [modeleditor_sethost $modeleditor_filter; modeleditor_picker = ""] 0 $_w
                    ]
                    looplist _preset $MODELEDITOR_PRESETS [
                        if (modeleditor_shown (at $_preset 0)) [
                            ui_modeleditor_row (at $_preset 0) [modeleditor_sethost (at $_preset 1); modeleditor_picker = ""] (=s $modeledithost (at $_preset 1)) $_w
                        ]
                    ]
                    looplist _name (sortlist (enummodels) a b [<s $a $b]) [
                        if (modeleditor_shown $_name) [
                            ui_modeleditor_row $_name [modeleditor_sethost $_name; modeleditor_picker = ""] (=s $modeledithost $_name) $_w
                        ]
                    ]
                ] "attach" [
                    if (!=s $modeleditor_filter "") [
                        ui_modeleditor_row (concat "Load" $modeleditor_filter) [modeleditor_pending = $modeleditor_filter; modeleditor_pick attachtag] 0 $_w
                    ]
                    looplist _name (sortlist (enummodels) a b [<s $a $b]) [
                        if (modeleditor_shown $_name) [
                            ui_modeleditor_row $_name [modeleditor_pending = $_name; modeleditor_pick attachtag] 0 $_w
                        ]
                    ]
                ] "attachtag" [
                    if (!=s $modeleditor_filter "") [
                        ui_modeleditor_row (concat "Use" $modeleditor_filter) [modeleditor_attach $modeleditor_pending $modeleditor_filter; modeleditor_picker = ""] 0 $_w
                    ]
                    looplist _tag (modeledittags $modeledithost) [
                        if (modeleditor_shown $_tag) [
                            ui_modeleditor_row $_tag [modeleditor_attach $modeleditor_pending $_tag; modeleditor_picker = ""] 0 $_w
                        ]
                    ]
                ] "vanity" [
                    loop i (getvanity -1) [
                        _name = (getvanity $i 2)
                        if (modeleditor_shown $_name) [
                            ui_modeleditor_row $_name [
                                modeleditor_attach (vanitybodyfname $i (modeleditor_body)) (getvanity $i 3)
                                modeleditor_picker = ""
                            ] 0 $_w
                        ]
                    ]
                ] "anim" [
                    ui_modeleditor_row "(Every frame)" [modeleditanim = ""; modeleditor_time = 0; modeleditor_picker = ""] (=s $modeleditanim "") $_w
                    looplist _name (modeleditanims $modeledithost) [
                        if (modeleditor_shown $_name) [
                            ui_modeleditor_row $_name [modeleditanim = $_name; modeleditor_time = 0; modeleditor_picker = ""] (=s $modeleditanim $_name) $_w
                        ]
                    ]
                ] "bone" [
                    looplist _name (modeleditbones (modeleditor_model)) [
                        if (modeleditor_shown $_name) [
                            ui_modeleditor_row $_name [modeleditor_bone = $_name; modeleditor_tagname = ""; modeleditor_picker = "tagname"] 0 $_w
                        ]
                    ]
                ]
            ]
        ] [
            p_width  = @(-f $_w 0.02) // leaving room for the scrollbar
            p_height = 0.36
        ]
    ]
]

// The host model, its attachments, and the list for picking more
ui_modeleditor_scene = [
    local _w _mdl _tag
    _w = (-f $MODELEDITOR_SIDE_W 0.03)

    uivlist 0.008 [
        uistyle lefttop
        uistyle clampx

        ui_modeleditor_heading "Host model"
        ui_modeleditor_row $modeledithost [modeleditor_sel = -1; modeleditor_tag = ""] (< $modeleditor_sel 0) $_w
        ui_modeleditor_button "Change host" [modeleditor_pick host] 0.2 (=s $modeleditor_picker "host")

        ui_modeleditor_heading "Attachments"
        if (modeleditor_count) [
            loop i (modeleditor_count) [
                _mdl = (at $modeleditattached (* $i 2))
                _tag = (at $modeleditattached (+ (* $i 2) 1))
                uihlist 0.005 [
                    ui_modeleditor_row (concat $_tag ":" $_mdl) [modeleditor_sel = $i; modeleditor_tag = ""] (= $modeleditor_sel $i) (-f $_w 0.035)
                    ui_modeleditor_button "x" [modeleditor_detach $i] 0.03
                ]
            ]
        ] [
            uicolourtext "None yet" 0x888888 0.9
            uiprev [uialign -1]
        ]
        uihlist 0.01 [
            uialign -1
            ui_modeleditor_button "Add attachment" [modeleditor_pick attach] 0.2 (|| [=s $modeleditor_picker "attach"] [=s $modeleditor_picker "attachtag"])
            ui_modeleditor_button "Add vanity" [modeleditor_pick vanity] 0.17 (=s $modeleditor_picker "vanity")
        ]

        if (!=s $modeleditor_picker "") [ui_modeleditor_picker]

        uipropchild [uialign -1]
    ]
]

// The selected model's placement and tags, and saving
ui_modeleditor_values = [
    local _mdl _tags _w
    _mdl  = (modeleditor_model)
    _tags = (modeledittags $_mdl)
    _w    = (-f $MODELEDITOR_SIDE_W 0.03)

    uivlist 0.006 [
        uistyle lefttop
        uistyle clampx

        ui_modeleditor_heading (concat "Placement of" $_mdl)
        uicolourtext (concat (strupper (modeleditformat $_mdl)) (? (modeleditchanged $_mdl) "model, changed" "model")) 0x999999 0.8
        uiprev [uialign -1]

        uihlist 0.006 [
            uialign -1
            uicolourtext "Step" 0xdddddd 0.9
            ui_modeleditor_button "Fine" [modeleditor_step = 0] 0.09 (= $modeleditor_step 0)
            ui_modeleditor_button "Normal" [modeleditor_step = 1] 0.09 (= $modeleditor_step 1)
            ui_modeleditor_button "Coarse" [modeleditor_step = 2] 0.09 (= $modeleditor_step 2)
        ]

        ui_modeleditor_value "Scale %" scale 2
        ui_modeleditor_value "X" x 0
        ui_modeleditor_value "Y" y 0
        ui_modeleditor_value "Z" z 0
        ui_modeleditor_value "Yaw" yaw 1
        ui_modeleditor_value "Pitch" pitch 1
        ui_modeleditor_value "Roll" roll 1

        ui_modeleditor_heading "Tags"
        ui_gameui_vscrollarea [
            uivlist 0 [
                uistyle lefttop
                looplist _tag $_tags [
                    ui_modeleditor_row (concat $_tag (? (modeledittagget $_mdl $_tag editable) (concat "on" (modeledittagget $_mdl $_tag bone)) "(in the mesh, can't be changed)")) [
                        modeleditor_tag = (? (=s $modeleditor_tag $_tag) "" $_tag)
                    ] (=s $modeleditor_tag $_tag) $_w
                ]
                if (=s $_tags "") [
                    uicolourtext "No tags" 0x888888 0.9
                    uiprev [uialign -1]
                ]
            ]
        ] [
            p_width  = @(-f $_w 0.02)
            p_height = 0.12
        ]
        if (&& [!=s $modeleditor_tag ""] [modeledittagget $_mdl $modeleditor_tag editable]) [
            ui_modeleditor_value "X" tagx 0
            ui_modeleditor_value "Y" tagy 0
            ui_modeleditor_value "Z" tagz 0
            ui_modeleditor_value "Rot X" tagrx 1
            ui_modeleditor_value "Rot Y" tagry 1
            ui_modeleditor_value "Rot Z" tagrz 1
        ]
        ui_modeleditor_button "Add tag" [modeleditor_pick bone] 0.15 (|| [=s $modeleditor_picker "bone"] [=s $modeleditor_picker "tagname"]) (=s (modeleditbones $_mdl) "")

        ui_modeleditor_heading "Save"
        uihlist 0.01 [
            uialign -1
            ui_gameui_textinput modeleditfile 30 [
                p_prompt    = "[mdledit.cfg]"
                p_width     = 0.25
                p_text_size = 1
            ]
            ui_modeleditor_button "Save" [modeleditsave $modeleditfile (modeleditor_models)] 0.12
        ]
        uihlist 0.01 [
            uialign -1
            ui_modeleditor_button "Copy this model" [modeleditcopy (modeleditor_model)] 0.2
            ui_modeleditor_button "Revert this model" [modeleditrevert (modeleditor_model); modeleditor_tag = ""] 0.2 0 (! (modeleditchanged $_mdl))
        ]
        uicolourtext "Saves every model on screen to your home folder." 0x888888 0.75
        uiprev [uialign -1]
        uicolourtext "Closing the editor puts the models back." 0x888888 0.75

        uipropchild [uialign -1]
    ]
]

// The model on screen, and the animation and view controls under it
// 1:<width> 2:<height>
ui_modeleditor_view = [
    local _len _anim
    _anim = $modeleditanim
    _len  = (? (=s $_anim "") 0 (modeleditanimlength $modeledithost $_anim))

    uivlist 0.008 [
        uistyle lefttop

        uicolour 0x60000000 $arg1 $arg2 [
            uimodelpreview $modeledithost $_anim 1 1 $arg1 $arg2 [
                uimodelpreviewinteract 1
                uimodelpreviewyaw 180
                uimodelpreviewpitch (? $modeleditor_hud 0 -15)
                if $modeleditor_hud [uimodelpreviewhudview (? (>f $firstpersondepthfov 0) $firstpersondepthfov 70)]
                if $modeleditor_reset [
                    uimodelpreviewresetoffset
                    modeleditor_reset = 0
                ]
                loop i (modeleditor_count) [
                    uimodelpreviewattach (at $modeleditattached (+ (* $i 2) 1)) (at $modeleditattached (* $i 2))
                ]
                if (&& [! $modeleditor_play] [> $_len 0]) [uimodelpreviewanimtime $modeleditor_time]
            ]
            uicolourtext "Drag to turn, right-drag to move, wheel to zoom" 0x88ffffff 0.75
            uiprev [uialign -1 1]
        ]

        uihlist 0.008 [
            uialign -1
            uicolourtext "Animation" 0xdddddd 0.9
            ui_modeleditor_button (? (=s $_anim "") "(Every frame)" $_anim) [modeleditor_pick anim] 0.22 (=s $modeleditor_picker "anim")
            ui_modeleditor_button (? $modeleditor_play "Pause" "Play") [modeleditor_play = (! $modeleditor_play)] 0.09 0 (<= $_len 0)
        ]
        if (&& [! $modeleditor_play] [> $_len 0]) [
            modeleditor_time = (min $modeleditor_time (- $_len 1))
            uihlist 0.008 [
                uialign -1
                uicolourtext "Time" 0xdddddd 0.9
                uihslider modeleditor_time 0 (- $_len 1) 10 [] [
                    uicolour 0x30ffffff 0.3 0.01
                    uisliderbutton [uicolour 0xccdddddd 0.008 0.026]
                ]
                uicolourtext (format "%1 of %2 ms" $modeleditor_time $_len) 0xbbbbbb 0.8
            ]
        ]
        uihlist 0.008 [
            uialign -1
            uicolourtext "View" 0xdddddd 0.9
            ui_modeleditor_button "First person" [modeleditor_hud = (! $modeleditor_hud); modeleditor_reset = 1] 0.16 $modeleditor_hud
            ui_modeleditor_button "Reset view" [modeleditor_reset = 1] 0.14
        ]
    ]
]

ui_gameui_modeleditor_dims  = 100 // as wide as the screen allows
ui_gameui_modeleditor_title = "Model Editor"

