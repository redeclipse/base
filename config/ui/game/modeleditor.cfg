gameui_begin_ids

// The Model editor: a host model with attachments on its tags, each model's placement and tags tuned while they're on screen.
// The host, attachments, animation and save file are kept in modeledithost, modeleditattached (model and tag pairs),
// modeleditanim and modeleditfile; every change is dropped again when the Panel closes.

modeleditor_sel     = -1 // -1 for the host model, otherwise which attachment is being tuned
modeleditor_tag     = "" // the tag of the selected model being tuned
modeleditor_step    = 1  // 0 fine, 1 normal, 2 coarse
modeleditor_play    = 1  // the animation plays, or is held at modeleditor_time
modeleditor_time    = 0
modeleditor_hud     = 0  // seen through the first person camera
modeleditor_reset   = 0  // put the view back next frame
modeleditor_picker  = "" // what the list on the left picks: host, attach, attachtag, retag, vanity, anim, bone, tagname
modeleditor_filter  = ""
modeleditor_pending = "" // the model chosen as an attachment while its tag is picked
modeleditor_bone    = "" // the bone chosen for a new tag
modeleditor_tagname = ""
modeleditor_tab     = 0  // 0 placement, 1 tags
modeleditor_loaded  = "" // the loaded models, sorted when a list of them opens
modeleditor_matches = "" // those the filter shows, worked out again only when it changes
modeleditor_listkey = ""

MODELEDITOR_PRESETS = [
    ["Male body"          "actors/player/male"]
    ["Female body"        "actors/player/female"]
    ["Male hands (HUD)"   "actors/player/male/hwep"]
    ["Female hands (HUD)" "actors/player/female/hwep"]
    ["Janitor"            "actors/janitor"]
]

// Steps for fine, normal and coarse: distances, angles and scale in percent
MODELEDITOR_STEPS  = [[0.01 0.1 1] [1 5 15] [1 5 25]]
// What the sliders span for each of those
MODELEDITOR_RANGES = [[-10 10] [-360 360] [1 1000]]

// The layout: three columns of the same height, every row the same height and gap, every label column the same width
MODELEDITOR_COL_H    = 0.78  // each column
MODELEDITOR_COL_GAP  = 0.02  // between the columns
MODELEDITOR_MARGIN   = 0.02  // either side of them
MODELEDITOR_PAD      = 0.014 // inside a column
MODELEDITOR_ROW_H    = 0.032
MODELEDITOR_GAP      = 0.006
MODELEDITOR_HEAD_H   = 0.036
MODELEDITOR_NOTE_H   = 0.024
MODELEDITOR_LABEL_W  = 0.075
MODELEDITOR_NUDGE_W  = 0.03  // the - and + buttons
MODELEDITOR_FIELD_W  = 0.085
MODELEDITOR_BUTTON_W = 0.1   // a button beside a heading or field
MODELEDITOR_SCROLL_W = 0.015 // kept clear for a list's scrollbar
MODELEDITOR_ATTACH_H = 0.165 // five attachments before the list scrolls
MODELEDITOR_LIST_MAX = 150   // lines of loaded models shown at once, as hundreds can be loaded during a match

// Worked out from the Panel's width each frame
modeleditor_sidew   = 0.44
modeleditor_innerw  = 0.41
modeleditor_centrew = 0.6

// Opens the Model editor, on a host model when given one
// 1:<host model>
modeleditor = [
    if $isonline [
        echo "The Model Editor can't be used while connected to a server"
    ] [
        if (!=s $arg1 "") [modeleditor_sethost $arg1]
        modeleditor_sel    = -1
        modeleditor_tag    = ""
        modeleditor_picker = ""
        modeleditor_reset  = 1
        gameui_open ui_gameui_modeleditor
    ]
]

modeleditor_count = [div (listlen $modeleditattached) 2]

// The model being tuned
modeleditor_model = [
    if (< $modeleditor_sel 0) [result $modeledithost] [result (at $modeleditattached (* $modeleditor_sel 2))]
]

// Every model on screen once, for saving
modeleditor_models = [
    local _list _mdl
    _list = (escape $modeledithost)
    loop i (modeleditor_count) [
        _mdl = (at $modeleditattached (* $i 2))
        if (< (listfind=s $_list $_mdl) 0) [append _list (escape $_mdl)]
    ]
    result $_list
]

// 1:<model> 2:<tag>
modeleditor_attach = [
    modeleditattached = (concat $modeleditattached (escape $arg1) (escape $arg2))
    modeleditor_sel   = (- (modeleditor_count) 1)
    modeleditor_tag   = ""
]

// 1:<attachment>
modeleditor_detach = [
    local _list
    _list = []
    loop i (modeleditor_count) [
        if (!= $i $arg1) [
            _list = (concat $_list (escape (at $modeleditattached (* $i 2))) (escape (at $modeleditattached (+ (* $i 2) 1))))
        ]
    ]
    modeleditattached = $_list
    modeleditor_select -1
]

// 1:<model>
modeleditor_sethost = [
    modeledithost      = $arg1
    modeleditanim      = (? (>= (listfind=s (modeleditanims $arg1) "idle") 0) "idle" "")
    modeleditor_sel    = -1
    modeleditor_tag    = ""
    modeleditor_reset  = 1
]

// The body a vanity is drawn on, from the host model
modeleditor_body = [
    cond [>= (strstr $modeledithost "female") 0] [result "female"] [>= (strstr $modeledithost "janitor") 0] [result "janitor"] [result "male"]
]

// 1:<kind: 0 distance, 1 angle, 2 scale>
modeleditor_stepfor = [at (at $MODELEDITOR_STEPS $arg1) $modeleditor_step]

// A placement value, or a tag's when the field starts with "tag"
// 1:<field>
modeleditor_get = [
    if (=s (substr $arg1 0 3) "tag") [
        modeledittagget (modeleditor_model) $modeleditor_tag (substr $arg1 3)
    ] [
        modeleditget (modeleditor_model) $arg1
    ]
]

// 1:<field> 2:<value>
modeleditor_set = [
    if (=s (substr $arg1 0 3) "tag") [
        modeledittagset (modeleditor_model) $modeleditor_tag (substr $arg1 3) $arg2
    ] [
        modeleditset (modeleditor_model) $arg1 $arg2
    ]
]

// 1:<picker>
modeleditor_pick = [
    modeleditor_picker = (? (=s $modeleditor_picker $arg1) "" $arg1)
    modeleditor_filter = ""
    modeleditor_listkey = ""
    if (|| [=s $modeleditor_picker "host"] [=s $modeleditor_picker "attach"]) [
        modeleditor_loaded = (sortlist (enummodels) a b [<s $a $b])
    ]
]

// The loaded models the filter shows
modeleditor_filtered = [
    local _key
    _key = (concat $modeleditor_picker $modeleditor_filter)
    if (!=s $_key $modeleditor_listkey) [
        modeleditor_listkey = $_key
        modeleditor_matches = (listfilter _name $modeleditor_loaded [modeleditor_shown $_name])
    ]
    result $modeleditor_matches
]

// The loaded models the filter shows, as many as are drawn at once, and a line saying how many more there are
// 1:<action given each model's name in _name> 2:<selected model> 3:<width>
ui_modeleditor_loadedrows = [
    local _all _more _action _sel _w
    _action = $arg1
    _sel    = $arg2
    _w      = $arg3
    _all    = (modeleditor_filtered)
    _more   = (- (listlen $_all) $MODELEDITOR_LIST_MAX)
    looplist _name (sublist $_all 0 $MODELEDITOR_LIST_MAX) [
        ui_modeleditor_row $_name $_action (=s $_sel $_name) $_w
    ]
    if (> $_more 0) [ui_modeleditor_note (format "%1 more; type to narrow the list" $_more) $_w]
]

// Selects the host model (-1) or an attachment to tune, closing a list that belonged to the one selected before
// 1:<attachment>
modeleditor_select = [
    modeleditor_sel = $arg1
    modeleditor_tag = ""
    if (>= (listfind=s "retag bone tagname" $modeleditor_picker) 0) [modeleditor_picker = ""]
]

// Whether an item shows under the filter
// 1:<text>
modeleditor_shown = [
    || [=s $modeleditor_filter ""] [>= (strstr (strlower $arg1) (strlower $modeleditor_filter)) 0]
]

// Text cut from the front to fit a width, as models' paths differ at their ends
// 1:<text> 2:<width> 3:<size>
modeleditor_textw = [divf (*f (textwidth $arg1 0 0 0 0) $arg2 $uitextscale) (fontheight "play/clear")]

modeleditor_fit = [
    local _w _cut _len _text
    _w = (modeleditor_textw $arg1 $arg3)
    if (<=f $_w $arg2) [result $arg1] [
        _len = (strlen $arg1)
        // a guess from how far over it is, then a character at a time
        _cut  = (max 1 (min $_len (toint (*f $_len (-f 1 (divf $arg2 $_w))))))
        _text = (concatword "..." (substr $arg1 $_cut))
        while [&& [< $_cut $_len] [>f (modeleditor_textw $_text $arg3) $arg2]] [
            _cut  = (+ $_cut 1)
            _text = (concatword "..." (substr $arg1 $_cut))
        ]
        result $_text
    ]
]

// A column: a box of the Panel's column height with its rows from the top
// 1:<width> 2:<rows>
ui_modeleditor_column = [
    uiborderedimageclamped $skintex 0x88111111 0 $ui_texborder $ui_screenborder $arg1 $MODELEDITOR_COL_H [
        uispace $MODELEDITOR_PAD $MODELEDITOR_PAD [
            uistyle clampxy
            uivlist $MODELEDITOR_GAP [
                uistyle lefttop
                arg2
                uipropchild [uialign -1]
            ]
        ]
        ui_gameui_shadow
    ]
]

// A heading over part of a column, underlined across it, with a button on its right when given one
// 1:<text> 2:<width> 3:<button label> 4:<button action>
ui_modeleditor_heading = [
    local _textw
    _textw = (-f $arg2 (? (!=s $arg3 "") (+f $MODELEDITOR_BUTTON_W 0.01) 0))
    uifill $arg2 $MODELEDITOR_HEAD_H [
        uicolourtext (modeleditor_fit $arg1 $_textw 1.1) 0xeeeeee 1.1
        uiprev [uialign -1 -2]
        if (!=s $arg3 "") [
            ui_modeleditor_button $arg3 $arg4 $MODELEDITOR_BUTTON_W
            uiprev [uialign 1 -2]
        ]
        uicolour 0x40ffffff $arg2 0.002
        uiprev [uialign -1 1]
    ]
]

// A line of text in a row's height
// 1:<text> 2:<width> 3:<colour> 4:<alignment>
ui_modeleditor_text = [
    uifill $arg2 $MODELEDITOR_ROW_H [
        uicolourtext (modeleditor_fit $arg1 $arg2 0.9) (? (!=s $arg3 "") $arg3 0xbbbbbb) 0.9
        uiprev [uialign (? (!=s $arg4 "") $arg4 -1)]
    ]
]

// A quieter line of text, for hints
// 1:<text> 2:<width>
ui_modeleditor_note = [
    uifill $arg2 $MODELEDITOR_NOTE_H [
        uicolourtext (modeleditor_fit $arg1 $arg2 0.8) 0x888888 0.8
        uiprev [uialign -1]
    ]
]

// One line of a list, chosen by clicking it, with a note on its right
// 1:<label> 2:<action> 3:<selected> 4:<width> 5:<note>
ui_modeleditor_row = [
    local _notew
    _notew = (? (!=s $arg5 "") 0.13 0)
    uitarget $arg4 $MODELEDITOR_ROW_H [
        uihover [
            uiinteractive 1
            uicolour 0x34ffffff 0 0 [uistyle clampxy]
        ] [
            if $arg3 [uicolour 0x50801010 0 0 [uistyle clampxy]]
        ]
        uirelease $arg2
        uispace 0.008 0 [
            uistyle clampxy
            uicolourtext (modeleditor_fit $arg1 (-f $arg4 0.016 $_notew) 0.9) (? $arg3 0xffffff 0xcccccc) 0.9
            uiprev [uialign -1]
            if $_notew [
                uicolourtext (modeleditor_fit $arg5 (-f $_notew 0.01) 0.8) 0x999999 0.8
                uiprev [uialign 1]
            ]
        ]
    ]
]

// A button in a row's height
// 1:<label> 2:<action> 3:<width> 4:<highlight> 5:<disabled>
ui_modeleditor_button = [
    uitarget $arg3 $MODELEDITOR_ROW_H [
        uicolour (? $arg5 0x18ffffff (? $arg4 0x60801010 0x28ffffff)) 0 0 [uistyle clampxy]
        if (! $arg5) [
            uihover [
                uiinteractive 1
                uicolour 0x24ffffff 0 0 [uistyle clampxy]
            ]
            uirelease $arg2
        ]
        uicolourtext (modeleditor_fit $arg1 (-f $arg3 0.01) 0.9) (? $arg5 0x777777 0xdddddd) 0.9
    ]
]

// The width of each of a number of buttons sharing a width
// 1:<width> 2:<buttons>
modeleditor_share = [divf (-f $arg1 (*f $MODELEDITOR_GAP (- $arg2 1))) $arg2]

// A text field in a row's height, as many characters long as fit its width
// 1:<var> 2:<width> 3:<prompt> 4:<on change> 5:<immediate> 6:<keys it takes, all when empty>
ui_modeleditor_field = [
    local _chars _var _prompt
    _var    = $arg1
    _prompt = $arg3
    _chars  = (max 4 (toint (divf (-f $arg2 0.012) (divf (*f (textwidth "0" 0 0 0 0) 0.8 $uitextscale) (fontheight "play/clear")))))
    uiborderedimageclamped $skintex 0x222222 0 $ui_texborder $ui_screenborder $arg2 $MODELEDITOR_ROW_H [
        uiclip (-f $arg2 0.008) $MODELEDITOR_ROW_H 0 0 [
            uifield $_var $_chars $arg4 0.8 (? $arg5 1 0) [
                if (&& [=s $$_var ""] [! (uifocus?)]) [
                    uicolourtext $_prompt 0x666666 0.8
                    uiprev [uialign -1]
                ]
            ] $arg6
        ]
    ]
]

// One value with a slider, steps either side of it and a field to type it in
// 1:<label> 2:<field> 3:<kind: 0 distance, 1 angle, 2 scale>
ui_modeleditor_value = [
    local _field _var _step _range _set _sliderw
    _field   = $arg2
    _var     = (concatword "modeleditor_v_" $arg2)
    _step    = (modeleditor_stepfor $arg3)
    _range   = (at $MODELEDITOR_RANGES $arg3)
    _set     = (format [modeleditor_set %1 $%2] $_field $_var)
    _sliderw = (-f $modeleditor_innerw $MODELEDITOR_LABEL_W (*f $MODELEDITOR_NUDGE_W 2) $MODELEDITOR_FIELD_W (*f $MODELEDITOR_GAP 4))
    alias $_var (round (modeleditor_get $_field) 0.0001)

    uihlist $MODELEDITOR_GAP [
        ui_modeleditor_text $arg1 $MODELEDITOR_LABEL_W 0xdddddd
        ui_modeleditor_button "-" [modeleditor_set $_field (-f (getalias $_var) $_step)] $MODELEDITOR_NUDGE_W
        uihslider $_var (at $_range 0) (at $_range 1) $_step $_set [
            uicolour 0x30ffffff $_sliderw 0.008
            uisliderbutton [uicolour 0xccdddddd 0.008 0.026]
        ]
        ui_modeleditor_button "+" [modeleditor_set $_field (+f (getalias $_var) $_step)] $MODELEDITOR_NUDGE_W
        ui_modeleditor_field $_var $MODELEDITOR_FIELD_W "" $_set 0 "0123456789.-"
    ]
]

// Moves the selected attachment to another of the host's tags
// 1:<tag>
modeleditor_retag = [
    local _list
    _list = []
    loop i (modeleditor_count) [
        _list = (concat $_list (escape (at $modeleditattached (* $i 2))) (escape (? (= $i $modeleditor_sel) $arg1 (at $modeleditattached (+ (* $i 2) 1)))))
    ]
    modeleditattached = $_list
]

// The list for whatever is being picked, at the foot of the left column
// 1:<height>
ui_modeleditor_picker = [
    local _iw _listw _listh _name _tag _seltag
    _iw    = $modeleditor_innerw
    _listw = (-f $_iw $MODELEDITOR_SCROLL_W)
    _listh = (-f $arg1 $MODELEDITOR_HEAD_H $MODELEDITOR_ROW_H (*f $MODELEDITOR_GAP 2))

    if (=s $modeleditor_picker "") [
        ui_modeleditor_heading "Choose" $_iw
        ui_modeleditor_note "The lists for the buttons show here." $_iw
        uifill $_iw $_listh
    ] [
        if (=s $modeleditor_picker "tagname") [
            ui_modeleditor_heading (concat "New tag on" $modeleditor_bone) $_iw "Cancel" [modeleditor_picker = ""]
            uihlist $MODELEDITOR_GAP [
                ui_modeleditor_field modeleditor_tagname (-f $_iw $MODELEDITOR_BUTTON_W $MODELEDITOR_GAP) "Tag name" [] 1
                ui_modeleditor_button "Add tag" [
                    if (modeledittagadd (modeleditor_model) $modeleditor_bone $modeleditor_tagname) [
                        modeleditor_tag    = $modeleditor_tagname
                        modeleditor_tab    = 1
                        modeleditor_picker = ""
                    ]
                ] $MODELEDITOR_BUTTON_W 0 (=s $modeleditor_tagname "")
            ]
            uifill $_iw $_listh
        ] [
            ui_modeleditor_heading (cases $modeleditor_picker "host" [result "Choose the host model"] "attach" [result "Choose a model to attach"] "attachtag" [concat "Choose a tag for" $modeleditor_pending] "retag" [result "Move it to another tag"] "vanity" [result "Choose a vanity"] "anim" [result "Choose an animation"] "bone" [result "Choose a bone for the new tag"]) $_iw "Cancel" [modeleditor_picker = ""]
            ui_modeleditor_field modeleditor_filter $_iw (? (|| [=s $modeleditor_picker "host"] [=s $modeleditor_picker "attach"]) "Filter, or a model's path" "Filter") [] 1
            ui_gameui_vscrollarea [
                uivlist 0 [
                    uistyle lefttop
                    cases $modeleditor_picker "host" [
                        if (!=s $modeleditor_filter "") [
                            ui_modeleditor_row (concat "Load" $modeleditor_filter) [modeleditor_sethost $modeleditor_filter; modeleditor_picker = ""] 0 $_listw
                        ]
                        looplist _preset $MODELEDITOR_PRESETS [
                            if (modeleditor_shown (at $_preset 0)) [
                                ui_modeleditor_row (at $_preset 0) [modeleditor_sethost (at $_preset 1); modeleditor_picker = ""] (=s $modeledithost (at $_preset 1)) $_listw
                            ]
                        ]
                        ui_modeleditor_loadedrows [modeleditor_sethost $_name; modeleditor_picker = ""] $modeledithost $_listw
                    ] "attach" [
                        if (!=s $modeleditor_filter "") [
                            ui_modeleditor_row (concat "Load" $modeleditor_filter) [modeleditor_pending = $modeleditor_filter; modeleditor_pick attachtag] 0 $_listw
                        ]
                        ui_modeleditor_loadedrows [modeleditor_pending = $_name; modeleditor_pick attachtag] "" $_listw
                    ] "attachtag" [
                        if (!=s $modeleditor_filter "") [
                            ui_modeleditor_row (concat "Use" $modeleditor_filter) [modeleditor_attach $modeleditor_pending $modeleditor_filter; modeleditor_picker = ""] 0 $_listw
                        ]
                        looplist _tag (modeledittags $modeledithost) [
                            if (modeleditor_shown $_tag) [
                                ui_modeleditor_row $_tag [modeleditor_attach $modeleditor_pending $_tag; modeleditor_picker = ""] 0 $_listw
                            ]
                        ]
                    ] "retag" [
                        _seltag = (at $modeleditattached (+ (* $modeleditor_sel 2) 1))
                        if (!=s $modeleditor_filter "") [
                            ui_modeleditor_row (concat "Use" $modeleditor_filter) [modeleditor_retag $modeleditor_filter; modeleditor_picker = ""] 0 $_listw
                        ]
                        looplist _tag (modeledittags $modeledithost) [
                            if (modeleditor_shown $_tag) [
                                ui_modeleditor_row $_tag [modeleditor_retag $_tag; modeleditor_picker = ""] (=s $_tag $_seltag) $_listw
                            ]
                        ]
                    ] "vanity" [
                        loop i (getvanity -1) [
                            _name = (getvanity $i 2)
                            if (modeleditor_shown $_name) [
                                ui_modeleditor_row $_name [
                                    modeleditor_attach (vanitybodyfname $i (modeleditor_body)) (getvanity $i 3)
                                    modeleditor_picker = ""
                                ] 0 $_listw (getvanity $i 3)
                            ]
                        ]
                    ] "anim" [
                        ui_modeleditor_row "(Every frame)" [modeleditanim = ""; modeleditor_time = 0; modeleditor_picker = ""] (=s $modeleditanim "") $_listw
                        looplist _name (modeleditanims $modeledithost) [
                            if (modeleditor_shown $_name) [
                                ui_modeleditor_row $_name [modeleditanim = $_name; modeleditor_time = 0; modeleditor_picker = ""] (=s $modeleditanim $_name) $_listw
                            ]
                        ]
                    ] "bone" [
                        looplist _name (modeleditbones (modeleditor_model)) [
                            if (modeleditor_shown $_name) [
                                ui_modeleditor_row $_name [modeleditor_bone = $_name; modeleditor_tagname = ""; modeleditor_picker = "tagname"] 0 $_listw
                            ]
                        ]
                    ]
                ]
            ] [
                p_width  = @_listw
                p_height = @_listh
            ]
        ]
    ]
]

// The left column: the host model, its attachments, and the list for picking more
ui_modeleditor_scene = [
    local _iw _half _listw _pickh _mdl _tag
    _iw    = $modeleditor_innerw
    _half  = (modeleditor_share $_iw 2)
    _listw = (-f $_iw $MODELEDITOR_SCROLL_W)
    // what's left of the column under the host and attachments
    _pickh = (-f $MODELEDITOR_COL_H (*f $MODELEDITOR_PAD 2) (*f $MODELEDITOR_HEAD_H 2) (*f $MODELEDITOR_ROW_H 3) $MODELEDITOR_ATTACH_H (*f $MODELEDITOR_GAP 6))

    ui_modeleditor_column $modeleditor_sidew [
        ui_modeleditor_heading "Host model" $_iw
        ui_modeleditor_row $modeledithost [modeleditor_select -1] (< $modeleditor_sel 0) $_iw (strupper (modeleditformat $modeledithost))
        ui_modeleditor_button "Change host" [modeleditor_pick host] $_iw (=s $modeleditor_picker "host")

        ui_modeleditor_heading "Attachments" $_iw
        ui_gameui_vscrollarea [
            uivlist 0 [
                uistyle lefttop
                loop i (modeleditor_count) [
                    _mdl = (at $modeleditattached (* $i 2))
                    _tag = (at $modeleditattached (+ (* $i 2) 1))
                    uihlist $MODELEDITOR_GAP [
                        ui_modeleditor_row $_mdl [modeleditor_select $i] (= $modeleditor_sel $i) (-f $_listw $MODELEDITOR_NUDGE_W $MODELEDITOR_GAP) $_tag
                        ui_modeleditor_button "x" [modeleditor_detach $i] $MODELEDITOR_NUDGE_W
                    ]
                ]
                if (! (modeleditor_count)) [ui_modeleditor_text "None yet" $_listw 0x888888]
            ]
        ] [
            p_width  = @_listw
            p_height = @MODELEDITOR_ATTACH_H
        ]
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_button "Add attachment" [modeleditor_pick attach] $_half (|| [=s $modeleditor_picker "attach"] [=s $modeleditor_picker "attachtag"])
            ui_modeleditor_button "Add vanity" [modeleditor_pick vanity] $_half (=s $modeleditor_picker "vanity")
        ]

        ui_modeleditor_picker $_pickh
    ]
]

// The middle column: the model on screen, and the animation and view under it
ui_modeleditor_view = [
    local _iw _ph _len _anim _half
    _iw   = (-f $modeleditor_centrew (*f $MODELEDITOR_PAD 2))
    _ph   = (-f $MODELEDITOR_COL_H (*f $MODELEDITOR_PAD 2) $MODELEDITOR_HEAD_H (*f (+f $MODELEDITOR_ROW_H $MODELEDITOR_GAP) 3) $MODELEDITOR_GAP)
    _half = (modeleditor_share (-f $_iw $MODELEDITOR_LABEL_W $MODELEDITOR_GAP) 2)
    _anim = $modeleditanim
    _len  = (? (=s $_anim "") 0 (modeleditanimlength $modeledithost $_anim))
    if (>= $modeleditor_time $_len) [modeleditor_time = (max (- $_len 1) 0)]

    ui_modeleditor_column $modeleditor_centrew [
        ui_modeleditor_heading "Preview" $_iw
        uicolour 0x60000000 $_iw $_ph [
            uimodelpreview $modeledithost $_anim 1 1 $_iw $_ph [
                uimodelpreviewinteract 1
                uimodelpreviewyaw 180
                uimodelpreviewpitch (? $modeleditor_hud 0 -15)
                if $modeleditor_hud [uimodelpreviewhudview (? (>f $firstpersondepthfov 0) $firstpersondepthfov 70)]
                if $modeleditor_reset [
                    uimodelpreviewresetoffset
                    modeleditor_reset = 0
                ]
                loop i (modeleditor_count) [
                    uimodelpreviewattach (at $modeleditattached (+ (* $i 2) 1)) (at $modeleditattached (* $i 2))
                ]
                if (&& [! $modeleditor_play] [> $_len 0]) [uimodelpreviewanimtime $modeleditor_time]
            ]
            uispace 0.008 0.006 [
                uistyle clampxy
                uicolourtext (? $modeleditor_hud "Right-drag to move" "Drag to turn, right-drag to move, wheel to zoom") 0x88ffffff 0.75
                uiprev [uialign -1 1]
            ]
        ]

        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_text "Animation" $MODELEDITOR_LABEL_W 0xdddddd
            ui_modeleditor_button (? (=s $_anim "") "(Every frame)" $_anim) [modeleditor_pick anim] $_half (=s $modeleditor_picker "anim")
            ui_modeleditor_button (? $modeleditor_play "Pause" "Play") [modeleditor_play = (! $modeleditor_play)] $_half 0 (<= $_len 0)
        ]
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_text "Time" $MODELEDITOR_LABEL_W 0xdddddd
            if (&& [! $modeleditor_play] [> $_len 0]) [
                uihslider modeleditor_time 0 (- $_len 1) 10 [] [
                    uicolour 0x30ffffff $_half 0.008
                    uisliderbutton [uicolour 0xccdddddd 0.008 0.026]
                ]
                ui_modeleditor_text (format "%1 of %2 ms" $modeleditor_time $_len) $_half 0xbbbbbb
            ] [
                ui_modeleditor_note (? (> $_len 0) "Pause to hold the animation at a moment" "This animation doesn't move") (-f $_iw $MODELEDITOR_LABEL_W $MODELEDITOR_GAP)
            ]
        ]
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_text "Camera" $MODELEDITOR_LABEL_W 0xdddddd
            ui_modeleditor_button "First person" [modeleditor_hud = (! $modeleditor_hud); modeleditor_reset = 1] $_half $modeleditor_hud
            ui_modeleditor_button "Reset view" [modeleditor_reset = 1] $_half
        ]
    ]
]

// The right column: the selected model's placement or tags, and saving
ui_modeleditor_values = [
    local _iw _mdl _tags _tag _seltag _stepw _tabh _listw _info _ctw
    _iw    = $modeleditor_innerw
    _mdl   = (modeleditor_model)
    _tags  = (modeledittags $_mdl)
    _listw = (-f $_iw $MODELEDITOR_SCROLL_W)
    _stepw = (modeleditor_share (-f $_iw $MODELEDITOR_LABEL_W $MODELEDITOR_GAP) 3)
    _ctw   = 0.13
    // what's left of the column for the placement or tags
    _tabh  = (-f $MODELEDITOR_COL_H (*f $MODELEDITOR_PAD 2) (*f $MODELEDITOR_HEAD_H 2) (*f $MODELEDITOR_ROW_H 5) (*f $MODELEDITOR_NOTE_H 2) (*f $MODELEDITOR_GAP 9))
    _info  = (concat (strupper (modeleditformat $_mdl)) "model")
    if (>= $modeleditor_sel 0) [
        _seltag = (at $modeleditattached (+ (* $modeleditor_sel 2) 1))
        _info   = (concat $_info "on" $_seltag)
    ]
    if (modeleditchanged $_mdl) [_info = (concatword $_info ", changed")]
    if (&& [!=s $modeleditor_tag ""] [< (listfind=s $_tags $modeleditor_tag) 0]) [modeleditor_tag = ""]

    ui_modeleditor_column $modeleditor_sidew [
        ui_modeleditor_heading $_mdl $_iw
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_text $_info (-f $_iw $_ctw $MODELEDITOR_GAP) 0x999999
            ui_modeleditor_button "Change tag" [modeleditor_pick retag] $_ctw (=s $modeleditor_picker "retag") (< $modeleditor_sel 0)
        ]
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_button "Placement" [modeleditor_tab = 0] (modeleditor_share $_iw 2) (= $modeleditor_tab 0)
            ui_modeleditor_button (format "Tags (%1)" (listlen $_tags)) [modeleditor_tab = 1] (modeleditor_share $_iw 2) (= $modeleditor_tab 1)
        ]
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_text "Step" $MODELEDITOR_LABEL_W 0xdddddd
            ui_modeleditor_button "Fine" [modeleditor_step = 0] $_stepw (= $modeleditor_step 0)
            ui_modeleditor_button "Normal" [modeleditor_step = 1] $_stepw (= $modeleditor_step 1)
            ui_modeleditor_button "Coarse" [modeleditor_step = 2] $_stepw (= $modeleditor_step 2)
        ]

        uifill $_iw $_tabh [
            uivlist $MODELEDITOR_GAP [
                uistyle lefttop
                if (= $modeleditor_tab 0) [
                    ui_modeleditor_value "Scale %" scale 2
                    ui_modeleditor_value "X" x 0
                    ui_modeleditor_value "Y" y 0
                    ui_modeleditor_value "Z" z 0
                    ui_modeleditor_value "Yaw" yaw 1
                    ui_modeleditor_value "Pitch" pitch 1
                    ui_modeleditor_value "Roll" roll 1
                ] [
                    ui_gameui_vscrollarea [
                        uivlist 0 [
                            uistyle lefttop
                            looplist _tag $_tags [
                                ui_modeleditor_row $_tag [
                                    modeleditor_tag = (? (=s $modeleditor_tag $_tag) "" $_tag)
                                ] (=s $modeleditor_tag $_tag) $_listw (? (modeledittagget $_mdl $_tag editable) (modeledittagget $_mdl $_tag bone) "can't be changed")
                            ]
                            if (=s $_tags "") [ui_modeleditor_text "No tags" $_listw 0x888888]
                        ]
                    ] [
                        p_width  = @_listw
                        p_height = 0.13
                    ]
                    ui_modeleditor_button "Add tag" [modeleditor_pick bone] $_iw (|| [=s $modeleditor_picker "bone"] [=s $modeleditor_picker "tagname"]) (=s (modeleditbones $_mdl) "")
                    if (&& [!=s $modeleditor_tag ""] [modeledittagget $_mdl $modeleditor_tag editable]) [
                        ui_modeleditor_value "X" tagx 0
                        ui_modeleditor_value "Y" tagy 0
                        ui_modeleditor_value "Z" tagz 0
                        ui_modeleditor_value "Rot X" tagrx 1
                        ui_modeleditor_value "Rot Y" tagry 1
                        ui_modeleditor_value "Rot Z" tagrz 1
                    ] [
                        ui_modeleditor_note (? (=s $_tags "") "" "Pick a tag to move and turn it") $_iw
                    ]
                ]
                uipropchild [uialign -1]
            ]
        ]

        ui_modeleditor_heading "Save" $_iw
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_field modeleditfile (-f $_iw $MODELEDITOR_BUTTON_W $MODELEDITOR_GAP) "mdledit.cfg" []
            ui_modeleditor_button "Save" [modeleditsave $modeleditfile (modeleditor_models)] $MODELEDITOR_BUTTON_W
        ]
        uihlist $MODELEDITOR_GAP [
            ui_modeleditor_button "Copy this model" [modeleditcopy (modeleditor_model)] (modeleditor_share $_iw 2)
            ui_modeleditor_button "Revert this model" [modeleditrevert (modeleditor_model); modeleditor_tag = ""] (modeleditor_share $_iw 2) 0 (! (modeleditchanged $_mdl))
        ]
        ui_modeleditor_note "Save writes every model on screen." $_iw
        ui_modeleditor_note "Closing the editor puts them all back." $_iw
    ]
]

// Leaving with changes that aren't saved asks first, over the editor, which keeps its changes while it's still drawn
ui_gameui_modeleditor_can_close = [
    if (modeleditunsaved) [
        local _x
        _x = (-f (uiwidth 0.5) 0.31)
        gameui_overlay_open ui_gameui_modeleditor_leave [@_x 0.38]
        result 0
    ] [
        result 1
    ]
]

// Leaves the editor without asking again
modeleditor_leave = [
    gameui_overlay_close
    gameui_close
]

