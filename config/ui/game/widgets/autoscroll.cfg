// Speed content too wide for its space scrolls at, in UI units a second, and the millis it rests at either end
GAMEUI_AUTOSCROLL_SPEED = 0.1
GAMEUI_AUTOSCROLL_HOLD  = 1500

// How far content too wide for its space has scrolled across it: resting at the start, scrolling to the end at a steady speed,
// resting there and scrolling back
// 1:<how much wider the content is> 2:<millis it started at>
gameui_autoscroll_offset = [
    local _travel _t
    if (<=f $arg1 0) [result 0] [
        _travel = (divf (*f $arg1 1000) $GAMEUI_AUTOSCROLL_SPEED)
        _t      = (modf (-f $totalmillis $arg2) (*f (+f $_travel $GAMEUI_AUTOSCROLL_HOLD) 2))
        _t      = (? (<f $_t (+f $_travel $GAMEUI_AUTOSCROLL_HOLD)) (-f $_t $GAMEUI_AUTOSCROLL_HOLD) (-f (*f $_travel 2) (-f $_t $GAMEUI_AUTOSCROLL_HOLD $GAMEUI_AUTOSCROLL_HOLD)))
        *f $arg1 (clampf (divf $_t $_travel) 0 1)
    ]
]

gameui_autoscrollh_props = [
    [ p_width 0.5 ]
    [ p_start 0   ]
]

// 1:<content> 2:<props, p_start the millis the content appeared at, to scroll from the start>
ui_gameui_autoscrollh = [
    @(props $gameui_autoscrollh_props arg2)

    uiclip $p_width 0 0 0 [
        arg1
        uiclipoffsetx (gameui_autoscroll_offset (-f $uiclipvirtw $p_width) $p_start)
    ]
]

gameui_autoscrollv_props = [
    [ p_height 0.5 ]
]

// 1:<content> 2:<props>
ui_gameui_autoscrollv = [
    @(props $gameui_autoscrollv_props arg2)

    uiclip 0 $p_height 0 0 [
        arg1
        uiclipoffsety (*f $gameui_autoscroll (-f $uiclipvirth $p_height))
    ]
]
