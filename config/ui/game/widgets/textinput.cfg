// 1:<var>
ui_gameui_textinput_prompt = [
    if (&& [=s $$arg1 ""] [! (uifocus?)]) [
        uicolourtext $p_prompt 0x555555 1
    ]
]

gameui_textinput_props = [
    [ p_text_size 1.5                  ]
    [ p_prompt    ["[Enter text here"] ]
    [ p_width     0                    ]
    [ p_lines     0                    ]
    [ p_limit     0                    ]
    [ p_immediate 0                    ]
    [ p_on_change []                   ]
    [ p_focus     0                    ]
    [ p_masked    0                    ]
]

// The field fills its box, which is p_width wide when given and otherwise as wide as <length> characters
// 1:<var> 2:<length> 3:<props>
ui_gameui_textinput = [
    @(props $gameui_textinput_props arg3)

    uiborderedimageclamped $skintex 0x222222 0 $ui_texborder $ui_screenborder $p_width 0 [
        uipropagate [uicolourblend 0.66]
        uihover [ uiinteractive 1 ]
        local _var _width _height
        _var = $arg1
        _width = (? (>f $p_width 0) $p_width (uitextfieldwidth $arg2 $p_text_size))
        if $p_lines [
            _height = (uitextfieldheight $p_lines $p_text_size)
            uitextscroll $_width $_height [
                uitextarea $_var $_textw $_height $p_limit [
                    p_on_change
                ] $p_text_size $p_immediate [
                    uistyle clampx
                    ui_gameui_textinput_prompt $_var
                    if $p_focus uitextfieldsetfocus
                ] "" 8 // one line wrapped across the rows
            ]
        ] [
            uiscroll $_width 0 [
                uistyle clampx
                uitextfield $arg1 $_width [
                    p_on_change
                ] $p_text_size $p_immediate [
                    uistyle clampx
                    ui_gameui_textinput_prompt $arg1
                    if $p_focus uitextfieldsetfocus
                ] "" $p_limit (? $p_masked 1 0) // masked shows the text as stars
            ]
        ]

        ui_gameui_shadow
    ]
]
