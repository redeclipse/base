gameui_colourslider_props = [
    [ p_width        0.24                  ]
    [ p_height       0.022                 ]
    [ p_handle_width 0.008                 ]
    [ p_colours      [[0x000000 0xffffff]] ]
    [ p_min          0                     ]
    [ p_max          1                     ]
    [ p_float        0                     ]
    [ p_on_change    []                    ]
    [ p_on_finish    []                    ]
    [ p_tip          ""                    ]
    [ p_id           []                    ]
]

// A slider drawn over a colour gradient, for picking hue, saturation and the like
// Pressing anywhere on the gradient jumps to that value and keeps dragging from there.
// 1:<var> 2:<props>
# ui_gameui_colourslider = [
    @(props $gameui_colourslider_props arg2)

    local _drag _active _factor _new_val
    _drag   = (=s $gameui_slider_drag_id $p_id)
    _active = $_drag

    uitarget $p_width $p_height [
        local _track_x
        // where the gradient starts, as of the last frame
        _track_x = $uilastsx

        uihover [
            if (gameui_can_interact) [
                gameui_hover 1
                _active = 1
            ]
        ]

        uipress [
            if (gameui_can_interact) [
                gameui_slider_drag_id = $p_id
                _drag                 = 1
                soundbyname S_UI_ACTION
            ]
        ]

        uihold [] [
            if $_drag [
                _drag                 = 0
                gameui_slider_drag_id = -1
                p_on_finish
            ]
        ]

        if $_drag [
            _factor  = (clampf (divf (-f $uicursorx $_track_x) $p_width) 0 1)
            _new_val = (+f $p_min (*f (-f $p_max $p_min) $_factor))
            if (! $p_float) [
                _new_val = (toint (round $_new_val))
            ]

            if (!=f $$arg1 $_new_val) [
                set $arg1 $_new_val
                p_on_change
            ]
        ]

        _factor = (clampf (divf (-f $$arg1 $p_min) (-f $p_max $p_min)) 0 1)

        uiborderedimageclamped $skintex (at $p_colours 0) 0 $ui_texborder $ui_screenborder 0 0 [
            uistyle clampxy
            looplist _colour (sublist $p_colours 1) [
                uicolouradd $_colour
            ]
            uicolourdir 1
        ]

        uiborderedimageclamped $skinbordertex (? $_active 0xcccccc 0x666666) 0 $ui_texborder $ui_screenborder 0 0 [
            uistyle clampxy
        ]

        uioffset (*f $_factor (-f $p_width $p_handle_width)) 0 [
            uialign -1

            uiborderedimageclamped $skintex (? $_active 0xffffff 0xcccccc) 0 $ui_texborder $ui_screenborder $p_handle_width (+f $p_height 0.008) [
                uiborderedimageclamped $skinbordertex 0x222222 0 $ui_texborder $ui_screenborder 0 0 [
                    uistyle clampxy
                ]
            ]
        ]

        ui_gameui_shadow
    ]
]
gameui_widget_register colourslider 1
