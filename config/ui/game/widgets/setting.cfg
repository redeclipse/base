// Width of the column every setting row's control is right aligned in, the same on every row, Section and page
GAMEUI_SETTING_CONTROL_W = 0.3

// Height of a setting row
GAMEUI_SETTING_ROW_H     = 0.036

// Height of a settings page's scrolling Sections, below its title and above the tip
GAMEUI_SETTING_PAGE_H    = 0.74

// Colour of a setting row's label
GAMEUI_SETTING_LABEL     = 0xdddddd

// Every setting row, known without its page being open: each is its page, label, tip, control type, variable and control props
gameui_setting_rows = []

// The page setting rows are being registered for, see gameui_setting_begin
gameui_setting_page = ""

// Begins registering a page's setting rows, called in its '#' definition in place of gameui_begin_ids
// 1:<page>
gameui_setting_begin = [
    gameui_setting_page = $arg1
    gameui_begin_ids
]

// A setting row's control, as code
// 1:<tip> 2:<control type, see ui_gameui_<type>> 3:<var> 4:<control props>
gameui_setting_control = [
    format [ui_gameui_%1 %2 [
        %3
        %4
        p_tip = %5
        p_id  = %6
    ]] $arg2 $arg3 (? (=s $arg2 toggle) "" [p_width = $GAMEUI_SETTING_CONTROL_W]) $arg4 (escape $arg1) (gameui_get_id $arg2)
]

// Registers a setting row for the page being registered, see gameui_setting_rows
// 1:<label> 2:<tip> 3:<control type> 4:<var> 5:<control props>
gameui_setting_register = [
    append gameui_setting_rows (format "[%1]" (concat (escape $gameui_setting_page) (escape $arg1) (escape $arg2) $arg3 $arg4 (escape $arg5)))
]

// A setting row, registered and returned as the code drawing it, called in a page's '#' definition
// 1:<label> 2:<tip> 3:<control type> 4:<var> 5:<control props>
gameui_setting = [
    gameui_setting_register $arg1 $arg2 $arg3 $arg4 $arg5
    format [ui_gameui_settingrow %1 [%2]] (escape $arg1) (gameui_setting_control $arg2 $arg3 $arg4 $arg5)
]

// A short run of related on/off settings sharing one row, each registered, returned as the code drawing them
// 1:<list of [label tip var props]>
gameui_settingtoggles = [
    local _code
    _code = []
    looplist _toggle $arg1 [
        gameui_setting_register (at $_toggle 0) (at $_toggle 1) toggle (at $_toggle 2) (at $_toggle 3)
        _code = (concat $_code (format [
            ui_gameui_settingpair %1 [%2]
        ] (escape (at $_toggle 0)) (gameui_setting_control (at $_toggle 1) toggle (at $_toggle 2) (at $_toggle 3))))
    ]
    format [ui_gameui_settingline [%1]] $_code
]

// A Section of setting rows, drawn as ui_gameui_group draws one
// 1:<label> 2:<rows>
ui_gameui_section = [
    uiborderedimageclamped $skintex 0x88111111 0 $ui_texborder $ui_screenborder 0 0 [
        uistyle clampx

        uispace 0.02 0.02 [
            uistyle clampx

            uivlist 0 [
                uistyle clampx

                uitext $arg1 1.5
                uiprev [uialign -1 -1]

                uifill 0 0.01

                arg2
            ]
        ]

        ui_gameui_shadow
    ]
]

// One setting's label and the control changing it, right aligned in a column of the same width on every row
// 1:<label> 2:<control>
ui_gameui_settingrow = [
    uifill 0 $GAMEUI_SETTING_ROW_H [
        uistyle clampx

        uicolourtext $arg1 $GAMEUI_SETTING_LABEL
        uiprev [uialign -1]

        uihlist 0 [
            arg2
        ]
        uiprev [uialign 1]
    ]
]

// Setting rows sharing one row, see gameui_settingtoggles
// 1:<pairs>
ui_gameui_settingline = [
    uifill 0 $GAMEUI_SETTING_ROW_H [
        uistyle clampx

        uihlist 0.04 [
            arg1
        ]
        uiprev [uialign -1]
    ]
]

// A label and its control, in a row with others, see ui_gameui_settingline
// 1:<label> 2:<control>
ui_gameui_settingpair = [
    uihlist 0.012 [
        uicolourtext $arg1 $GAMEUI_SETTING_LABEL
        arg2
    ]
]
