// Width of the column every setting row's control is right aligned in, the same on every row, Section and page
GAMEUI_SETTING_CONTROL_W = 0.3

// Height of a setting row
GAMEUI_SETTING_ROW_H     = 0.036

// Height of a settings page's scrolling Sections, below its title and above the tip
GAMEUI_SETTING_PAGE_H    = 0.74

// Width of the toggles sharing a row, and the space between each and the next label, see gameui_settingtoggles
GAMEUI_SETTING_PAIR_W    = 0.06
GAMEUI_SETTING_PAIR_GAP  = 0.025

// Width a label takes before the toggles sharing its row, so rows of the same toggles line up
GAMEUI_SETTING_LINE_LABEL_W = 0.16

// Colour of a setting row's label
GAMEUI_SETTING_LABEL     = 0xdddddd

// Every setting row, known without its page being open: each is its page, Section, label, tip, control type, variable and control
// props, which hold the tip as p_tip
gameui_setting_rows = []

// The page and Section setting rows are being registered for, see gameui_setting_begin and gameui_section
gameui_setting_page    = ""
gameui_setting_section = ""

// Begins registering a page's setting rows, called in its '#' definition in place of gameui_begin_ids
// 1:<page>
gameui_setting_begin = [
    gameui_setting_page    = $arg1
    gameui_setting_section = ""
    gameui_begin_ids
]

// Begins a Section of setting rows, returned as the code drawing it to be followed by its rows, called in a page's '#' definition
// 1:<label>
gameui_section = [
    gameui_setting_section = $arg1
    format [ui_gameui_section %1] (escape $arg1)
]

// A setting row's control, as code
// 1:<control type, see ui_gameui_<type>> 2:<var> 3:<control props>
gameui_setting_control = [
    format [ui_gameui_%1 %2 [
        %3
        %4
        p_id = %5
    ]] $arg1 $arg2 (? (=s $arg1 toggle) "" [p_width = $GAMEUI_SETTING_CONTROL_W]) $arg3 (gameui_get_id $arg1)
]

// The tip set in a control's props
// 1:<control props>
gameui_setting_tip = [
    local _i
    _i = (listfind i $arg1 [=s $i p_tip])
    ? (>= $_i 0) (at $arg1 (+ $_i 2)) ""
]

// Registers a setting row for the page being registered, see gameui_setting_rows
// 1:<label> 2:<control type> 3:<var> 4:<control props>
gameui_setting_register = [
    local _row
    _row = (concat (escape $gameui_setting_page) (escape $gameui_setting_section) (escape $arg1) (escape (gameui_setting_tip $arg4)))
    append gameui_setting_rows (format "[%1]" (concat $_row $arg2 $arg3 (escape $arg4)))
]

// A setting row, registered and returned as the code drawing it, called in a page's '#' definition
// 1:<label> 2:<control type> 3:<var> 4:<control props, with its p_tip>
gameui_setting = [
    gameui_setting_register $arg1 $arg2 $arg3 $arg4
    format [ui_gameui_settingrow %1 [%2]] (escape $arg1) (gameui_setting_control $arg2 $arg3 $arg4)
]

// A short run of related on/off settings sharing one row, each registered, returned as the code drawing them; with a label, it's
// on the left and the toggles start a fixed way after it, lining up with rows of the same toggles, each registered as
// "<label>: <toggle's label>"
// 1:<list of [label var props]> 2:<label>
gameui_settingtoggles = [
    local _code _label
    _code = []
    looplist _toggle $arg1 [
        _label = (? (=s $arg2 "") (at $_toggle 0) (format "%1: %2" $arg2 (at $_toggle 0)))
        gameui_setting_register $_label toggle (at $_toggle 1) (at $_toggle 2)
        _code = (concat $_code (format [
            ui_gameui_settingpair %1 [%2]
        ] (escape (at $_toggle 0)) (gameui_setting_control toggle (at $_toggle 1) (concat (at $_toggle 2) [
            p_width = $GAMEUI_SETTING_PAIR_W
        ]))))
    ]
    format [ui_gameui_settingline %1 [%2]] (escape $arg2) $_code
]

// A Section of setting rows, drawn as ui_gameui_group draws one
// 1:<label> 2:<rows>
ui_gameui_section = [
    uiborderedimageclamped $skintex 0x88111111 0 $ui_texborder $ui_screenborder 0 0 [
        uistyle clampx

        uispace 0.02 0.02 [
            uistyle clampx

            uivlist 0 [
                uistyle clampx

                uitext $arg1 1.5
                uiprev [uialign -1 -1]

                uifill 0 0.01

                arg2
            ]
        ]

        ui_gameui_shadow
    ]
]

// One setting's label and the control changing it, right aligned in a column of the same width on every row
// 1:<label> 2:<control>
ui_gameui_settingrow = [
    uifill 0 $GAMEUI_SETTING_ROW_H [
        uistyle clampx

        uicolourtext $arg1 $GAMEUI_SETTING_LABEL
        uiprev [uialign -1]

        uihlist 0 [
            arg2
        ]
        uiprev [uialign 1]
    ]
]

// Setting rows sharing one row, see gameui_settingtoggles
// 1:<label> 2:<pairs>
ui_gameui_settingline = [
    uifill 0 $GAMEUI_SETTING_ROW_H [
        uistyle clampx

        if (=s $arg1 "") [
            uihlist $GAMEUI_SETTING_PAIR_GAP [
                arg2
            ]
            uiprev [uialign -1]
        ] [
            uihlist 0 [
                uifill $GAMEUI_SETTING_LINE_LABEL_W 0 [
                    uicolourtext $arg1 $GAMEUI_SETTING_LABEL
                    uiprev [uialign -1]
                ]

                uihlist $GAMEUI_SETTING_PAIR_GAP [
                    arg2
                ]
            ]
            uiprev [uialign -1]
        ]
    ]
]

// A label and its control, in a row with others, see ui_gameui_settingline
// 1:<label> 2:<control>
ui_gameui_settingpair = [
    uihlist 0.012 [
        uicolourtext $arg1 $GAMEUI_SETTING_LABEL
        arg2
    ]
]
