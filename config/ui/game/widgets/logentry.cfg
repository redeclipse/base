// Shared log entry, used by the chat history and the damage log

gameui_logentry_props = [
    [ p_tag    ""         ]
    [ p_side   left       ]
    [ p_colour 0x80000000 ]
    [ p_growth 1          ]
    [ p_blend  1          ]
    [ p_cull   0          ]
]

// Grows in over <in time>, holds until <out time>, then shrinks over <fade time>
// An <out time> of 0 never expires
// 1:<age> 2:<in time> 3:<out time> 4:<fade time>
gameui_logentry_growth = [
    if (&& $arg3 (> $arg1 $arg3)) [
        if (< (- $arg1 $arg3) $arg4) [
            -f 1 (divf (- $arg1 $arg3) $arg4)
        ] [
            result 0
        ]
    ] [
        if (< $arg1 $arg2) [
            divf $arg1 $arg2
        ] [
            result 1
        ]
    ]
]

// The content is built lazily, and may set p_colour to change the background
// With p_cull, an entry that was not drawn last frame (i.e. scrolled out of view) is not built
// 1:<content> 2:<props>
ui_gameui_logentry = [
    @(props $gameui_logentry_props arg2)

    uitag $p_tag [
        // Non-zero size so uidrawn can become true while the entry is still empty
        uifill 0.01 0.001 [
            if (|| (! $p_cull) $uidrawn) [
                local _bottom
                _bottom = (concatword $p_side bottom)

                uistyle $_bottom

                uipad 0 0 0 (*f $ui_padsmaller $p_growth) [
                    uistyle $_bottom

                    uiborderedimageclamped $skinalphatex 0xffffff 0 $ui_texborder $ui_screenborder 0 0 [
                        uistyle $_bottom

                        uiclip 0 0 0 0 [
                            uistyle $_bottom

                            uispace $ui_padsmall $ui_padsmaller [
                                uistyle $_bottom

                                uihlist $ui_padsmall [
                                    uistyle (concatword $p_side middle)
                                    arg1
                                ]
                            ]
                            uiclipoffsetx (*f $uilastwprev (-f 1.0 $p_growth))
                            uiclipoffsety (*f $uilasthprev (-f 1.0 $p_growth))
                            uiclipsizew (*f $uilastwprev $p_growth)
                            uiclipsizeh (*f $uilasthprev $p_growth)
                        ]
                        uicolourset $p_colour
                    ]
                    uipropagate [ uicolourblend $p_blend ]
                ]
            ]
        ]
    ]
]
