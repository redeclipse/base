// the Visor rim, the edge of the screen glowing in the colour of what is happening to the player's body, drawn flat behind the Visor as added light

deffvarp game_hud_rim 0 1 2 // strength of hits and residuals, 0 turns them off
defvarp game_hud_rim_fade 1 2000 10000 // how long a hit takes to fade, in milliseconds, cut short by damagemergedelay + damagemergetime when longer
deffvarp game_hud_rim_critical 0 1 2 // strength of the alert at critical health and the flatline at death, 0 turns them off
deffvarp game_hud_rim_regen 0 0.5 2 // strength of health regenerating, 0 turns it off
deffvarp game_hud_rim_buff 0 0.7 2 // strength of being buffed, 0 turns it off
deffvarp game_hud_rim_opacity 0 0.5 1 // how much of the light shows, over everything it lights
deffvarp game_hud_rim_size 1 4 8 // how far in the light reaches, in widths of the gap between the screen's edge and the HUD
deffvarp game_hud_rim_radius 0 0.15 8 // radius of the inner corners, in widths of the light

deffvarp game_hud_rim_hitmin 0 0.4 1 // strength of the smallest hit
deffvarp game_hud_rim_hitscale 0 4 20 // how much stronger a hit is for each spawn health's worth of damage
defvarp game_hud_rim_attack 1 60 1000 // how long a hit takes to light up, in milliseconds
defvarp game_hud_rim_change 1 250 5000 // how long a residual, regen or buff takes to rise or fall, in milliseconds
deffvarp game_hud_rim_residual 0 0.6 1 // strength of a residual between its ticks
deffvarp game_hud_rim_period 0.1 1.2 10 // seconds for one rise and fall of the critical alert

game_hud_rim_burn = 0
game_hud_rim_bleed = 0
game_hud_rim_shock = 0
game_hud_rim_corrode = 0
game_hud_rim_regen_on = 0
game_hud_rim_buff_on = 0

// light brightest at the screen's edge that falls away inwards to an inner edge with rounded corners, each source changing how far in it reaches
// every length is in widths of the band, so the shape is the same at any resolution, and pixels inside the band are discarded first
shader $SHADER_DEFAULT "hudrim" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0; // noiselut
    uniform vec4 rendersize, curmillis;
    uniform vec4 rimshape; // x: width of the band, y: radius of its inner corners, z: seconds for one rise and fall of the critical alert, w: 1 when it flatlines
    uniform vec4 rimhit, rimburn, rimbleed, rimshock, rimcorrode, rimcritical, rimregen, rimbuff; // rgb: colour, a: strength
    uniform vec4 rimphase; // x: how far the last regen tick's wave has risen, 0 to 1, y: how far a buff has risen, 0 to 1
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    @(sdf_rounded_box)
    @(compositenoiselut2d tex0)

    // light falling away from the screen's edge over reach, where depth is 0 at the inner edge and 1 at the screen's edge,
    // and easing out to nothing at the inner edge so the band never ends in a line
    float rimfade(float depth, float reach)
    {
        return exp2(-4.5 * (1.0 - depth) / clamp(reach, 0.05, 1.0)) * smoothstep(0.0, 0.3, depth);
    }

    // every colour at full brightness with its hue kept, so a pulse cycling through darker colours never dims the light
    vec4 rimlight(vec4 c)
    {
        return vec4(c.rgb / max(max(c.r, c.g), max(c.b, 0.001)), 1.0) * c.a;
    }

    void main(void)
    {
        vec2 size = rendersize.zw * 0.5, p = texcoord0 * rendersize.zw - size;
        float width = rimshape.x, edge = sdf_rounded_box(p, size - width, vec4(min(rimshape.y, min(size.x, size.y) - width)));
        if(edge <= 0.0) discard;

        float depth = min(edge / width, 1.0), t = curmillis.z;
        vec2 q = p / width;
        vec4 light = vec4(0.0);

        if(rimhit.a > 0.0) light += rimlight(rimhit) * rimfade(depth, 1.0);

        if(rimburn.a > 0.0)
        {   // flickering tongues that lick inwards
            float tongue = fbm3(q * 0.4 + vec2(0.6, 1.0) * t * 2.0), flicker = noise(q * 1.5 + vec2(-1.0, 0.7) * t * 8.0);
            light += rimlight(rimburn) * rimfade(depth, mix(0.6, 1.3, tongue)) * mix(0.8, 1.4, flicker);
        }

        if(rimbleed.a > 0.0)
        {   // a slow heavy throb
            float beat = pow(0.5 + 0.5 * sin(t * 5.6548668), 3.0);
            light += rimlight(rimbleed) * rimfade(depth, mix(0.6, 1.0, beat)) * mix(0.55, 1.0, beat);
        }

        if(rimshock.a > 0.0)
        {   // crackles that run along the rim, jumping to a new shape many times a second
            float turn = atan(p.y, p.x) + t * 0.8, around = (size.x + size.y) / (width * 3.1415927) * 0.3;
            float crack = 1.0 - abs(noise(vec2(cos(turn), sin(turn)) * (around + depth * 1.5) + floor(t * 14.0) * vec2(5.3, 9.1)) * 2.0 - 1.0);
            light += rimlight(rimshock) * (rimfade(depth, 0.5) * 0.4 + pow(crack, 10.0) * smoothstep(0.0, 0.4, depth));
        }

        if(rimcorrode.a > 0.0)
        {   // blotches that slowly creep along the edge
            float blotch = smoothstep(0.4, 0.75, fbm3(q * 0.3 + vec2(0.2, 0.07) * t));
            light += rimlight(rimcorrode) * rimfade(depth, mix(0.3, 1.0, blotch)) * mix(0.5, 1.0, blotch);
        }

        if(rimcritical.a > 0.0)
        {   // a smooth alert fading in and out, held solid when it flatlines
            float alert = rimshape.w > 0.5 ? 1.0 : 0.5 - 0.5 * cos(t * 6.2831853 / max(rimshape.z, 0.1));
            light += rimlight(rimcritical) * rimfade(depth, 1.0) * alert;
        }

        if(rimregen.a > 0.0)
        {   // a soft glow with a wave of light rising up from the edge on every tick, the waves turning to the buff's colour and the glow giving way
            // to its shimmer while buffed, as a buff regenerates health too
            float rise = rimphase.x, wave = exp2(-pow((depth - (1.0 - rise)) * 5.0, 2.0)) * (1.0 - rise) * smoothstep(0.0, 0.3, depth);
            vec4 colour = vec4(mix(rimregen.rgb, rimbuff.rgb, rimphase.y), rimregen.a);
            light += rimlight(colour) * (rimfade(depth, 0.5) * 0.5 * (1.0 - rimphase.y) + wave);
        }

        if(rimbuff.a > 0.0)
        {   // a slow shimmer drifting around the edge
            float turn = atan(p.y, p.x) - t * 0.15, around = (size.x + size.y) / (width * 3.1415927) * 0.15;
            float shimmer = fbm3(vec2(cos(turn), sin(turn)) * around + vec2(t * 0.3, depth * 0.5));
            light += rimlight(rimbuff) * rimfade(depth, mix(0.5, 1.0, shimmer)) * mix(0.6, 1.0, shimmer);
        }

        if(light.a <= 0.0) discard;
        fragcolor = vec4(light.rgb / light.a, min(light.a, 1.0)) * colorscale;
    }
]

// adds the hits and residual ticks the player took within the fade, by type, each lighting up quickly then fading out,
// every hit showing at least a little however small, as health can run to the thousands
game_hud_rim_hits = [
    local _hits _spawn _age _amt _type
    _hits = [0 0 0 0 0]
    _spawn = (max (getclientspawnhealth $focusedplayer) 1)
    loop i (getdamages) [
        if (&& [= (getdamageclient $i) $focusedplayer] [> (getdamageamt $i) 0]) [
            _age = (- $totalmillis (getdamagemillis $i))
            _type = (getdamagetype $i)
            if (&& [< $_age $game_hud_rim_fade] [>= $_type 0] [< $_type 5]) [
                _amt = (minf (+f $game_hud_rim_hitmin (*f (divf (getdamageamt $i) $_spawn) $game_hud_rim_hitscale)) 1)
                _amt = (*f $_amt (-f 1 (divf $_age $game_hud_rim_fade)) (minf (divf $_age $game_hud_rim_attack) 1))
                _hits = (listsplice $_hits (+f (at $_hits $_type) $_amt) $_type 1)
            ]
        ]
    ]
    result $_hits
]

// 1:<name> 2:<whether it is on> rises or falls the light's strength towards it, returning it
game_hud_rim_rise = [
    local _var _step
    _var = (concatword game_hud_rim_ $arg1)
    _step = (divf $curtime $game_hud_rim_change)
    set $_var (clampf (+f (getalias $_var) (? $arg2 $_step (-f 0 $_step))) 0 1)
    result (getalias $_var)
]

// 1:<residual> 2:<ticks> 3:<alive> returns its strength, rising and falling as it starts and ends, with each tick flashing
game_hud_rim_effect = [
    local _on
    _on = (&& $arg3 [(concatword getclient $arg1 func) $focusedplayer])
    result (*f (clampf (+f (*f (game_hud_rim_rise $arg1 $_on) $game_hud_rim_residual) $arg2) 0 1) $game_hud_rim)
]

// strength of the critical alert, from gentle just under the critical line to full near death
game_hud_rim_alert = [
    local _spawn _crit _health
    _spawn = (getclientspawnhealth $focusedplayer)
    _crit = (*f $_spawn $damagecritical)
    _health = (getclienthealth $focusedplayer)
    if (&& [> $game_hud_rim_critical 0] [< $_crit $_spawn] [> $_crit 0] [<= $_health $_crit]) [
        result (*f (lerpf 0.4 1 (clampf (-f 1 (divf $_health $_crit)) 0 1)) $game_hud_rim_critical)
    ] [ result 0 ]
]

// how far the last regen tick's wave has risen, past 1 once the next tick is overdue and regen has stopped
game_hud_rim_regenphase = [
    local _last
    _last = (getclientregen $focusedplayer)
    if (&& $_last [> (getclientregenamt $focusedplayer) 0] [> $regentime 0]) [
        result (divf (- $lastmillis $_last) $regentime)
    ] [ result 2 ]
]

// alive it shows hurt, healing and buffs, dead it flatlines until waiting to respawn, then nothing
ui_game_hud_rim = [
    local _state _alive _hits _hit _burn _bleed _shock _corrode _alert _flat _phase _regen _buff _buffon
    _state = (getclientstate $focusedplayer)
    _alive = (= $_state $CS_ALIVE)
    _flat = (&& [= $_state $CS_DEAD] [>f $game_hud_rim_critical 0])
    if (|| $_alive [= $_state $CS_DEAD]) [
        _hits = (game_hud_rim_hits)
        _hit = (*f (minf (at $_hits 0) 1) $game_hud_rim)
    ] [
        _hits = [0 0 0 0 0]
        _hit = 0
    ]
    _alert = (? $_flat $game_hud_rim_critical (? $_alive (game_hud_rim_alert) 0))
    _burn = (game_hud_rim_effect burn (at $_hits 1) $_alive)
    _bleed = (game_hud_rim_effect bleed (at $_hits 2) $_alive)
    _shock = (game_hud_rim_effect shock (at $_hits 3) $_alive)
    _corrode = (game_hud_rim_effect corrode (at $_hits 4) $_alive)
    _phase = (game_hud_rim_regenphase)
    _regen = (*f (game_hud_rim_rise regen_on (&& $_alive [<=f $_phase 1.2])) $game_hud_rim_regen)
    _buffon = (game_hud_rim_rise buff_on (&& $_alive [getclientbuffing $focusedplayer]))
    _buff = (*f $_buffon $game_hud_rim_buff)

    if (&& [>f $game_hud_rim_opacity 0] [>f (+f $_hit $_burn $_bleed $_shock $_corrode $_alert $_regen $_buff) 0]) [
        uiblend 4 0 [ uiclamp 1 1 1 1; uirender "hudrim" 0 0 [
            uiclamp 1 1 1 1
            uicolourblend $game_hud_rim_opacity
            uirendertex "<comp:0,-256,2>noiselut" 0 1
            uirenderparam rimshape (*f $ui_padhud $game_hud_rim_size) (*f $ui_padhud $game_hud_rim_size $game_hud_rim_radius) $game_hud_rim_period $_flat
            uirenderparam rimphase (minf $_phase 1) (? (>f $game_hud_rim_buff 0) $_buffon 0) 0 0
            uirenderpmcol rimhit (getclientpulsecolour $focusedplayer $PULSE_HIT) $_hit
            uirenderpmcol rimburn (getclientpulsecolour $focusedplayer $PULSE_BURN) $_burn
            uirenderpmcol rimbleed (getclientpulsecolour $focusedplayer $PULSE_BLEED) $_bleed
            uirenderpmcol rimshock (getclientpulsecolour $focusedplayer $PULSE_SHOCK) $_shock
            uirenderpmcol rimcorrode (getclientpulsecolour $focusedplayer $PULSE_CORRODE) $_corrode
            uirenderpmcol rimcritical (getclientpulsecolour $focusedplayer $PULSE_WARN) $_alert
            uirenderpmcol rimregen (getclientpulsecolour $focusedplayer $PULSE_REGEN) $_regen
            uirenderpmcol rimbuff (getclientpulsecolour $focusedplayer $PULSE_BUFF) $_buff
        ] ]
    ]
]
