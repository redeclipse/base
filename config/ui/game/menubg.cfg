defvarp menubgplayers 0 1 1
defvarp menubgglitch 0 0 1 // break the flanking figures up with the glitch's prisms
menubg_fadetime = 800 // millis for each figure to materialise

// figures standing on the main menu scene, drawn from the back to the front
// 1:<x> 2:<z> offset from the horizon centre and depth below the horizon, in screen heights
// 3:<height> 4:<yaw> 5:<tint> 6:<hero, uses the player's own profile> 7:<model>
// 8:<anim> danced in time with the theme
// 9:<weapon> 10:<delay> before materialising, in millis
// 11:<nudge> across in figure heights, centring a pose that leans to one side on its place, so the hero stands under the eclipse
// 12:<moves> to dance instead, indexes into menubg_dances taking turns every few bars, no two figures on the same one at once:
// each goes through them all in the same order, four moves apart
menubg_figures = [
    [-0.47 0.12 0.31 215 0xffffff 0 1 ""            $W_MELEE 300 0    "0 11 3 8 1 12 6 10 4 13 2 15 5 9 7 14"]
    [ 0.47 0.12 0.31 145 0xffffff 0 0 ""            $W_MELEE 350 0    "1 12 6 10 4 13 2 15 5 9 7 14 0 11 3 8"]
    [-0.25 0.16 0.37 205 0xffffff 0 0 ""            $W_MELEE 150 0    "4 13 2 15 5 9 7 14 0 11 3 8 1 12 6 10"]
    [ 0.25 0.16 0.37 155 0xffffff 0 1 ""            $W_MELEE 200 0    "5 9 7 14 0 11 3 8 1 12 6 10 4 13 2 15"]
    [ 0    0.34 0.62 180 0xffffff 1 0 "emote point" $W_MELEE 0   -0.03 ""]
]

// each move is two bars long, as is the hero's pointing pose, danced twice over before the next, kept to where the theme is playing or to
// the clock
menubg_dances = [
    "emote headbang" "emote jump" "emote guitar" "emote clap" "emote punch" "emote stomp" "emote hands" "emote spin"
    "emote drum" "emote mosh" "emote kick" "emote march" "emote twist" "emote roll" "emote bass" "emote shake"
]
// the theme's quiet parts get calmer moves, each figure two apart as they take them in turn
menubg_calmdances = [
    "emote sway" "emote tap" "emote snap" "emote lighter" "emote nod" "emote rock" "emote stretch" "emote look"
]
menubg_dancequiet = 0
menubg_dancemove = (divf 60000 174) // millis a beat at the tempo the moves were made at, see src/scripts/makeposes.py
menubg_dancebeats = 8 // beats a move lasts
menubg_dancerepeat = 2
menubg_dancemillis = 0
menubg_dancesynced = 0
menubg_dancebeat = $menubg_dancemove // millis a beat at the tempo being danced to
menubg_dancefirst = 0 // millis into the track of the first downbeat
menubg_dancetrack = ""
menubg_dancescale = 0.75 // dancers are drawn smaller in a taller box, leaving room overhead to jump into

menubg_showmillis = 0
menubg_ready = 0
menubg_frames = 0
menubg_lastbuild = 0

// the timing of the theme, set by the .cfg kept beside it, see data/sounds/music/wearetheglitch.cfg
deffvar musictempo 1 174 1000 // beats a minute
defvar musicmeter 1 4 16 // beats a bar
defvar musicfirstbeat 0 0 $varidxmax // millis into the track of the first downbeat
defsvar musicquiet "" // the quiet parts, from and to the bar of each, -1 to the end

// loads the timing kept in a .cfg beside a music track, wherever the track is found, starting over from the defaults
// 1:<track>
menubg_dancetimed = 0
menubg_dancetiming = [
    musictempo 174
    musicmeter 4
    musicfirstbeat 0
    musicquiet ""
    menubg_dancetimed = 0
    looplist _dir ["" "sounds/" "sounds/music/" "sounds/egmusic/"] [
        if (! $menubg_dancetimed) [menubg_dancetimed = (exec (concatword $_dir $arg1 ".cfg") 0 0)]
    ]
]

// the figures are laid out in the scene and placed on the screen as backgroundlayout spread them and zoomed the scene out
// 1:<figure> 2:<index>
menubg_figure = [
    local _x _z _h _w _pos _fade _profile _anim _scale _bh _loops _phrase
    _h = (*f (at $arg1 2) $backgroundzoom)
    _x = (+f $backgroundx (*f (at $arg1 0) $backgroundspread $backgroundzoom) (*f (at $arg1 10) $_h))
    _z = (*f (+f $backgroundhorizony (at $arg1 1)) $backgroundzoom)
    _w = (*f $_h 1.3) // wide enough for outstretched arms, the model is fitted to the height
    _pos = (backgroundpos $_x $_z)
    _fade = (clampf (divf (- $uilastmillis $menubg_showmillis (at $arg1 9)) $menubg_fadetime) 0 1)
    _fade = (*f $_fade $_fade (-f 3 (*f 2 $_fade)))

    // the flanking figures can be broken up by the background's glitch, which keeps clear of the hero and anyone it doesn't cut up
    backgroundfigure $arg2 $_x $_z $_h (&& $menubgglitch [! (at $arg1 5)]) (clampf (*f $_fade 1.5) 0 1)

    if (at $arg1 5) [
        _profile = [
            uiplayerpreviewmodel  $playermodel
            uiplayerpreviewcolour $playercolour 0
            uiplayerpreviewcolour $playercolour2 1
            uiplayerpreviewmixer  $playermixer
            uiplayerpreviewvanity $playervanity
        ]
    ] [
        _profile = (format [
            uiplayerpreviewmodel  %1
            uiplayerpreviewcolour 0xc01010 0
            uiplayerpreviewcolour 0x500000 1
            uiplayerpreviewmixer  "default"
            uiplayerpreviewvanity ""
        ] (at $arg1 6))
    ]

    _scale = 1
    _anim = (at $arg1 7)
    _loops = (divf (maxf (-f $menubg_dancemillis $menubg_dancefirst) 0) (*f $menubg_dancebeat $menubg_dancebeats))
    if (listlen (at $arg1 11)) [
        _scale = $menubg_dancescale
        _phrase = (floor (divf $_loops $menubg_dancerepeat))
        if $menubg_dancequiet [
            _anim = (at $menubg_calmdances (mod (+ (* $arg2 2) $_phrase) (listlen $menubg_calmdances)))
        ] [
            _anim = (at $menubg_dances (at (at $arg1 11) (mod $_phrase (listlen (at $arg1 11)))))
        ]
    ]
    _anim = (format "%1 %2 1 0" (escape $_anim) (*f (-f $_loops (floorf $_loops)) $menubg_dancebeats $menubg_dancemove))

    // the model keeps its size, fitted to the taller box at the smaller scale, and is lowered by how much further its feet sit
    // above the bottom of the box, which is about 7% of its height
    _bh = (divf $_h $_scale)
    uiplayerpreview $_scale $_fade $_w $_bh (concat $_profile (format [
        uiplayerpreviewweapselect %1
        uiplayerpreviewanim %2
    ] (at $arg1 8) $_anim)) [
        uiposition (-f (at $_pos 0) (*f $_w 0.5)) (+f (-f (at $_pos 1) $_bh) (*f $_h 0.074 (-f (divf 1 $_scale) 1)))
        uicolourset (at $arg1 4) 0 0
        uipreviewinteract 0
        uipreviewyaw      (+f (at $arg1 3) (*f (sin (*f $uilastmillis 0.02)) 6))
        uipreviewpitch    -4
        // lit like the cover: a dim red key, a strong backlight off the horizon glow catching the edges, and hot body lights
        uipreviewskycol   0x3c0c0c
        uipreviewsuncol   0x60403c
        uipreviewsundir   0.5 0.3 0.8
        uipreviewexcol    0x400808
        uipreviewexdir    0 -1 0.2
        uipreviewrim      0xff1010 2.2
        uipreviewgrade    0x8c0000 1
        uipreviewglow     1
    ]
    // its mist, over it but under anyone standing in front of it
    uibackgroundmist $arg2 []
]

// the logo's lettering beside the eclipse, where backgroundlayout put it
menubg_logo = [
    local _rect
    _rect = (backgroundlogo)
    uiimage $logotexttex 0xffffff 1 (at $_rect 2) (at $_rect 3) [
        uiposition (at $_rect 0) (at $_rect 1)
    ]
]

newui "menubg" $SURFACE_BACKGROUND [
    // wait until the game is running smoothly before showing anyone, the display isn't settled while it's still starting up,
    // then fade in from that moment
    if (! $menubg_ready) [
        if (&& [! $progressing] [< (- $uilastmillis $menubg_lastbuild) 100]) [menubg_frames = (+ $menubg_frames 1)] [menubg_frames = 0]
        if (>= $menubg_frames 15) [menubg_ready = 1]
        menubg_showmillis = (max $uilastmillis 1)
    ]
    menubg_lastbuild = $uilastmillis

    // lay the scene out between the left edge of the screen and the main menu, wherever the menu ends up
    backgroundlayout (at $ui_gameui_main_dims 1) (at $ui_gameui_main_dims 0) (-f (at $ui_gameui_main_dims 2) (at $ui_gameui_main_dims 0))

    // in time with the theme where it's playing and has its timing beside it, otherwise to the clock at the moves' own tempo
    if (!=s $menubg_dancetrack $musictheme) [
        menubg_dancetrack = $musictheme
        menubg_dancetiming $musictheme
    ]
    menubg_dancemillis = (musicmillis $musictheme)
    menubg_dancesynced = (&& $menubg_dancetimed [>= $menubg_dancemillis 0])
    menubg_dancebeat = $menubg_dancemove
    menubg_dancefirst = 0
    menubg_dancequiet = 0
    if $menubg_dancesynced [
        local _bar _to
        menubg_dancebeat = (divf 60000 $musictempo)
        menubg_dancefirst = $musicfirstbeat
        _bar = (divf (-f $menubg_dancemillis $musicfirstbeat) (*f $menubg_dancebeat $musicmeter))
        loop i (div (listlen $musicquiet) 2) [
            _to = (at $musicquiet (+ (* $i 2) 1))
            if (&& [>=f $_bar (at $musicquiet (* $i 2))] [|| [< $_to 0] [<f $_bar $_to]]) [menubg_dancequiet = 1]
        ]
    ] [menubg_dancemillis = $uilastmillis]

    uifill $uiaspect 1 [
        if $menubg_ready [loop i (listlen $menubg_figures) [
            // the glitch cuts up the flankers drawn so far, but not the hero drawn after it
            if (&& $menubgglitch [at (at $menubg_figures $i) 5]) [uibackgroundglitch []]
            menubg_figure (at $menubg_figures $i) $i
        ]]
        menubg_logo
    ]
] [
    menubg_showmillis = 0
    menubg_ready = 0
    menubg_frames = 0
] [] [&& $menubgplayers [! $isconnected]]
