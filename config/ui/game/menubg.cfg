defvarp menubgplayers 0 1 1
defvarp menubglyrics 0 1 1 // show the theme's lyrics under the hero as they're sung
defvarp menubgnowplaying 0 1 1 // show what's playing to the left of the eclipse
menubg_fadetime = 800 // millis for each figure to materialise

// figures standing on the main menu scene, drawn from the back to the front
// 1:<x> 2:<z> offset from the horizon centre and depth below the horizon, in screen heights
// 3:<height> 4:<yaw> 5:<tint> 6:<hero, uses the player's own profile> 7:<model>
// 8:<anim> danced in time with the theme
// 9:<weapon> 10:<delay> before materialising, in millis
// 11:<nudge> across in figure heights, centring a pose that leans to one side on its place, so the hero stands under the eclipse
// 12:<dances> instead, taking moves at random from menubg_dances for a random number of bars each, see menubg_dancepick
// 13:<calm anim> held instead of 8 through the theme's quiet parts
menubg_figures = [
    [-0.47 0.12 0.31 215 0xffffff 0 1 ""            $W_MELEE 300 0     1 ""]
    [ 0.47 0.12 0.31 145 0xffffff 0 0 ""            $W_MELEE 350 0     1 ""]
    [-0.25 0.16 0.37 205 0xffffff 0 0 ""            $W_MELEE 150 0     1 ""]
    [ 0.25 0.16 0.37 155 0xffffff 0 1 ""            $W_MELEE 200 0     1 ""]
    [ 0    0.34 0.62 180 0xffffff 1 0 "emote point" $W_MELEE 0   -0.03 0 "emote wag"]
]

// each move is two bars long, as are the hero's pointing poses, kept to where the theme is playing or to the clock
menubg_dances = [
    "emote headbang" "emote jump" "emote guitar" "emote clap" "emote punch" "emote stomp" "emote hands" "emote spin"
    "emote drum" "emote march" "emote twist"
]
// the theme's quiet parts get calmer moves
menubg_calmdances = [
    "emote tap" "emote snap" "emote lighter" "emote nod" "emote look"
]
menubg_dancequiet = 0
menubg_dancemove = (divf 60000 120) // millis a beat at the tempo the moves were made at, see src/scripts/makeposes.py
menubg_dancebeats = 8 // beats a move lasts
menubg_dancebarsmin = 2 // bars a dancer keeps to a move before picking another, at random between these
menubg_dancebarsmax = 8
menubg_danceblend = 0.5 // beats a dancer takes to blend from one move into the next
menubg_dancemillis = 0
menubg_danceclock = 0 // millis the figures dance to, carrying on past the end of the track each time it loops back round
menubg_danceloops = 0 // millis added to the track's own for the times it's looped, a whole number of bars each
menubg_dancelast = 0
menubg_dancesynced = 0
menubg_dancebeat = $menubg_dancemove // millis a beat at the tempo being danced to
menubg_dancefirst = 0 // millis into the track of the first downbeat
menubg_dancetrack = ""
// the horizon glow swells on each beat of the theme and dies away over the rest of it, hardest on the first beat of each bar and
// less hard on the others, rising and falling gently over a few bars through the quiet parts instead, and doesn't pulse at all
// while nothing's playing in time
menubg_glowoffbeat = 0.5
menubg_glowquiet = 0.4
menubg_glowquietbars = 2 // bars the glow takes to rise and fall again in the quiet parts
menubg_glowdecay = 3 // how sharply it dies away after each beat
menubg_dancescale = 0.75 // dancers are drawn smaller in a taller box, leaving room overhead to jump into
menubg_feet = 0.074 // how far above the bottom of its box a figure's feet are, in figure heights

// the lyrics under the hero, rolling along two rows at a time: each row scrolls up into place over this many millis before it's
// sung, the rows fade out this many millis after the last before a pause of this many millis or more, each word lights up over
// this many millis as it's sung and again as the next is, and a line longer than this many letters is broken into two rows
menubg_lyriclead = 300
menubg_lyriclinger = 700
menubg_lyricgap = 3000
menubg_lyricnext = 0.5 // how solid the next row is while it waits below the one being sung, brightening as it scrolls up
menubg_lyricfill = 150
menubg_lyricwrap = 30
menubg_lyricsize = 2 // text scale, as the main menu's items, as long as two rows fit below the hero's feet
menubg_lyricmargin = 0.04 // screen heights kept clear below the lyrics
// the logo's palette, which the rest of the scene keeps to: its white, its red, and its white in shadow, light enough to read
// against the red glow behind it
menubg_logowhite = 0xffffff
menubg_logored = 0xff3c3c
menubg_logoshade = 0x808080
menubg_lyricunsung = $menubg_logoshade
menubg_lyricsinging = $menubg_logowhite // the word being sung
menubg_lyricsung = $menubg_logored
menubg_lyricnoteicons = ["textures/icons/note" "textures/icons/notes"] // distance fields, taking turns along the bar while there's no singing
menubg_lyricrows = "" // the lines of musiclyrics broken into rows, each the millis it starts and ends, then its words and their millis
// what's playing, to the left of the eclipse as the lettering is to its right, fading in over this many millis each time the
// track changes, the same size whatever the screen's shape unless one of its lines won't fit, when it's all made smaller
menubg_nowplayinggap = 1.2 // eclipse radii between it and the eclipse, as the lettering is, see BACKGROUNDLOGOGAP
menubg_nowplayingmargin = 0.03 // screen heights kept clear of the left edge
menubg_nowplayingfade = 1000
// text scales, fitting the theme's on screens as narrow as 4:3
menubg_nowplayinglabel = 1.2
menubg_nowplayingtitle = 2
menubg_nowplayingartist = 1.2
menubg_nowplayingtrack = ""
menubg_nowplayingmillis = 0
menubg_herox = 0 // where the hero's feet are and how tall it is, for the lyrics to sit beneath
menubg_heroy = 0
menubg_heroh = 0

menubg_showmillis = 0
menubg_ready = 0
menubg_frames = 0
menubg_lastbuild = 0

// the timing of the theme, set by the .cfg kept beside it, see data/sounds/music/wearetheglitch.cfg
deffvar musictempo 1 120 1000 // beats a minute
defvar musicmeter 1 4 16 // beats a bar
defvar musicfirstbeat 0 0 $varidxmax // millis into the track of the first downbeat
defsvar musicquiet "" // the quiet parts, from and to the bar of each, -1 to the end
defsvar musiclyrics "" // the lines as they're sung, each the millis it starts and ends, then each word and the millis it's sung at

// loads the timing kept in a .cfg beside a music track, wherever the track is found, starting over from the defaults
// 1:<track>
menubg_dancetimed = 0
menubg_dancetiming = [
    musictempo 120
    musicmeter 4
    musicfirstbeat 0
    musicquiet ""
    musiclyrics ""
    menubg_dancetimed = 0
    looplist _dir ["" "sounds/" "sounds/music/" "sounds/egmusic/"] [
        if (! $menubg_dancetimed) [menubg_dancetimed = (exec (concatword $_dir $arg1 ".cfg") 0 0)]
    ]
    menubg_lyricsplit
]

// breaks the lines of musiclyrics into the rows they're shown in, a long line into two near its middle, after a word ending a
// phrase where there's one that isn't too far from it, each row
// ending when the next word after it is sung or the line ends, with a row of music notes, one with no words, wherever there's no
// singing: the intro, each pause of menubg_lyricgap or more, starting menubg_lyriclinger after the singing stops, and the outro
menubg_lyricsplit = [
    local _n _total _split _chars _best _score _word _row _end
    menubg_lyricrows = ""
    _end = -1
    looplist _line $musiclyrics [
        if (< $_end 0) [menubg_lyricrows = (escape (concat 0 (at $_line 0)))] [
            if (>= (- (at $_line 0) $_end) $menubg_lyricgap) [
                menubg_lyricrows = (concat $menubg_lyricrows (escape (concat (+ $_end $menubg_lyriclinger) (at $_line 0))))
            ]
        ]
        _end = (at $_line 1)
        _n = (div (- (listlen $_line) 2) 2)
        _total = 0
        loop i $_n [_total = (+ $_total (strlen (at $_line (+ 2 (* $i 2)))) (! (menubg_lyricjoins (at $_line (+ 2 (* $i 2))))))]
        _split = $_n
        if (> $_total $menubg_lyricwrap) [
            _chars = 0
            _best = $_total
            loop i $_n [
                _score = (? (&& [> $i 0] [menubg_lyricjoins $_word]) $_total (abs (- (* $_chars 2) $_total))) // never inside a word
                if (&& [> $i 0] [>= (strstr ",.!?;:^")" (substr $_word (- (strlen $_word) 1) 1)) 0]) [
                    _score = (- $_score (div $_total 4))
                ]
                if (< $_score $_best) [
                    _best = $_score
                    _split = $i
                ]
                _word = (at $_line (+ 2 (* $i 2)))
                _chars = (+ $_chars (strlen $_word) (! (menubg_lyricjoins $_word)))
            ]
        ]
        _row = (concat (at $_line 0) (? (< $_split $_n) (at $_line (+ 3 (* $_split 2))) (at $_line 1)))
        loop i $_split [_row = (concat $_row (escape (at $_line (+ 2 (* $i 2)))) (at $_line (+ 3 (* $i 2))))]
        menubg_lyricrows = (concat $menubg_lyricrows (escape $_row))
        if (< $_split $_n) [
            _row = (concat (at $_line (+ 3 (* $_split 2))) (at $_line 1))
            loop i (- $_n $_split) [_row = (concat $_row (escape (at $_line (+ 2 (* (+ $_split $i) 2)))) (at $_line (+ 3 (* (+ $_split $i) 2))))]
            menubg_lyricrows = (concat $menubg_lyricrows (escape $_row))
        ]
    ]
    if (>= $_end 0) [menubg_lyricrows = (concat $menubg_lyricrows (escape (concat (+ $_end $menubg_lyriclinger) $varidxmax)))]
]

// the move a dancing figure is on and the bar it started on, picking another at random once it's danced its bars, the music has
// gone quiet or loud, or the music has gone back past its start, never the move it's leaving or one another figure is dancing
// 1:<index> 2:<bar>
menubg_dancepick = [
    local _state _used _moves
    _state = (getalias (concatword menubg_dancing $arg1))
    if (|| [! (listlen $_state)] [< $arg2 (at $_state 1)] [>= $arg2 (at $_state 2)] [!= (at $_state 3) $menubg_dancequiet]) [
        _used = (escape (at $_state 0))
        loop i (listlen $menubg_figures) [
            if (!= $i $arg1) [_used = (concat $_used (escape (at (getalias (concatword menubg_dancing $i)) 0)))]
        ]
        _moves = (listdel (? $menubg_dancequiet $menubg_calmdances $menubg_dances) $_used)
        _state = (concat (escape (at $_moves (rnd (listlen $_moves)))) $arg2 (+ $arg2 (rnd (+ $menubg_dancebarsmax 1) $menubg_dancebarsmin)) $menubg_dancequiet)
        alias (concatword menubg_dancing $arg1) $_state
    ]
    result $_state
]

// the figures are laid out in the scene and placed on the screen as backgroundlayout spread them and zoomed the scene out
// 1:<figure> 2:<index>
menubg_figure = [
    local _x _z _h _w _pos _fade _profile _anim _scale _bh _at _move _bar _dance
    _h = (*f (at $arg1 2) $backgroundzoom)
    _x = (+f $backgroundx (*f (at $arg1 0) $backgroundspread $backgroundzoom) (*f (at $arg1 10) $_h))
    _z = (*f (+f $backgroundhorizony (at $arg1 1)) $backgroundzoom)
    _w = (*f $_h 1.3) // wide enough for outstretched arms, the model is fitted to the height
    _pos = (backgroundpos $_x $_z)
    _fade = (clampf (divf (- $uilastmillis $menubg_showmillis (at $arg1 9)) $menubg_fadetime) 0 1)
    _fade = (*f $_fade $_fade (-f 3 (*f 2 $_fade)))

    backgroundfigure $arg2 $_x $_z $_h (clampf (*f $_fade 1.5) 0 1)
    if (at $arg1 5) [
        menubg_herox = (at $_pos 0)
        menubg_heroy = (-f (at $_pos 1) (*f $_h $menubg_feet))
        menubg_heroh = $_h
    ]

    if (at $arg1 5) [
        _profile = [
            uiplayerpreviewmodel  $playermodel
            uiplayerpreviewcolour $playercolour 0
            uiplayerpreviewcolour $playercolour2 1
            uiplayerpreviewmixer  $playermixer
            uiplayerpreviewvanity $playervanity
        ]
    ] [
        _profile = (format [
            uiplayerpreviewmodel  %1
            uiplayerpreviewcolour 0xc01010 0
            uiplayerpreviewcolour 0x500000 1
            uiplayerpreviewmixer  "default"
            uiplayerpreviewvanity ""
        ] (at $arg1 6))
    ]

    _scale = 1
    _anim = (at $arg1 (? (&& $menubg_dancequiet [!=s (at $arg1 12) ""]) 12 7))
    _at = (maxf (-f $menubg_danceclock $menubg_dancefirst) 0) // millis since the first downbeat
    if (at $arg1 11) [
        _scale = $menubg_dancescale
        _bar = (*f $menubg_dancebeat $musicmeter)
        _dance = (menubg_dancepick $arg2 (floor (divf $_at $_bar)))
        _anim = (at $_dance 0)
        _at = (-f $_at (*f (at $_dance 1) $_bar))
    ]
    // how far into the move, stretched from the music's tempo to the one it was made at
    _move = (*f $menubg_dancebeat $menubg_dancebeats)
    _at = (-f $_at (*f (floorf (divf $_at $_move)) $_move))
    _anim = (format "%1 %2 1 0" (escape $_anim) (*f (divf $_at $menubg_dancebeat) $menubg_dancemove))

    // the model keeps its size, fitted to the taller box at the smaller scale, and is lowered by how much further its feet sit
    // above the bottom of the box
    _bh = (divf $_h $_scale)
    uiplayerpreview $_scale $_fade $_w $_bh (concat $_profile (format [
        uiplayerpreviewweapselect %1
        uiplayerpreviewanim %2
        uiplayerpreviewblend %3
    ] (at $arg1 8) $_anim (round (*f $menubg_dancebeat $menubg_danceblend)))) [
        uiposition (-f (at $_pos 0) (*f $_w 0.5)) (+f (-f (at $_pos 1) $_bh) (*f $_h $menubg_feet (-f (divf 1 $_scale) 1)))
        uicolourset (at $arg1 4) 0 0
        uipreviewinteract 0
        uipreviewyaw      (+f (at $arg1 3) (*f (sin (*f $uilastmillis 0.02)) 6))
        uipreviewpitch    -4
        // lit like the cover: a dim red key, a strong backlight off the horizon glow catching the edges, and hot body lights
        uipreviewskycol   0x3c0c0c
        uipreviewsuncol   0x60403c
        uipreviewsundir   0.5 0.3 0.8
        uipreviewexcol    0x400808
        uipreviewexdir    0 -1 0.2
        uipreviewrim      0xff1010 2.2
        uipreviewgrade    0x8c0000 1
        uipreviewglow     1
    ]
    // its mist, over it but under anyone standing in front of it
    uibackgroundmist $arg2 []
]

// whether a word of the lyrics is the first part of a word split at its hyphens, joined to the part after it
// 1:<word>
menubg_lyricjoins = [=s (substr $arg1 (- (strlen $arg1) 1) 1) "-"]

// a word, or part of one, of the row menubg_lyricrow is drawing, lit up while it's sung and left lit once the next is
// 1:<index of the word>
menubg_lyricword = [
    local _c _next
    _next = (? (< (+ (* $arg1 2) 4) (listlen $_row)) (at $_row (+ 5 (* $arg1 2))) (at $_row 1))
    _c = (skewcolour $menubg_lyricunsung $menubg_lyricsinging (clampf (divf (- $_at (at $_row (+ 3 (* $arg1 2)))) $menubg_lyricfill) 0 1))
    _c = (skewcolour $_c $menubg_lyricsung (clampf (divf (- $_at $_next) $menubg_lyricfill) 0 1))
    uicolourtext (at $_row (+ 2 (* $arg1 2))) (| $_c (<< (max 1 (round (*f $_rowalpha 255))) 24)) $_scale
]

// a row of the lyrics, the parts of words split at their hyphens drawn together but lit up one at a time, or of music notes where
// there are no words, for menubg_lyrics drawing them
// 1:<row> 2:<alpha> 3:<y>
menubg_lyricrow = [
    if (<= (listlen $arg1) 2) [
        if (>f $arg2 0) [menubg_lyricnotes $arg1 $arg2 $arg3]
    ] [if (>f $arg2 0) [
        local _row _rowalpha _n _starts _from _to
        _row = $arg1
        _rowalpha = $arg2
        _n = (div (- (listlen $_row) 2) 2)
        // where each whole word starts
        _starts = ""
        loop i $_n [if (|| [= $i 0] [! (menubg_lyricjoins (at $_row (* $i 2)))]) [_starts = (concat $_starts $i)]]
        uifill (divf $_w $uiscale) (divf $_rowh $uiscale) [
            uiposition 0 $arg3
            uifont $textfontoutline [
                uihlist (*f $_scale 0.006) [
                    loop g (listlen $_starts) [
                        _from = (at $_starts $g)
                        _to = (? (< (+ $g 1) (listlen $_starts)) (at $_starts (+ $g 1)) $_n)
                        uihlist 0 [loop k (- $_to $_from) [menubg_lyricword (+ $_from $k)]]
                    ]
                ]
            ]
        ]
    ]]
]

// whether one row of the lyrics carries on into the next without a pause
// 1:<row> 2:<next row>
menubg_lyricjoined = [&& (listlen $arg1) (listlen $arg2) (< (- (at $arg2 0) (at $arg1 1)) $menubg_lyricgap)]

// a row of music notes for the instrumental parts, one for each beat of the bar, coloured as the lyrics' words are as each beat
// comes round and jumping up on it, starting over each bar, for menubg_lyricrow drawing them
// 1:<row> 2:<alpha> 3:<y>
menubg_lyricnotes = [
    local _beat _size _t _hop _c
    _beat = (divf (-f $_at $menubg_dancefirst) $menubg_dancebeat)
    _beat = (-f $_beat (*f (floorf (divf $_beat $musicmeter)) $musicmeter)) // into the bar
    _size = (*f $_rowh 0.8) // leaving room in the row to jump up into
    uifill (divf $_w $uiscale) (divf $_rowh $uiscale) [
        uiposition 0 $arg3
        uihlist (divf (*f $_size 0.4) $uiscale) [
            loop i $musicmeter [
                _t = (-f $_beat $i) // beats since this one's beat came round
                _c = (skewcolour $menubg_lyricunsung $menubg_lyricsinging (clampf (divf (*f $_t $menubg_dancebeat) $menubg_lyricfill) 0 1))
                _c = (skewcolour $_c $menubg_lyricsung (clampf (divf (*f (-f $_t 1) $menubg_dancebeat) $menubg_lyricfill) 0 1))
                _c = (| $_c (<< (max 1 (round (*f $arg2 255))) 24))
                _hop = (? (&& [>=f $_t 0] [<f $_t 1]) (*f (-f 1 $_t) (-f 1 $_t) (-f 1 $_t)) 0)
                uifill (divf $_size $uiscale) (divf $_rowh $uiscale) [
                    uiimage (at $menubg_lyricnoteicons (mod $i (listlen $menubg_lyricnoteicons))) $_c 0 (divf $_size $uiscale) (divf $_size $uiscale) [
                        uiimageoutline 1
                        uiposition 0 (*f (-f $_rowh $_size) (-f 1 $_hop))
                    ]
                ]
            ]
        ]
    ]
]

// the theme's lyrics under the hero, the row being sung with the next below it, each row scrolling up into place as it's sung while
// the one before it fades out above and the one after fades in below, all fading in at the start of each part of the song and out
// at the end, with rows of music notes in between while there's no singing
menubg_lyrics = [
    local _at _c _prev _cur _next _joined _more _p _alpha _scale _w _top _room _rowh _y
    _at = $menubg_dancemillis
    // in the middle of the space between the hero's feet and the bottom of the screen, sized so two rows always fit in it
    _top = (+f $menubg_heroy 0.01)
    _room = (-f 1 $menubg_lyricmargin $_top)
    _scale = (minf $menubg_lyricsize (divf $_room (*f 2.2 $uitextscale $uiscale)))
    _rowh = (*f $_scale $uitextscale $uiscale 1.1)
    _y = (*f (-f $_room (*f $_rowh 2)) 0.5)
    _w = (*f (minf $menubg_herox (-f $uiaspect $menubg_herox)) 2)
    _c = -1
    looplist _row $menubg_lyricrows [
        if (>= $_at (- (at $_row 0) $menubg_lyriclead)) [_c = (+ $_c 1)]
    ]
    _alpha = 0
    _more = 0
    _next = (at $menubg_lyricrows (+ $_c 1))
    if (>= $_c 0) [
        _prev = (at $menubg_lyricrows (- $_c 1))
        _cur = (at $menubg_lyricrows $_c)
        _joined = (&& (> $_c 0) [menubg_lyricjoined $_prev $_cur])
        _more = (menubg_lyricjoined $_cur $_next)
        // how far the row has scrolled up into place from below the last, or faded in if it starts a new part
        _p = (clampf (divf (- $_at (- (at $_cur 0) $menubg_lyriclead)) $menubg_lyriclead) 0 1)
        _alpha = (? $_more 1 (clampf (divf (- (+ (at $_cur 1) $menubg_lyriclinger) $_at) $menubg_lyriclinger) 0 1))
        if (! $_joined) [
            _alpha = (minf $_alpha $_p)
            _p = 1
        ]
    ]
    uifill (divf $_w $uiscale) (divf $_room $uiscale) [
        uiposition (-f $menubg_herox (*f $_w 0.5)) $_top
        if (>f $_alpha 0) [
            if $_joined [menubg_lyricrow $_prev (*f $_alpha (-f 1 $_p)) (-f $_y (*f $_p $_rowh))]
            menubg_lyricrow $_cur (*f $_alpha (? $_joined (lerpf $menubg_lyricnext 1 $_p) 1)) (+f $_y (*f (-f 1 $_p) $_rowh))
            // once the row being sung is halfway out of its way, or under music notes, only for the last bar before the singing
            if $_more [
                if (<= (listlen $_cur) 2) [
                    _p = (-f (at $_next 0) $menubg_lyriclead (*f $menubg_dancebeat $musicmeter))
                    menubg_lyricrow $_next (*f $_alpha $menubg_lyricnext (clampf (divf (-f $_at $_p) $menubg_lyriclead) 0 1)) (+f $_y $_rowh)
                ] [menubg_lyricrow $_next (*f $_alpha $menubg_lyricnext (clampf (-f (*f $_p 2) 1) 0 1)) (+f $_y $_rowh)]
            ]
        ]
    ]
]

// a line of menubg_nowplaying, right aligned
// 1:<text> 2:<colour> 3:<scale>
menubg_nowplayingline = [
    uicolourtext $arg1 (| $arg2 $_alpha) $arg3
    uiprev [uialign 1]
]

// how much a line of menubg_nowplaying has to be made smaller by to fit in the room it has, in screen heights, at most 1
// 1:<text> 2:<scale> 3:<room>
menubg_nowplayingfit = [
    local _tw
    _tw = (divf (*f (textwidth $arg1 0 0 0 0) $arg2 $uitextscale $uiscale) (fontheight $textfontoutline))
    ? (>f $_tw $arg3) (divf $arg3 $_tw) 1
]

// what's playing, its title above its artist, right aligned against the eclipse and centred on it
menubg_nowplaying = [
    local _e _w _alpha _name _title _artist _x _fit
    _name = (getmusic 0)
    if (!=s $menubg_nowplayingtrack $_name) [
        menubg_nowplayingtrack = $_name
        menubg_nowplayingmillis = $uilastmillis
    ]
    _e = (backgroundeclipse)
    _x = (-f (at $_e 0) (*f (at $_e 2) $menubg_nowplayinggap))
    _w = (-f $_x $menubg_nowplayingmargin)
    _title = (getmusic 2)
    _artist = (getmusic 1)
    if (=s $_title "") [_title = (substr $_name (+ (strrstr $_name "/") 1))]
    _fit = (minf (menubg_nowplayingfit "Now Playing" $menubg_nowplayinglabel $_w) (menubg_nowplayingfit $_title $menubg_nowplayingtitle $_w))
    _fit = (minf $_fit (menubg_nowplayingfit $_artist $menubg_nowplayingartist $_w))
    if (>f $_w 0) [
        _alpha = (*f (clampf (divf (- $uilastmillis (max $menubg_nowplayingmillis $menubg_showmillis)) $menubg_nowplayingfade) 0 1) 255)
        _alpha = (<< (max 1 (round $_alpha)) 24)
        // centred on the eclipse as a whole, from the top of the sun peeking over the planet to the bottom of the planet
        uifill (divf $_w $uiscale) (divf (*f (at $_e 2) 2.27) $uiscale) [
            uiposition $menubg_nowplayingmargin (-f (at $_e 1) (*f (at $_e 2) 1.27))
            uifont $textfontoutline [
                uivlist 0 [
                    menubg_nowplayingline "Now Playing" $menubg_logoshade (*f $menubg_nowplayinglabel $_fit)
                    menubg_nowplayingline $_title $menubg_logowhite (*f $menubg_nowplayingtitle $_fit)
                    if (!=s $_artist "") [menubg_nowplayingline $_artist $menubg_logored (*f $menubg_nowplayingartist $_fit)]
                ]
            ]
            uiprev [uialign 1]
        ]
    ]
]

// the logo's lettering beside the eclipse, where backgroundlayout put it
menubg_logo = [
    local _rect
    _rect = (backgroundlogo)
    uiimage $logotexttex 0xffffff 1 (at $_rect 2) (at $_rect 3) [
        uiposition (at $_rect 0) (at $_rect 1)
    ]
]

// sets how hard the horizon glow is pulsing on this beat, see menubg_glowdecay
menubg_glowbeat = [
    local _beat _t _pulse
    _pulse = 0
    if (&& $menubg_dancesynced [>=f $menubg_danceclock $menubg_dancefirst]) [
        _beat = (divf (-f $menubg_danceclock $menubg_dancefirst) $menubg_dancebeat)
        if $menubg_dancequiet [
            _t = (divf $_beat (* $musicmeter $menubg_glowquietbars))
            _t = (-f $_t (floorf $_t)) // into the swell, at its brightest as it starts
            _pulse = (*f (+f 0.5 (*f (cos (*f $_t 360)) 0.5)) $menubg_glowquiet)
        ] [
            _t = (-f $_beat (floorf $_beat)) // into the beat
            _pulse = (pow (-f 1 $_t) $menubg_glowdecay)
            if (mod (floor $_beat) $musicmeter) [_pulse = (*f $_pulse $menubg_glowoffbeat)]
        ]
    ]
    backgroundbeat $_pulse
]

newui "menubg" $SURFACE_BACKGROUND [
    // wait until the game is running smoothly before showing anyone, the display isn't settled while it's still starting up,
    // then fade in from that moment
    if (! $menubg_ready) [
        if (&& [! $progressing] [< (- $uilastmillis $menubg_lastbuild) 100]) [menubg_frames = (+ $menubg_frames 1)] [menubg_frames = 0]
        if (>= $menubg_frames 15) [menubg_ready = 1]
        menubg_showmillis = (max $uilastmillis 1)
    ]
    menubg_lastbuild = $uilastmillis

    // lay the scene out between the left edge of the screen and the main menu, wherever the menu ends up
    backgroundlayout (at $ui_gameui_main_dims 1) (at $ui_gameui_main_dims 0) (-f (at $ui_gameui_main_dims 2) (at $ui_gameui_main_dims 0))

    // in time with the theme where it's playing and has its timing beside it, otherwise to the clock at the moves' own tempo
    if (!=s $menubg_dancetrack $musictheme) [
        menubg_dancetrack = $musictheme
        menubg_dancetiming $musictheme
    ]
    menubg_dancemillis = (musicmillis $musictheme)
    menubg_dancesynced = (&& $menubg_dancetimed [>= $menubg_dancemillis 0])
    menubg_dancebeat = $menubg_dancemove
    menubg_dancefirst = 0
    menubg_dancequiet = 0
    if $menubg_dancesynced [
        local _bar _to _length
        menubg_dancebeat = (divf 60000 $musictempo)
        menubg_dancefirst = $musicfirstbeat
        _bar = (*f $menubg_dancebeat $musicmeter)
        // looping back round to the start carries on from the end, as if the track were a whole number of bars long, so the figures
        // keep dancing their moves through it instead of jumping back to the start of them, and stay on the beat
        _length = (getmusic 9)
        if (&& [> $_length 0] [<f $menubg_dancemillis (-f $menubg_dancelast (divf $_length 2))]) [
            menubg_danceloops = (+f $menubg_danceloops (*f (max (round (divf $_length $_bar)) 1) $_bar))
        ]
        menubg_dancelast = $menubg_dancemillis
        menubg_danceclock = (+f $menubg_dancemillis $menubg_danceloops)
        _bar = (divf (-f $menubg_dancemillis $musicfirstbeat) $_bar)
        loop i (div (listlen $musicquiet) 2) [
            _to = (at $musicquiet (+ (* $i 2) 1))
            if (&& [>=f $_bar (at $musicquiet (* $i 2))] [|| [< $_to 0] [<f $_bar $_to]]) [menubg_dancequiet = 1]
        ]
    ] [
        menubg_dancemillis = $uilastmillis
        menubg_danceclock = $uilastmillis
        menubg_danceloops = 0
        menubg_dancelast = 0
    ]
    menubg_glowbeat


    uifill $uiaspect 1 [
        if $menubg_ready [loop i (listlen $menubg_figures) [
            menubg_figure (at $menubg_figures $i) $i
        ]]
        menubg_logo
    ]
] [
    menubg_showmillis = 0
    menubg_ready = 0
    menubg_frames = 0
    backgroundbeat 0
    loop i (listlen $menubg_figures) [alias (concatword menubg_dancing $i) ""]
] [] [&& $menubgplayers [! $isconnected]]

// the lyrics stand in front of the scene's fog, which is drawn over everything in the background, but behind the menus
newui "menubglyrics" $SURFACE_FOREGROUND [
    uizindex -1
    uifill $uiaspect 1 [
        if (&& $menubg_ready $menubglyrics $menubg_dancesynced) [menubg_lyrics]
        if (&& $menubg_ready $menubgnowplaying [getmusic 8]) [menubg_nowplaying]
    ]
] [] [] [&& $menubgplayers [! $isconnected]]
