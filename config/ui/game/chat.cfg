defvarp chatintime 0 250 $varidxmax
defvarp chatouttime 0 15000 $varidxmax
defvarp chatfadetime 0 500 $varidxmax
defvarp chatlines 0 6 $varidxmax
deffvarp chatblend 0 1 1

defvarp chatskin 0 2 4
deffvarp chatskinblend 0.0 0.9 1.0
deffvarp chatskinspace 0 0.001 $fvaridxmax

gameui_chat_msg    = ""
gameui_chat_focus  = 0
gameui_chat_typing = 0
gameui_chat_scroll = 0

// WARNING: Assumes called within ui_gameui_chat_message
// 1:<message id>
gameui_chat_message_chat = [
    local _action _team _team_colour

    _action  = (getmessagelist $arg1 "args" "action")
    _icon    = $chattex
    _preface = (getmessagename $arg1 "client" 0)

    if (& $_action $SAY_WHISPER) [
        _preface = (concat $_preface "whispers")
    ]

    if (& $_action $SAY_TEAM) [
        _team        = (getmessagetag $arg1 "client" 0 "team")
        _icon        = $[team@(at $T_NAMES $_team)tex]
        _team_colour = $[team@(at $T_NAMES $_team)colour]
        _icon_colour = $_team_colour
    ]

    // Actions keep their own colour and read as a sentence
    if (& $_action $SAY_ACTION) [] [
        _preface = (concatword $_preface ":")

        if (& $_action $SAY_TEAM) [
            _text_colour = (modcolour $_team_colour 3)
        ]
    ]
]

// WARNING: Assumes called within ui_gameui_logentry
// 1:<message id>
ui_gameui_chat_message = [
    local _preface _text _text_colour _icon _icon_colour _preface_width _clients _client_matched

    _preface     = ""
    _text_colour = (getmessagelist $arg1 "args" "colour")
    _icon        = $infotex
    _icon_colour = 0xFFFFFF

    cases (getmessagelist $arg1 "args" "type") "chat" [
        _text = (getmessagelist $arg1 "args" "text")
        gameui_chat_message_chat $arg1
    ] "echomsg" [
        _text = (getmessagelist $arg1 "args" "text")
        _icon = $dottex
    ] () [
        _text = (getmessagelist $arg1 "args" "console")
    ]

    _clients        = (getmessagetaggroups $arg1 "client")
    _client_matched = 0

    loopwhile _client $_clients [! $_client_matched] [
        if (= $focusedplayer (getmessagetag $arg1 "client" $_client "clientnum")) [
            _client_matched = 1
            p_colour        = 0x80202020
        ]
    ]

    uiimage $_icon $_icon_colour 0 0 $ui_hud_texttiny [
        uiimageaspect 1
        uiimageshadow 0.001 0x20202020 1
    ]

    _preface_width = 0

    if (!=s $_preface "") [
        uitext $_preface $ui_texttiny [
            uitextalign -1
            _preface_width = $uilastw
        ]
    ]

    uitext $_text $ui_texttiny [
        uitextalign -2
        uicolourset $_text_colour
        uitextwrap (-f 0.475 $ui_hud_texttiny $_preface_width (*f $ui_padsmaller 2))
    ]

    uipropchild [ uistyle lefttop ]
]

// 1:<focused>
ui_gameui_chat_history = [
    local _timeout _lines _growth
    _timeout = (? $arg1 0 $chatouttime)
    _lines   = (? $arg1 500 $chatlines)

    uivlist 0 [
        uistyle leftbottom
        uistyle clampx

        loopmessages (- $_lines) 0 _msg_id [
            _growth = (gameui_logentry_growth (- $totalmillis (getmessagemillis $_msg_id)) $chatintime $_timeout $chatfadetime)

            if (>f $_growth 0) [
                ui_gameui_logentry [
                    ui_gameui_chat_message $_msg_id
                ] [
                    p_tag    = (concatword "message_" (getmessagemillis $_msg_id) "_" (getmessageseqid $_msg_id))
                    p_growth = $_growth
                    p_blend  = (clampf (*f $_growth $chatblend) 0 1)
                    // Only the scrollable history has entries out of view
                    p_cull   = $arg1
                ]
            ]
        ]
    ]
]

// 1:<always show> 2:<width fill>
ui_gameui_chat = [
    if (|| $arg1 $gameui_chat_typing) [
        local _colour

        if (= $gameui_chat_typing 2) [
            _colour = $playerteamcolour
        ] [
            _colour = 0xffffff
        ]

        ui_gameui_group [
            ui_gameui_vscrollarea [
                ui_gameui_chat_history 1
            ] [
                p_width    = 0.4865
                p_height   = 0.15
                p_inverted = 1
                p_scroll_speed = 0.1
            ]
            uiprev [uialign -1 1]

            uifill 0 0.01

            uihlist 0.005 [
                uistyle leftbottom
                uivlist 0 [
                    uistyle leftbottom
                    uiimage "<grey>textures/icons/chat" $_colour 1 0.03 0.03 [
                        uiimageshadow 0.002 0x88010101
                    ]
                    if (= $gameui_chat_typing 2) [
                        uitext "Team:" 0.8
                    ]
                    uifill 0.04
                ]
                uiprev [uialign -2 -1]

                ui_gameui_textinput gameui_chat_msg 42 [
                    p_prompt    = ""
                    p_focus     = $gameui_chat_focus
                    p_text_size = $ui_textsmall
                    p_lines     = 3
                    p_limit     = 100
                    p_on_change = [
                        if (!=s $gameui_chat_msg "") [
                            local say_action; say_action = (=s (at $gameui_chat_msg 0) "/me")
                            local say_type; say_type = (? $say_action "me" "say")
                            local say_text; say_text = (? $say_action (substr $gameui_chat_msg 4) $gameui_chat_msg)
                            if (= $gameui_chat_typing 2) [
                                [@[say_type]team] $say_text
                            ] [
                                [@[say_type]] $say_text
                            ]
                            gameui_chat_msg = ""
                        ]
                        gameui_chat_typing = 0
                    ]
                ]
            ]
        ] [
            p_space_x = 0.01
            p_space_y = 0.01
            p_clamp   = 0
            p_width   = $arg2
            p_colour = 0x44000000
        ]

        if (= $gameui_chat_typing 2) [
            uiprev [
                uiborderedimageclamped $skinshadowtex $_colour 0 $ui_texborder $ui_screenborder 0 0 [
                    uiclamp 1 1 1 1
                ]
            ]
        ]

        if $uianyfocus [] [
            gameui_chat_typing = 0
        ]
    ] [
        ui_gameui_chat_history
    ]
    uiprev [uialign -1 1]

    if $gameui_chat_focus [
        gameui_chat_focus = 0
    ]
]

gameui_chat = [
    gameui_chat_scroll = 0
    gameui_chat_msg    = ""
    gameui_chat_focus  = 1
    gameui_chat_typing = 1
]

gameui_chat_team = [
    if (! (hasmut $G_M_FFA)) [
        gameui_chat
        gameui_chat_typing = 2
    ]
]
