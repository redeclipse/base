                p_label    = "Back"
                p_tip      = "Go back to the page before"
                p_width    = 0.12
                p_height   = 0.04
                p_disabled = (&& [=s $gameui_docs_image ""] [< (listlen $gameui_docs_history) 2])
                p_on_click = [gameui_docs_back]
                p_id       = #(gameui_get_id button)
            ]
            ui_gameui_button [
                p_label    = "Forward"
                p_tip      = "Go forward again"
                p_width    = 0.12
                p_height   = 0.04
                p_disabled = (< (listlen $gameui_docs_ahead) 2)
                p_on_click = [gameui_docs_forward]
                p_id       = #(gameui_get_id button)
            ]
            ui_gameui_button [
                p_label    = "Home"
                p_tip      = "The docs' main page"
                p_width    = 0.12
                p_height   = 0.04
                p_disabled = (=s $gameui_docs_page $GAMEUI_DOCS_HOME)
                p_on_click = [gameui_docs_go $GAMEUI_DOCS_HOME]
                p_id       = #(gameui_get_id button)
            ]
            ui_gameui_textinput gameui_docs_query 40 [
                p_text_size = 1.2
                p_prompt    = "[Search the docs]"
                p_width     = 0.5
                p_on_change = [gameui_docs_search]
            ]
            ui_gameui_button [
                p_label    = "Website"
                p_tip      = "Read this page on the website"
                p_width    = 0.12
                p_height   = 0.04
                p_disabled = 0
                p_on_click = [gameui_openlink (gameui_docs_weburl $gameui_docs_page)]
                p_id       = #(gameui_get_id button)
            ]
        ]

        ui_gameui_horizgroup [
            if (!=s $gameui_docs_searched "") [
                ui_gameui_docs_results
            ] [
                ui_gameui_docs_page
            ]
        ]

        // the link under the cursor, or the page's name
        uispace 0.02 0 [
            uialign -1
            uicolourtext (gameui_docs_status) 0x888888 1 [
                uitextlimit (-f $GAMEUI_PANEL_WIDE 0.05)
            ]
        ]
    ]

    #(ui_gameui_backbutton)
]
