gameui_begin_ids

///////////
// STATE //
///////////

// The page shown, and where it is scrolled to now
gameui_docs_page    = ""
gameui_docs_offset  = 0

// Pages to go back and forward to, as page and scroll position pairs, kept until the game closes
gameui_docs_history = []
gameui_docs_ahead   = []

// Where the page should scroll to next: an anchor, or a position when it's 0 or more
gameui_docs_anchor  = ""
gameui_docs_scroll  = -1

// The link under the cursor, what the status line names it by, and an image opened full size from a link
gameui_docs_link    = ""
gameui_docs_linkfor = ""
gameui_docs_linkname = ""
gameui_docs_image   = ""

// Search: what was typed, and the results for it, four to a result (page, anchor, heading, snippet)
gameui_docs_query   = ""
gameui_docs_results = []
gameui_docs_searched = ""

GAMEUI_DOCS_HOME    = "docs/Home.md"
GAMEUI_DOCS_WEBSITE = "https://www.redeclipse.net/docs/"
GAMEUI_DOCS_HISTORY = 50

// Size of the area pages are read in
GAMEUI_DOCS_W       = 1.2
GAMEUI_DOCS_H       = 0.62


/////////////
// HELPERS //
/////////////

// Opens the Docs reader, on a page if one is given
// 1:<page> 2:<anchor>
gameui_docs_open = [
    if (!=s $arg1 "") [
        gameui_docs_go $arg1 $arg2
    ]
    gameui_open ui_gameui_docs
]

// Goes to a page, keeping the one shown to go back to
// 1:<page> 2:<anchor>
gameui_docs_go = [
    if (!=s $gameui_docs_page "") [
        gameui_docs_history = (concat $gameui_docs_history $gameui_docs_page $gameui_docs_offset)
        if (> (listlen $gameui_docs_history) (* $GAMEUI_DOCS_HISTORY 2)) [
            gameui_docs_history = (sublist $gameui_docs_history 2)
        ]
    ]
    gameui_docs_ahead  = []
    gameui_docs_show $arg1 $arg2 0
]

// Shows a page without touching the history
// 1:<page> 2:<anchor> 3:<scroll position>
gameui_docs_show = [
    gameui_docs_page   = $arg1
    gameui_docs_anchor = $arg2
    gameui_docs_scroll = (? (=s $arg2 "") $arg3 -1)
    gameui_docs_image  = ""
    gameui_docs_link   = ""
    gameui_docs_linkfor = ""
    gameui_docs_query  = ""
    gameui_docs_searched = ""
]

gameui_docs_back = [
    if (!=s $gameui_docs_image "") [
        gameui_docs_image = ""
    ] [
        local _num
        _num = (listlen $gameui_docs_history)
        if (>= $_num 2) [
            gameui_docs_ahead = (concat $gameui_docs_page $gameui_docs_offset $gameui_docs_ahead)
            gameui_docs_show (at $gameui_docs_history (- $_num 2)) "" (at $gameui_docs_history (- $_num 1))
            gameui_docs_history = (sublist $gameui_docs_history 0 (- $_num 2))
        ]
    ]
]

gameui_docs_forward = [
    if (>= (listlen $gameui_docs_ahead) 2) [
        gameui_docs_history = (concat $gameui_docs_history $gameui_docs_page $gameui_docs_offset)
        gameui_docs_show (at $gameui_docs_ahead 0) "" (at $gameui_docs_ahead 1)
        gameui_docs_ahead = (sublist $gameui_docs_ahead 2)
    ]
]

// Follows a link: another page, an image to see full size, or a web address to open in the browser
// A link on a page shown outside the reader opens the reader
// 1:<href> 2:<page the link is on, when it isn't the reader's>
gameui_docs_follow = [
    local _to _outside
    _outside = (&& [>= $numargs 2] [!=s $arg2 ""])
    _to = (docsresolve (? $_outside $arg2 $gameui_docs_page) $arg1)
    cases (at $_to 0) "page" [
        gameui_docs_go (at $_to 1) (at $_to 2)
        if $_outside [gameui_open ui_gameui_docs]
    ] "image" [
        if $_outside [
            gameui_docs_go $arg2
            gameui_open ui_gameui_docs
        ]
        gameui_docs_image = (at $_to 1)
    ] () [
        gameui_openlink (at $_to 1)
    ]
]

// What a link is named by: the title of the page it goes to, with the heading it goes to, or a web address
// 1:<href>
gameui_docs_linktitle = [
    local _to _title _heading
    _to = (docsresolve $gameui_docs_page $arg1)
    cases (at $_to 0) "page" [
        _title = (docstitle (at $_to 1))
        if (=s (at $_to 2) "") [
            result $_title
        ] [
            _heading = (docsheading (at $_to 1) (at $_to 2))
            format "%1: %2" $_title (? (=s $_heading "") (at $_to 2) $_heading)
        ]
    ] "image" [
        result $arg1
    ] () [
        result (at $_to 1)
    ]
]

// The status line under the page: the link under the cursor, or the page's title
gameui_docs_status = [
    if (=s $gameui_docs_link "") [
        docstitle $gameui_docs_page
    ] [
        if (!=s $gameui_docs_link $gameui_docs_linkfor) [
            gameui_docs_linkfor  = $gameui_docs_link
            gameui_docs_linkname = (gameui_docs_linktitle $gameui_docs_link)
        ]
        result $gameui_docs_linkname
    ]
]

// The website's address for a page
// 1:<page>
gameui_docs_weburl = [
    local _name
    _name = (substr $arg1 5 (- (strlen $arg1) 8))
    concatword $GAMEUI_DOCS_WEBSITE (? (=s $_name "Home") "" $_name)
]

gameui_docs_search = [
    gameui_docs_searched = $gameui_docs_query
    gameui_docs_link     = ""
    gameui_docs_results  = (? (=s $gameui_docs_query "") [] (docssearch $gameui_docs_query))
]


///////////
// PANEL //
///////////

ui_gameui_docs_dims  = $GAMEUI_PANEL_WIDE
ui_gameui_docs_title = "Docs"

ui_gameui_docs_on_open = [
    if (=s $gameui_docs_page "") [
        gameui_docs_show $GAMEUI_DOCS_HOME "" 0
    ]
]

ui_gameui_docs_page = [
    if (! (docsexists $gameui_docs_page)) [
        uivlist 0.02 [
            uifill $GAMEUI_DOCS_W $GAMEUI_DOCS_H
            uiprev [
                uivlist 0.02 [
                    uitext "The docs aren't installed with this copy of the game." 1.5
                    uicolourtext "You can read them on the website instead:" 0xaaaaaa 1.2
                    ui_gameui_button [
                        p_label    = "Open the docs on the website"
                        p_width    = 0.4
                        p_on_click = [ gameui_openlink $GAMEUI_DOCS_WEBSITE ]
                        p_id       = #(gameui_get_id button)
                    ]
                ]
            ]
        ]
    ] [
        if (!=s $gameui_docs_image "") [
            ui_gameui_vscrollarea [
                // a document with no page around the image, so back and forward work here too
                uidocument "" $GAMEUI_DOCS_W 1 [
                    uiimage $gameui_docs_image 0xffffff 0 $GAMEUI_DOCS_W 0 [ uiimageaspect 1 ]
                    case (uidocumentnav) -1 [
                        gameui_docs_back
                    ] 1 [
                        gameui_docs_forward
                    ]
                    uirelease [ gameui_docs_image = "" ]
                ]
            ] [
                p_width  = $GAMEUI_DOCS_W
                p_height = $GAMEUI_DOCS_H
            ]
        ] [
            ui_gameui_vscrollarea [
                uidocument $gameui_docs_page $GAMEUI_DOCS_W 1 [
                    if (!=s $gameui_docs_anchor "") [
                        uidocumentanchor $gameui_docs_anchor
                        gameui_docs_anchor = ""
                    ]
                    if (>=f $gameui_docs_scroll 0) [
                        uidocumentscroll $gameui_docs_scroll
                        gameui_docs_scroll = -1
                    ]
                    gameui_docs_offset = (uidocumentoffset)
                    gameui_docs_link   = (uidocumentlink)
                    case (uidocumentnav) -1 [
                        gameui_docs_back
                    ] 1 [
                        gameui_docs_forward
                    ]
                    uirelease [
                        if (!=s $gameui_docs_link "") [
                            gameui_docs_follow $gameui_docs_link
                        ]
                    ]
                ]
            ] [
                p_width  = $GAMEUI_DOCS_W
                p_height = $GAMEUI_DOCS_H
            ]
        ]
    ]
]

ui_gameui_docs_results = [
    local _num
    _num = (div (listlen $gameui_docs_results) 4)
    ui_gameui_vscrollarea [
        uivlist 0.01 [
            uialign -1 -1
            if (= $_num 0) [
                uicolourtext (format "Nothing in the docs matches ^"%1^"." $gameui_docs_searched) 0xaaaaaa 1.2
                uiprev [uialign -1]
            ]
            loop i $_num [
                local _page _anchor _heading _snippet _title
                _page    = (at $gameui_docs_results (* $i 4))
                _anchor  = (at $gameui_docs_results (+ (* $i 4) 1))
                _heading = (at $gameui_docs_results (+ (* $i 4) 2))
                _snippet = (at $gameui_docs_results (+ (* $i 4) 3))
                _title   = (docstitle $_page)
                uitarget $GAMEUI_DOCS_W 0 [
                    uihover [
                        uicolour 0x22ffffff 0 0 [ uistyle clampxy ]
                    ]
                    uivlist 0.002 [
                        uialign -1 -1
                        uicolourtext (? (=s $_heading "") $_title (format "%1 ^fa- %2" $_title $_heading)) 0x66c2ff 1.3
                        uiprev [uialign -1]
                        uicolourtext $_snippet 0xcccccc 1 [
                            uitextwrap $GAMEUI_DOCS_W
                            uitextalign -1
                        ]
                        uiprev [uialign -1]
                    ]
                    uirelease [
                        gameui_docs_go $_page $_anchor
                    ]
                ]
            ]
        ]
    ] [
        p_width  = $GAMEUI_DOCS_W
        p_height = $GAMEUI_DOCS_H
    ]
]

# ui_gameui_docs = [
    #(gameui_begin_ids)

    uivlist 0.02 [
