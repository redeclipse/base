gameui_begin_ids

///////////
// STATE //
///////////

// Name search, matched anywhere in the name with optional * and ? wildcards
gameui_variables_query    = ""

// Index into the categories below
gameui_variables_category = 0

// Bits of the ident types shown
gameui_variables_types    = (| (<< 1 $ididxvar) (<< 1 $ididxfvar) (<< 1 $ididxsvar))

// Only show variables changed from their default
gameui_variables_changed  = 0

// Current page of results
gameui_variables_page     = 0

// Name of the selected variable
gameui_variables_selected = ""

// Value field contents and the variable's value when it was last loaded into the field
gameui_variables_value      = ""
gameui_variables_value_last = ""

// Results per page
GAMEUI_VARIABLES_ROWS     = 15

// Fixed sizes of the result list and the details beside it
GAMEUI_VARIABLES_LIST_W   = 0.6
GAMEUI_VARIABLES_INFO_W   = 0.55
GAMEUI_VARIABLES_H        = (*f $GAMEUI_VARIABLES_ROWS 0.03)

gameui_variables_category_names = ["Settings" "Game" "Map" "All"]
gameui_variables_category_flags = (concat $idfbitpersist $idfbitclient $idfbitmap 0)


/////////////
// HELPERS //
/////////////

// Returns the number of results, or the name of a result
// 1:<index, -1 for the number of results>
gameui_variables_find = [
    if $gameui_variables_types [
        getvarinfo $arg1 $gameui_variables_types 0 (at $gameui_variables_category_flags $gameui_variables_category) 0 (concatword "*" $gameui_variables_query "*") 3 $gameui_variables_changed
    ] [
        result (? (< $arg1 0) 0 "")
    ]
]

// The value of a variable as it's typed in to set it
// 1:<name>
gameui_variables_editstr = [
    if (&& (= (getvartype $arg1) $ididxvar) (& (getvarflags $arg1) $idfbithex)) [
        tohex $$arg1 (? (ui_var_iscolour $arg1) 6 1)
    ] [
        result $$arg1
    ]
]

// The value of a variable for display, empty for commands and aliases
// 1:<name>
gameui_variables_valstr = [
    case (getvartype $arg1) $ididxvar [
        ui_var_valstr $arg1 $$arg1
    ] $ididxfvar [
        result $$arg1
    ] $ididxsvar [
        result $$arg1
    ] () [
        result ""
    ]
]

// 1:<name>
gameui_variables_isdefault = [
    case (getvartype $arg1) $ididxvar [
        = (getvardef $arg1) $$arg1
    ] $ididxfvar [
        =f (getfvardef $arg1) $$arg1
    ] $ididxsvar [
        =s (getsvardef $arg1) $$arg1
    ] () [
        result 1
    ]
]

// Whether a variable can be changed right now
// 1:<name>
gameui_variables_editable = [
    local _type _flags
    _type  = (getvartype $arg1)
    _flags = (getvarflags $arg1)

    && [>= $_type $ididxvar] [<= $_type $ididxsvar] [! (& $_flags $idfbitreadonly)] [
        || [! (& $_flags $idfbitmap)] [& $_flags $idfbitrewrite] [isediting]
    ]
]

// Loads the selected variable's value into the value field
gameui_variables_load = [
    gameui_variables_value      = (gameui_variables_editstr $gameui_variables_selected)
    gameui_variables_value_last = $gameui_variables_value
]

// Reloads the value field when the variable changed elsewhere, leaving any text being typed alone otherwise
gameui_variables_sync = [
    if (!=s (gameui_variables_editstr $gameui_variables_selected) $gameui_variables_value_last) [
        gameui_variables_load
    ]
]

// 1:<name>
gameui_variables_select = [
    gameui_variables_selected = $arg1
    gameui_variables_load
]

// Sets the selected variable from the value field, showing what it was clamped to
gameui_variables_commit = [
    set $gameui_variables_selected $gameui_variables_value
    gameui_variables_load
]

gameui_variables_reset = [
    local _name
    _name = $gameui_variables_selected

    case (getvartype $_name) $ididxvar [
        set $_name (getvardef $_name)
    ] $ididxfvar [
        set $_name (getfvardef $_name)
    ] $ididxsvar [
        set $_name (getsvardef $_name)
    ]
    gameui_variables_load
]

gameui_variables_copy = [
    local _name _text
    _name = $gameui_variables_selected
    _text = (concatword "/" $_name)

    case (getvartype $_name) $ididxvar [
        _text = (concat $_text (gameui_variables_editstr $_name))
    ] $ididxfvar [
        _text = (concat $_text $$_name)
    ] $ididxsvar [
        _text = (concat $_text (escape $$_name))
    ]
    setclipboard $_text
]


//////////////
// PANEL UI //
//////////////

// 1:<result index> 2:<row>
# ui_gameui_variables_entry = [
    local _name _sel _bg _changed
    _name    = (gameui_variables_find $arg1)
    _sel     = (=s $_name $gameui_variables_selected)
    _changed = (! (gameui_variables_isdefault $_name))
    _bg      = (? $_sel #(hsvtohex 8 0.5 0.8) (? (& $arg2 1) 0x555555 0x888888))

    uiborderedimageclamped $skintex $_bg 0 $ui_texborder $ui_screenborder $GAMEUI_VARIABLES_LIST_W 0.03 [
        local _hover
        _hover = 0

        uihover [
            gameui_tip      = (strreplace (getvardesc $_name) "^n" " ")
            gameui_hovering = 1
            _hover          = 1

            uipropagate [uicolourblend 0.66]
            uiinteractive 1
        ] [
            uipropagate [uicolourblend (? $_sel 0.66 0.33)]
        ]

        uirelease [
            gameui_variables_select $_name
            soundbyname S_UI_ACTION
        ]

        uispace 0.015 0 [
            uistyle clampx

            uihlist 0.01 [
                uistyle clampx

                // long names scroll into view while pointed at or selected
                if (|| $_hover $_sel) [
                    ui_gameui_autoscrollh [
                        uitext $_name
                    ] [
                        p_width = 0.36
                    ]
                ] [
                    uiclip 0.36 0 0 0 [
                        uitext $_name [uialign -1]
                    ]
                ]

                uiclip #(-f $GAMEUI_VARIABLES_LIST_W 0.4) 0 0 0 [
                    uicolourtext (gameui_variables_valstr $_name) (? $_changed 0xffff88 0xcccccc) 0.9 [uialign 1]
                ]
            ]
        ]

        ui_gameui_shadow
    ]
]

// 1:<number of results> 2:<number of pages>
# ui_gameui_variables_list = [
    // widgets below have their own arguments
    local _num _pages
    _num   = $arg1
    _pages = $arg2

    ui_gameui_group [
        uiclip $GAMEUI_VARIABLES_LIST_W $GAMEUI_VARIABLES_H 0 0 [
            uifill $GAMEUI_VARIABLES_LIST_W $GAMEUI_VARIABLES_H [
                uivlist 0 [
                    uialign 0 -1

                    local _first _rows
                    _first = (* $gameui_variables_page $GAMEUI_VARIABLES_ROWS)
                    _rows  = (min $GAMEUI_VARIABLES_ROWS (- $_num $_first))

                    loop i $_rows [
                        ui_gameui_variables_entry (+ $_first $i) $i
                    ]
                ]

                if (= $_num 0) [
                    uicolourtext (? $gameui_variables_types "No matches" "No types selected") 0x888888 1.2
                ]
            ]
        ]

        uifill 0 0.01

        uihlist 0.01 [
            ui_gameui_button [
                p_label      = "<<"
                p_label_size = 1.2
                p_width      = 0.04
                p_height     = 0.03
                p_tip        = "First page"
                p_disabled   = (<= $gameui_variables_page 0)
                p_on_click   = [gameui_variables_page = 0]
                p_id         = #(gameui_get_id button)
            ]
            ui_gameui_button [
                p_label      = "<"
                p_label_size = 1.2
                p_width      = 0.04
                p_height     = 0.03
                p_tip        = "Previous page"
                p_disabled   = (<= $gameui_variables_page 0)
                p_on_click   = [gameui_variables_page = (- $gameui_variables_page 1)]
                p_id         = #(gameui_get_id button)
            ]

            uifill 0.18 0 [
                uicolourtext (format "Page %1 of %2" (+ $gameui_variables_page 1) $_pages) 0xaaaaaa
            ]

            ui_gameui_button [
                p_label      = ">"
                p_label_size = 1.2
                p_width      = 0.04
                p_height     = 0.03
                p_tip        = "Next page"
                p_disabled   = (>= $gameui_variables_page (- $_pages 1))
                p_on_click   = [gameui_variables_page = (+ $gameui_variables_page 1)]
                p_id         = #(gameui_get_id button)
            ]
            ui_gameui_button [
                p_label      = ">>"
                p_label_size = 1.2
                p_width      = 0.04
                p_height     = 0.03
                p_tip        = "Last page"
                p_disabled   = (>= $gameui_variables_page (- $_pages 1))
                p_on_click   = [gameui_variables_page = (- $gameui_variables_listpages 1)]
                p_id         = #(gameui_get_id button)
            ]
        ]
    ]
]

// The control for changing the selected variable, picked by its type and range
// 1:<name>
# ui_gameui_variables_editor = [
    local _name _type _flags _slider
    _name   = $arg1
    _type   = (getvartype $_name)
    _flags  = (getvarflags $_name)
    _slider = 0

    if (! (gameui_variables_editable $_name)) [
        uicolourtext (format "Value: ^fw%1" (gameui_variables_valstr $_name)) 0xaaaaaa 1.2 [uitextwrap #(-f $GAMEUI_VARIABLES_INFO_W 0.03); uitextalign -1]
        uicolourtext (? (& $_flags $idfbitreadonly) "This variable is read-only." "Map variables can only be changed while editing.") 0x888888
    ] [
        caseif (&& [= $_type $ididxvar] [= (getvarmin $_name) 0] [= (getvarmax $_name) 1]) [
            uihlist 0.01 [
                uicolourtext "Enabled" 0xaaaaaa
                ui_gameui_compactswitch $_name [
                    p_tip       = "Turn this on or off"
                    p_on_change = [gameui_variables_load]
                    p_id        = #(gameui_get_id compactswitch)
                ]
            ]
        ] (ui_var_iscolour $_name) [
            uihlist 0.01 [
                uicolour (| $$_name 0xff000000) 0.05 0.03 [ui_gameui_shadow]
                ui_gameui_textinput gameui_variables_value 12 [
                    p_text_size = 1.2
                    p_prompt    = "[0xRRGGBB]"
                    p_on_change = [gameui_variables_commit]
                ]
            ]
        ] 1 [
            // game variables are changed on the server, so they aren't dragged around with a slider
            if (! (& $_flags (| $idfbithex $idfbitclient))) [
                case $_type $ididxvar [
                    _slider = (<= (- (getvarmax $_name) (getvarmin $_name)) 1000)
                ] $ididxfvar [
                    _slider = (<=f (-f (getfvarmax $_name) (getfvarmin $_name)) 1000)
                ]
            ]

            if $_slider [
                ui_gameui_slider $_name [
                    p_width     = #(-f $GAMEUI_VARIABLES_INFO_W 0.03)
                    p_tip       = "Drag to change the value"
                    p_on_change = [gameui_variables_load]
                    p_id        = #(gameui_get_id slider)
                ]
                uifill 0 0.01
            ]

            ui_gameui_textinput gameui_variables_value (? (= $_type $ididxsvar) 40 16) [
                p_text_size = 1.2
                p_prompt    = "[Enter a value]"
                p_on_change = [gameui_variables_commit]
            ]
        ]
    ]
]

// Range, default and usage of a variable
// 1:<name>
ui_gameui_variables_info = [
    local _name _type _textstyle
    _name      = $arg1
    _type      = (getvartype $_name)
    _textstyle = [uitextwrap (-f $GAMEUI_VARIABLES_INFO_W 0.03); uitextalign -1]

    case $_type $ididxvar [
        uicolourtext (format "Range: ^fw%1 ^fato ^fw%2" (ui_var_valstr $_name (getvarmin $_name)) (ui_var_valstr $_name (getvarmax $_name))) 0xaaaaaa 1 $_textstyle
        uicolourtext (format "Default: ^fw%1" (ui_var_valstr $_name (getvardef $_name))) 0xaaaaaa 1 $_textstyle
    ] $ididxfvar [
        uicolourtext (format "Range: ^fw%1 ^fato ^fw%2" (getfvarmin $_name) (getfvarmax $_name)) 0xaaaaaa 1 $_textstyle
        uicolourtext (format "Default: ^fw%1" (getfvardef $_name)) 0xaaaaaa 1 $_textstyle
    ] $ididxsvar [
        uicolourtext (format "Default: ^fw%1" (escape (getsvardef $_name))) 0xaaaaaa 1 $_textstyle
    ] $ididxcommand [
        uicolourtext (format "Arguments: ^fw%1" (? (strlen (getvarargs $_name)) (getvarargs $_name) "none")) 0xaaaaaa 1 $_textstyle
    ]

    uicolourtext (concatword "Usage: ^fw" (ui_var_usagestr $_name)) 0xaaaaaa 1 $_textstyle
    if (ui_var_isbitfield $_name) [
        loop i (getvarfields $_name) [
            uicolourtext (format "    ^fw%1^fa = %2" (<< 1 $i) (getvarfields $_name $i)) 0xaaaaaa 1 $_textstyle
        ]
    ]

    if (= $_type $ididxalias) [
        uicolourtext (concatword "Contents: ^fw" (ui_var_aliasstr $_name)) 0xaaaaaa 1 $_textstyle
    ]
]

# ui_gameui_variables_details = [
    ui_gameui_group [
        uiclip $GAMEUI_VARIABLES_INFO_W $GAMEUI_VARIABLES_H 0 0 [
            uifill $GAMEUI_VARIABLES_INFO_W $GAMEUI_VARIABLES_H [
                if (>= (getvartype $gameui_variables_selected) 0) [
                    gameui_variables_sync

                    ui_gameui_vscrollarea [
                        uivlist 0.008 [
                            uialign -1 -1

                            uitext $gameui_variables_selected 1.8
                            uicolourtext (ui_var_typestr $gameui_variables_selected) #(hsvtohex 8 0.3 1) 1

                            if (strlen (getvardesc $gameui_variables_selected)) [
                                uicolourtext (getvardesc $gameui_variables_selected) 0xcccccc 1 [uitextwrap #(-f $GAMEUI_VARIABLES_INFO_W 0.03); uitextalign -1]
                            ]

                            if (<= (getvartype $gameui_variables_selected) $ididxsvar) [
                                uifill 0 0.01
                                ui_gameui_variables_editor $gameui_variables_selected
                            ]
                            uifill 0 0.01
                            ui_gameui_variables_info $gameui_variables_selected

                            uipropchild [uialign -1]
                        ]
                    ] [
                        p_width  = #(-f $GAMEUI_VARIABLES_INFO_W 0.02)
                        p_height = $GAMEUI_VARIABLES_H
                    ]
                ] [
                    uivlist 0.01 [
                        uialign -1 -1
                        uicolourtext "No variable selected" 0xcccccc 1.4
                        uicolourtext "Search by name above and pick a variable from the list." 0x888888 1 [uitextwrap #(-f $GAMEUI_VARIABLES_INFO_W 0.05); uitextalign -1]
                    ]
                ]
            ]
        ]

        uifill 0 0.01

        uihlist 0.01 [
            uialign -1

            ui_gameui_button [
                p_label      = "Reset to default"
                p_label_size = 1.2
                p_width      = 0.18
                p_height     = 0.03
                p_tip        = "Set the variable back to its default value"
                p_disabled   = (|| [! (gameui_variables_editable $gameui_variables_selected)] [gameui_variables_isdefault $gameui_variables_selected])
                p_on_click   = [gameui_variables_reset]
                p_id         = #(gameui_get_id button)
            ]
            ui_gameui_button [
                p_label      = "Copy"
                p_label_size = 1.2
                p_width      = 0.1
                p_height     = 0.03
                p_tip        = "Copy the console command that sets this value"
                p_disabled   = (< (getvartype $gameui_variables_selected) 0)
                p_on_click   = [gameui_variables_copy]
                p_id         = #(gameui_get_id button)
            ]
        ]
    ]
]

// 1:<number of results>
# ui_gameui_variables_filters = [
    local _num
    _num = $arg1

    ui_gameui_group [
        uistyle clampx

        // as tall as the export button, so nothing moves when it appears
        uifill 0 0.03 [
            uistyle clampx

            uihlist 0.02 [
                uistyle clampx

                uihlist 0.02 [
                    uialign -1

                    uicolourtext "Search" 0xaaaaaa
                    ui_gameui_textinput gameui_variables_query 32 [
                        p_text_size = 1.2
                        p_prompt    = "[Search by name]"
                        p_immediate = 1
                        p_on_change = [gameui_variables_page = 0]
                    ]
                    uicolourtext (format "^fw%1 ^fa%2" $_num (? (= $_num 1) "match" "matches")) 0xaaaaaa
                ]

                if (= $gameui_variables_category 1) [
                    ui_gameui_button [
                        p_label      = "Export game vars"
                        p_label_size = 1.2
                        p_width      = 0.18
                        p_height     = 0.03
                        p_tip        = "Write changed game variables to vars_<time>.cfg in your home folder"
                        p_on_click   = [writevars]
                        p_id         = #(gameui_get_id button)
                    ]
                    uiprev [uialign 1]
                ]
            ]
        ]

        uifill 0 0.01

        uihlist 0.01 [
            uialign -1 0

            uicolourtext "Category" 0xaaaaaa
            ui_gameui_switch gameui_variables_category [
                p_width     = 0.2
                p_options   = $gameui_variables_category_names
                p_tip       = "Settings are saved with your profile, game variables come from the server, map variables from the map"
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id switch)
            ]

            uifill 0.02

            uicolourtext "Integer" 0xaaaaaa
            ui_gameui_compactswitch gameui_variables_types [
                p_tip       = "Show whole number variables"
                p_get       = [& $arg1 #(<< 1 $ididxvar)]
                p_set       = [? $arg1 (| $gameui_variables_types #(<< 1 $ididxvar)) (&~ $gameui_variables_types #(<< 1 $ididxvar))]
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id compactswitch)
            ]

            uicolourtext "Float" 0xaaaaaa
            ui_gameui_compactswitch gameui_variables_types [
                p_tip       = "Show decimal number variables"
                p_get       = [& $arg1 #(<< 1 $ididxfvar)]
                p_set       = [? $arg1 (| $gameui_variables_types #(<< 1 $ididxfvar)) (&~ $gameui_variables_types #(<< 1 $ididxfvar))]
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id compactswitch)
            ]

            uicolourtext "String" 0xaaaaaa
            ui_gameui_compactswitch gameui_variables_types [
                p_tip       = "Show text variables"
                p_get       = [& $arg1 #(<< 1 $ididxsvar)]
                p_set       = [? $arg1 (| $gameui_variables_types #(<< 1 $ididxsvar)) (&~ $gameui_variables_types #(<< 1 $ididxsvar))]
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id compactswitch)
            ]

            uicolourtext "Command" 0xaaaaaa
            ui_gameui_compactswitch gameui_variables_types [
                p_tip       = "Show commands, for reference"
                p_get       = [& $arg1 #(<< 1 $ididxcommand)]
                p_set       = [? $arg1 (| $gameui_variables_types #(<< 1 $ididxcommand)) (&~ $gameui_variables_types #(<< 1 $ididxcommand))]
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id compactswitch)
            ]

            uicolourtext "Alias" 0xaaaaaa
            ui_gameui_compactswitch gameui_variables_types [
                p_tip       = "Show script aliases, for reference"
                p_get       = [& $arg1 #(<< 1 $ididxalias)]
                p_set       = [? $arg1 (| $gameui_variables_types #(<< 1 $ididxalias)) (&~ $gameui_variables_types #(<< 1 $ididxalias))]
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id compactswitch)
            ]

            uifill 0.02

            uicolourtext "Changed only" 0xaaaaaa
            ui_gameui_compactswitch gameui_variables_changed [
                p_tip       = "Only show variables changed from their default"
                p_on_change = [gameui_variables_page = 0]
                p_id        = #(gameui_get_id compactswitch)
            ]
        ]
    ]
]

ui_gameui_variables_dims = $GAMEUI_PANEL_WIDE
ui_gameui_variables_title = "Variables"

ui_gameui_variables_on_open = [
    gameui_variables_page = 0
]

# ui_gameui_variables = [
    local _num
    _num = (gameui_variables_find -1)
    gameui_variables_listpages = (max 1 (div (+ $_num (- $GAMEUI_VARIABLES_ROWS 1)) $GAMEUI_VARIABLES_ROWS))
    gameui_variables_page      = (clamp $gameui_variables_page 0 (- $gameui_variables_listpages 1))

    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        ui_gameui_paneltitle

        uispace 0.05 0 [
            uistyle clampx

            uivlist 0.02 [
                uistyle clampx

                ui_gameui_variables_filters $_num

                uihlist 0.02 [
                    uistyle clampx

                    ui_gameui_variables_list $_num $gameui_variables_listpages
                    ui_gameui_variables_details
                ]
            ]
        ]

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]

    #(ui_gameui_backbutton)
]
