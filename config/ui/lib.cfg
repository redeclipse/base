defvarp uisounds 0 1 2
defvarp uiborders 0 1 1
defvarp uishadows 0 0 1

sound_back = (soundslot S_BACK)
ui_interacted = 0
ui_lastinteract = 0
ui_freecursor = 1

uiwidth = [
    result (*f $uiaspect $arg1)
]

// 1:<image> 2:<colour> 3:<alpha> 4:<minw> 5:<minh> 6:<children>
uiaspectimage = [
    uiimage $arg1 $arg2 $arg3 (*f $arg4 (gettexaspect $arg1)) $arg5 $arg6
]

uitoggle = [
    mouseoverride 0
    local topname; topname = (uitopwindow $arg2)
    if (&& (!=s $topname "") (!=s $topname "hud")) [
        if (gameui_has_panel_overlay) [
            gameui_overlay_close
        ] [
            gameui_close
        ]
    ] [
        gameui_main_handler
    ]
]

uiclose = [
    local topname; topname = (uitopwindow $arg2)
    if (&& (!=s $topname "") (!=s $topname "hud")) [
        if $uisounds [sound $sound_back]
        ui_interacted = 0
        ui_lastinteract = 1
    ]
    hideui "tooltip" $SURFACE_FOREGROUND
    hideui $arg1 $arg2
]

uiopen = [
    hideui "tooltip" $SURFACE_FOREGROUND
    showui $arg1 $arg2
]

uicursorset = [
    uihold [uiinteractive 1] [uihover [uiinteractive 1; ui_interacted = 1]]
]

uihighlighting = 0

uisethighlight = [
    uihighlighting = 1
]

uigethighlight = [
    result $uihighlighting
    uihighlighting = 0
]

uiinteract = [
    local highlighting
    highlighting = (uigethighlight)

    uihold [
        uicolourset $arg3
    ] [
        uihover [ highlighting = 1 ]

        if $highlighting [
            uicolourset $arg2
        ] [
            uicolourset $arg1
        ]
    ]
]

// uiskin 1:<w> 2:<h> 3:<bgcolour> 4:<bghover> 5:<bghold> 6:<children> 7:[interact]
uiskin = [
    uiborderedimageclamped $skintex $arg3 0 $ui_texborder $ui_screenborder $arg1 $arg2 [
        if $arg7 [uiinteract $arg3 $arg4 $arg5 1]
        if $uishadows [uiimageshadow $ui_menu_s]
        doargs $arg6
    ]
]
// uiskinborder 1:<w> 2:<h> 3:<bgcolour> 4:<bghover> 5:<bghold> 6:<bordercolour> 7:<borderhover> 8:<borderhold> 9:<children> 10:[children2] 11:[interact] 12:[forced]
uiskinborder = [
    uiborderedimageclamped $skintex $arg3 0 $ui_texborder $ui_screenborder $arg1 $arg2 [
        if $arg11 [uiinteract $arg3 $arg4 $arg5 1]
        if $uishadows [uiimageshadow $ui_menu_s]
        doargs $arg10
        if (|| $arg12 $uiborders) [
            uiborderedimageclamped $skinbordertex $arg6 0 $ui_texborder $ui_screenborder $arg1 $arg2 [
                if $arg11 [uiinteract $arg6 $arg7 $arg8]
                uicolourdir 1
                doargs $arg9
            ]
        ] [
            uitarget $arg1 $arg2 [
                if $arg11 [uiinteract $arg6 $arg7 $arg8]
                doargs $arg9
            ]
        ]
    ]
]

// uidrawtriangle 1:<colour> 2:<w> 3:<h> 4:<orient> 5:[outline]
uidrawtriangle = [
    if $arg1 [] [arg1 = $ui_bline]
    uigroup [
        uitriangle $arg1 $arg2 $arg3 $arg4
        if $arg5 [uitriangleoutline $arg5 $arg2 $arg3 $arg4]
    ]
]

// uiarrowbutton 1:(SIZE-W) 2:(SIZE-H) 3:(ORIENTATION) 4:[on-release] 5:(ARROW-%-SIZE) 6:[children]
uiarrowbutton = [
    local arrowsize
    arrowsize = (*f (minf $arg1 $arg2) (minf 1 (maxf 0 $arg5)))
    uiskinborder $arg1 $arg2 $ui_main1 $ui_main2 $ui_main3 $ui_line $colourred $colourpink [
        doargs $arg6
        uirelease [doargs $arg4]
        uipropchild [uistyle clampxy]
        uidrawtriangle $ui_bline $arrowsize $arrowsize $arg3 $ui_line
    ] [] 1
]

// uivscroll 1:(SIZE-W) 2:(SIZE-H) 3:(SCROLLSPEED) 4:(ARROW-%-SIZE)
uivscroll = [
    if $arg3 [] [arg3 = 1.0]
    if $arg4 [] [arg4 = 0.5]
    uiskinborder $arg1 $arg2 $ui_main1 $ui_main1 $ui_main1 $ui_line $colourred $colourpink [
        uicursorset
        uivlist 0 [
            uistyle clampxy
            uiscrollarrow (-f 0 $arg3) [uiarrowbutton $arg1 $arg1 0 [] $arg4]
            uivscrollbar [
                uifill $arg1 (-f $arg2 (*f $arg1 2)) [uiprev [uistyle clampxy]]
                uiscrollbutton [
                    uiskinborder $arg1 0 $ui_main2 $ui_main3 $ui_main1 $ui_line $colourred $colourpink [
                        uistyle clampxy
                        uipropchild [uistyle clampxy]
                        uivlist 0.004 [loop i 3 [uiline $ui_line (*f $arg1 0.5)]]
                    ] [uistyle clampxy] 1
                ]
            ]
            uiscrollarrow $arg3 [uiarrowbutton $arg1 $arg1 180 [] $arg4]
        ]
    ] [] 1
]

// uihscroll 1:(SIZE-W) 2:(SIZE-H) 3:(SCROLLSPEED) 4:(ARROW-%-SIZE)
uihscroll = [
    if $arg3 [] [arg3 = 1.0]
    if $arg4 [] [arg4 = 0.5]
    uiskinborder $arg1 $arg2 $ui_main1 $ui_main1 $ui_main1 $ui_line $colourred $colourpink [
        uicursorset
        uihlist 0 [
            uistyle clampxy
            uiscrollarrow (-f 0 $arg3) [uiarrowbutton $arg2 $arg2 90 [] $arg4]
            uihscrollbar [
                uifill (-f $arg1 (*f $arg2 2)) $arg2 [uiprev [uistyle clampxy]]
                uiscrollbutton [
                    uiskinborder 0 $arg2 $ui_main2 $ui_main3 $ui_main1 $ui_line $colourred $colourpink [
                        uistyle clampxy
                        uipropchild [uistyle clampxy]
                        uihlist 0.004 [loop i 3 [uiline $ui_line (*f $arg2 0.5)]]
                    ] [uistyle clampxy] 1
                ]
            ]
            uiscrollarrow $arg3 [uiarrowbutton $arg2 $arg2 270 [] $arg4]
        ]
    ] [] 1
]

//uiinput 1:VAR 2:LENGTH 3:[on-change] 4:SCALE 5:[immediate] 6:[prompt] 7:[promptcolour] 8:[tooltip] 9:[children] 10:[children2]
uiinput = [
    if $arg7 [] [arg7 = $colourgrey]
    uiskinborder 0 0 $ui_main1 $ui_main2 $ui_main3 $ui_line $colourred $colourpink [
        uicursorset
        doargs $arg10
        uispace $ui_padsmall $ui_padsmaller [
            ui_input_prompt = ""
            if (uifocus+? 0 1) [
                if (&& (!=s $arg6 "") (=s $$arg1 "")) [ui_input_prompt = $arg6]
                if (!=s $arg8 "") [uitip $arg8]
            ]
            uifield $arg1 $arg2 $arg3 $arg4 $arg5 [
                @(? (!=s $ui_input_prompt "") [uicolourtext $ui_input_prompt $arg7 (*f $arg4 $ui_texttiny)])
                @arg9
            ]
            uicolour // workaround for stale color states
        ]
    ] [] 1
]

uicursorpos = [
    concat $uicursorx $uicursory
]

uicursorpxx = [
    toint (*f (divf $uicursorx $uiaspect) $screenw)
]

uicursorpxy = [
    - $screenh (toint (*f $uicursory $screenh))
]

defvarp doubleclicktime 100 200 1000

ui_last_press = 0
ui_last_press_id = ""

// 1:<id> 2:<code>
uidoublepress = [
    uipress [
        local cur_millis millis_diff
        cur_millis = $totalmillis
        millis_diff = (- $cur_millis $ui_last_press)
        if (&& (=s $ui_last_press_id $arg1) (<= $millis_diff $doubleclicktime)) [
            doargs $arg2
        ]
        ui_last_press = $cur_millis
        ui_last_press_id = $arg1
    ]
]
