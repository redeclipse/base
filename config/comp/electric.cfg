shader $SHADER_DEFAULT compositeelectric [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0; // noiselut
    uniform vec4 params; // seed bolts strikerate jitter
    uniform vec4 shape; // corewidth glowwidth glow jagged
    uniform vec4 curmillis;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    @(compositenoiselut3d)

    float hash(uint n)
    {
        n ^= n >> 16; n *= 0x7feb352du;
        n ^= n >> 15; n *= 0x846ca68bu;
        n ^= n >> 16;
        return float(n >> 8) * (1.0 / 16777216.0);
    }

    // how far a bolt wanders sideways at distance x along it, jagged at several scales
    float wander(float x, float seed, float time)
    {
        vec3 p = vec3(x, seed, time);
        float f = 0.0;
        f += 0.500 * (noise(p) - 0.5); p.x *= 2.3;
        f += 0.250 * (noise(p) - 0.5); p.x *= 2.3;
        f += 0.125 * (noise(p) - 0.5); p.x *= 2.3;
        f += 0.0625 * (noise(p) - 0.5);
        return f;
    }

    // bright thin core and soft halo of a bolt leaving the centre at angle base, alive from start to end along it
    vec2 bolt(float r, float ang, float base, float start, float end, float seed, float time, float width)
    {
        if(r < start || r > end) return vec2(0.0);
        float along = (r - start) / (end - start);
        float path = base + wander(r * 6.0, seed, time) * shape.w * (0.6 + along);
        float d = abs(mod(ang - path + 3.14159265, 6.28318531) - 3.14159265) * r;
        float taper = (1.0 - along * along) * smoothstep(0.0, 0.08, r - start), w = width * mix(1.0, 0.35, along);
        return vec2(exp(-d * d / (w * w)), exp(-d / (w * shape.y))) * taper;
    }

    void main(void)
    {
        vec2 co = texcoord0 * 2.0 - 1.0;
        float r = length(co), ang = atan(co.y, co.x);
        if(r > 1.0) discard;

        // bolts strike out in fresh directions several times a second and crackle in between
        float time = curmillis.x, strike = time * params.z, jitter = time * params.w;
        uint cycle = uint(floor(strike)), tile = uint(params.x);

        vec2 light = vec2(0.0);
        int bolts = int(params.y);
        for(int i = 0; i < bolts; i++)
        {
            uint id = tile * 7919u + uint(i) * 104729u + cycle * 1299709u;
            float base = (float(i) + hash(id)) * 6.28318531 / params.y, len = mix(0.55, 0.95, hash(id + 1u)),
                  bright = mix(0.5, 1.0, hash(id + 2u)), seed = hash(id + 3u) * 211.0;
            light += bolt(r, ang, base, 0.0, len, seed, jitter, shape.x) * bright;

            // a shorter fork splits off part way along
            float fork = len * mix(0.25, 0.6, hash(id + 4u)), side = hash(id + 5u) < 0.5 ? -1.0 : 1.0;
            float forkpath = base + wander(fork * 6.0, seed, jitter) * shape.w * (0.6 + fork / len);
            light += bolt(r, ang, forkpath + side * mix(0.3, 0.7, hash(id + 6u)) * (r - fork) / max(r, 1e-3), fork, mix(fork, len, 0.75), seed + 57.0, jitter, shape.x * 0.7) * bright * 0.7;
        }

        // white-hot node where the bolts meet
        float node = exp(-r * r / 0.006), halo = exp(-r * r / 0.05);
        float core = clamp(light.x + node, 0.0, 1.0), glow = clamp(light.y * shape.z + halo * 0.5, 0.0, 1.0);
        float alpha = clamp(core + glow * (1.0 - core), 0.0, 1.0) * (1.0 - smoothstep(0.85, 1.0, r));
        fragcolor.rg = vec2(mix(0.8, 1.0, core), alpha) * colorscale.ra;
    }
]

newui electric $SURFACE_COMPOSITE [
    @(localargs params [0.0 8.0 14.0 3.0])
    @(localargs shape [0.02 3.0 0.8 0.8])
    execid uiarg1
    uivlist 0 [
        local k; k = 0
        loop i 2 [
            uihlist 0 [
                loop j 2 [
                    uirender compositeelectric 0.5 0.5 [
                        uirendertex "<comp:0,-256,2>noiselut" 0 1
                        uirenderparam params (+f $params1 $k) $params2 $params3 $params4
                        uirenderparam shape $shape1 $shape2 $shape3 $shape4
                    ]
                    k = (+ $k 1)
                ]
            ]
        ]
    ]
]
