// the main menu scene's mist across the screen, carried along with the floor, see hudbackgroundmist
shader $SHADER_DEFAULT compositemenumist [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2D tex0; // noiselut
    uniform vec4 params; // screen aspect, then where the eclipse is across, how far the scene is zoomed out and where its middle is down, see backgroundzoom
    uniform vec4 horizon; // x, y and curve of the horizon in the scene
    uniform vec4 curmillis;
    varying vec2 texcoord0;

    fragdata(0) vec4 fragcolor;

    @(compositenoiselut2d tex0)
    @(hudbackgroundmist)

    void main(void)
    {
        vec2 p = vec2((texcoord0.x - 0.5)*params.x, texcoord0.y - params.w);
        p = vec2(params.y + (p.x - params.y)/params.z, p.y/params.z);
        fragcolor = vec4(mistcarried(p, mistfloorflow(p, horizon.xyz), curmillis.x), 0.0, 1.0);
    }
]

newui menumist $SURFACE_COMPOSITE [
    uirender compositemenumist 1 1 [
        uirendertex "<comp:0,-256,2>noiselut" 0 1
        uirenderparam params $backgroundaspect $backgroundx $backgroundzoom $backgroundmiddle
        uirenderparam horizon $backgroundx $backgroundhorizony $backgroundhorizoncurve 0
    ]
]
