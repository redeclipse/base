shader $SHADER_DEFAULT compositenoiselut [
    attribute vec4 vvertex;
    uniform mat4 hudmatrix;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
    }
] [
    fragdata(0) vec4 fragcolor;

    float hash(uvec2 p)
    {
        uint h = (p.x & 255u) | ((p.y & 255u) << 8);
        h ^= h >> 16; h *= 0x7feb352du;
        h ^= h >> 15; h *= 0x846ca68bu;
        h ^= h >> 16;
        return float(h >> 8) * (1.0 / 16777216.0);
    }

    void main(void)
    {
        // lattice values for 3D noise from a 2D texture: green is slice z and red is slice z+1, offset by (37, 17)
        uvec2 p = uvec2(gl_FragCoord.xy);
        fragcolor = vec4(hash(p + uvec2(37u, 17u)), hash(p), 0.0, 1.0);
    }
]

newui noiselut $SURFACE_COMPOSITE [ uirender compositenoiselut 1 1 ]

// 3D value noise sampled from the noiselut composite, which shaders bind as tex0
compositenoiselut3d = [
    result [
        float noise(vec3 p)
        { // value noise with quintic blending, filtered in hardware from the lattice texture
            vec3 pi = floor(p), pf = p - pi;
            pf = pf * pf * pf * (pf * (pf * 6.0 - 15.0) + 10.0);
            pi = mod(pi, 256.0); // the lattice repeats every 256, keeps texture coordinates precise
            vec2 uv = pi.xy + vec2(37.0, 17.0) * pi.z + pf.xy;
            vec2 slices = texture2DLod(tex0, (uv + 0.5) * (1.0 / 256.0), 0.0).ar; // luminance-alpha swizzle
            return mix(slices.x, slices.y, pf.z);
        }
    ]
]

shader $SHADER_DEFAULT compositenoise [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform vec4 params;
    uniform vec4 curmillis;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    float hash12(vec2 p)
    {
        vec3 p3  = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
    }

    void main()
    {
        float a = 0.0;
        for(int t = 0; t < int(params.x); t++)
        {
            float v = float(t + 1) * params.y;
            vec2 pos = ((texcoord0 * 2.0 - 1.0) * v + curmillis.x * params.z + params.w);
            a += hash12(pos.xy);
        }
        a /= params.x;
        fragcolor = vec4(a, a, a, 1.0) * colorscale;
    }
]

newui noise $SURFACE_COMPOSITE [
    @(localargs params [2.0 0.152 1500.0 50.0])
    execid uiarg1
    uirender compositenoise 1 1 [
        uirenderparam params $params1 $params2 $params3 $params4
    ]
]
// fbm looking out from a centre: across is the angle around it, down is the distance out from it,
// so anything sampling noise along lines from a point can look it up instead
shader $SHADER_DEFAULT compositefbmpolar [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2D tex0; // noiselut
    uniform vec4 params; // distance at the top, distance at the bottom, octaves (3 or 5)
    uniform vec4 drift; // per second across and down, spin per second
    uniform vec4 curmillis;
    varying vec2 texcoord0;

    fragdata(0) vec4 fragcolor;

    @(compositenoiselut2d tex0)

    void main(void)
    {
        float a = texcoord0.x*6.2831853 + curmillis.x*drift.z;
        vec2 p = vec2(cos(a), sin(a))*mix(params.x, params.y, texcoord0.y) + drift.xy*curmillis.x;
        float v = params.z > 3.5 ? fbm(p) : fbm3(p);
        fragcolor = vec4(v, v, v, 1.0);
    }
]

newui fbmpolar $SURFACE_COMPOSITE [
    @(localargs params [0.0 1.0 3.0 0.0])
    @(localargs drift [0.0 0.0 0.0 0.0])
    execid uiarg1
    uirender compositefbmpolar 1 1 [
        uirendertex "<comp:0,-256,2>noiselut" 0 1
        uirenderparam params $params1 $params2 $params3 $params4
        uirenderparam drift $drift1 $drift2 $drift3 $drift4
    ]
]
