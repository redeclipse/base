shader $SHADER_DEFAULT compositenoiselut [
    attribute vec4 vvertex;
    uniform mat4 hudmatrix;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
    }
] [
    fragdata(0) vec4 fragcolor;

    float hash(uvec2 p)
    {
        uint h = (p.x & 255u) | ((p.y & 255u) << 8);
        h ^= h >> 16; h *= 0x7feb352du;
        h ^= h >> 15; h *= 0x846ca68bu;
        h ^= h >> 16;
        return float(h >> 8) * (1.0 / 16777216.0);
    }

    void main(void)
    {
        // lattice values for 3D noise from a 2D texture: green is slice z and red is slice z+1, offset by (37, 17)
        uvec2 p = uvec2(gl_FragCoord.xy);
        fragcolor = vec4(hash(p + uvec2(37u, 17u)), hash(p), 0.0, 1.0);
    }
]

newui noiselut $SURFACE_COMPOSITE [ uirender compositenoiselut 1 1 ]

compositeburn = [
    shader $SHADER_DEFAULT $arg1 [
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        uniform mat4 hudmatrix;
        varying vec2 texcoord0;
        varying vec4 colorscale;

        void main(void)
        {
            gl_Position = hudmatrix * vvertex;
            texcoord0 = vtexcoord0;
            colorscale = vcolor;
        }
    ] [
        uniform sampler2D tex0; // noiselut
        uniform vec4 params; // rotation length iters speed
        uniform vec4 curmillis;
        uniform vec2 rayparams; // steps threshold
        uniform float volstep;
        varying vec2 texcoord0;
        varying vec4 colorscale;

        fragdata(0) vec4 fragcolor;

        float noise(vec3 p)
        { // value noise with quintic blending, filtered in hardware from the lattice texture
            vec3 pi = floor(p), pf = p - pi;
            pf = pf * pf * pf * (pf * (pf * 6.0 - 15.0) + 10.0);
            pi = mod(pi, 256.0); // the lattice repeats every 256, keeps texture coordinates precise
            vec2 uv = pi.xy + vec2(37.0, 17.0) * pi.z + pf.xy;
            vec2 slices = texture2DLod(tex0, (uv + 0.5) * (1.0 / 256.0), 0.0).ar; // luminance-alpha swizzle
            return mix(slices.x, slices.y, pf.z);
        }

        float fnoise(vec3 p, float time)
        {
            vec3 offset = vec3(0.0, 0.5 * time, 0.0);
            p = (p + offset) * 3.0;
            
            float f = 0.0;
            f += 0.50000 * noise(p); p *= 2.0;
            f += 0.25000 * noise(p); p *= 2.0;
            f += 0.12500 * noise(p); p *= 2.0;
            f += 0.06250 * noise(p); p *= 2.0;
            f += 0.03125 * noise(p);
            return f;
        }

        float model(vec3 p, float speed)
        {
            vec3 q = p - vec3(0.0, 0.1, 0.0);
            float sphere = length(q) - params.y;
            
            return (sphere + fnoise(q * 1.5, speed) * 0.4) * 0.8;
        }

        float raymarch(vec3 ro, vec3 rd, float dist, float maxdist, float speed)
        {
            for(int i = 0; i < int(rayparams.x); i++)
            {
                float m = model(ro + rd * dist, speed);
                if(m < rayparams.y) return dist;

                dist += m;
                if(dist > maxdist) break;
            }
            return -1.0;
        }

        float saturation(float bri, float adjustment)
        {
            vec3 brightness = vec3(bri), intensity = vec3(dot(brightness, vec3(0.75))),
                 mixer = mix(intensity, brightness, adjustment);
            return mixer.r;
        }

        vec2 volume(vec3 p, vec3 rd, float speed)
        {
            float td = 0.0, emit = 0.0;
            bool found = false, needemit = false;

            for(int i = 0; i < params.z; i++)
            {
                float m = model(p, speed);
                p += rd * volstep;

                if(needemit)
                { // emission is taken one step past where the density saturates, which is this sample
                    emit = pow(smoothstep(-0.3, 0.0, m), 4.0);
                    needemit = false;
                }

                td += 1.0 - smoothstep(0.0, 0.35, -m);
                if(td > 1.0 && !found)
                {
                    found = needemit = true;
                    td = 1.0;
                }
            }
            if(needemit) emit = pow(smoothstep(-0.3, 0.0, model(p, speed)), 4.0);

            float trans = smoothstep(0.0, 1.0, 1.0 - pow(td / params.z, 4.5));

            float sat = clamp(saturation(((emit * trans) * 0.8 + 0.2) * 0.2, pow(trans, 0.5) * 0.4) * 5.0 - 0.4, 0.0, 1.0);
            return vec2(mix(0.0, sat, trans), clamp(fnoise(p + trans + sat, curmillis.x) * 3.0 - 1.0, 0.0, 1.0) * trans);
        }

        void main(void)
        {
            vec2 co = texcoord0 * 2.0 - 1.0;
            float speed = curmillis.x * params.w, cosrot = cos(params.x), sinrot = sin(params.x);
            vec3 ta = vec3(0.0, 0.1, 0.0);
            vec3 ro = vec3(cosrot, 1.0, sinrot);
            
            vec3 w = normalize(ta - ro);
            vec3 u = normalize(cross(w, vec3(0.0, 1.0, 0.0)));
            vec3 v = normalize(cross(u, w));
            vec3 rd = normalize(mat3(u, v, w) * vec3(co.xy, 1.0));

            // the noise only ever shrinks the sphere, so the surface lies within its bound: march from where the ray enters it
            vec3 oc = ro - ta;
            float b = dot(oc, rd), bound = params.y + rayparams.y / 0.8, h = b * b - dot(oc, oc) + bound * bound;
            if(h < 0.0) discard;
            h = sqrt(h);
            if(-b + h < 0.0) discard;

            float dist = raymarch(ro, rd, max(-b - h, 0.0), -b + h, speed);
            if(dist < 0.0) discard;

            vec3 pos = ro + rd * dist;
            fragcolor.rg = volume(pos, rd, speed) * colorscale.ra;
        }
    ]
]

compositeburn "compositeburnfire"

shader $SHADER_DEFAULT compositesmoke [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0; // noiselut
    uniform vec4 params; // rotation radius samples cyclerate
    uniform vec4 shape; // threshold density shade lobes
    uniform float expand;
    uniform float shading;
    uniform vec4 curmillis;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    float noise(vec3 p)
    { // value noise with quintic blending, filtered in hardware from the lattice texture
        vec3 pi = floor(p), pf = p - pi;
        pf = pf * pf * pf * (pf * (pf * 6.0 - 15.0) + 10.0);
        pi = mod(pi, 256.0); // the lattice repeats every 256, keeps texture coordinates precise
        vec2 uv = pi.xy + vec2(37.0, 17.0) * pi.z + pf.xy;
        vec2 slices = texture2DLod(tex0, (uv + 0.5) * (1.0 / 256.0), 0.0).ar; // luminance-alpha swizzle
        return mix(slices.x, slices.y, pf.z);
    }

    float fbm(vec3 p)
    {
        p *= 3.0;
        float f = 0.0;
        f += 0.50000 * noise(p); p *= 2.0;
        f += 0.25000 * noise(p); p *= 2.0;
        f += 0.12500 * noise(p); p *= 2.0;
        f += 0.06250 * noise(p); p *= 2.0;
        f += 0.03125 * noise(p);
        return f;
    }

    float lobes(vec3 d)
    {
        return smoothstep(0.25, 0.75, 0.6 * noise(d * 2.0) + 0.4 * noise(d * 4.0 + 17.0));
    }

    void main(void)
    {
        vec2 co = texcoord0 * 2.0 - 1.0;
        float cosrot = cos(params.x), sinrot = sin(params.x);
        vec3 ta = vec3(0.0, 0.1, 0.0), ro = vec3(cosrot, 1.0, sinrot);

        // widen the view so the sphere's silhouette lands on the tile edge, the puff then can never be clipped by it
        vec3 oc = ro - ta;
        float fit = params.y * inversesqrt(dot(oc, oc) - params.y * params.y);

        vec3 w = normalize(ta - ro);
        vec3 u = normalize(cross(w, vec3(0.0, 1.0, 0.0)));
        vec3 v = normalize(cross(u, w));
        vec3 rd = normalize(mat3(u, v, w) * vec3(co.xy * fit, 1.0));

        float b = dot(oc, rd), h = b * b - dot(oc, oc) + params.y * params.y;
        if(h <= 0.0) discard;
        h = sqrt(h);
        float t0 = max(-b - h, 0.0), t1 = -b + h;
        if(t1 <= t0) discard;

        // two overlapping cycles grow their noise outwards from the centre and crossfade, so the puff keeps billowing out;
        // each cycle starts from fresh noise and the blend keeps the noise contrast steady through the crossfade
        vec2 cycle = curmillis.x * params.w + vec2(0.0, 0.5), phase = fract(cycle), num = floor(cycle);
        vec2 weight = 1.0 - abs(phase * 2.0 - 1.0), scale = 1.5 / (1.0 + phase * expand);
        vec3 seed0 = vec3(23.17, 11.31, 5.73) * num.x, seed1 = vec3(23.17, 11.31, 5.73) * num.y + vec3(71.3, 3.7, 29.1);
        float contrast = inversesqrt(dot(weight, weight));

        // integrate noisy density through the puff, fading towards its edge so the silhouette stays soft
        int samples = int(params.z);
        float ds = (t1 - t0) / params.z, depth = 0.0, bright = 0.0;
        for(int i = 0; i < samples; i++)
        {
            vec3 q = ro + rd * (t0 + (float(i) + 0.5) * ds) - ta, d = normalize(q);
            float f = (fbm(q * scale.x + seed0) * weight.x + fbm(q * scale.y + seed1) * weight.y - 0.5) * contrast + 0.5;
            // low frequency noise by direction gives the puff a lumpy outline, it only shrinks the edge so it stays inside the sphere
            float lobe = clamp((lobes(d * (1.0 / (1.0 + phase.x * expand)) + seed0) * weight.x + lobes(d * (1.0 / (1.0 + phase.y * expand)) + seed1) * weight.y - 0.5) * contrast + 0.5, 0.0, 1.0);
            float r = dot(q, q) / (params.y * params.y) * (1.0 + lobe * shape.w), dens = max(f - shape.x, 0.0) * max(1.0 - r * r, 0.0);
            depth += dens;
            bright += dens * f;
        }

        float alpha = 1.0 - exp(-depth * ds * shape.y);
        // the denser billows catch more light than the thin wisps around them
        float shade = clamp(1.0 + (bright / max(depth, 1e-4) - 0.55) * shading, 0.25, 2.0);
        fragcolor.rg = vec2(alpha * shape.z * shade, alpha) * colorscale.ra; // premultiplied grey like the original smoke image
    }
]

newui fire $SURFACE_COMPOSITE [
    @(localargs params [0.0 1.0 6.0 2.0])
    @(localargs rayparams [5.0 0.01])
    @(localargs volstep [0.03])
    execid uiarg1
    uivlist 0 [
        @(localdef k 0)
        loop i 2 [
            uihlist 0 [
                loop j 2 [
                    uirender compositeburnfire 0.5 0.5 [
                        uirendertex "<comp:0,-256,2>noiselut" 0 1
                        uirenderparam params (+f $params1 (*f $k 45)) $params2 $params3 $params4
                        uirenderparam rayparams $rayparams1 $rayparams2
                        uirenderparam volstep $volstep1
                    ]
                    k = (+ $k 1)
                ]
            ]
        ]
    ]
]

newui smoke $SURFACE_COMPOSITE [
    @(localargs params [0.0 1.0 4.0 0.6])
    @(localargs shape [0.2 2.2 0.45 1.0])
    @(localargs expand [0.8])
    @(localargs shading [5.5])
    execid uiarg1
    uivlist 0 [
        @(localdef k 0)
        loop i 2 [
            uihlist 0 [
                loop j 2 [
                    uirender compositesmoke 0.5 0.5 [
                        uirendertex "<comp:0,-256,2>noiselut" 0 1
                        uirenderparam params (+f $params1 (*f $k 45)) $params2 $params3 $params4
                        uirenderparam shape $shape1 $shape2 $shape3 $shape4
                        uirenderparam expand $expand1
                        uirenderparam shading $shading1
                    ]
                    k = (+ $k 1)
                ]
            ]
        ]
    ]
]
