// a painted metal sign reading FLAG with an arrow, stood in for luckystrike's flag signs (128x32): it's drawn four times
// down a square texture, so a face that showed one sign still does at the same texture scale, or once across the middle
// for a decal, which takes the texture's shape
// colour: the panel's colour, dir: 0 for the arrow on the left pointing left, 1 for it on the right pointing right,
// rows: how many signs down the texture
newui flagsign $SURFACE_COMPOSITE [
    @(localdef colour 0xC02020)
    @(localdef dir 0)
    @(localdef rows 4)
    execid uiarg1
    uistyle clampxy
    uivlist 0 [
        uistyle centermiddle
        loop i (clamp $rows 1 4) [
            uicolour 0x34383C 1.0 0.25 [
                uicolour 0x60666C 0.98 0.22 [
                    uicolour $colour 0.95 0.19 [
                        uifont "play/clear/bold" [
                            uihlist 0.04 [
                                uistyle centermiddle
                                if (! $dir) [uitriangle 0xFFFFFF 0.1 0.12 90]
                                uitext "FLAG" 7 [uicolourset 0xFFFFFF]
                                if $dir [uitriangle 0xFFFFFF 0.1 0.12 270]
                            ]
                        ]
                    ]
                ]
            ]
        ]
    ]
]
