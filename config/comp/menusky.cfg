// the main menu scene's sky noise across the screen, see hudbackgroundsky
shader $SHADER_DEFAULT compositemenusky [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2D tex0; // noiselut
    uniform vec4 params; // screen aspect
    uniform vec4 curmillis;
    varying vec2 texcoord0;

    fragdata(0) vec4 fragcolor;

    @(compositenoiselut2d tex0)
    @(hudbackgroundsky)

    void main(void)
    {
        fragcolor = vec4(skyfields(vec2((texcoord0.x - 0.5)*params.x, texcoord0.y - 0.5), curmillis.x), 1.0);
    }
]

newui menusky $SURFACE_COMPOSITE [
    uirender compositemenusky 1 1 [
        uirendertex "<comp:0,-256,2>noiselut" 0 1
        uirenderparam params $backgroundaspect 0 0 0
    ]
]
