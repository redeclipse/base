// The player docs: characters the game's charset has no glyph for
// docsymbol code "texture": drawn as a small image in the text
// docreplace code "text": replaced by text the charset has

docsymbol 0x2606 "textures/icons/star" // ☆
docsymbol 0x2605 "textures/icons/star" // ★
docsymbol 0x2B50 "textures/icons/star" // ⭐
docsymbol 0x2713 "textures/icons/tick" // ✓
docsymbol 0x2714 "textures/icons/tick" // ✔
docsymbol 0x2705 "textures/icons/tick" // ✅
docsymbol 0x2715 "textures/icons/cross" // ✕
docsymbol 0x2716 "textures/icons/cross" // ✖
docsymbol 0x2717 "textures/icons/cross" // ✗
docsymbol 0x274C "textures/icons/cross" // ❌
docsymbol 0x2022 "textures/icons/dot" // •
docsymbol 0x26A0 "textures/icons/warning" // ⚠

docreplace 0x2010 "-" // ‐
docreplace 0x2011 "-" // ‑
docreplace 0x2012 "-" // ‒
docreplace 0x2013 "-" // –
docreplace 0x2014 "-" // —
docreplace 0x2015 "-" // ―
docreplace 0x2212 "-" // −
docreplace 0x2018 "'" // ‘
docreplace 0x2019 "'" // ’
docreplace 0x201C "^"" // “
docreplace 0x201D "^"" // ”
docreplace 0x2026 "..." // …
docreplace 0x00D7 "x" // ×
docreplace 0x00B0 " degrees" // °
docreplace 0x2192 "->" // →
docreplace 0x2190 "<-" // ←
docreplace 0x2194 "<->" // ↔
docreplace 0x21D2 "=>" // ⇒
docreplace 0x2264 "<=" // ≤
docreplace 0x2265 ">=" // ≥
docreplace 0x2260 "!=" // ≠
docreplace 0x2248 "~" // ≈
docreplace 0x00B1 "+/-" // ±
docreplace 0x00A9 "(c)" // ©
docreplace 0x00AE "(R)" // ®
docreplace 0x2122 "(TM)" // ™
