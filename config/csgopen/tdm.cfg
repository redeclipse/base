// Regole server CSGOpen TDM v0.1. Eseguire sul server, mai come sole variabili client.
// Valori di prototipo nelle unità di Red Eclipse, non una replica di CS:GO.
sv_defaultmode $G_DEATHMATCH
sv_defaultmuts 0
sv_rotatemode 0
sv_rotatemuts 0
sv_modelockfilter (<< 1 $G_DEATHMATCH)
sv_mutslockfilter 0
sv_mutslockforce 0
sv_waitforplayers 0
sv_botbalance 2
sv_balancemaps 0

sv_playerhealth 100
sv_bothealth 100
sv_healthscale 1
sv_maxhealth 1
// Conserva movimento, salto e crouch; elimina regen e melee; il preset limita il secondario allo zoom AWP.
sv_playerabilities (& $A_A_PLAYER (~ (| (<< 1 $A_A_REGEN) (<< 1 $A_A_MELEE))))
sv_botabilities (& $A_A_BOT (~ (| (<< 1 $A_A_REGEN) (<< 1 $A_A_MELEE))))
// Friendly fire enabled for humans and bots, with no team damage reduction.
sv_playerteamdamage $A_T_PLAYER
sv_botteamdamage $A_T_PLAYER
sv_damageteamscale 1
sv_playerspawndelay 3000
sv_botspawndelay 3000

// Il salto a terra usa IM_T_JUMP: non azzerare tutto il sistema impulse.
sv_playerimpulse (<< 1 $IM_T_JUMP)
sv_botimpulse (<< 1 $IM_T_JUMP)
sv_movespeed 0.55
sv_moverun 1
sv_movesprint 1
sv_movestraight 1
sv_movestrafe 1
sv_moveaccelscale 0.75
sv_movebrakescale 1.25
// Shot buildup multiplies posture spread; full recovery from the cap takes 1.2 s.
sv_spreadburstadd 0.35
sv_pistolspreadburstscale 2
sv_spreadburstmax 1.5
sv_spreadburstrecovery 1200

// Pistol semiautomatica + SMG automatico esistenti, proiettili non hitscan.
// Shared spawnstate validates a primary plus an exclusive SMG/utility choice.
sv_playerweaponspawn $W_PISTOL
sv_botweaponspawn $W_PISTOL
sv_playermaxcarry 2
sv_botmaxcarry 2
sv_pistoldisabled 0
sv_smgdisabled 0
// Desert Eagle / PP-Bizon reference: weapon-reference.json (sheet gid=0).
// Keep damagescale 0.1: engine damage 530/270 gives torso damage 53/27.
sv_pistoldamage1 530
sv_pistoldamagetorso1 1
sv_pistoldamagehead1 3.9
sv_pistoldelayattack1 225
sv_pistolfullauto1 0
sv_pistolammoclip 7
sv_pistolammoadd 7
sv_pistolammoitem 7
sv_pistolammospawn 28
sv_pistolammostore 21
sv_smgdamage1 270
sv_smgdamagetorso1 1
sv_smgdamagehead1 4
sv_smgdelayattack1 80
sv_smgfullauto1 1
sv_smgammoclip 64
sv_smgammoadd 64
sv_smgammoitem 64
sv_smgammospawn 192
sv_smgammostore 128
// Primary fire spread: standing 1x, running 3x, crouched 0.5x.
// Moving while crouched: moving 2x * crouch 0.5x = 1x.
sv_pistolspread1 1
sv_pistolspreadstill1 1
sv_pistolspreadmoving1 2
sv_pistolspreadrunning1 3
sv_pistolspreadsprinting1 3
sv_pistolspreadcrouch1 0.5
sv_pistolspreadinair1 2
sv_smgspread1 2
sv_smgspreadstill1 1
sv_smgspreadmoving1 2
sv_smgspreadrunning1 3
sv_smgspreadsprinting1 3
sv_smgspreadcrouch1 0.5
sv_smgspreadinair1 2
sv_clawdisabled 1
sv_sworddisabled 1
sv_shotgundisabled 1
sv_flamerdisabled 1
sv_plasmadisabled 1
sv_zapperdisabled 1
sv_rifledisabled 1
sv_corroderdisabled 1
sv_grenadedisabled 1
sv_minedisabled 1
sv_rocketdisabled 1
sv_minigundisabled 1
sv_jetsawdisabled 1
sv_eclipsedisabled 1
sv_meleedisabled 1
// Adatta il danno alla scala salute 1000 -> 100.
sv_damagescale 0.1
sv_playerspawngrenades 0
sv_botspawngrenades 0
sv_playerspawnmines 0
sv_botspawnmines 0
sv_spreeprize 0
sv_spreemaxprize 0
sv_spreebreakprize 0
sv_revengeprize 0
sv_janitorlimit 0
sv_kamikaze 0

exec config/csgopen/arsenal.cfg
exec config/csgopen/he.cfg
exec config/csgopen/smoke-grenade.cfg
exec config/csgopen/proximity-mine.cfg
exec config/csgopen/grenade-launcher.cfg

// Four total utility slots; quantities live in the clip, without reloads.
sv_grenadeammoclip 4
sv_corroderammoclip 4
sv_mineammoclip 4
sv_savevars
