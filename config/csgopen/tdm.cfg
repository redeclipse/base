// Regole server CSGOpen TDM v0.1. Eseguire sul server, mai come sole variabili client.
// Valori di prototipo nelle unità di Red Eclipse, non una replica di CS:GO.
sv_defaultmode $G_DEATHMATCH
sv_defaultmuts 0
sv_rotatemode 0
sv_rotatemuts 0
sv_modelockfilter (<< 1 $G_DEATHMATCH)
sv_mutslockfilter 0
sv_mutslockforce 0
sv_waitforplayers 0
sv_botbalance 2
sv_balancemaps 0

sv_playerhealth 100
sv_bothealth 100
sv_healthscale 1
sv_maxhealth 1
// Conserva movimento, salto e crouch; elimina regen, melee arena e fuoco alternativo.
sv_playerabilities (& $A_A_PLAYER (~ (| (<< 1 $A_A_REGEN) (<< 1 $A_A_MELEE) (<< 1 $A_A_SECONDARY))))
sv_botabilities (& $A_A_BOT (~ (| (<< 1 $A_A_REGEN) (<< 1 $A_A_MELEE) (<< 1 $A_A_SECONDARY))))
// Friendly fire enabled for humans and bots, with no team damage reduction.
sv_playerteamdamage $A_T_PLAYER
sv_botteamdamage $A_T_PLAYER
sv_damageteamscale 1
sv_playerspawndelay 3000
sv_botspawndelay 3000

// Il salto a terra usa IM_T_JUMP: non azzerare tutto il sistema impulse.
sv_playerimpulse (<< 1 $IM_T_JUMP)
sv_botimpulse (<< 1 $IM_T_JUMP)
sv_movespeed 0.55
sv_moverun 1
sv_movesprint 1
sv_movestraight 1
sv_movestrafe 1
sv_moveaccelscale 0.75
sv_movebrakescale 1.5

// Pistol semiautomatica + SMG automatico esistenti, proiettili non hitscan.
// spawnstate risolve anche i loadout non validi verso la sola arma ammessa.
sv_playerweaponspawn $W_PISTOL
sv_botweaponspawn $W_PISTOL
sv_playermaxcarry 1
sv_botmaxcarry 1
sv_pistoldisabled 0
sv_smgdisabled 0
sv_clawdisabled 1
sv_sworddisabled 1
sv_shotgundisabled 1
sv_flamerdisabled 1
sv_plasmadisabled 1
sv_zapperdisabled 1
sv_rifledisabled 1
sv_corroderdisabled 1
sv_grenadedisabled 1
sv_minedisabled 1
sv_rocketdisabled 1
sv_minigundisabled 1
sv_jetsawdisabled 1
sv_eclipsedisabled 1
sv_meleedisabled 1
// Adatta il danno alla scala salute 1000 -> 100.
sv_damagescale 0.1
sv_playerspawngrenades 0
sv_botspawngrenades 0
sv_playerspawnmines 0
sv_botspawnmines 0
sv_spreeprize 0
sv_spreemaxprize 0
sv_spreebreakprize 0
sv_revengeprize 0
sv_janitorlimit 0
sv_kamikaze 0

// Salva i default di sessione per cleanup, resetvars e fine partita.
sv_savevars
