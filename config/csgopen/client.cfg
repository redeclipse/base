// Solo preferenze locali; le regole arrivano sempre dal server.
// Preserve the chosen primary across restarts; initialize only an empty loadout.
if (= (listlen $playerloadweap) 0) [playerloadweap $W_SMG]
showloadoutmenu 1
damagedivisor 1

// Indicate current primary-fire spread through the ammunition ring radius.
clipspread 1

// Select the HE independently of the primary loadout.
bind G [weapon $W_GRENADE 1]

// Select the smoke grenade independently of the HE.
bind H [weapon $W_CORRODER 1]

// No player silhouettes or damage highlights through geometry.
playerhalos 0
playerhalodamage 0

// Hide labels above map pickups and dropped loot. Player labels are team-only.
entityitemui -1
entityprojui -1

// Select the circular proximity mine.
bind J [weapon $W_MINE 1]
