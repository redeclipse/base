        csgopen_smoke_check (= (getclientcanshoot "" $W_SHOTGUN 1) 0) shotgun_secondary_policy
        csgopen_smoke_check (=f $shotgunradial1 0) shotgun_no_splash
        csgopen_smoke_check (= $shotgunresidual1 0) shotgun_no_residual
    ]
    sleep 4501 [spectate 1; gameui_player_reset; gameui_player_loadout_filter = 0; gameui_player_loadout_set $W_PLASMA; csgopen_smoke_check (gameui_player_loadout_validate) menu_primary_valid; gameui_player_set; sleep 1100 [spectate 0]]
