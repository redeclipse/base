csgopen_smoke_spawn = [
    csgopen_smoke_check (= (getclienthealth) 100) actual_health
    csgopen_smoke_check (= (getclientspawnhealth) 100) spawn_health
    csgopen_smoke_check (= (getclientmaxhealth) 100) max_health
    csgopen_smoke_check (= (getclientweapclip "" $W_PISTOL) 7) pistol
    csgopen_smoke_check (= (getclientweapclip "" $W_SMG) 64) smg
    csgopen_smoke_check (=f (getclientweapbloom "" $W_PISTOL) 0) pistol_bloom_reset
    csgopen_smoke_check (=f (getclientweapbloom "" $W_SMG) 0) smg_bloom_reset
    csgopen_smoke_check (= (getclientweapclip "" $W_MINE) 1) mine_spawn
    csgopen_smoke_check (= (getclientweapstore "" $W_MINE) 0) mine_no_reserve
    csgopen_smoke_check (= (getclientweapclip "" $W_CORRODER) 1) smoke_spawn
    csgopen_smoke_check (= (getclientweapstore "" $W_CORRODER) 0) smoke_no_reserve
    csgopen_smoke_check (= (getclientweapclip "" $W_GRENADE) 1) he_spawn
    csgopen_smoke_check (= (getclientweapstore "" $W_GRENADE) 0) he_no_reserve
    csgopen_smoke_check (= (getclientweapstore "" $W_PISTOL) 21) pistol_reserve
    csgopen_smoke_check (= (getclientweapstore "" $W_SMG) 128) smg_reserve
    loop i $W_MAX [if (&& (!= $i $W_PISTOL) (!= $i $W_SMG) (!= $i $W_SHOTGUN) (!= $i $W_PLASMA) (!= $i $W_ZAPPER) (!= $i $W_RIFLE) (!= $i $W_MINIGUN) (!= $i $W_GRENADE) (!= $i $W_MINE) (!= $i $W_CORRODER)) [csgopen_smoke_check (= (getclientweapclip "" $i) -1) (concat disabled_weapon $i)]]
    echo (concat ACTUAL_PLAYER (getclientnum) TEAM (getclientteam) STATE (getclientstate) HP (getclienthealth))
]
csgopen_smoke_wait = [
    if (= (getclientstate) 0) [
        csgopen_smoke_rules
        csgopen_smoke_spawn
        weapon $W_GRENADE 1
        csgopen_smoke_check (= (getclientweapselect) $W_GRENADE) he_selection
        echo START_RESPAWN_TEST
        suicide
        sleep 500 [csgopen_smoke_death = (getclientlastdeath)]
        sleep 1000 [spectate 1; sleep 100 [spectate 0]]
        sleep 2500 [csgopen_smoke_check (!= (getclientstate) 0) respawn_not_early]
        sleep 4000 [
            csgopen_smoke_check (= (getclientstate) 0) respawn_alive
            csgopen_smoke_spawn
            csgopen_smoke_rules
            // Timestamp client di messaggi distinti: tolleranza di 50 ms al limite.
            csgopen_smoke_check (>= (- (getclientlastspawn) $csgopen_smoke_death) 2950) respawn_delay_actual
            echo (concat RESPAWN_ELAPSED (- (getclientlastspawn) $csgopen_smoke_death))
            echo START_MAP_CHANGE
            tdm dutility
            sleep 9000 [
                csgopen_smoke_rules
                echo (concat CHANGED_MAP $mapname HEALTH $playerhealth SPEED $movespeed)
                echo (concat SMOKE_DONE FAILURES $csgopen_smoke_failures)
                quit
            ]
        ]
    ] [sleep 500 [csgopen_smoke_wait]]
]

csgopen_arsenal_start = [
    sleep 1 [spectate 1; gameui_player_reset; gameui_player_loadout_filter = 0; gameui_player_loadout_set $W_SHOTGUN; csgopen_smoke_check (gameui_player_loadout_validate) menu_primary_valid; gameui_player_set; sleep 1100 [spectate 0]]
    sleep 4000 [
        csgopen_smoke_check (= (getclientstate) 0) shotgun_alive
        csgopen_smoke_check (= (getclientweapclip "" $W_SHOTGUN) 7) shotgun_loadout_clip
        csgopen_smoke_check (= (getclientweapstore "" $W_SHOTGUN) 32) shotgun_loadout_reserve
