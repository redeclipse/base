csgopen_arsenal_wait = [if (= (getclientstate) 0) [csgopen_arsenal_start] [sleep 500 [csgopen_arsenal_wait]]]
connect 127.0.0.1 28801
sleep 3000 [spectate 0; csgopen_arsenal_wait]
sleep 80000 [echo ARSENAL_TIMEOUT; quit]
