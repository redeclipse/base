// Run against the loopback dedicated server. Checks real inventories after respawn.
showloadoutmenu 0
name "Loadout validation"
csgopen_loadout_failures = 0
csgopen_loadout_case = 0
csgopen_loadout_map_check = 0
csgopen_loadout_cases = [[7 0 10 10 9 11] [12 0 10 10 10 10 10] [12 4 10 9 11 10 9] [7 6 0 0 0 0] [8 0 0 0 0 0 0] [2 7 12 10 11 9 1] [4 4 10 10 10 10 10] [7 0 10 10 10 10 10 9 11] [13] [7 0 9 9 9 9 9]]
// Expected primary, secondary, HE count, smoke count, mine count.
csgopen_loadout_expected = [[7 0 2 1 1] [12 0 4 0 0] [12 4 0 0 0] [7 6 0 0 0] [8 0 0 0 0] [4 0 1 1 1] [4 0 4 0 0] [7 0 4 0 0] [13 0 1 1 1] [7 0 0 4 0]]
csgopen_loadout_check = [
    if $arg1 [echo (concat LOADOUT_PASS $csgopen_loadout_case $arg2)] [
        csgopen_loadout_failures = (+ $csgopen_loadout_failures 1)
        echo (concat LOADOUT_FAIL $csgopen_loadout_case $arg2)
    ]
]
csgopen_loadout_verify = [
    local _expected _primary _secondary _weap _count
    _expected = (at $csgopen_loadout_expected $csgopen_loadout_case)
    _primary = (at $_expected 0)
    _secondary = (at $_expected 1)
    csgopen_loadout_check (= (getclientstate) 0) alive
    csgopen_loadout_check (= (getclientweapselect) $_primary) primary_selected
    csgopen_loadout_check (= (getclientweapclip "" $W_PISTOL) 7) deagle_clip
    csgopen_loadout_check (= (getclientweapstore "" $W_PISTOL) 21) deagle_reserve
    csgopen_loadout_check (= (getclientweapclip "" $_primary) $(concatword (at $W_NAMES $_primary) ammoclip)) primary_clip
    csgopen_loadout_check (= (getclientweapstore "" $_primary) $(concatword (at $W_NAMES $_primary) ammostore)) primary_reserve
    if $_secondary [
        csgopen_loadout_check (= (getclientweapclip "" $_secondary) $(concatword (at $W_NAMES $_secondary) ammoclip)) secondary_clip
        csgopen_loadout_check (= (getclientweapstore "" $_secondary) $(concatword (at $W_NAMES $_secondary) ammostore)) secondary_reserve
    ]
    loop i 3 [
        _weap = (at [10 9 11] $i)
        _count = (at $_expected (+ $i 2))
        csgopen_loadout_check (= (max (getclientweapclip "" $_weap) 0) $_count) (concat utility $_weap)
        csgopen_loadout_check (= (getclientweapstore "" $_weap) 0) (concat utility_no_reload $_weap)
    ]
    loop i $W_MAX [
        if (&& (!= $i $W_PISTOL) (!= $i $_primary) (!= $i $_secondary) (!= $i 10) (!= $i 9) (!= $i 11)) [
            csgopen_loadout_check (= (getclientweapclip "" $i) -1) (concat unselected_weapon $i)
        ]
    ]
    echo (concat LOADOUT_ACTUAL $csgopen_loadout_case PROFILE $playerloadweap HE (getclientweapclip "" 10) SMOKE (getclientweapclip "" 9) MINE (getclientweapclip "" 11))
    csgopen_loadout_case = (+ $csgopen_loadout_case 1)
    if (< $csgopen_loadout_case (listlen $csgopen_loadout_cases)) [
        csgopen_loadout_live_primary = (getclientweapselect)
        csgopen_loadout_live_utilities = (+ (max (getclientweapclip "" 10) 0) (max (getclientweapclip "" 9) 0) (max (getclientweapclip "" 11) 0))
        playerloadweap (at $csgopen_loadout_cases $csgopen_loadout_case)
        sleep 300 [
            csgopen_loadout_check (= (getclientweapselect) $csgopen_loadout_live_primary) waits_for_respawn_primary
            csgopen_loadout_check (= (+ (max (getclientweapclip "" 10) 0) (max (getclientweapclip "" 9) 0) (max (getclientweapclip "" 11) 0)) $csgopen_loadout_live_utilities) waits_for_respawn_grenades
            suicide; sleep 1000 [spectate 1; sleep 100 [spectate 0]]; sleep 4200 [csgopen_loadout_verify]]
    ] [
        if (! $csgopen_loadout_map_check) [
            csgopen_loadout_map_check = 1
            csgopen_loadout_case = (- $csgopen_loadout_case 1)
            tdm dutility
            sleep 9000 [spectate 0; sleep 1000 [csgopen_loadout_verify]]
        ] [echo (concat LOADOUT_DONE FAILURES $csgopen_loadout_failures); quit]
    ]
]
// Exercise the same save callbacks used by the menu, including slot duplicates.
gameui_player_loadout_slots = [7 0 10 9 11 0]
gameui_player_loadout_cur_slot = 1
gameui_player_loadout_set 6
csgopen_loadout_check (=s $playerloadweap "7 6 0 0 0 0") ui_secondary_excludes_grenades
gameui_player_loadout_cur_slot = 2
gameui_player_loadout_set 10
csgopen_loadout_check (=s $playerloadweap "7 0 10 0 0 0") ui_grenade_excludes_secondary
gameui_player_loadout_cur_slot = 3
gameui_player_loadout_set 10
csgopen_loadout_check (=s $playerloadweap "7 0 10 10 0 0") ui_duplicate_grenades
gameui_player_loadout_cur_slot = 0
gameui_player_loadout_set 12
csgopen_loadout_check (=s $playerloadweap "12 0 10 10 0 0") ui_launcher_primary
playerloadweap (at $csgopen_loadout_cases 0)
connect 127.0.0.1 28801
sleep 3000 [spectate 0; sleep 7000 [csgopen_loadout_verify]]
sleep 5000 [gameui_player_show_loadout]
sleep 80000 [echo LOADOUT_TIMEOUT; quit]
