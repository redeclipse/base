// Smoke test volontario: server dev.sh server gia avviato su 127.0.0.1:28801.
// Muore, rientra tramite spectator (senza simulare tasti), cambia mappa e chiude.
// Cercare SMOKE_DONE FAILURES 0 nel log; quit da solo non segnala assert falliti.
name "CSGOpen smoke"
csgopen_smoke_failures = 0
csgopen_smoke_check = [if (! $arg1) [csgopen_smoke_failures = (+ $csgopen_smoke_failures 1); echo (concat CHECK_FAIL $arg2)] [echo (concat CHECK_PASS $arg2)]]
csgopen_smoke_rules = [
    csgopen_smoke_check (= $gamemode $G_DEATHMATCH) mode
    csgopen_smoke_check (= $mutators 0) mutators
    csgopen_smoke_check (= $playerhealth 100) playerhealth
    csgopen_smoke_check (= $bothealth 100) bothealth
    csgopen_smoke_check (= $playerimpulse (<< 1 $IM_T_JUMP)) impulse
    csgopen_smoke_check (= (& $playerabilities (<< 1 $A_A_REGEN)) 0) no_regen
    csgopen_smoke_check (= $playerteamdamage $A_T_PLAYER) friendly_fire_players
    csgopen_smoke_check (= $botteamdamage $A_T_PLAYER) friendly_fire_bots
    csgopen_smoke_check (=f $damageteamscale 1) friendly_fire_scale
    csgopen_smoke_check (= $playerspawndelay 3000) delay
    csgopen_smoke_check (=f $moveaccelscale 0.75) accel
    csgopen_smoke_check (=f $movebrakescale 1.25) brake
    csgopen_smoke_check (=f $pistolspreadburstscale 2) pistol_burst_scale
    csgopen_smoke_check (=f $spreadburstadd 0.35) burst_add
    csgopen_smoke_check (=f $spreadburstmax 1.5) burst_cap
    csgopen_smoke_check (= $spreadburstrecovery 1200) burst_recovery
    csgopen_smoke_check (=f $pistolspread1 1) pistol_spread
    csgopen_smoke_check (=f $smgspread1 2) smg_spread
    csgopen_smoke_check (=f $pistolspreadstill1 1) pistol_still
    csgopen_smoke_check (=f $smgspreadstill1 1) smg_still
    csgopen_smoke_check (=f $pistolspreadmoving1 2) pistol_moving
    csgopen_smoke_check (=f $smgspreadmoving1 2) smg_moving
    csgopen_smoke_check (=f $pistolspreadrunning1 3) pistol_running
    csgopen_smoke_check (=f $smgspreadrunning1 3) smg_running
    csgopen_smoke_check (=f $pistolspreadsprinting1 3) pistol_sprinting
    csgopen_smoke_check (=f $smgspreadsprinting1 3) smg_sprinting
    csgopen_smoke_check (=f $pistolspreadcrouch1 0.5) pistol_crouch
    csgopen_smoke_check (=f $smgspreadcrouch1 0.5) smg_crouch
    csgopen_smoke_check (=f $pistolspreadinair1 2) pistol_air
    csgopen_smoke_check (=f $smgspreadinair1 2) smg_air
]
csgopen_smoke_spawn = [
    csgopen_smoke_check (= (getclienthealth) 100) actual_health
    csgopen_smoke_check (= (getclientspawnhealth) 100) spawn_health
    csgopen_smoke_check (= (getclientmaxhealth) 100) max_health
    csgopen_smoke_check (= (getclientweapclip "" $W_PISTOL) 10) pistol
    csgopen_smoke_check (= (getclientweapclip "" $W_SMG) 40) smg
    csgopen_smoke_check (=f (getclientweapbloom "" $W_PISTOL) 0) pistol_bloom_reset
    csgopen_smoke_check (=f (getclientweapbloom "" $W_SMG) 0) smg_bloom_reset
    loop i $W_MAX [if (&& (!= $i $W_PISTOL) (!= $i $W_SMG)) [csgopen_smoke_check (= (getclientweapclip "" $i) -1) (concat disabled_weapon $i)]]
    echo (concat ACTUAL_PLAYER (getclientnum) TEAM (getclientteam) STATE (getclientstate) HP (getclienthealth))
]
csgopen_smoke_wait = [
    if (= (getclientstate) 0) [
        csgopen_smoke_rules
        csgopen_smoke_spawn
        echo START_RESPAWN_TEST
        suicide
        sleep 500 [csgopen_smoke_death = (getclientlastdeath)]
        sleep 1000 [spectate 1; sleep 100 [spectate 0]]
        sleep 2500 [csgopen_smoke_check (!= (getclientstate) 0) respawn_not_early]
        sleep 4000 [
            csgopen_smoke_check (= (getclientstate) 0) respawn_alive
            csgopen_smoke_spawn
            csgopen_smoke_rules
            // Timestamp client di messaggi distinti: tolleranza di 50 ms al limite.
            csgopen_smoke_check (>= (- (getclientlastspawn) $csgopen_smoke_death) 2950) respawn_delay_actual
            echo (concat RESPAWN_ELAPSED (- (getclientlastspawn) $csgopen_smoke_death))
            echo START_MAP_CHANGE
            tdm dutility
            sleep 9000 [
                csgopen_smoke_rules
                echo (concat CHANGED_MAP $mapname HEALTH $playerhealth SPEED $movespeed)
                echo (concat SMOKE_DONE FAILURES $csgopen_smoke_failures)
                quit
            ]
        ]
    ] [sleep 500 [csgopen_smoke_wait]]
]
connect 127.0.0.1 28801
sleep 3000 [spectate 0; csgopen_smoke_wait]
sleep 45000 [echo SMOKE_TIMEOUT; quit]
