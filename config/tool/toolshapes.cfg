// The Shapes panel: geometry from a formula built over the selection, added to what is there or carved out of it

tool_goto_control_Shapes = [
    toolpanel_open tool_shapes right [
        p_title       = "Shapes"
        p_clear_stack = 1
    ]
]

// 1:<description> 2:<tags> 3:<param>
tool_shape_register_control = [
    tool_register_control $arg1 $arg2 "Shapes" $arg3
]

// The shapes the panel builds, in the order the picker lists them
TOOL_SHAPE_NAMES = [Sphere Cylinder Tunnel "Pipe bend" Torus Paraboloid Octahedron Helix Box Cone]

TOOL_SHAPE_SPHERE     = 0
TOOL_SHAPE_CYLINDER   = 1
TOOL_SHAPE_TUNNEL     = 2
TOOL_SHAPE_PIPEBEND   = 3
TOOL_SHAPE_TORUS      = 4
TOOL_SHAPE_PARABOLOID = 5
TOOL_SHAPE_OCTAHEDRON = 6
TOOL_SHAPE_HELIX      = 7
TOOL_SHAPE_BOX        = 8
TOOL_SHAPE_CONE       = 9

tool_shape_type    = 0
tool_shape_carve   = 0
tool_shape_detail  = 2
tool_shape_radius  = 4
tool_shape_height  = 8
tool_shape_minor   = 1
tool_shape_coil    = 3
tool_shape_scalex  = 1
tool_shape_scaley  = 1
tool_shape_scalez  = 1
tool_shape_sizex   = 4
tool_shape_sizey   = 4
tool_shape_sizez   = 4
tool_shape_round   = 1
tool_shape_offx    = 0
tool_shape_offy    = 0
tool_shape_offz    = 0

tool_shape_terrain        = ""
tool_shape_terrain_height = 16
tool_shape_smc            = ""
tool_shape_smc_voxel      = 0

// Whether the current shape takes an offset in its box (the helix doesn't)
tool_shape_has_offset = [
    != $tool_shape_type $TOOL_SHAPE_HELIX
]

// The box the current shape builds, as "x y z" in cubes of the selection's grid size, as its command reckons it
tool_shape_box = [
    local _r _ox _oy _oz
    _r  = $tool_shape_radius
    _ox = (ceil $tool_shape_offx)
    _oy = (ceil $tool_shape_offy)
    _oz = (ceil $tool_shape_offz)

    case $tool_shape_type $TOOL_SHAPE_SPHERE [
        result (concat (+ (ceil (*f $_r 2 $tool_shape_scalex)) $_ox) (+ (ceil (*f $_r 2 $tool_shape_scaley)) $_oy) (+ (ceil (*f $_r 2 $tool_shape_scalez)) $_oz))
    ] $TOOL_SHAPE_CYLINDER [
        result (concat (+ (ceil (*f $_r 2)) $_ox) (+ (ceil (*f $_r 2)) $_oy) (+ (ceil $tool_shape_height) $_oz))
    ] $TOOL_SHAPE_TUNNEL [
        result (concat (+ (ceil (*f $_r 2)) $_ox 1) (+ (ceil $tool_shape_height) $_oy) (+ (ceil (*f $_r 2)) $_oz))
    ] $TOOL_SHAPE_PIPEBEND [
        result (concat (+ (ceil (*f $_r 2)) $_ox) (+ (ceil (*f $_r 2)) $_oy) (+ (ceil (*f $tool_shape_minor 2)) $_oz))
    ] $TOOL_SHAPE_TORUS [
        result (concat (+ (ceil (*f $_r 2)) $_ox) (+ (ceil (*f $_r 2)) $_oy) (+ (ceil (*f $tool_shape_minor 2)) $_oz))
    ] $TOOL_SHAPE_HELIX [
        local _s
        _s = (ceil (*f (+f $_r $tool_shape_coil) 2))
        result (concat $_s $_s $_s)
    ] $TOOL_SHAPE_BOX [
        result (concat (+ (ceil $tool_shape_sizex) $_ox) (+ (ceil $tool_shape_sizey) $_oy) (+ (ceil $tool_shape_sizez) $_oz))
    ] $TOOL_SHAPE_CONE [
        result (concat (+ (ceil (*f $_r 2)) $_ox) (+ (ceil (*f $_r 2)) $_oy) (+ (ceil $tool_shape_height) $_oz))
    ] () [
        // paraboloid and octahedron
        result (concat (+ (ceil (*f $_r 2)) $_ox) (+ (ceil (*f $_r 2)) $_oy) (+ (ceil (*f $_r 2)) $_oz))
    ]
]

// Why the current shape can't be built now, or nothing when it can
tool_shape_problem = [
    local _box
    _box = (tool_shape_box)
    shapeproblem (at $_box 0) (at $_box 1) (at $_box 2)
]

// Builds the current shape over the selection
tool_shape_build = [
    local _d _c
    _d   = $tool_shape_detail
    _c   = $tool_shape_carve

    case $tool_shape_type $TOOL_SHAPE_SPHERE [
        buildsphere $tool_shape_radius $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $tool_shape_scalex $tool_shape_scaley $tool_shape_scalez $_c
    ] $TOOL_SHAPE_CYLINDER [
        buildcylinder $tool_shape_radius $tool_shape_height $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_TUNNEL [
        buildtunnel $tool_shape_radius $tool_shape_height $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_PIPEBEND [
        buildpipebend $tool_shape_radius $tool_shape_minor $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_TORUS [
        buildtorus $tool_shape_radius $tool_shape_minor $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_PARABOLOID [
        buildparaboloid $tool_shape_radius $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_OCTAHEDRON [
        buildoctahedron $tool_shape_radius $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_HELIX [
        buildhelix $tool_shape_radius $tool_shape_coil $_d $_c
    ] $TOOL_SHAPE_BOX [
        buildbox $tool_shape_sizex $tool_shape_sizey $tool_shape_sizez $tool_shape_round $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ] $TOOL_SHAPE_CONE [
        buildcone $tool_shape_radius $tool_shape_height $_d $tool_shape_offx $tool_shape_offy $tool_shape_offz $_c
    ]
]

// The box terrain from the chosen image builds, one cube smaller than the image on each side, or nothing without one
tool_shape_terrain_box = [
    local _size
    _size = (? (!=s $tool_shape_terrain "") (gettexsize $tool_shape_terrain 1 0) "")
    if (!=s $_size "") [
        result (concat (- (at $_size 0) 1) (- (at $_size 1) 1) (ceil $tool_shape_terrain_height))
    ]
]

// Why terrain can't be built from the chosen image now, or nothing when it can
tool_shape_terrain_problem = [
    local _box
    if (=s $tool_shape_terrain "") [
        result "Choose a heightmap image first"
    ] [
        _box = (tool_shape_terrain_box)
        if (=s $_box "") [
            result "The heightmap image can't be loaded"
        ] [
            shapeproblem (at $_box 0) (at $_box 1) (at $_box 2)
        ]
    ]
]

// Why a file can't be imported now, or nothing when it can; its box is only known once it is read
tool_shape_smc_problem = [
    if (=s $tool_shape_smc "") [
        result "Choose an SMC file first"
    ] [
        shapeproblem 1 1 1
    ]
]

tool_action ta_shapes [
    p_short_desc = "Shapes panel"
    p_long_desc  = "Open the Shapes panel, to build spheres, boxes, terrain and other shapes over the selection"
    p_icon       = "<grey>textures/icons/edit/shape"
    p_category   = "Shapes"
    p_code       = [
        toolpanel_toggle tool_shapes right [
            p_title       = "Shapes"
            p_clear_stack = 1
        ]
    ]
]

tool_action ta_shape_build [
    p_short_desc = "Build shape"
    p_long_desc  = "Build the shape chosen in the Shapes panel over the selection"
    p_icon       = "<grey>textures/icons/edit/shape"
    p_category   = "Shapes"
    p_code       = [
        tool_shape_build
    ]
]
