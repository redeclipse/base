toolbind F1 ta_textures (kmod SHIFT)
toolbind F1 ta_help
toolbind F4 ta_recalc
toolbind F8 ta_save
toolbind F8 ta_save_as (kmod SHIFT)
toolbind Z ta_undo
toolbind O ta_redo
toolbind C ta_copy
toolbind C ta_grab (kmod SHIFT)
toolbind C ta_ent_cycle_snapmode (kmod CTRL SHIFT)
toolbind V ta_paste
toolbind J ta_tex_get
toolbind Y ta_tex_apply
toolbind X ta_flip
toolbind M ta_toggle_showmat
toolbind M ta_setmat (kmod CTRL)
toolbind X ta_focus_axis_x (kmod SHIFT)
toolbind Y ta_focus_axis_y (kmod SHIFT)
toolbind Z ta_focus_axis_z (kmod SHIFT)

// The default preset's keys for these, kept so they don't fall through to chat or walking
toolbindalso T ta_tex_apply
toolbindalso T ta_tex_get (kmod SHIFT)
toolbindalso S ta_save (kmod CTRL)
toolbindalso S ta_save_as (kmod CTRL SHIFT)
toolbindalso Z ta_redo (kmod CTRL SHIFT)

toolbindpreset legacy
