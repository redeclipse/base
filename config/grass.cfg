// 8: a hot spot at its top
grassheadshapedef "Glowing bulb" [
    grassheadshapestalk 1.2 0.23 0.4 0 0.2
    grassheadshapesize 0.07
    grassheadshapeplace above 0.9
    grassheadshapeglow 1
    grassheadshapeaccent 0xFFF6D8
    grassheadshapelevel 0 -1 0
    grassheadshapelevel 1 -0.7 0.71
    grassheadshapelevel 2 -0.25 0.97
    grassheadshapelevel 3 0.25 0.97
    grassheadshapelevel 4 0.7 0.71 [ grassheadshapelevelcolour head 1 0.5 ]
    grassheadshapelevel 5 1 0 [ grassheadshapelevelcolour accent 1 0 ]
