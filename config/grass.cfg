// the colours grass textures in maps before version 58 are imported as, from root through the middle to the tip
// grassimport <texture> <root> <middle> <tip>, the texture without its extension or <commands>

grassimport "luckystrike/grass_lucky" 0x563905 0x503604 0x472F04
grassimport "luckystrike/grass_lucky_alt" 0x344D20 0x30481E 0x2C411B
grassimport "luckystrike/grass_lucky_bright" 0x204D1D 0x1E471B 0x1B4219
grassimport "luckystrike/grass_lucky_green" 0x454318 0x3E3C16 0x3A3816
grassimport "nobiax/grass01" 0x3B3126 0x73614B 0x9B8C6D
grassimport "nobiax/grass02" 0x3C3126 0x71604B 0x928365
grassimport "nobiax/grass03" 0x392F25 0x73624C 0x8E7F62
grassimport "nobiax/grassbush" 0x383020 0x6B563D 0x836547
grassimport "textures/grass" 0x6D6338 0x5B522C 0x1E1711

// grassbladeshapedef <name> [<body>]: the shapes around grass blades, as seen cut across them, picked by texgrassbladeshape <index>
// maps keep a shape's index, so the list only grows: never remove or reorder a shape, only add new ones to the end
// in the body: grassbladeshapeopen 1 for lines seen from both sides rather than rings around the blade, grassbladeshapesmooth 1
// for normals that blend between the points, and grassbladeshapepoints [x y ...] for each line or ring, from -1 to 1 across the
// blade's width, y towards its front, anticlockwise around a ring, up to 16 points and 4 parts

// 0: as grass has always been
grassbladeshapedef "Flat" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0 1 0]
]

// 1: folded along its middle
grassbladeshapedef "Folded" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0.4 0 -0.2 1 0.4]
]

// 2: curled into a channel, like a rush leaf
grassbladeshapedef "Channelled" [
    grassbladeshapeopen 1
    grassbladeshapesmooth 1
    grassbladeshapepoints [-1 0.5 -0.65 -0.05 0 -0.25 0.65 -0.05 1 0.5]
]

// 3: two flat blades crossed, an X from above
grassbladeshapedef "Cross" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-0.7 -0.7 0.7 0.7]
    grassbladeshapepoints [-0.7 0.7 0.7 -0.7]
]

// 4: two flat blades crossed, a + from above
grassbladeshapedef "Plus" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0 1 0]
    grassbladeshapepoints [0 -1 0 1]
]

// 5: three fins, a Y from above
grassbladeshapedef "Fins" [
    grassbladeshapeopen 1
    grassbladeshapepoints [0 0 0 1]
    grassbladeshapepoints [0 0 -0.866 -0.5]
    grassbladeshapepoints [0 0 0.866 -0.5]
]

// 6: three flat blades crossed, six fins from above
grassbladeshapedef "Asterisk" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0 1 0]
    grassbladeshapepoints [-0.5 -0.866 0.5 0.866]
    grassbladeshapepoints [-0.5 0.866 0.5 -0.866]
]

// 7
grassbladeshapedef "Triangle" [
    grassbladeshapepoints [0 1 -0.866 -0.5 0.866 -0.5]
]

// 8
grassbladeshapedef "Square" [
    grassbladeshapepoints [-0.75 -0.75 0.75 -0.75 0.75 0.75 -0.75 0.75]
]

// 9
grassbladeshapedef "Diamond" [
    grassbladeshapepoints [0 -1 1 0 0 1 -1 0]
]

// 10
grassbladeshapedef "Pentagon" [
    grassbladeshapepoints [0 1 -0.951 0.309 -0.588 -0.809 0.588 -0.809 0.951 0.309]
]

// 11
grassbladeshapedef "Hexagon" [
    grassbladeshapepoints [0 1 -0.866 0.5 -0.866 -0.5 0 -1 0.866 -0.5 0.866 0.5]
]

// 12
grassbladeshapedef "Octagon" [
    grassbladeshapepoints [0.924 0.383 0.383 0.924 -0.383 0.924 -0.924 0.383 -0.924 -0.383 -0.383 -0.924 0.383 -0.924 0.924 -0.383]
]

// 13: five points
grassbladeshapedef "Star" [
    grassbladeshapepoints [0 1 -0.265 0.364 -0.951 0.309 -0.428 -0.139 -0.588 -0.809 0 -0.45 0.588 -0.809 0.428 -0.139 0.951 0.309 0.265 0.364]
]

// 14: flat at the back, a D from above
grassbladeshapedef "Half-round" [
    grassbladeshapepoints [-1 -0.5 1 -0.5 0.866 0 0.5 0.366 0 0.5 -0.5 0.366 -0.866 0]
]

// 15
grassbladeshapedef "Round" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 1 -0.5 0.866 -0.866 0.5 -1 0 -0.866 -0.5 -0.5 -0.866 0 -1 0.5 -0.866 0.866 -0.5 1 0 0.866 0.5 0.5 0.866]
]

// 16: flattened, like a leek
grassbladeshapedef "Oval" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 0.5 -0.5 0.433 -0.866 0.25 -1 0 -0.866 -0.25 -0.5 -0.433 0 -0.5 0.5 -0.433 0.866 -0.25 1 0 0.866 0.25 0.5 0.433]
]

// 17: round with grooves, like horsetail
grassbladeshapedef "Fluted" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 1 -0.306 0.739 -0.707 0.707 -0.739 0.306 -1 0 -0.739 -0.306 -0.707 -0.707 -0.306 -0.739 0 -1 0.306 -0.739 0.707 -0.707 0.739 -0.306 1 0 0.739 0.306 0.707 0.707 0.306 0.739]
]

// 18: round at the back, narrowing to an edge at the front
grassbladeshapedef "Teardrop" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 1 -0.386 0.11 -0.591 -0.246 -0.52 -0.65 -0.205 -0.914 0.205 -0.914 0.52 -0.65 0.591 -0.246 0.386 0.11]
]
