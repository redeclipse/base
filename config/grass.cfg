    grassheadshapeaccent 0x4E3A6B
    grassheadshapelevel 0 -1 0 [ grassheadshapelevellobe 0.7 0.3 2.5 1.3 1 0; grassheadshapelevelcolour head 0.8 0.8 ]
    grassheadshapelevel 1 -0.85 0.22 [ grassheadshapelevellobe 0.7 0.3 2.5 1.3 1 0; grassheadshapelevelcolour head 0.86 0.6 ]
    grassheadshapelevel 2 -0.35 0.24 [ grassheadshapelevellobe 0.7 0.3 2.5 1.3 1 0; grassheadshapelevelcolour head 0.92 0.3 ]
    grassheadshapelevel 3 0.2 0.2 [ grassheadshapelevellobe 0.7 0.3 2.5 1.3 1 0; grassheadshapelevelcolour head 0.98 0 ]
    grassheadshapelevel 4 0.7 0.13 [ grassheadshapelevellobe 0.7 0.3 2.5 1.3 1 0; grassheadshapelevelcolour head 1.04 0 ]
    grassheadshapelevel 5 1.05 0 [ grassheadshapelevellobe 0.7 0.3 2.5 1.3 1 0; grassheadshapelevelcolour head 1.1 0 ]
]

// 7: a tuft paling to its tips over green bracts
grassheadshapedef "Thistle" [
    grassheadshapestalk 1.3 0.28 0.7 0 0.2
    grassheadshapesize 0.1
    grassheadshapeplace tip 0
    grassheadshapeaccent 0xEBD3F0
    grassheadshapelevel 0 -0.6 0 [ grassheadshapelevelcolour stalk 0.9 0 ]
    grassheadshapelevel 1 -0.35 0.45 [ grassheadshapelevelcolour stalk 0.9 0 ]
    grassheadshapelevel 2 0.05 0.55 [ grassheadshapelevelcolour stalk 0.9 0 ]
    grassheadshapelevel 3 0.3 0.3 [ grassheadshapelevelcolour stalk 0.9 0 ]
    grassheadshapelevel 4 0.65 0.6 [ grassheadshapelevellobe 1 0 0 0 0 0.55; grassheadshapelevelcolour head 1 0.35 ]
    grassheadshapelevel 5 0.75 0 [ grassheadshapelevelcolour head 1 0.8 ]
