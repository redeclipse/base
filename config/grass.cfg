    grassheadshapesize 0.08
    grassheadshapeplace above 0.9
    grassheadshapeaccent 0x8C7A55
    grassheadshapelevel 0 -1 0 [ grassheadshapelevellobe 0.9 0.1 7 2 0 0; grassheadshapelevelcolour accent 1 0 ]
    grassheadshapelevel 1 -0.7 0.71 [ grassheadshapelevellobe 0.9 0.1 7 2 0 0; grassheadshapelevelcolour head 0.94 0.6 ]
    grassheadshapelevel 2 -0.25 0.97 [ grassheadshapelevellobe 0.9 0.1 7 2 0 0; grassheadshapelevelcolour head 0.98 0 ]
    grassheadshapelevel 3 0.25 0.97 [ grassheadshapelevellobe 0.9 0.1 7 2 0 0; grassheadshapelevelcolour head 1.02 0 ]
    grassheadshapelevel 4 0.7 0.71 [ grassheadshapelevellobe 0.9 0.1 7 2 0 0; grassheadshapelevelcolour head 1.06 0 ]
    grassheadshapelevel 5 1 0 [ grassheadshapelevellobe 0.9 0.1 7 2 0 0; grassheadshapelevelcolour head 1.1 0 ]
]

// 5: paler inside
grassheadshapedef "Bell" [
    grassheadshapestalk 1.15 0.23 0.2 0.6 0.2
    grassheadshapesize 0.1
    grassheadshapeplace hang 0.4
    grassheadshapeaccent 0xF2E6EE
    grassheadshapelevel 0 0 0 [ grassheadshapelevelcolour stalk 1 0 ]
    grassheadshapelevel 1 0.15 0.3
    grassheadshapelevel 2 0.45 0.42
    grassheadshapelevel 3 0.8 0.55
    grassheadshapelevel 4 1 0.85 [ grassheadshapelevellobe 0.85 0.15 6 0 0 0; grassheadshapelevelcolour head 1 0.35 ]
    grassheadshapelevel 5 0.7 0 [ grassheadshapelevelcolour accent 0.6 0 ]
]

