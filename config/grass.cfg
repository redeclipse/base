// the colours grass textures in maps before version 58 are imported as, from root through the middle to the tip
// grassimport <texture> <root> <middle> <tip>, the texture without its extension or <commands>

grassimport "luckystrike/grass_lucky" 0x563905 0x503604 0x472F04
grassimport "luckystrike/grass_lucky_alt" 0x344D20 0x30481E 0x2C411B
grassimport "luckystrike/grass_lucky_bright" 0x204D1D 0x1E471B 0x1B4219
grassimport "luckystrike/grass_lucky_green" 0x454318 0x3E3C16 0x3A3816
grassimport "nobiax/grass01" 0x3B3126 0x73614B 0x9B8C6D
grassimport "nobiax/grass02" 0x3C3126 0x71604B 0x928365
grassimport "nobiax/grass03" 0x392F25 0x73624C 0x8E7F62
grassimport "nobiax/grassbush" 0x383020 0x6B563D 0x836547
grassimport "textures/grass" 0x6D6338 0x5B522C 0x1E1711

// grassbladeshapedef <name> [<body>]: the shapes around grass blades, as seen cut across them, picked by texgrassbladeshape <index>
// maps keep a shape's index, so the list only grows: never remove or reorder a shape, only add new ones to the end
// in the body: grassbladeshapeopen 1 for lines seen from both sides rather than rings around the blade, grassbladeshapesmooth 1
// for normals that blend between the points, and grassbladeshapepoints [x y ...] for each line or ring, from -1 to 1 across the
// blade's width, y towards its front, anticlockwise around a ring, up to 16 points and 4 parts

// 0: as grass has always been
grassbladeshapedef "Flat" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0 1 0]
]

// 1: folded along its middle
grassbladeshapedef "Folded" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0.4 0 -0.2 1 0.4]
]

// 2: curled into a channel, like a rush leaf
grassbladeshapedef "Channelled" [
    grassbladeshapeopen 1
    grassbladeshapesmooth 1
    grassbladeshapepoints [-1 0.5 -0.65 -0.05 0 -0.25 0.65 -0.05 1 0.5]
]

// 3: two flat blades crossed, an X from above
grassbladeshapedef "Cross" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-0.7 -0.7 0.7 0.7]
    grassbladeshapepoints [-0.7 0.7 0.7 -0.7]
]

// 4: two flat blades crossed, a + from above
grassbladeshapedef "Plus" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0 1 0]
    grassbladeshapepoints [0 -1 0 1]
]

// 5: three fins, a Y from above
grassbladeshapedef "Fins" [
    grassbladeshapeopen 1
    grassbladeshapepoints [0 0 0 1]
    grassbladeshapepoints [0 0 -0.866 -0.5]
    grassbladeshapepoints [0 0 0.866 -0.5]
]

// 6: three flat blades crossed, six fins from above
grassbladeshapedef "Asterisk" [
    grassbladeshapeopen 1
    grassbladeshapepoints [-1 0 1 0]
    grassbladeshapepoints [-0.5 -0.866 0.5 0.866]
    grassbladeshapepoints [-0.5 0.866 0.5 -0.866]
]

// 7
grassbladeshapedef "Triangle" [
    grassbladeshapepoints [0 1 -0.866 -0.5 0.866 -0.5]
]

// 8
grassbladeshapedef "Square" [
    grassbladeshapepoints [-0.75 -0.75 0.75 -0.75 0.75 0.75 -0.75 0.75]
]

// 9
grassbladeshapedef "Diamond" [
    grassbladeshapepoints [0 -1 1 0 0 1 -1 0]
]

// 10
grassbladeshapedef "Pentagon" [
    grassbladeshapepoints [0 1 -0.951 0.309 -0.588 -0.809 0.588 -0.809 0.951 0.309]
]

// 11
grassbladeshapedef "Hexagon" [
    grassbladeshapepoints [0 1 -0.866 0.5 -0.866 -0.5 0 -1 0.866 -0.5 0.866 0.5]
]

// 12
grassbladeshapedef "Octagon" [
    grassbladeshapepoints [0.924 0.383 0.383 0.924 -0.383 0.924 -0.924 0.383 -0.924 -0.383 -0.383 -0.924 0.383 -0.924 0.924 -0.383]
]

// 13: five points
grassbladeshapedef "Star" [
    grassbladeshapepoints [0 1 -0.265 0.364 -0.951 0.309 -0.428 -0.139 -0.588 -0.809 0 -0.45 0.588 -0.809 0.428 -0.139 0.951 0.309 0.265 0.364]
]

// 14: flat at the back, a D from above
grassbladeshapedef "Half-round" [
    grassbladeshapepoints [-1 -0.5 1 -0.5 0.866 0 0.5 0.366 0 0.5 -0.5 0.366 -0.866 0]
]

// 15
grassbladeshapedef "Round" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 1 -0.5 0.866 -0.866 0.5 -1 0 -0.866 -0.5 -0.5 -0.866 0 -1 0.5 -0.866 0.866 -0.5 1 0 0.866 0.5 0.5 0.866]
]

// 16: flattened, like a leek
grassbladeshapedef "Oval" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 0.5 -0.5 0.433 -0.866 0.25 -1 0 -0.866 -0.25 -0.5 -0.433 0 -0.5 0.5 -0.433 0.866 -0.25 1 0 0.866 0.25 0.5 0.433]
]

// 17: round with grooves, like horsetail
grassbladeshapedef "Fluted" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 1 -0.306 0.739 -0.707 0.707 -0.739 0.306 -1 0 -0.739 -0.306 -0.707 -0.707 -0.306 -0.739 0 -1 0.306 -0.739 0.707 -0.707 0.739 -0.306 1 0 0.739 0.306 0.707 0.707 0.306 0.739]
]

// 18: round at the back, narrowing to an edge at the front
grassbladeshapedef "Teardrop" [
    grassbladeshapesmooth 1
    grassbladeshapepoints [0 1 -0.386 0.11 -0.591 -0.246 -0.52 -0.65 -0.205 -0.914 0.205 -0.914 0.52 -0.65 0.591 -0.246 0.386 0.11]
]

// grassheadshapedef <name> [<body>]: the shapes of the heads grass blades grow, picked by texgrassheadshape <slot> <index>
// maps keep a shape's index, so the list only grows: never remove or reorder a shape, only add new ones to the end
// in the body:
//   grassheadshapestalk <height> <width> <stiffness> <droop> <taper>: the stalk against the grass's height and width, 0 height for none,
//     its usual stiffness, how much more it leans and how far it narrows to its top
//   grassheadshapestalkshape <name>: the blade shape around its stalk, Round unless set, or the grass's for ""
//   grassheadshapesize <size>: the head's size against the grass's height
//   grassheadshapeplace <tip|spike|above|hang|ground> <share>: on the tip of its stalk, around the stalk at a share of its length, above the
//     tip at a share of its size facing up, hanging down from the tip leaning by a share, or growing from the ground
//   grassheadshapeaccent <colour>: the accent of its secondary part, where the texture doesn't set one
//   grassheadshapeglow <glow>: how much it glows
//   grassheadshapelevel <level> <height> <radius> [<body>]: its outline from the pole below (0) through four rings to the pole above (5),
//     along its axis and out from it in its size, with in the body:
//     grassheadshapelevelstalk <rise> <width> <taper>: how much higher the level is for each time taller its stalk is, and whether it
//       widens with the stalk's width and narrows with its taper, for a stalk drawn as part of the head
//     grassheadshapelevellobe <base> <depth> <count> <twist> <power> <alternate>: each point of the ring reaches out by base plus depth
//       times the cosine of count times the way around, turned by twist for each level, unsigned and raised to power where above 0,
//       and every second point reaches alternate instead where above 0
//     grassheadshapelevelcup 1: the level's points cup up as far as they reach out
//     grassheadshapelevelcolour <head|stalk|accent> <scale> <blend>: its colour from the head, the stalk, which takes the grass's tip
//       colour, or the accent, times scale, blended to the accent by blend

// 0: petals around a raised centre
grassheadshapedef "Flower" [
    grassheadshapestalk 1.2 0.25 0.5 0 0.2
    grassheadshapesize 0.09
    grassheadshapeplace tip 0
    grassheadshapeaccent 0xF2B326
    grassheadshapelevel 0 -0.5 0 [ grassheadshapelevelcolour stalk 1 0 ]
    grassheadshapelevel 1 -0.15 0.3 [ grassheadshapelevelcolour stalk 1 0 ]
    grassheadshapelevel 2 0 0.4 [ grassheadshapelevelcolour head 0.85 0 ]
    grassheadshapelevel 3 0.2 1 [
        grassheadshapelevellobe 0.35 0.65 2.5 0 0.5 0
        grassheadshapelevelcup 1
        grassheadshapelevelcolour head 1 0
    ]
    grassheadshapelevel 4 0.12 0.3 [ grassheadshapelevelcolour head 1 0.8 ]
    grassheadshapelevel 5 0.22 0 [ grassheadshapelevelcolour accent 0.8 0 ]
]

// 1: a pale tip above the seed spike
grassheadshapedef "Cattail" [
    grassheadshapestalk 1.8 0.25 0.85 0 0.2
    grassheadshapesize 0.18
    grassheadshapeplace spike 0.82
    grassheadshapeaccent 0xC9A86B
    grassheadshapelevel 0 -1 0 [ grassheadshapelevelcolour head 0.92 0 ]
    grassheadshapelevel 1 -0.85 0.15 [ grassheadshapelevelcolour head 0.92 0 ]
    grassheadshapelevel 2 -0.3 0.17 [ grassheadshapelevelcolour head 0.92 0 ]
    grassheadshapelevel 3 0.3 0.17 [ grassheadshapelevelcolour head 1.08 0 ]
    grassheadshapelevel 4 0.85 0.15 [ grassheadshapelevelcolour head 1.08 0.6 ]
    grassheadshapelevel 5 1 0 [ grassheadshapelevelcolour accent 1 0 ]
]

// 2: ripening towards its top
grassheadshapedef "Seed head" [
    grassheadshapestalk 1.35 0.2 0 0.4 0.2
    grassheadshapesize 0.12
    grassheadshapeplace spike 0.86
    grassheadshapeaccent 0xE3D29A
    grassheadshapelevel 0 -1 0 [ grassheadshapelevellobe 0.8 0.2 3 1.57 1 0; grassheadshapelevelcolour head 0.9 0 ]
    grassheadshapelevel 1 -0.7 0.17 [ grassheadshapelevellobe 0.8 0.2 3 1.57 1 0; grassheadshapelevelcolour head 0.94 0 ]
    grassheadshapelevel 2 -0.2 0.22 [ grassheadshapelevellobe 0.8 0.2 3 1.57 1 0; grassheadshapelevelcolour head 0.98 0 ]
    grassheadshapelevel 3 0.35 0.2 [ grassheadshapelevellobe 0.8 0.2 3 1.57 1 0; grassheadshapelevelcolour head 1.02 0.2 ]
    grassheadshapelevel 4 0.85 0.11 [ grassheadshapelevellobe 0.8 0.2 3 1.57 1 0; grassheadshapelevelcolour head 1.06 0.5 ]
    grassheadshapelevel 5 1.3 0 [ grassheadshapelevellobe 0.8 0.2 3 1.57 1 0; grassheadshapelevelcolour head 1.1 0.85 ]
]

// 3: a stem drawn as part of the head carries the cap
grassheadshapedef "Mushroom" [
    grassheadshapestalk 0 0 0.85 0 0.2
    grassheadshapesize 0.14
    grassheadshapeplace ground 0
    grassheadshapeaccent 0xE0D9C7
    grassheadshapelevel 0 0 0 [ grassheadshapelevelcolour accent 1 0 ]
    grassheadshapelevel 1 0.05 0.3 [ grassheadshapelevelstalk 0 1 0; grassheadshapelevelcolour accent 1 0 ]
    grassheadshapelevel 2 1.2 0.3 [ grassheadshapelevelstalk 1.2 1 1; grassheadshapelevelcolour accent 1 0 ]
    grassheadshapelevel 3 1.1 1 [ grassheadshapelevelstalk 1.2 0 0; grassheadshapelevelcolour head 0.85 0 ]
    grassheadshapelevel 4 1.45 0.75 [ grassheadshapelevelstalk 1.2 0 0; grassheadshapelevelcolour head 1 0 ]
    grassheadshapelevel 5 1.6 0 [ grassheadshapelevelstalk 1.2 0 0; grassheadshapelevelcolour head 1 0 ]
]

// 4: its seeds gathered at the base
grassheadshapedef "Puff" [
