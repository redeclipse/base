// Page templates and the look they share with the master's mail templates
// htmlpagedef <type> [ html ] defines a page, and htmlpage <type> [args...] renders one, as HTML when it's an httproute's reply
// Dynamic values arrive as $arg1..$argN and must be escaped: htmlescape for HTML, jsonescape for a string inside a <script>
// The shared parts stay email-safe: buttons are tables, there's no flex or grid, and nothing is loaded from elsewhere
// Pages defined here come back on rehash, so servinit.cfg can replace one and taking that out again restores it

html_style = [
    body {
        margin: 0;
        padding: 0;
        background-color: #340201;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.002em;
    }
    a, a:link, a:visited { color: #ff8080; text-decoration: none; }
    a:hover, a:active, a:focus { color: #fff0f0; text-decoration: underline; }
    h1 {
        margin: 0 0 18px 0;
        padding: 0 0 12px 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        color: #ffb2b2;
        text-shadow: -1px -1px 4px #ff0000;
        border-bottom: 1px solid rgba(255, 160, 160, 0.18);
    }
    p { margin: 0 0 16px 0; color: #e6e6e6; }
    p.muted { color: #beaaaa; font-size: 13px; }
    strong { color: #f0e0e0; }
    code {
        background-color: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 160, 160, 0.18);
        border-radius: 3px;
        padding: 1px 5px;
        color: #f0e0e0;
        font-size: 14px;
    }
    .outer {
        width: 100%;
        background-color: #340201;
        background-image: radial-gradient(ellipse at top, #5c0806 0%, #340201 55%, #1c0101 100%);
    }
    .outer-cell { padding: 28px 12px; }
    .card {
        width: 100%;
        max-width: 600px;
        background-color: rgba(16, 16, 16, 0.92);
        border: 1px solid #780000;
        border-radius: 4px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }
    .header {
        padding: 20px 28px;
        background-color: rgba(0, 0, 0, 0.35);
        border-bottom: 1px solid #780000;
    }
    .header a { text-decoration: none; }
    .header img { display: block; margin: 0 auto; max-width: 100%; height: auto; border: 0; }
    .content { padding: 24px 28px; color: #e6e6e6; }
    .cta { margin: 20px 0 16px 0; }
    .cta-cell {
        background-color: #960000;
        border: 1px solid #ff4040;
        border-radius: 4px;
    }
    .cta-btn, .cta-btn:link, .cta-btn:visited {
        display: inline-block;
        padding: 9px 22px;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        font-size: 15px;
    }
    .cta-btn:hover { background-color: #be0000; color: #ffffff; text-decoration: none; }
    .fallback { color: #beaaaa; font-size: 12px; word-break: break-all; }
    .fallback a { word-break: break-all; text-decoration: underline; }
    .footer {
        padding: 14px 24px;
        background-color: #080808;
        border-top: 1px solid rgba(255, 160, 160, 0.18);
        color: #beaaaa;
        font-size: 13px;
        line-height: 1.6;
    }
    .footer a, .footer a:link, .footer a:visited { font-weight: 600; color: #ff6060; text-decoration: none; }
    .footer a:hover { color: #fff0f0; text-decoration: underline; }
    .footer .legal { font-size: 12px; }
    .footer .legal a, .footer .legal a:link, .footer .legal a:visited { font-weight: 400; color: #beaaaa; }
    .footer .legal a:hover { color: #fff0f0; text-decoration: underline; }
]

// html_wrap <title> <body html> [heading] [extra css]: a whole page or email; the heading is the title unless given
html_wrap = [
    format [
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>%1</title>
            <style>
                %6
                %7
            </style>
        </head>
        <body bgcolor="#340201">
            <table class="outer" role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" bgcolor="#340201">
                <tr>
                    <td class="outer-cell" align="center">
                        <table class="card" role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" bgcolor="#101010">
                            <tr>
                                <td class="header" align="center" bgcolor="#0a0a0a">
                                    <a href="%3">
                                        <img src="%3/bits/regular.png" alt="%5" width="240">
                                    </a>
                                </td>
                            </tr>
                            <tr>
                                <td class="content">
                                    <h1>%8</h1>
                                    %2
                                </td>
                            </tr>
                            <tr>
                                <td class="footer" align="center" bgcolor="#080808">
                                    <strong>%5</strong> &middot;
                                    <a href="%3">%4</a> &middot;
                                    <a href="%3/account">Account</a> &middot;
                                    <a href="%3/discord">Discord</a><br>
                                    <span class="legal">
                                        <a href="%3/guidelines">Guidelines</a> &middot;
                                        <a href="%3/privacy">Privacy Policy</a> &middot;
                                        <a href="%3/license">License</a> &middot;
                                        <a href="%3/trademark">Trademark Policy</a>
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </body>
        </html>
    ] (htmlescape $arg1) $arg2 (htmlescape (concatword "https://" $versionurl)) (htmlescape $versionurl) (htmlescape $versionname) $html_style $arg4 (htmlescape (? (strlen $arg3) $arg3 $arg1))
]

// html_button <label> <url>: a button
html_button = [
    format [
        <table class="cta" role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td class="cta-cell" align="center" bgcolor="#960000">
                    <a class="cta-btn" href="%2">%1</a>
                </td>
            </tr>
        </table>
    ] (htmlescape $arg1) (htmlescape $arg2)
]

// html_cta <label> <url>: a button with the link written out under it, for mail clients that don't show buttons
html_cta = [
    format [
        %1
        <p class="fallback">
            Or copy this link:<br>
            <a href="%2">%2</a>
        </p>
    ] (html_button $arg1 $arg2) (htmlescape $arg2)
]

// html_link <text> <url>: a link
html_link = [
    format [<a href="%2">%1</a>] (htmlescape $arg1) (htmlescape $arg2)
]

