loadsky = [
    skybox $arg1
    if (> $numargs 1) [spinsky $arg2]
    if (> $numargs 2) [yawsky $arg3]
]; setcomplete loadsky 1

mapmsg = [maptitle $arg1]; setcomplete mapmsg 1
cloudalpha = [cloudblend $arg1]
savecurrentmap = [ savemap ]

// people have complained /fov was removed
fov = [do [ @(? (isthirdperson) third first)personfov @arg1 ]]; setcomplete fov 1
texturecull = [ fixinsidefaces; compactvslots 1 ]; setcomplete texturecull 1
name = [playername $arg1]; setcomplete name 1
colour = [playercolourbody $arg1]; setcomplete colour 1

// the player's colours are the body and accent colours now
playercolour = [ if $numargs [ playercolourbody $arg1 ] [ playercolourbody ] ]
playercolour2 = [ if $numargs [ playercolouraccent $arg1 ] [ playercolouraccent ] ]

// the primary and secondary player tones are the body and accent tones now
playertoneprimary = [ if $numargs [ playertonebody $arg1 ] [ playertonebody ] ]
playertoneprimarylevel = [ if $numargs [ playertonebodylevel $arg1 ] [ playertonebodylevel ] ]
playertoneprimarymix = [ if $numargs [ playertonebodymix $arg1 ] [ playertonebodymix ] ]
playertoneprimarybright = [ if $numargs [ playertonebodybright $arg1 ] [ playertonebodybright ] ]
playertonesecondary = [ if $numargs [ playertoneaccent $arg1 ] [ playertoneaccent ] ]
playertonesecondarylevel = [ if $numargs [ playertoneaccentlevel $arg1 ] [ playertoneaccentlevel ] ]
playertonesecondarymix = [ if $numargs [ playertoneaccentmix $arg1 ] [ playertoneaccentmix ] ]
playertonesecondarybright = [ if $numargs [ playertoneaccentbright $arg1 ] [ playertoneaccentbright ] ]
playertonecombine = [] // combined tones are always half body, half accent now

// the old grass rows' settings, still in players' configs, which blades have no use for
grassstep = []
grasstaper = []
grassmargin = []
grasswedges = []
grassoffsets = []
vanity = [playervanity $arg1]; setcomplete vanity 1
setinfo = [playername $arg1; playercolourbody $arg2; playermodel $arg3; playervanity $arg4; playerloadweap $arg5; playerrandweap $arg6]; setcomplete setinfo 1
setmaster = [ setpriv $arg1 ]; setcomplete setmaster 1
vcolor = [ vcolour $arg1 $arg2 $arg3 ]
texcolor = [ texcolour $arg1 $arg2 $arg3 ]
soundmusicvol = [ soundmusicgamevol $arg1 ]
musicvol = [ if $numargs [ musicgamevol $arg1 ] [ musicgamevol ] ]

// random stuff
privcreatortex = $privfoundertex
privoperatortex = $privmoderatortex

screenshotting = 0
takescreenshot = [
    if (! $screenshotting) [
        screenshotting = 1
        sleep 50 [
            screenshot
            showhud @@showhud
            showconsole @@showconsole
            playerui @@playerui
            auras @@auras
            screenshotting = 0
        ]
        showhud 0
        showconsole 0
        playerui -1
        auras 0
    ]
]; setcomplete takescreenshot 1

