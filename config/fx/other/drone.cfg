registerfx FX_DRONE $FX_TYPE_PARTICLE [
    fxpropf emitdist 512
    fxpropf emitcull 4
    fxpropi emitlen 200
    fxpropi parttype $FX_PARTTYPE_EXPLODE
    fxpropi part $PART_EXPLOSION
    fxpropi fade 1
    fxpropf maxpartsize 0.1
    fxpropf maxpartsize 0.5 $FX_MOD_LERP [
        fxpropi lerptime 100
    ]
    fxpropi fadein 50
    fxpropi fadeout 200
    fxpropf blend 0.5
    fxpropi posfromenttag $TAG_JET_BACK
]

registerfx FX_DRONE_SOUND $FX_TYPE_SOUND [
    fxparent FX_DRONE
    fxpropf emitdist 512
    fxpropf emitcull 4
    fxpropi emitlen 200
    fxprops sound S_JET
    fxpropi onplayer 1
    fxpropi flags $SND_LOOP
    fxpropi fadein 100
    fxpropi fadeout 100
    fxpropf gain 0.1
    fxpropf rolloff 2
]

registerfx FX_DRONE_BOOST $FX_TYPE_PARTICLE [
    fxparent FX_DRONE
    fxpropf emitdist 512
    fxpropf emitcull 4
    fxpropi emitparam 0
    fxpropi emitlen 100
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_LIGHTZAP_FLARE
    fxpropf partsize 0.01
    fxpropf partsizechange 0.01
    fxpropi fade 100
    fxpropf vel 10
    fxpropf blend 0.5
    fxpropi num 5
    fxpropi posfromenttag $TAG_JET_BACK
    fxpropi colorized $FX_COLORIZE_PARAM
]

// FX_DRONE_HOVER //
// A drone's hover, always heard while it flies and rising in pitch and volume the faster it moves; param 0 is its speed against its top speed

registerfx FX_DRONE_HOVER $FX_TYPE_SOUND [
    fxpropf emitdist 512
    fxpropi emitlen 200
    fxprops sound S_DRONE
    fxpropi onplayer 1
    fxpropi flags $SND_LOOP
    fxpropi fadein 100
    fxpropi fadeout 100
    fxpropf rolloff 2
    fxpropf gain 0.5
    fxpropf gain 1 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
    fxpropf pitch 0.9
    fxpropf pitch 1.3 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
]

// FX_DRONE_EVADE //
// A drone's sideways burst out of the line of fire when it is hit: a puff of its colour and a thruster blast

registerfx FX_DRONE_EVADE $FX_TYPE_PARTICLE [
    fxpropf emitdist 512
    fxpropf emitcull 4
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_LIGHTZAP_FLARE
    fxpropi num 12
    fxpropf partsize 3
    fxpropf partsizechange -0.01
    fxpropf vel 40
    fxpropf shapesize 4
    fxpropf blend 0.75
    fxpropi fade 250
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi posfroment $FX_ENT_POS_MIDDLE
]

registerfx FX_DRONE_EVADE_SMOKE $FX_TYPE_PARTICLE [
    fxparent FX_DRONE_EVADE
    fxpropf emitdist 512
    fxpropf emitcull 4
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_SMOKE_SOFT
    fxpropi num 4
    fxpropf partsize 4
    fxpropf partsizechange 0.01
    fxpropf vel 10
    fxpropf shapesize 4
    fxpropf blend 0.25
    fxpropi fade 400
    fxpropf gravity -20
    fxpropi posfroment $FX_ENT_POS_MIDDLE
]

registerfx FX_DRONE_EVADE_SOUND $FX_TYPE_SOUND [
    fxparent FX_DRONE_EVADE
    fxpropf emitdist 512
    fxprops sound S_IMPULSE
    fxpropi onplayer 1
    fxpropf pitch 1.25
]

// FX_DRONE_LOCK //
// A drone warning its target before it opens fire: a beam of its colour from its muzzle to the target, thickening, and a tone
// that rises as the warning runs; param 0 is how far the warning has run

registerfx FX_DRONE_LOCK $FX_TYPE_PARTICLE [
    fxpropf emitdist 1024
    fxpropi emitlen 50
    fxpropi fadeout 50
    fxpropi parttype $FX_PARTTYPE_FLARE
    fxpropi part $PART_FLARE
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 0.05
    fxpropf partsize 0.4 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
    fxpropf shapesize 0
    fxpropf blend 0.5
    fxpropf blend 1 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
]

registerfx FX_DRONE_LOCK_SOUND $FX_TYPE_SOUND [
    fxparent FX_DRONE_LOCK
    fxpropf emitdist 1024
    fxpropi emitlen 50
    fxprops sound S_DRONE_LOCK
    fxpropi onplayer 1
    fxpropi flags $SND_LOOP
    fxpropi fadeout 50
    fxpropf rolloff 1
    fxpropf pitch 1
    fxpropf pitch 2 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
]
