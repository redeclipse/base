// FX_ROLLER //
// A roller's rolling, louder the faster it moves so it can be heard coming; param 0 is its speed against its top speed

registerfx FX_ROLLER $FX_TYPE_SOUND [
    fxpropf emitdist 512
    fxpropi emitlen 200
    fxprops sound S_ROLLER
    fxpropi onplayer 1
    fxpropi flags $SND_LOOP
    fxpropi fadein 100
    fxpropi fadeout 100
    fxpropf rolloff 2
    fxpropf gain 0
    fxpropf gain 1 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
]

// FX_ROLLER_ARMED //
// An armed roller's flash, modelled on the grenade's fuse and kept alive while it is armed;
// param 0 is how far the fuse has run and param 1 how far the current flash has run, 0 between flashes

registerfx FX_ROLLER_ARMED $FX_TYPE_PARTICLE [
    fxpropi emitlen 50
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_HINT
    fxpropf partsize 0.1
    fxpropf partsize 20 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 1
    ]
    fxpropc colour 255 255 0
    fxpropc colour 255 0 0 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 0
    ]
    fxpropf blend 0
    fxpropf blend 0.5 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam 1
    ]
    fxpropi posfroment $FX_ENT_POS_MIDDLE
]

if (> $fxdetail 1) [
    registerfx FX_ROLLER_ARMED_LIGHT $FX_TYPE_LIGHT [
        fxparent FX_ROLLER_ARMED
        fxpropi emitlen 50
        fxpropi emitparent 1
        fxpropc colour 255 255 0
        fxpropc colour 255 0 0 $FX_MOD_LERP [
            fxpropi lerpmode $FX_MOD_LERP_PARAM
            fxpropi lerpparam 0
        ]
        fxpropf blend 0
        fxpropf blend 1 $FX_MOD_LERP [
            fxpropi lerpmode $FX_MOD_LERP_PARAM
            fxpropi lerpparam 1
        ]
        fxpropf radius 0
        fxpropf radius 96 $FX_MOD_LERP [
            fxpropi lerpmode $FX_MOD_LERP_PARAM
            fxpropi lerpparam 1
        ]
        fxpropi posfroment $FX_ENT_POS_MIDDLE
    ]
]

// FX_ROLLER_ARMED_BEEP //
// Sent at the start of each flash

registerfx FX_ROLLER_ARMED_BEEP $FX_TYPE_SOUND [
    fxprops sound S_W_GRENADE_TRANSIT
    fxpropi onplayer 1
]
