registerfx FX_P_TRIDENT_LIFE $FX_TYPE_PARTICLE [
    fxpropf emitcull 4
    fxpropi parttype $FX_PARTTYPE_FLARE
    fxpropi part $PART_LIGHTNING
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 50
    fxpropf partsize 2
    fxpropf shapesize 0
    fxpropf blend 0.25
]

registerfx FX_P_TRIDENT_LIFE_ZAP $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_LIFE
    fxpropi parttype $FX_PARTTYPE_FLARE
    fxpropi part $PART_LIGHTZAP
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 1
    fxpropf shapesize 0
    fxpropf blend 0.75
    fxpropf blend 0.05 $FX_MOD_LERP [
        fxpropi lerptime 30
    ]
]

registerfx FX_P_TRIDENT_LIFE_CRACKLE $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_LIFE
    fxpropi emitparent 1
    fxpropi emitinterval (? $fxdetail 40 80)
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_ELECZAP_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 2
    fxpropf partsize 2 $FX_MOD_RAND
    fxpropi fade 60
    fxpropf blend 0.5
    fxpropi posflip 1
]

registerfx FX_P_TRIDENT_LIFE_BUZZ $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_LIFE
    fxpropi emitparent 1
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_ELECTRIC_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 1
    fxpropf partsize 3
    fxpropf partsize 1 $FX_MOD_RAND
    fxpropf blend 0.2
    fxpropi posflip 1
]

if (> $fxdetail 1) [
    registerfx FX_P_TRIDENT_LIFE_LIGHT $FX_TYPE_LIGHT [
        fxparent FX_P_TRIDENT_LIFE
        fxpropi emitparent 1
        fxpropi colorized $FX_COLORIZE_PARAM
        fxpropf radius 48
        fxpropf radius 16 $FX_MOD_RAND
        fxpropf blend 0.5
        fxpropi posflip 1
    ]
]

registerfx FX_P_TRIDENT_HIT $FX_TYPE_PARTICLE [
    fxpropf emitcull 4
    fxpropi emitlen 100
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_ELECZAP
    fxpropf partsize 1
    fxpropf partsize 10 $FX_MOD_LERP [
        fxpropi lerptime 100
    ]
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf blend 0.5
    fxpropi fadeout 50
]

register_proj_hit_fx FX_P_TRIDENT_HIT2 FX_P_TRIDENT_HIT 1.5

registerfx FX_P_TRIDENT_HIT_ARCS $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_HIT
    fxpropf emitcull 4
    fxpropi emitlen 150
    fxpropi emitinterval 25
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_ELECTRIC
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 0.5
    fxpropf partsize 0.5 $FX_MOD_RAND
    fxpropi fade 100
    fxpropf vel 60
    fxpropi num (? $fxdetail 4 2)
    fxpropf blend 0.75
]

if (> $fxdetail 1) [
    registerfx FX_P_TRIDENT_HIT_LIGHT $FX_TYPE_LIGHT [
        fxparent FX_P_TRIDENT_HIT
        fxpropi emitlen 150
        fxpropi colorized $FX_COLORIZE_PARAM
        fxpropf radius 48
        fxpropf radius 24 $FX_MOD_RAND
        fxpropf blend 0.75
        fxpropi fadeout 50
    ]
]

registerfx FX_P_TRIDENT_DESTROY $FX_TYPE_PARTICLE [
    fxpropi emitlen 100
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_ELECZAP_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 2
    fxpropf partsize 20 $FX_MOD_LERP [
        fxpropi lerptime 100
        fxpropi lerpmode $FX_MOD_LERP_EMIT
    ]
    fxpropf blend 0.4
    fxpropi fadeout 50
]

registerfx FX_P_TRIDENT_DESTROY_ARCS $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_DESTROY
    fxpropi emitlen 300
    fxpropi emitinterval 50
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_ELECTRIC
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 0.75
    fxpropf partsize 0.75 $FX_MOD_RAND
    fxpropi fade 150
    fxpropf vel 120
    fxpropi num (? $fxdetail 6 3)
    fxpropf blend 0.75
]

registerfx FX_P_TRIDENT_DESTROY_ZAP $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_DESTROY
    fxpropi emitlen 300
    fxpropi emitinterval 60
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_ELECZAP
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 3
    fxpropf partsize 6 $FX_MOD_RAND
    fxpropi fade 60
    fxpropf blend 1
    fxpropfv posoffset -4 -4 -4
    fxpropfv posoffset 8 8 8 $FX_MOD_RAND
]

registerfx FX_P_TRIDENT_DESTROY_GLOWSTAIN $FX_TYPE_STAIN [
    fxparent FX_P_TRIDENT_DESTROY
    fxpropi staintype $STAIN_ENERGY
    fxpropf radius 4
    fxpropf radius 2 $FX_MOD_RAND
    fxpropi colorized $FX_COLORIZE_PARAM
]

registerfx FX_P_TRIDENT_DESTROY_SOUND $FX_TYPE_SOUND [
    fxparent FX_P_TRIDENT_DESTROY
    fxprops sound S_W_TRIDENT_DESTROY2
]

if (> $fxdetail 1) [
    registerfx FX_P_TRIDENT_DESTROY_LIGHT $FX_TYPE_LIGHT [
        fxparent FX_P_TRIDENT_DESTROY
        fxpropi emitlen 300
        fxpropi colorized $FX_COLORIZE_PARAM
        fxpropf radius 64
        fxpropf radius 32 $FX_MOD_RAND
        fxpropf blend 0.75
        fxpropi fadeout 150
    ]
]
