registerfx FX_P_TRIDENT_LIFE $FX_TYPE_PARTICLE [
    fxpropf emitcull 4
    fxpropi parttype $FX_PARTTYPE_TRAIL
    fxpropi part $PART_HINT_BOLD
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 0.5
    fxpropf partsize 1.5 $FX_MOD_LERP [
        fxpropi lerptime 250
        fxpropi lerpshape $FX_MOD_LERP_SHAPE_SQUARE_IN
    ]
    fxpropf shapesize 0.1
    fxpropf blend 0.4
    fxpropi posflip 1
    fxpropi fadein 100
    fxpropi fade (? $fxdetail 200 100)
]

registerfx FX_P_TRIDENT_LIFE_GLOW $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_LIFE
    fxpropi emitparent 1
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_HINT_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 1
    fxpropf partsize 6
    fxpropf blend 0.15
]

if (> $fxdetail 1) [
    registerfx FX_P_TRIDENT_LIFE_LIGHT $FX_TYPE_LIGHT [
        fxparent FX_P_TRIDENT_LIFE
        fxpropi emitparent 1
        fxpropi colorized $FX_COLORIZE_PARAM
        fxpropf radius 48
        fxpropf blend 0.5
    ]
]

registerfx FX_P_TRIDENT_HIT $FX_TYPE_PARTICLE [
    fxpropf emitcull 4
    fxpropi emitlen 100
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_SPARK
    fxpropf partsize 1
    fxpropf partsize 10 $FX_MOD_LERP [
        fxpropi lerptime 100
    ]
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf blend 0.5
    fxpropi fadeout 50
]

register_proj_hit_fx FX_P_TRIDENT_HIT2 FX_P_TRIDENT_HIT 1.5

registerfx FX_P_TRIDENT_DESTROY $FX_TYPE_PARTICLE [
    fxpropi emitlen 100
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_HINT_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 2
    fxpropf partsize 16 $FX_MOD_LERP [
        fxpropi lerptime 100
        fxpropi lerpmode $FX_MOD_LERP_EMIT
    ]
    fxpropf blend 0.25
    fxpropi fadeout 50
]

registerfx FX_P_TRIDENT_DESTROY_SPARKS $FX_TYPE_PARTICLE [
    fxparent FX_P_TRIDENT_DESTROY
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_SPARK
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 0.5
    fxpropi fade 150
    fxpropf vel 150
    fxpropi num (? $fxdetail 12 6)
    fxpropf blend 0.75
]

registerfx FX_P_TRIDENT_DESTROY_SCORCH $FX_TYPE_STAIN [
    fxparent FX_P_TRIDENT_DESTROY
    fxpropi staintype $STAIN_SCORCH
    fxpropf radius 3
    fxpropf radius 2 $FX_MOD_RAND
]

if (> $fxdetail 1) [
    registerfx FX_P_TRIDENT_DESTROY_LIGHT $FX_TYPE_LIGHT [
        fxparent FX_P_TRIDENT_DESTROY
        fxpropi emitlen 150
        fxpropi colorized $FX_COLORIZE_PARAM
        fxpropf radius 64
        fxpropf blend 0.75
        fxpropi fadeout 100
    ]
]
