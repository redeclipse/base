registerfx FX_W_TRIDENT_P $FX_TYPE_PARTICLE [
    fxpropi emitlen 1
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_HINT_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 1
    fxpropf partsize 0.5
    fxpropf partsize 3 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropf blend 0.1
    fxpropf blend 0.3 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropi posfroment $FX_ENT_POS_MUZZLE
]

registerfx FX_W_TRIDENT_P_ZAP $FX_TYPE_PARTICLE [
    fxparent FX_W_TRIDENT_P
    fxpropi emitlen 30
    fxpropi emitrestart 1
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_SPARK
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 1
    fxpropf partsize 0.2
    fxpropf partsize 2 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropf partsize 1 $FX_MOD_RAND
    fxpropf blend 1
    fxpropfv posoffset -1 -1 -1
    fxpropfv posoffset 2 2 2 $FX_MOD_RAND
    fxpropi posfroment $FX_ENT_POS_MUZZLE
]

registerfx FX_W_TRIDENT_P_SPARKS $FX_TYPE_PARTICLE [
    fxparent FX_W_TRIDENT_P
    fxpropi emitlen 60
    fxpropi emitrestart 1
    fxpropi parttype $FX_PARTTYPE_SPLASH
    fxpropi part $PART_SPARK
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropf partsize 0.15
    fxpropf partsize 0.15 $FX_MOD_RAND
    fxpropi fade 80
    fxpropf vel 25
    fxpropi num 1
    fxpropi num 3 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropf blend 0.75
    fxpropi posfroment $FX_ENT_POS_MUZZLE
]
