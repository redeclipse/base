registerfx FX_W_TRIDENT_P $FX_TYPE_PARTICLE [
    fxpropi emitlen 1
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_HINT_SOFT
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 1
    fxpropf partsize 0.5
    fxpropf partsize 4 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropf blend 0.1
    fxpropf blend 0.4 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropi posfroment $FX_ENT_POS_MUZZLE
]

registerfx FX_W_TRIDENT_P_SPARK $FX_TYPE_PARTICLE [
    fxparent FX_W_TRIDENT_P
    fxpropi emitlen 25
    fxpropi emitrestart 1
    fxpropi parttype $FX_PARTTYPE_SINGLE
    fxpropi part $PART_SPARK
    fxpropi colorized $FX_COLORIZE_PARAM
    fxpropi fade 1
    fxpropf partsize 0.1
    fxpropf partsize 1.5 $FX_MOD_LERP [
        fxpropi lerpmode $FX_MOD_LERP_PARAM
        fxpropi lerpparam $W_FX_POWER_PARAM
    ]
    fxpropf partsize 0.5 $FX_MOD_RAND
    fxpropf blend 0.75
    fxpropi posfroment $FX_ENT_POS_MUZZLE
]
