// where chat from outside the game comes from, which a bridged message names as its via
// bridgevia <id> <name> <texture>, an id the client doesn't know shows as web
// the platforms' logos are their owners' trademarks, used as they allow to say where a message came from, and drawn as they
// publish them, in white as the game's other icons are
bridgevia web "Web" "<grey>textures/icons/bridge/web"
bridgevia irc "IRC" "<grey>textures/icons/bridge/irc"
bridgevia discord "Discord" "<grey>textures/icons/bridge/discord"
bridgevia matrix "Matrix" "<grey>textures/icons/bridge/matrix"
bridgevia xmpp "XMPP" "<grey>textures/icons/bridge/xmpp"
bridgevia twitch "Twitch" "<grey>textures/icons/bridge/twitch"
bridgevia telegram "Telegram" "<grey>textures/icons/bridge/telegram"
bridgevia stoat "Stoat" "<grey>textures/icons/bridge/stoat"
bridgevia revolt "Stoat" "<grey>textures/icons/bridge/stoat"
