////////////////////////////////////////////////
//
// anti-aliasing
//
// The GLSL is in config/glsl/aa/. The aliases below only hand it the engine
// state and the options aa.cpp asks for, as #defines; each file's header
// lists the ones it reads.
//
////////////////////////////////////////////////

// Engine state tqaaresolve branches on. Call inside a shader_new body.
tqaaresolvedefines = [
    shader_define MSAA_LIGHT $msaalight
    shader_define GDEPTH_FORMAT $gdepthformat
    shader_define TQAA_RESOLVE_GATHER $tqaaresolvegather
]

lazyshader_new $SHADER_DEFAULT "tqaaresolve" [
    tqaaresolvedefines
    shader_source "config/glsl/aa/tqaa_resolve.vert" "config/glsl/aa/tqaa_resolve.frag"
]

smaaopt = [ >= (strstr $smaaopts $arg1) 0 ]
smaashaders = [
    smaapreset = $arg1
    smaaopts = $arg2
    exec "config/glsl/smaa.cfg"
]

// fxaashaders <preset> <options>, from loadfxaashaders (aa.cpp). Preset is
// $fxaaquality 0..3. Options: g green luma.
fxaashaders = [
    shader_new $SHADER_DEFAULT (format "fxaa%1%2" $arg1 $arg2) [
        shader_define FXAA_PRESET $arg1
        if (>= (strstr $arg2 "g") 0) [shader_define FXAA_GREENLUMA ""]
        shader_source "config/glsl/aa/screenquad.vert" "config/glsl/aa/fxaa.frag"
    ]
]

