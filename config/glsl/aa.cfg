////////////////////////////////////////////////
//
// anti-aliasing
//
// The GLSL is in config/glsl/aa/. The aliases below only hand it the engine
// state and the options aa.cpp asks for, as #defines; each file's header
// lists the ones it reads.
//
////////////////////////////////////////////////

// Engine state tqaaresolve branches on. Call inside a shader_new body.
tqaaresolvedefines = [
    shader_define MSAA_LIGHT $msaalight
    shader_define GDEPTH_FORMAT $gdepthformat
    shader_define TQAA_RESOLVE_GATHER $tqaaresolvegather
]

lazyshader_new $SHADER_DEFAULT "tqaaresolve" [
    tqaaresolvedefines
    shader_include_fs "config/glsl/shared/gdepth.glsl"
    shader_source "config/glsl/aa/tqaa_resolve.vert" "config/glsl/aa/tqaa_resolve.frag"
]

// smaadefines <preset> <options>: the SMAA defines. Call inside a shader_new body.
smaadefines = [
    shader_define SMAA_PRESET $arg1
    if (>= (strstr $arg2 "a") 0) [shader_define SMAA_ALPHAAREA ""]
    if (>= (strstr $arg2 "d") 0) [shader_define SMAA_DISCARD ""]
    if (>= (strstr $arg2 "s") 0) [shader_define SMAA_SPLIT ""]
    if (>= (strstr $arg2 "g") 0) [shader_define SMAA_GREENLUMA ""]
    if (>= (strstr $arg2 "t") 0) [shader_define SMAA_TEMPORAL ""]
    shader_include_fs "config/glsl/aa/smaa_defs.glsl"
]

// smaashaders <preset> <options>, from loadsmaashaders (aa.cpp). Preset is
// $smaaquality 0..3. Options: a alpha area texture (no texture_rg), d discard
// edgeless pixels, s split 2x MSAA, g green luma, t temporal (TQAA).
smaashaders = [
    shader_new $SHADER_DEFAULT (format "SMAALumaEdgeDetection%1%2" $arg1 $arg2) [
        smaadefines $arg1 $arg2
        shader_source "config/glsl/aa/screenquad.vert" "config/glsl/aa/smaa_luma_edge_detect.frag"
    ]
    shader_new $SHADER_DEFAULT (format "SMAAColorEdgeDetection%1%2" $arg1 $arg2) [
        smaadefines $arg1 $arg2
        shader_source "config/glsl/aa/screenquad.vert" "config/glsl/aa/smaa_color_edge_detect.frag"
    ]
    shader_new $SHADER_DEFAULT (format "SMAABlendingWeightCalculation%1%2" $arg1 $arg2) [
        smaadefines $arg1 $arg2
        shader_source "config/glsl/aa/smaa_blend_weight_calc.vert" "config/glsl/aa/smaa_blend_weight_calc.frag"
    ]
    shader_new $SHADER_DEFAULT (format "SMAANeighborhoodBlending%1%2" $arg1 $arg2) [
        smaadefines $arg1 $arg2
        shader_source "config/glsl/aa/screenquad.vert" "config/glsl/aa/smaa_neighborhood_blend.frag"
    ]
]

// fxaashaders <preset> <options>, from loadfxaashaders (aa.cpp). Preset is
// $fxaaquality 0..3. Options: g green luma.
fxaashaders = [
    shader_new $SHADER_DEFAULT (format "fxaa%1%2" $arg1 $arg2) [
        shader_define FXAA_PRESET $arg1
        if (>= (strstr $arg2 "g") 0) [shader_define FXAA_GREENLUMA ""]
        shader_source "config/glsl/aa/screenquad.vert" "config/glsl/aa/fxaa.frag"
    ]
]

