////////////////////////////////////////////////
//
// model shaders
//
// The GLSL is in config/glsl/model/. The aliases below register the shaders
// and hand the GLSL the type letters and engine state as #defines; see the
// header of model/model_defs.glsl.
//
////////////////////////////////////////////////

// mdltype:
//    a -> alpha test
//    u -> dither the alpha test
//    A -> alpha blend
//    t -> transparent (the row 1 fragment variant)
//    e -> envmap
//    n -> normalmap
//    m -> masks
//    d -> decal
//    D -> alpha decal
//    b -> dual-quat skeletal animation (the row 0 vertex variants)
//    c -> disable cullface
//    p -> material pattern
//    P -> pattern mask
//    x -> material mixer
//    X -> mixer mask
//    w -> wind
//    0..N -> effect

mdlopt = [ >= (strstr $modeltype $arg1) 0 ]

// modeldefines <type> [<bones>]: one MODEL_* define per type letter; for the
// skeletal (b) vertex variants also the bone count, the animdata size limits
// and model/skelanim.glsl, which carries the animdata uniform pragma the
// engine reads from the text whatever #if surrounds it.
modeldefines = [
    local modeltype
    modeltype = $arg1
    if (mdlopt "a") [shader_define MODEL_ALPHATEST ""]
    if (mdlopt "u") [shader_define MODEL_DITHER ""]
    if (mdlopt "A") [shader_define MODEL_ALPHABLEND ""]
    if (mdlopt "t") [shader_define MODEL_TRANSPARENT ""]
    if (mdlopt "e") [shader_define MODEL_ENVMAP ""]
    if (mdlopt "n") [shader_define MODEL_NORMALMAP ""]
    if (mdlopt "m") [shader_define MODEL_MASKS ""]
    if (mdlopt "d") [shader_define MODEL_DECAL ""]
    if (mdlopt "D") [shader_define MODEL_ALPHADECAL ""]
    if (mdlopt "c") [shader_define MODEL_DOUBLESIDED ""]
    if (mdlopt "p") [shader_define MODEL_PATTERN ""]
    if (mdlopt "P") [shader_define MODEL_PATTERNMASK ""]
    if (mdlopt "x") [shader_define MODEL_MIXER ""]
    if (mdlopt "X") [shader_define MODEL_MIXERMASK ""]
    if (mdlopt "w") [shader_define MODEL_WIND ""]
    if (mdlopt "0") [shader_define MODEL_EFFECT0 ""]
    if (mdlopt "1") [shader_define MODEL_EFFECT1 ""]
    if (mdlopt "b") [
        shader_define MODEL_SKELETAL ""
        shader_define MODEL_BONES $arg2
        shader_define MAXVSUNIFORMS $maxvsuniforms
        shader_define MAXSKELANIMDATA $maxskelanimdata
        shader_include_vs "config/glsl/model/skelanim.glsl"
    ]
]

// The vertex includes every model shader uses.
modelvsincludes = [
    shader_include_vs "config/glsl/model/model_defs.glsl"
    shader_include_vs "config/glsl/shared/rotateuv.glsl"
    shader_include_vs "config/glsl/model/wind.glsl"
]

// modelskelvariants <name> <type> <file> <maxvariants> <extra>: the skeletal
// vertex variants of shader <name>, row 0, one per bone count 1-4, from
// config/glsl/model/<file>.vert. <extra> runs in each body after the type's
// defines.
modelskelvariants = [
    local modeltype modelvert modelextra
    modeltype = $arg2
    modelvert = (concatword "config/glsl/model/" $arg3 ".vert")
    modelextra = $arg5
    loop+ i 1 4 [
        variantshader_new $SHADER_DEFAULT $arg1 0 $arg4 [
            modeldefines (concatword $modeltype "b") $i
            do $modelextra
            modelvsincludes
            shader_source $modelvert ""
        ]
    ]
]

// shadowmodelshader <name> <type>: model/shadowmodel.*.
shadowmodelshader = [
    defershader $SHADER_DEFAULT $arg1 [
        shader_new $SHADER_DEFAULT @arg1 [
            modeldefines @@arg2
            modelvsincludes
            shader_source "config/glsl/model/shadowmodel.vert" "config/glsl/model/shadowmodel.frag"
        ]
        modelskelvariants @arg1 [@@arg2] "shadowmodel" 0 ""
    ]
]

shadowmodelshader "shadowmodel" ""
shadowmodelshader "alphashadowmodel" "a"
shadowmodelshader "windshadowmodel" "aw"

// The engine state the g-buffer model shader reads, and its includes.
modelgbufferdefines = [
    shader_define GDEPTH_FORMAT $gdepthformat
    shader_define MSAA_SAMPLES $msaasamples
    shader_define USEPACKNORM $usepacknorm
    shader_define DEBUG_VERTCOLORS $debugvertcolors
]
modelgbuffervsincludes = [
    shader_include_vs "config/glsl/shared/gbuffer.glsl"
]
modelgbufferfsincludes = [
    shader_include_fs "config/glsl/model/model_defs.glsl"
    shader_include_fs "config/glsl/model/effect.glsl"
    shader_include_fs "config/glsl/shared/gdepth.glsl"
    shader_include_fs "config/glsl/shared/gbuffer.glsl"
    shader_include_fs "config/glsl/shared/gnormal.glsl"
    shader_include_fs "config/glsl/shared/gcolor.glsl"
    // The engine reads the output declarations from the text, ignoring #if,
    // so each output set has its own file.
    shader_include_fs (gbufferoutputs)
]

// modelshader <type>: model<type>, generated by animmodel.h loadshader().
modelshader = [
    local modeltype
    modeltype = $arg1
    shadername = (concatword "model" $arg1)
    maxvariants = 9
    shader_new $SHADER_DEFAULT $shadername [
        modeldefines $modeltype
        modelgbufferdefines
        modelvsincludes
        modelgbuffervsincludes
        modelgbufferfsincludes
        shader_source "config/glsl/model/model.vert" "config/glsl/model/model.frag"
    ]
    modelskelvariants $shadername $modeltype "model" $maxvariants [
        modelgbufferdefines
        modelgbuffervsincludes
    ]
    variantshader_new $SHADER_DEFAULT $shadername 1 $maxvariants [
        modeldefines (concatword $modeltype "t")
        modelgbufferdefines
        modelgbufferfsincludes
        shader_source "" "config/glsl/model/model.frag"
    ]
    // The transparent fragment with each skeletal vertex variant; no GLSL.
    loop i 4 [
        variantshader $SHADER_DEFAULT $shadername 1 [0 , @i] 1 $maxvariants
    ]
]

// rsmmodelshader <type>: rsmmodel<type>, generated by animmodel.h
// loadshader() when rendering the reflective shadow map.
rsmmodelshader = [
    local modeltype
    modeltype = $arg1
    shadername = (concatword "rsmmodel" $arg1)
    shader_new $SHADER_DEFAULT $shadername [
        modeldefines $modeltype
        modelvsincludes
        shader_include_fs "config/glsl/shared/rsm_out.glsl"
        shader_source "config/glsl/model/rsmmodel.vert" "config/glsl/model/rsmmodel.frag"
    ]
    modelskelvariants $shadername $modeltype "rsmmodel" 0 ""
]

// halomodelshader <name> <type>: model/halomodel.*.
halomodelshader = [
    defershader $SHADER_DEFAULT $arg1 [
        shader_new $SHADER_DEFAULT @arg1 [
            modeldefines @@arg2
            modelvsincludes
            shader_include_fs "config/glsl/model/model_defs.glsl"
            shader_include_fs "config/glsl/model/effect.glsl"
            shader_source "config/glsl/model/halomodel.vert" "config/glsl/model/halomodel.frag"
        ]
        modelskelvariants @arg1 [@@arg2] "halomodel" 0 ""
    ]
]

halomodelshader "halomodel" ""
halomodelshader "alphahalomodel" "a"
halomodelshader "windhalomodel" "aw"
halomodelshader "haloshimmermodel" "0"
halomodelshader "alphahaloshimmermodel" "a0"
halomodelshader "windhaloshimmermodel" "aw0"
