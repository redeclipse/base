////////////////////////////////////////////////
//
// grass shaders: each instance is one blade, placed by hashing its patch and index
//
////////////////////////////////////////////////

bladehash = [
    result [
        uint bladehash(uint x)
        {
            x ^= x >> 16; x *= 0x7feb352du;
            x ^= x >> 15; x *= 0x846ca68bu;
            x ^= x >> 16;
            return x;
        }
        float bladernd(uint x) { return float(bladehash(x) & 0xFFFFFFu) * (1.0/16777216.0); }
        uint bladecell(vec3 p) { ivec3 q = ivec3(floor(p * 8.0)); return bladehash(uint(q.x) ^ bladehash(uint(q.y) ^ bladehash(uint(q.z)))); }
        // smooth noise over the world's xy, from hashes of the corners of the unit cells around p
        float bladenoise(vec2 p)
        {
            vec2 cell = floor(p), f = p - cell;
            f *= f * (3.0 - 2.0 * f);
            uint x = uint(int(cell.x)) * 73856093u, y = uint(int(cell.y)) * 19349663u;
            float a = bladernd(x ^ y), b = bladernd((x + 73856093u) ^ y), c = bladernd(x ^ (y + 19349663u)), d = bladernd((x + 73856093u) ^ (y + 19349663u));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
    ]
]

// bladetype:
//   b -> blendmap
//   s -> sun shadow cascade, depth only
//   h -> the heads of the flowers and cattails, on the blades that grow them

bladevariantshader = [
    local bladetype bladeshadow bladehead
    bladetype = $arg2
    bladeshadow = (>= (strstr $bladetype "s") 0)
    bladehead = (>= (strstr $bladetype "h") 0)
    variantshader $SHADER_DEFAULT $arg1 (? (>= (strstr $bladetype "b") 0) 0 -1) [
        attribute vec4 vvertex;
        uniform mat4 @(? $bladeshadow "shadowmatrix" "camprojmatrix");
        uniform vec3 camera;
        uniform float grassdist, grassclump;
        uniform vec3 bladethin; // where thinning starts, the share kept at grassdist, the size of a pixel per unit of distance
        uniform vec2 bladepixels; // the heights on screen where blades are thinnest and where they are full
        @(? $bladeshadow [uniform float bladeshadowdist, bladeshadowtexel;])
        uniform float millis;
        uniform vec4 bladewind; // the wind at this chunk, scaled by its strength, and the gust frequency
        uniform float bladeflutter; // how much each blade flutters on its own in the wind
        uniform float bladestiff; // how far blades resist leaning, the wind and trampling, standing straight like reeds
        uniform vec3 bladevary; // how far clumps and blades stray from the colours, how much the ground's patches change them, and 1/the patch size
        uniform vec4 trampleparams; // the trample map's lowest corner, the time now and the recovery time, in milliseconds
        uniform float tramplehold; // the share of the recovery time blades stay flat
        uniform sampler2D tex2;
        uniform vec3 bladecolours[3]; // root, middle and tip
        uniform vec2 bladeheads; // the share of every fourth blade that flowers, and that grows into a cattail
        @(? $bladehead [uniform vec3 bladeheadcolours[2];]) // flowers and cattails
        uniform vec4 bladeparams;
        // four vec4s per patch, GRASSCHUNKPATCHES patches
        layout(std140) uniform grasspatches { vec4 grasspatch[1024]; };
        @(if $bladeshadow [] [ginterpvert])
        varying vec3 bladenormal, bladeup, bladecol;
        @(bladehash)
        @(? (>= (strstr $bladetype "b") 0) [
            uniform sampler2D tex1;
            @(blendmapdefs tex1)
        ])

        void main(void)
        {
            // find the patch this blade belongs to from the first blade of each patch
            int blade = gl_InstanceID * int(bladeparams.w), lo = 0, hi = int(bladeparams.z) - 1;
            while(lo < hi)
            {
                int mid = (lo + hi + 1) / 2;
                if(grasspatch[mid*4].w <= float(blade)) lo = mid; else hi = mid - 1;
            }
            vec4 p0 = grasspatch[lo*4], p1 = grasspatch[lo*4+1], p2 = grasspatch[lo*4+2], p3 = grasspatch[lo*4+3];
            uint h = bladehash(bladecell(p0.xyz) ^ bladehash(bladecell(p2.xyz) + uint(blade - int(p0.w)) * 0x9e3779b9u));

            // a random point in the patch, choosing between its triangles by area
            vec3 a = p0.xyz, b = p1.xyz, c = p2.xyz;
            if(bladernd(h + 1u) >= p1.w) { b = p2.xyz; c = p3.xyz; }
            float r1 = bladernd(h + 2u), r2 = bladernd(h + 3u);
            if(r1 + r2 > 1.0) { r1 = 1.0 - r1; r2 = 1.0 - r2; }
            vec3 root = a + (b - a) * r1 + (c - a) * r2;
            // broad patches of taller and lusher or shorter, sparser and drier grass, fixed to the world so the map looks the same each time;
            // mottle is -1 for the driest patches and 1 for the lushest
            float mottle = 0.0;
            if(bladevary.y > 0.0)
            {
                vec2 mp = root.xy * bladevary.z;
                mottle = (bladenoise(mp) * 0.65 + bladenoise(mp * 2.7 + 17.0) * 0.35) * 2.0 - 1.0;
                mottle = clamp(mottle * 1.6, -1.0, 1.0) * bladevary.y;
            }
            // thin out with distance: every sixteenth blade is kept longest, then every eighth, fourth and second, then the rest,
            // so a far chunk drawing only every sixteenth to second blade draws the same blades a near one keeps;
            // the survivors widen to cover the same ground and shrink away rather than pop
            float camdist = distance(root, camera);
            float pixels = bladeparams.x / max(camdist * bladethin.z, 1e-6);
            float keep = min(mix(1.0, bladethin.y, smoothstep(bladethin.x, grassdist, camdist)), mix(bladethin.y, 1.0, smoothstep(bladepixels.x, bladepixels.y, pixels)));
            if(pixels < 1.0) keep = 0.0;
            float rank = bladernd(h + 11u);
            float tier = 0.5;
            if(blade % 2 == 0) tier = 0.25;
            if(blade % 4 == 0) tier = 0.125;
            if(blade % 8 == 0) tier = 0.0625;
            if(blade % 16 == 0) tier = 0.0;
            rank = tier + rank * max(tier, 0.0625);
            float shrink = clamp((keep - rank) * 16.0, 0.0, 1.0) * clamp((grassdist - camdist) / (grassdist * 0.15), 0.0, 1.0);
            @(? $bladeshadow [
                shrink *= clamp((bladeshadowdist - camdist) / (bladeshadowdist * 0.25), 0.0, 1.0);
            ])
            @(? (>= (strstr $bladetype "b") 0) [
                if(blendlookup(vec4(root, p2.w)) <= bladernd(h + 8u)) shrink = 0.0;
            ])
            if(bladernd(h + 14u) < max(-mottle, 0.0) * 0.6) shrink = 0.0;
            if(shrink <= 0.0)
            {
                gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
                return;
            }
            vec3 pnormal = normalize(cross(p1.xyz - p0.xyz, p2.xyz - p0.xyz));
            if(pnormal.z < 0.0) pnormal = -pnormal;

            // clumps: the nearest of the jittered cell centres around the root
            vec2 cp = root.xy * grassclump, cell = floor(cp);
            float best = 1e9;
            uint clump = 0u;
            for(int y = -1; y <= 1; y++) for(int x = -1; x <= 1; x++)
            {
                vec2 cc = cell + vec2(float(x), float(y));
                uint ch = bladehash(uint(int(cc.x)) * 73856093u ^ uint(int(cc.y)) * 19349663u);
                vec2 d = cc + vec2(bladernd(ch), bladernd(ch + 1u)) - cp;
                float dist = dot(d, d);
                if(dist < best) { best = dist; clump = ch; }
            }

            // every fourth blade may grow into a flower or a cattail, more often in some clumps than in others,
            // as a thin stiff stalk above the grass, with the head drawn on it by the head pass
            int kind = 0;
            if(blade % 4 == 0)
            {
                float r = bladernd(h + 17u), flowers = bladeheads.x * 2.0 * bladernd(clump + 18u), cattails = bladeheads.y * 2.0 * bladernd(clump + 19u);
                if(r < flowers) kind = 1;
                else if(r < flowers + cattails) kind = 2;
            }
            @(? $bladehead [
                if(kind == 0)
                {
                    gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
                    return;
                }
            ])

            float height = bladeparams.x * mix(0.55, 1.0, bladernd(clump + 2u)) * mix(0.7, 1.0, bladernd(h + 4u)) * (1.0 + mottle * 0.25) * shrink;
            float facing = (bladernd(clump + 3u) + (bladernd(h + 5u) - 0.5) * 0.35) * 6.2831853;
            float stiff = bladestiff;
            float width = bladeparams.y * mix(0.7, 1.3, bladernd(h + 7u));
            if(kind == 1) { height *= @grassflowerheight; width *= 0.5; stiff = max(stiff, 0.5); }
            else if(kind == 2) { height *= @grasscattailheight; width *= 0.5; stiff = max(stiff, 0.85); }
            float lean = mix(0.1, 0.7, bladernd(clump + 4u)) * mix(0.6, 1.4, bladernd(h + 6u)) * (1.0 - 0.85 * stiff);

            width = max(width / sqrt(keep), camdist * bladethin.z);
            @(? $bladeshadow [
                width = max(width, bladeshadowtexel);
            ])

            vec3 dir = vec3(cos(facing), sin(facing), 0.0), side = vec3(-dir.y, dir.x, 0.0);

            // the wind bends the blade along it, in gusts that travel across the grass, with a little flutter of its own
            vec2 push = vec2(0.0);
            float windspeed = length(bladewind.xy);
            if(windspeed > 0.0)
            {
                vec2 winddir = bladewind.xy / windspeed;
                float gust = 0.5 + 0.5 * sin(millis * 1000.0 * bladewind.w - dot(root.xy, winddir) * 0.02);
                float flutter = sin(millis * 7.0 + bladernd(h + 12u) * 6.2831853) * 0.15 * bladeflutter;
                push += winddir * (windspeed * 12.0 * (0.6 + 0.4 * gust + flutter) * (1.0 - 0.75 * stiff));
            }

            // players flatten the blades they walk through, which stand up again over the recovery time
            if(trampleparams.w > 0.0)
            {
                // blends the four nearest texels, so neighbouring blades bend by different amounts,
                // and each blade recovers at its own pace, springing back past upright before it settles
                vec2 tc = (root.xy - trampleparams.xy) * @(divf 1 $grasstramplescale) - 0.5;
                if(min(tc.x, tc.y) >= 0.0 && max(tc.x, tc.y) < @(- $grasstramplesize 1).0)
                {
                    vec2 cellpos = floor(tc), frac = tc - cellpos;
                    float recovertime = trampleparams.w * mix(0.7, 1.3, bladernd(h + 13u));
                    for(int y = 0; y < 2; y++) for(int x = 0; x < 2; x++)
                    {
                        ivec2 texel = ivec2(cellpos + vec2(float(x), float(y)) + trampleparams.xy * @(divf 1 $grasstramplescale)) & @(- $grasstramplesize 1);
                        vec4 trample = texelFetch(tex2, texel, 0);
                        vec2 tdir = (floor(trample.rg * 255.0 + 0.5) - 128.0) / 127.0;
                        float age = mod(trampleparams.z - (floor(trample.b * 255.0 + 0.5) * 256.0 + floor(trample.a * 255.0 + 0.5)), 65536.0);
                        float rise = clamp((age / recovertime - tramplehold) / (1.0 - tramplehold), 0.0, 1.0);
                        float bend = (1.0 - rise) * (1.0 - rise) * cos(rise * 4.712389);
                        float weight = (x == 0 ? 1.0 - frac.x : frac.x) * (y == 0 ? 1.0 - frac.y : frac.y);
                        push += tdir * (3.0 * bend * weight * (1.0 - 0.6 * stiff)); // stiff blades give way less
                    }
                }
            }

            vec3 tipdir = normalize(vec3(0.0, 0.0, cos(lean)) + dir * sin(lean) + vec3(push, 0.0));
            // stiff blades bend less along their length, pivoting at the root instead
            vec3 tip = root + tipdir * height, mid = mix(root + normalize(vec3(push * 0.5, 1.0)) * (height * 0.6), root + tipdir * (height * 0.5), stiff);
@(? $bladehead [
            // the variation of the clump the head grows in, and the patch around it
            float shade = (1.0 + (bladernd(clump + 14u) - 0.5) * 0.4 * bladevary.x) * (1.0 + mottle * 0.1);
            // a ring of points, between the poles below and above it at levels 0 and 3
            float angle = vvertex.x * 6.2831853, level = vvertex.y;
            vec3 pos, n;
            if(kind == 1)
            {
                // a flower faces the way its stalk ends, tilted up: five round cupped petals around a raised centre, on a small green base
                vec3 axis = normalize(normalize(tip - mid) + vec3(0.0, 0.0, 1.0));
                vec3 e1 = normalize(side - axis * dot(side, axis)), e2 = cross(axis, e1);
                vec3 radial = e1 * cos(angle) + e2 * sin(angle);
                float size = height * 0.09 * mix(0.8, 1.2, bladernd(h + 20u));
                vec3 headcol = bladeheadcolours[0] * shade;
                if(level < 0.5) { pos = tip - axis * (size * 0.5); n = -axis; bladecol = bladecolours[2]; }
                else if(level < 1.5) { pos = tip + radial * (size * 0.3) - axis * (size * 0.15); n = normalize(radial - axis); bladecol = bladecolours[2]; }
                else if(level < 2.5)
                {
                    float petal = mix(0.35, 1.0, sqrt(abs(cos(angle * 2.5))));
                    pos = tip + radial * (size * petal) + axis * (size * 0.2 * petal);
                    n = normalize(axis + radial * 0.3);
                    bladecol = headcol;
                }
                else { pos = tip + axis * (size * 0.2); n = axis; bladecol = mix(headcol, vec3(0.95, 0.7, 0.15), 0.7); }
            }
            else
            {
                // a cattail is a long brown spike most of the way up its stalk
                float t = 0.82;
                vec3 centre = root * ((1.0 - t) * (1.0 - t)) + mid * (2.0 * t * (1.0 - t)) + tip * (t * t);
                vec3 axis = normalize((mid - root) * (2.0 * (1.0 - t)) + (tip - mid) * (2.0 * t));
                vec3 e1 = normalize(side - axis * dot(side, axis)), e2 = cross(axis, e1);
                vec3 radial = e1 * cos(angle) + e2 * sin(angle);
                float size = height * 0.1 * mix(0.85, 1.15, bladernd(h + 20u)), thick = size * 0.17;
                if(level < 0.5) { pos = centre - axis * size; n = -axis; }
                else if(level < 2.5) { pos = centre + radial * thick + axis * (size * (level < 1.5 ? -0.75 : 0.75)); n = radial; }
                else { pos = centre + axis * size; n = axis; }
                bladecol = bladeheadcolours[1] * shade * (level > 1.5 ? 1.08 : 0.92);
            }
            bladenormal = n;
            bladeup = pnormal;

            ] [
            float t = vvertex.x;
            vec3 spine = root * ((1.0 - t) * (1.0 - t)) + mid * (2.0 * t * (1.0 - t)) + tip * (t * t);
            vec3 deriv = (mid - root) * (2.0 * (1.0 - t)) + (tip - mid) * (2.0 * t);
            // stalks keep some of their width up to the head they hold, where grass tapers to a point
            vec3 pos = spine + side * (vvertex.y * 0.5 * width * (1.0 - t * (kind > 0 ? 0.6 : 1.0)));

            vec3 n = normalize(cross(side, deriv));
            bladenormal = normalize(n + side * (vvertex.y * 0.35));
            bladeup = pnormal;

            // the colour at this height, from the root through the middle to the tip
            vec3 color = t < 0.5 ? mix(bladecolours[0], bladecolours[1], t * 2.0) : mix(bladecolours[1], bladecolours[2], t * 2.0 - 1.0);
            // clumps stray warmer and drier or cooler and lusher, lighter or darker, and some blades dry out from the tip
            float warm = clamp((bladernd(clump + 5u) * 2.0 - 1.0) * bladevary.x - mottle * 0.6, -1.0, 1.0);
            color *= warm > 0.0 ? mix(vec3(1.0), vec3(1.2, 1.08, 0.65), warm) : mix(vec3(1.0), vec3(0.85, 1.02, 0.95), -warm);
            color *= 1.0 + ((bladernd(clump + 14u) - 0.5) * 0.4 + (bladernd(h + 9u) - 0.5) * 0.3) * bladevary.x;
            float dry = step(bladernd(h + 15u), bladevary.x * 0.3 + max(-mottle, 0.0) * 0.3) * smoothstep(0.4, 1.0, t);
            bladecol = mix(color, vec3(dot(color, vec3(0.3, 0.5, 0.2))) * vec3(1.35, 1.15, 0.7), dry * 0.75);

            ])
            @(? $bladeshadow [
                gl_Position = height > 0.0 ? shadowmatrix * vec4(pos, 1.0) : vec4(0.0, 0.0, -2.0, 1.0);
            ] [
                gl_Position = height > 0.0 ? camprojmatrix * vec4(pos, 1.0) : vec4(0.0, 0.0, -2.0, 1.0);
                @(gdepthpackvert)
            ])
        }
    ] [
      @(? $bladeshadow [
        void main(void)
        {
        }
      ] [
        uniform vec2 bladeshading; // specular, normal blend
        @(ginterpfrag)
        varying vec3 bladenormal, bladeup, bladecol;

        void main(void)
        {
            gcolor.rgb = bladecol;
            @(gspecpack bladeshading.x)

            // the side facing the viewer, leaned towards the ground's normal so blades catch light from above
            vec3 normal = normalize(mix(@(? $bladehead "bladenormal" "gl_FrontFacing ? bladenormal : -bladenormal"), bladeup, bladeshading.y @(? $bladehead "* 0.5")));
            @(gnormpack normal)
            @(gdepthpackfrag)
        }
      ])
    ]
]

bladeshader = [
    bladevariantshader blade ""
    bladevariantshader blade "b"
]

bladeshadowshader = [
    bladevariantshader bladeshadow "s"
    bladevariantshader bladeshadow "sb"
]

bladeheadshader = [
    bladevariantshader bladehead "h"
    bladevariantshader bladehead "hb"
]

bladeheadshadowshader = [
    bladevariantshader bladeheadshadow "hs"
    bladevariantshader bladeheadshadow "hsb"
]
