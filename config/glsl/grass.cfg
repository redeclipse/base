////////////////////////////////////////////////
//
// grass shaders: each instance is one blade, placed by hashing its patch and index
//
////////////////////////////////////////////////

bladehash = [
    result [
        uint bladehash(uint x)
        {
            x ^= x >> 16; x *= 0x7feb352du;
            x ^= x >> 15; x *= 0x846ca68bu;
            x ^= x >> 16;
            return x;
        }
        float bladernd(uint x) { return float(bladehash(x) & 0xFFFFFFu) * (1.0/16777216.0); }
        uint bladecell(vec3 p) { ivec3 q = ivec3(floor(p * 8.0)); return bladehash(uint(q.x) ^ bladehash(uint(q.y) ^ bladehash(uint(q.z)))); }
        // smooth noise over the world's xy, from hashes of the corners of the unit cells around p
        float bladenoise(vec2 p)
        {
            vec2 cell = floor(p), f = p - cell;
            f *= f * (3.0 - 2.0 * f);
            uint x = uint(int(cell.x)) * 73856093u, y = uint(int(cell.y)) * 19349663u;
            float a = bladernd(x ^ y), b = bladernd((x + 73856093u) ^ y), c = bladernd(x ^ (y + 19349663u)), d = bladernd((x + 73856093u) ^ (y + 19349663u));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
    ]
]

// the heads blades may grow, by GRASSHEAD_ shape
bladeheaddefs = [
    result [
        // the stalk of a head: its height and width against the grass's, its usual stiffness and how much more it leans, or 0 height for none
        vec4 headstalk(int shape)
        {
            if(shape == @GRASSHEAD_CATTAIL) return vec4(1.8, 0.5, 0.85, 0.0);
            if(shape == @GRASSHEAD_SEED) return vec4(1.35, 0.4, 0.0, 0.4);
            if(shape == @GRASSHEAD_MUSHROOM) return vec4(0.0, 0.0, 0.85, 0.0);
            if(shape == @GRASSHEAD_PUFF) return vec4(1.25, 0.4, 0.3, 0.0);
            if(shape == @GRASSHEAD_BELL) return vec4(1.15, 0.45, 0.2, 0.6);
            if(shape == @GRASSHEAD_LAVENDER) return vec4(1.4, 0.4, 0.6, 0.0);
            if(shape == @GRASSHEAD_THISTLE) return vec4(1.3, 0.55, 0.7, 0.0);
            if(shape == @GRASSHEAD_BULB) return vec4(1.2, 0.45, 0.4, 0.0);
            return vec4(1.2, 0.5, 0.5, 0.0); // flower
        }

        // a head's outline from the pole below (level 0) through four rings to the pole above (level 5): height along its axis and radius, in its size
        vec2 headprofile(int shape, int level)
        {
            if(shape == @GRASSHEAD_CATTAIL)
            {
                if(level == 0) return vec2(-1.0, 0.0); if(level == 1) return vec2(-0.85, 0.15); if(level == 2) return vec2(-0.3, 0.17);
                if(level == 3) return vec2(0.3, 0.17); if(level == 4) return vec2(0.85, 0.15); return vec2(1.0, 0.0);
            }
            if(shape == @GRASSHEAD_SEED)
            {
                if(level == 0) return vec2(-1.0, 0.0); if(level == 1) return vec2(-0.7, 0.17); if(level == 2) return vec2(-0.2, 0.22);
                if(level == 3) return vec2(0.35, 0.2); if(level == 4) return vec2(0.85, 0.11); return vec2(1.3, 0.0);
            }
            if(shape == @GRASSHEAD_MUSHROOM)
            {
                if(level == 0) return vec2(0.0, 0.0); if(level == 1) return vec2(0.05, 0.3); if(level == 2) return vec2(1.2, 0.24);
                if(level == 3) return vec2(1.1, 1.0); if(level == 4) return vec2(1.45, 0.75); return vec2(1.6, 0.0);
            }
            if(shape == @GRASSHEAD_PUFF || shape == @GRASSHEAD_BULB)
            {
                if(level == 0) return vec2(-1.0, 0.0); if(level == 1) return vec2(-0.7, 0.71); if(level == 2) return vec2(-0.25, 0.97);
                if(level == 3) return vec2(0.25, 0.97); if(level == 4) return vec2(0.7, 0.71); return vec2(1.0, 0.0);
            }
            if(shape == @GRASSHEAD_BELL)
            {
                if(level == 0) return vec2(0.0, 0.0); if(level == 1) return vec2(0.15, 0.3); if(level == 2) return vec2(0.45, 0.42);
                if(level == 3) return vec2(0.8, 0.55); if(level == 4) return vec2(1.0, 0.85); return vec2(0.7, 0.0);
            }
            if(shape == @GRASSHEAD_LAVENDER)
            {
                if(level == 0) return vec2(-1.0, 0.0); if(level == 1) return vec2(-0.85, 0.22); if(level == 2) return vec2(-0.35, 0.24);
                if(level == 3) return vec2(0.2, 0.2); if(level == 4) return vec2(0.7, 0.13); return vec2(1.05, 0.0);
            }
            if(shape == @GRASSHEAD_THISTLE)
            {
                if(level == 0) return vec2(-0.6, 0.0); if(level == 1) return vec2(-0.35, 0.45); if(level == 2) return vec2(0.05, 0.55);
                if(level == 3) return vec2(0.3, 0.3); if(level == 4) return vec2(0.65, 0.6); return vec2(0.75, 0.0);
            }
            // flower: a small green base, then the petals' underside out to their tips and back over their tops to a raised centre
            if(level == 0) return vec2(-0.5, 0.0); if(level == 1) return vec2(-0.15, 0.3); if(level == 2) return vec2(0.0, 0.4);
            if(level == 3) return vec2(0.2, 1.0); if(level == 4) return vec2(0.12, 0.3); return vec2(0.22, 0.0);
        }

        // how far a point of a ring reaches out, for petals, grains, knobs and spikes
        float headlobe(int shape, int level, float angle, float index)
        {
            if(shape == @GRASSHEAD_SEED) return 0.8 + 0.2 * abs(cos(angle * 3.0 + float(level) * 1.57));
            if(shape == @GRASSHEAD_PUFF) return 0.9 + 0.1 * cos(angle * 7.0 + float(level) * 2.0);
            if(shape == @GRASSHEAD_BELL) return level == 4 ? 0.85 + 0.15 * cos(angle * 6.0) : 1.0;
            if(shape == @GRASSHEAD_LAVENDER) return 0.7 + 0.3 * abs(cos(angle * 2.5 + float(level) * 1.3));
            if(shape == @GRASSHEAD_THISTLE) return level == 4 && mod(index, 2.0) > 0.5 ? 0.55 : 1.0;
            if(shape == @GRASSHEAD_FLOWER) return level == 3 ? mix(0.35, 1.0, sqrt(abs(cos(angle * 2.5)))) : 1.0;
            return 1.0;
        }

        // the size of a head against the grass's height
        float headsize(int shape)
        {
            if(shape == @GRASSHEAD_CATTAIL) return 0.18;
            if(shape == @GRASSHEAD_SEED) return 0.12;
            if(shape == @GRASSHEAD_MUSHROOM) return 0.14;
            if(shape == @GRASSHEAD_PUFF) return 0.08;
            if(shape == @GRASSHEAD_BELL) return 0.1;
            if(shape == @GRASSHEAD_LAVENDER) return 0.2;
            if(shape == @GRASSHEAD_THISTLE) return 0.1;
            if(shape == @GRASSHEAD_BULB) return 0.07;
            return 0.09;
        }
    ]
]

// bladetype:
//   b -> blendmap
//   s -> sun shadow cascade, depth only
//   h -> the heads grown on some blades, see bladeheaddefs

bladevariantshader = [
    local bladetype bladeshadow bladehead
    bladetype = $arg2
    bladeshadow = (>= (strstr $bladetype "s") 0)
    bladehead = (>= (strstr $bladetype "h") 0)
    variantshader $SHADER_DEFAULT $arg1 (? (>= (strstr $bladetype "b") 0) 0 -1) [
        attribute vec4 vvertex;
        uniform mat4 @(? $bladeshadow "shadowmatrix" "camprojmatrix");
        uniform vec3 camera;
        uniform float grassdist, grassclump;
        uniform vec3 bladethin; // where thinning starts, the share kept at grassdist, the size of a pixel per unit of distance
        uniform vec2 bladepixels; // the heights on screen where blades are thinnest and where they are full
        @(? $bladeshadow [uniform float bladeshadowdist, bladeshadowtexel;])
        uniform float millis;
        uniform vec4 bladewind; // the wind at this chunk, scaled by its strength, and the gust frequency
        uniform float bladeflutter; // how much each blade flutters on its own in the wind
        uniform float bladestiff; // how far blades resist leaning, the wind and trampling, standing straight like reeds
        uniform vec3 bladevary; // how far clumps and blades stray from the colours, how much the ground's patches change them, and 1/the patch size
        uniform vec4 trampleparams; // the trample map's lowest corner, the time now and the recovery time, in milliseconds
        uniform float tramplehold; // the share of the recovery time blades stay flat
        uniform sampler2D tex2;
        uniform vec3 bladecolours[3]; // root, middle and tip
        uniform vec3 bladeheads, bladeheadshapes; // the share of the blades that grows each head, and their shapes
        uniform vec2 bladeheadstep; // heads grow on every blade, or every second up to sixteenth, as few as hold the shares, and the most of those that can
        uniform vec3 bladeheadstiffs; // how far each head resists the wind and trampling, or below 0 for its shape's usual stiffness
        uniform vec3 bladeheadstalkheights, bladeheadstalkwidths, bladeheadstalktapers; // each head's stalk against its shape's usual, 0 for the usual, and how far it narrows, below 0 for the usual
        @(? $bladehead [uniform vec3 bladeheadsizes, bladeheadvariances;]) // how big each head is, and how much bigger or smaller it may be
        @(? $bladehead [uniform vec3 bladeheadcolours[3];])
        uniform vec4 bladeparams;
        // four vec4s per patch, GRASSCHUNKPATCHES patches
        layout(std140) uniform grasspatches { vec4 grasspatch[1024]; };
        @(if $bladeshadow [] [ginterpvert])
        varying vec3 bladenormal, bladeup, bladecol;
        @(? $bladehead [varying float bladeglow;])
        @(bladehash)
        @(bladeheaddefs)
        @(? (>= (strstr $bladetype "b") 0) [
            uniform sampler2D tex1;
            @(blendmapdefs tex1)
        ])

        void main(void)
        {
            // find the patch this blade belongs to from the first blade of each patch
            int blade = gl_InstanceID * int(bladeparams.w), lo = 0, hi = int(bladeparams.z) - 1;
            while(lo < hi)
            {
                int mid = (lo + hi + 1) / 2;
                if(grasspatch[mid*4].w <= float(blade)) lo = mid; else hi = mid - 1;
            }
            vec4 p0 = grasspatch[lo*4], p1 = grasspatch[lo*4+1], p2 = grasspatch[lo*4+2], p3 = grasspatch[lo*4+3];
            uint h = bladehash(bladecell(p0.xyz) ^ bladehash(bladecell(p2.xyz) + uint(blade - int(p0.w)) * 0x9e3779b9u));

            @(? $bladehead [
                // most instances of the head pass have no head, so they stop before the rest of the blade
                if(bladernd(h + 17u) >= bladeheadstep.y)
                {
                    gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
                    return;
                }
            ])

            // a random point in the patch, choosing between its triangles by area
            vec3 a = p0.xyz, b = p1.xyz, c = p2.xyz;
            if(bladernd(h + 1u) >= p1.w) { b = p2.xyz; c = p3.xyz; }
            float r1 = bladernd(h + 2u), r2 = bladernd(h + 3u);
            if(r1 + r2 > 1.0) { r1 = 1.0 - r1; r2 = 1.0 - r2; }
            vec3 root = a + (b - a) * r1 + (c - a) * r2;
            // broad patches of taller and lusher or shorter, sparser and drier grass, fixed to the world so the map looks the same each time;
            // mottle is -1 for the driest patches and 1 for the lushest
            float mottle = 0.0;
            if(bladevary.y > 0.0)
            {
                vec2 mp = root.xy * bladevary.z;
                mottle = (bladenoise(mp) * 0.65 + bladenoise(mp * 2.7 + 17.0) * 0.35) * 2.0 - 1.0;
                mottle = clamp(mottle * 1.6, -1.0, 1.0) * bladevary.y;
            }
            // thin out with distance: every sixteenth blade is kept longest, then every eighth, fourth and second, then the rest,
            // so a far chunk drawing only every sixteenth to second blade draws the same blades a near one keeps;
            // the survivors widen to cover the same ground and shrink away rather than pop
            float camdist = distance(root, camera);
            float pixels = bladeparams.x / max(camdist * bladethin.z, 1e-6);
            float keep = min(mix(1.0, bladethin.y, smoothstep(bladethin.x, grassdist, camdist)), mix(bladethin.y, 1.0, smoothstep(bladepixels.x, bladepixels.y, pixels)));
            if(pixels < 1.0) keep = 0.0;
            float rank = bladernd(h + 11u);
            float tier = 0.5;
            if(blade % 2 == 0) tier = 0.25;
            if(blade % 4 == 0) tier = 0.125;
            if(blade % 8 == 0) tier = 0.0625;
            if(blade % 16 == 0) tier = 0.0;
            rank = tier + rank * max(tier, 0.0625);
            float shrink = clamp((keep - rank) * 16.0, 0.0, 1.0) * clamp((grassdist - camdist) / (grassdist * 0.15), 0.0, 1.0);
            @(? $bladeshadow [
                shrink *= clamp((bladeshadowdist - camdist) / (bladeshadowdist * 0.25), 0.0, 1.0);
            ])
            @(? (>= (strstr $bladetype "b") 0) [
                if(blendlookup(vec4(root, p2.w)) <= bladernd(h + 8u)) shrink = 0.0;
            ])
            if(bladernd(h + 14u) < max(-mottle, 0.0) * 0.6) shrink = 0.0;
            if(shrink <= 0.0)
            {
                gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
                return;
            }
            vec3 pnormal = normalize(cross(p1.xyz - p0.xyz, p2.xyz - p0.xyz));
            if(pnormal.z < 0.0) pnormal = -pnormal;

            // clumps: the nearest of the jittered cell centres around the root
            vec2 cp = root.xy * grassclump, cell = floor(cp);
            float best = 1e9;
            uint clump = 0u;
            for(int y = -1; y <= 1; y++) for(int x = -1; x <= 1; x++)
            {
                vec2 cc = cell + vec2(float(x), float(y));
                uint ch = bladehash(uint(int(cc.x)) * 73856093u ^ uint(int(cc.y)) * 19349663u);
                vec2 d = cc + vec2(bladernd(ch), bladernd(ch + 1u)) - cp;
                float dist = dot(d, d);
                if(dist < best) { best = dist; clump = ch; }
            }

            // blades grow heads instead of being grass, each kind more often in some clumps than in others, evening out as it covers more,
            // as a stalk with the head drawn on it by the head pass; only every second or fourth blade may when the shares are small,
            // so the head pass draws fewer
            int slot = -1, headstep = int(bladeheadstep.x);
            if(headstep > 0 && blade % headstep == 0)
            {
                float r = bladernd(h + 17u), reach = 0.0;
                for(int i = 0; i < 3; i++)
                {
                    float share = bladeheads[i] * bladeheadstep.x;
                    reach += share * mix(2.0 * bladernd(clump + 18u + uint(i)), 1.0, min(share, 1.0));
                    if(slot < 0 && r < reach) slot = i;
                }
            }
            int shape = slot >= 0 ? int(bladeheadshapes[slot] + 0.5) : -1;
            @(? $bladehead [
                if(slot < 0)
                {
                    gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
                    return;
                }
            ])

            float height = bladeparams.x * mix(0.55, 1.0, bladernd(clump + 2u)) * mix(0.7, 1.0, bladernd(h + 4u)) * (1.0 + mottle * 0.25) * shrink;
            float facing = (bladernd(clump + 3u) + (bladernd(h + 5u) - 0.5) * 0.35) * 6.2831853;
            float stiff = bladestiff;
            float width = bladeparams.y * mix(0.7, 1.3, bladernd(h + 7u));
            float base = height, droop = 0.0, taper = 1.0;
            if(slot >= 0)
            {
                vec4 stalk = headstalk(shape);
                height *= stalk.x * (bladeheadstalkheights[slot] > 0.0 ? bladeheadstalkheights[slot] : 1.0);
                width *= stalk.y * (bladeheadstalkwidths[slot] > 0.0 ? bladeheadstalkwidths[slot] : 1.0);
                // stalks keep some of their width up to the head they hold, where grass narrows to a point
                taper = bladeheadstalktapers[slot] >= 0.0 ? bladeheadstalktapers[slot] : 0.6;
                stiff = bladeheadstiffs[slot] >= 0.0 ? bladeheadstiffs[slot] : max(stiff, stalk.z);
                droop = stalk.w;
            }
            float lean = mix(0.1, 0.7, bladernd(clump + 4u)) * mix(0.6, 1.4, bladernd(h + 6u)) * (1.0 - 0.85 * stiff) + droop;
            float drawn = height;

            width = max(width / sqrt(keep), camdist * bladethin.z);
            @(? $bladeshadow [
                width = max(width, bladeshadowtexel);
            ])

            vec3 dir = vec3(cos(facing), sin(facing), 0.0), side = vec3(-dir.y, dir.x, 0.0);

            // the wind bends the blade along it, in gusts that travel across the grass, with a little flutter of its own
            vec2 push = vec2(0.0);
            float windspeed = length(bladewind.xy);
            if(windspeed > 0.0)
            {
                vec2 winddir = bladewind.xy / windspeed;
                float gust = 0.5 + 0.5 * sin(millis * 1000.0 * bladewind.w - dot(root.xy, winddir) * 0.02);
                float flutter = sin(millis * 7.0 + bladernd(h + 12u) * 6.2831853) * 0.15 * bladeflutter;
                push += winddir * (windspeed * 12.0 * (0.6 + 0.4 * gust + flutter) * (1.0 - 0.75 * stiff));
            }

            // players flatten the blades they walk through, which stand up again over the recovery time
            if(trampleparams.w > 0.0)
            {
                // blends the four nearest texels, so neighbouring blades bend by different amounts,
                // and each blade recovers at its own pace, springing back past upright before it settles
                vec2 tc = (root.xy - trampleparams.xy) * @(divf 1 $grasstramplescale) - 0.5;
                if(min(tc.x, tc.y) >= 0.0 && max(tc.x, tc.y) < @(- $grasstramplesize 1).0)
                {
                    vec2 cellpos = floor(tc), frac = tc - cellpos;
                    float recovertime = trampleparams.w * mix(0.7, 1.3, bladernd(h + 13u));
                    for(int y = 0; y < 2; y++) for(int x = 0; x < 2; x++)
                    {
                        ivec2 texel = ivec2(cellpos + vec2(float(x), float(y)) + trampleparams.xy * @(divf 1 $grasstramplescale)) & @(- $grasstramplesize 1);
                        vec4 trample = texelFetch(tex2, texel, 0);
                        vec2 tdir = (floor(trample.rg * 255.0 + 0.5) - 128.0) / 127.0;
                        float age = mod(trampleparams.z - (floor(trample.b * 255.0 + 0.5) * 256.0 + floor(trample.a * 255.0 + 0.5)), 65536.0);
                        float rise = clamp((age / recovertime - tramplehold) / (1.0 - tramplehold), 0.0, 1.0);
                        float bend = (1.0 - rise) * (1.0 - rise) * cos(rise * 4.712389);
                        float weight = (x == 0 ? 1.0 - frac.x : frac.x) * (y == 0 ? 1.0 - frac.y : frac.y);
                        push += tdir * (3.0 * bend * weight * (1.0 - 0.6 * stiff)); // stiff blades give way less
                    }
                }
            }

            vec3 tipdir = normalize(vec3(0.0, 0.0, cos(lean)) + dir * sin(lean) + vec3(push, 0.0));
            // stiff blades bend less along their length, pivoting at the root instead
            vec3 tip = root + tipdir * height, mid = mix(root + normalize(vec3(push * 0.5, 1.0)) * (height * 0.6), root + tipdir * (height * 0.5), stiff);
@(? $bladehead [
            // the variation of the clump the head grows in, and the patch around it
            vec3 headcol = bladeheadcolours[slot] * (1.0 + (bladernd(clump + 14u) - 0.5) * 0.4 * bladevary.x) * (1.0 + mottle * 0.1);
            float angle = vvertex.x * 6.2831853, index = floor(vvertex.x * 20.0 + 0.5);
            int level = int(vvertex.y + 0.5);
            float size = base * headsize(shape) * bladeheadsizes[slot] * max(1.0 + (bladernd(h + 20u) * 2.0 - 1.0) * bladeheadvariances[slot], 0.05);
            drawn = size;

            // where each head sits on its stalk, and the way it faces
            vec3 up = vec3(0.0, 0.0, 1.0), centre = tip, axis = normalize(normalize(tip - mid) + up);
            if(shape == @GRASSHEAD_CATTAIL || shape == @GRASSHEAD_SEED || shape == @GRASSHEAD_LAVENDER)
            {
                // spikes sit around the top of their stalks, which run on above them
                float t = shape == @GRASSHEAD_CATTAIL ? 0.82 : (shape == @GRASSHEAD_SEED ? 0.86 : 0.78);
                centre = root * ((1.0 - t) * (1.0 - t)) + mid * (2.0 * t * (1.0 - t)) + tip * (t * t);
                axis = normalize((mid - root) * (2.0 * (1.0 - t)) + (tip - mid) * (2.0 * t));
            }
            else if(shape == @GRASSHEAD_PUFF || shape == @GRASSHEAD_BULB) { axis = up; centre = tip + normalize(tip - mid) * (size * 0.9); }
            else if(shape == @GRASSHEAD_BELL) axis = normalize(normalize(tip - mid) * 0.4 - up);
            else if(shape == @GRASSHEAD_MUSHROOM)
            {
                // mushrooms grow from the ground, leaning a little, and the wind and trampling tip them over as far as they aren't stiff
                centre = root - pnormal * (size * 0.05);
                axis = normalize(pnormal + dir * ((bladernd(h + 21u) - 0.5) * 0.4) + vec3(push, 0.0) * (0.3 * (1.0 - stiff)));
            }
            vec3 e1 = normalize(side - axis * dot(side, axis)), e2 = cross(axis, e1);
            vec3 radial = e1 * cos(angle) + e2 * sin(angle);

            vec2 prof = headprofile(shape, level);
            float lobe = headlobe(shape, level, angle, index);
            if(shape == @GRASSHEAD_FLOWER && level == 3) prof.x *= lobe; // the petals cup up to their tips
            vec3 pos = centre + axis * (prof.x * size) + radial * (prof.y * lobe * size);
            // the normal across the outline between the levels either side, or along the axis at the poles
            vec2 slope = headprofile(shape, min(level + 1, 5)) - headprofile(shape, max(level - 1, 0));
            vec3 n = level == 0 || level == 5 ? axis * (level == 0 ? -sign(slope.x) : sign(slope.x)) : normalize(radial * slope.x - axis * slope.y);

            // colours: stems and bases take the grass's tip colour, then the head's own, with a few shapes' details
            vec3 stalkcol = bladecolours[2];
            bladecol = headcol;
            bladeglow = 0.0;
            if(shape == @GRASSHEAD_FLOWER)
            {
                vec3 centrecol = vec3(0.95, 0.7, 0.15);
                bladecol = level <= 1 ? stalkcol : (level == 2 ? headcol * 0.85 : (level == 3 ? headcol : (level == 4 ? mix(headcol, centrecol, 0.8) : centrecol * 0.8)));
            }
            else if(shape == @GRASSHEAD_CATTAIL) bladecol = headcol * (level >= 3 ? 1.08 : 0.92);
            else if(shape == @GRASSHEAD_SEED) bladecol = headcol * mix(0.9, 1.1, float(level) / 5.0);
            else if(shape == @GRASSHEAD_MUSHROOM) bladecol = level <= 2 ? vec3(0.88, 0.85, 0.78) : headcol * (level == 3 ? 0.85 : 1.0);
            else if(shape == @GRASSHEAD_PUFF) bladecol = headcol * (0.9 + 0.04 * float(level));
            else if(shape == @GRASSHEAD_BELL) bladecol = level == 0 ? stalkcol : headcol * (level == 5 ? 0.6 : 1.0);
            else if(shape == @GRASSHEAD_LAVENDER) bladecol = headcol * (0.8 + 0.06 * float(level));
            else if(shape == @GRASSHEAD_THISTLE) bladecol = level <= 3 ? stalkcol * 0.9 : headcol;
            else if(shape == @GRASSHEAD_BULB) bladeglow = 1.0;
            bladenormal = n;
            bladeup = pnormal;

            ] [
            float t = vvertex.x;
            vec3 spine = root * ((1.0 - t) * (1.0 - t)) + mid * (2.0 * t * (1.0 - t)) + tip * (t * t);
            vec3 deriv = (mid - root) * (2.0 * (1.0 - t)) + (tip - mid) * (2.0 * t);
            vec3 pos = spine + side * (vvertex.y * 0.5 * width * (1.0 - t * taper));

            vec3 n = normalize(cross(side, deriv));
            bladenormal = normalize(n + side * (vvertex.y * 0.35));
            bladeup = pnormal;

            // the colour at this height, from the root through the middle to the tip
            vec3 color = t < 0.5 ? mix(bladecolours[0], bladecolours[1], t * 2.0) : mix(bladecolours[1], bladecolours[2], t * 2.0 - 1.0);
            // clumps stray warmer and drier or cooler and lusher, lighter or darker, and some blades dry out from the tip
            float warm = clamp((bladernd(clump + 5u) * 2.0 - 1.0) * bladevary.x - mottle * 0.6, -1.0, 1.0);
            color *= warm > 0.0 ? mix(vec3(1.0), vec3(1.2, 1.08, 0.65), warm) : mix(vec3(1.0), vec3(0.85, 1.02, 0.95), -warm);
            color *= 1.0 + ((bladernd(clump + 14u) - 0.5) * 0.4 + (bladernd(h + 9u) - 0.5) * 0.3) * bladevary.x;
            float dry = step(bladernd(h + 15u), bladevary.x * 0.3 + max(-mottle, 0.0) * 0.3) * smoothstep(0.4, 1.0, t);
            bladecol = mix(color, vec3(dot(color, vec3(0.3, 0.5, 0.2))) * vec3(1.35, 1.15, 0.7), dry * 0.75);

            ])
            @(? $bladeshadow [
                gl_Position = drawn > 0.0 ? shadowmatrix * vec4(pos, 1.0) : vec4(0.0, 0.0, -2.0, 1.0);
            ] [
                gl_Position = drawn > 0.0 ? camprojmatrix * vec4(pos, 1.0) : vec4(0.0, 0.0, -2.0, 1.0);
                @(gdepthpackvert)
            ])
        }
    ] [
      @(? $bladeshadow [
        void main(void)
        {
        }
      ] [
        uniform vec2 bladeshading; // specular, normal blend
        @(ginterpfrag)
        varying vec3 bladenormal, bladeup, bladecol;
        @(? $bladehead [varying float bladeglow;])

        void main(void)
        {
            gcolor.rgb = bladecol;
            @(gspecpack bladeshading.x)
            @(? $bladehead [
                vec3 glow = bladecol * bladeglow;
                @(gglowpack glow packnorm)
            ])

            // the side facing the viewer, leaned towards the ground's normal so blades catch light from above
            vec3 normal = normalize(mix(@(? $bladehead "bladenormal" "gl_FrontFacing ? bladenormal : -bladenormal"), bladeup, bladeshading.y @(? $bladehead "* 0.5")));
            @(? $bladehead [@(gnormpackdef normal packnorm)] [@(gnormpack normal)])
            @(gdepthpackfrag)
        }
      ])
    ]
]

bladeshader = [
    bladevariantshader blade ""
    bladevariantshader blade "b"
]

bladeshadowshader = [
    bladevariantshader bladeshadow "s"
    bladevariantshader bladeshadow "sb"
]

bladeheadshader = [
    bladevariantshader bladehead "h"
    bladevariantshader bladehead "hb"
]

bladeheadshadowshader = [
    bladevariantshader bladeheadshadow "hs"
    bladevariantshader bladeheadshadow "hsb"
]
