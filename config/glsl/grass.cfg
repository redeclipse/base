////////////////////////////////////////////////
//
// grass shaders
//
////////////////////////////////////////////////

// grasstype:
//   b -> blendmap

grassopt = [ >= (strstr $grasstype $arg1) 0 ]

grassvariantshader = [
    local grasstype
    grasstype = $arg2
    variantshader $SHADER_DEFAULT $arg1 (? (grassopt "b") 0 -1) [
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        attribute vec4 vtangent;
        uniform mat4 camprojmatrix;
        uniform vec3 camera;
        uniform vec3 grassmargin;
        @(ginterpvert)
        varying vec2 texcoord0;
        varying vec4 colorscale;
        varying vec2 bounds;
        @(? (grassopt "b") [
            uniform vec4 grassplane;
            uniform float grassorient;
            varying vec4 blendpos;
        ])

        void main(void)
        {
            gl_Position = camprojmatrix * vvertex;
            colorscale = vcolor;
            texcoord0 = vtexcoord0;
            vec2 camdir = (camera.xy - vvertex.xy) * grassmargin.y;
            bounds = vec2(dot(camdir, vtangent.xy), dot(camdir, vtangent.zw)) + grassmargin.z;
            @(? (grassopt "b") [
                vec3 bp = vvertex.xyz;
                float gdim = floor(grassorient * 0.5 + 0.25);
                if(gdim < 0.5) bp.x = -(grassplane.y*bp.y + grassplane.z*bp.z + grassplane.w) / grassplane.x;
                else if(gdim < 1.5) bp.y = -(grassplane.x*bp.x + grassplane.z*bp.z + grassplane.w) / grassplane.y;
                else bp.z = -(grassplane.x*bp.x + grassplane.y*bp.y + grassplane.w) / grassplane.z;
                blendpos = vec4(bp, grassorient);
            ])
            @(gdepthpackvert)
        }
    ] [
        uniform sampler2D tex0;
        uniform float grasstest;
        @(ginterpfrag)
        varying vec2 texcoord0;
        varying vec4 colorscale;
        varying vec2 bounds;
        @(? (grassopt "b") [
            uniform sampler2D tex1;
            varying vec4 blendpos;
        ])
        @(if (grassopt "b") [blendmapdefs tex1])

        void main(void)
        {
            vec4 color = texture2D(tex0, texcoord0) * colorscale;
            color.a *= clamp(min(bounds.x, bounds.y), 0.0, 1.0);

            @(? (grassopt "b") [
                color.a *= blendlookup(blendpos);
            ])

            vec2 coords = step(0.5, fract(gl_FragCoord.xy * 0.5));
            float dither = 0.5 * coords.x + 0.75 * coords.y - coords.x * coords.y + 0.25;
            if(color.a <= grasstest * dither) discard;

            gcolor = vec4(color.rgb, 0.0);

            @(gnormpack [vec3(0.5, 0.5, 1.0)])
            @(gdepthpackfrag)
        }
    ]
]

grassshader = [
    shadername = (concatword "grass" $arg1)
    grassvariantshader $shadername $arg1
    grassvariantshader $shadername (concatword $arg1 "b")
]

