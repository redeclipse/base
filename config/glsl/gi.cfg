////////////////////////////////////////////////
//
// radiance hints
//
// The GLSL is in config/glsl/gi/. radiancehintsshader hands radiancehints.frag
// its tap count as a #define; the other shaders take no options.
//
////////////////////////////////////////////////

lazyshader_new $SHADER_DEFAULT "rsmsky" [
    shader_include_fs "config/glsl/shared/rsm_out.glsl"
    shader_source "config/glsl/gi/rsmsky.vert" "config/glsl/gi/rsmsky.frag"
]

// radiancehintsshader <taps>, from loadradiancehintsshader (renderlights.cpp):
// $rhtaps, which radiancehints.frag rounds up to 12, 20 or 32 taps.
radiancehintsshader = [
    shader_new $SHADER_DEFAULT (concatword "radiancehints" $arg1) [
        shader_define RH_TAPS $arg1
        shader_include_fs "config/glsl/gi/rh_out.glsl"
        shader_source "config/glsl/gi/radiancehints.vert" "config/glsl/gi/radiancehints.frag"
    ]
]

lazyshader_new $SHADER_DEFAULT "radiancehintsborder" [
    shader_include_fs "config/glsl/gi/rh_out.glsl"
    shader_source "config/glsl/gi/rhslice.vert" "config/glsl/gi/radiancehintsborder.frag"
]

lazyshader_new $SHADER_DEFAULT "radiancehintscached" [
    shader_include_fs "config/glsl/gi/rh_out.glsl"
    shader_source "config/glsl/gi/rhslice.vert" "config/glsl/gi/radiancehintscached.frag"
]

lazyshader_new $SHADER_DEFAULT "radiancehintsdisable" [
    shader_include_fs "config/glsl/gi/rh_out.glsl"
    shader_source "config/glsl/gi/radiancehintsdisable.vert" "config/glsl/gi/radiancehintsdisable.frag"
]
