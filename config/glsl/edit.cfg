////////////////////////////////////////////////
//
// miscellaneous edit shaders
//
////////////////////////////////////////////////

// draws the blend brush projected from the camera, as a stamp paints: the brush lies across brushaxis.xyz at depth
// brushaxis.w, and only surfaces within reach (brushsize.z) of it along that axis are covered
shader $SHADER_DEFAULT "blendbrush" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 camprojmatrix;
    uniform float ldrscale;
    varying vec4 color;
    varying vec3 worldpos;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        color = vec4(ldrscale * vcolor.rgb, vcolor.a);
        worldpos = vvertex.xyz;
    }
] [
    uniform sampler2D tex0;
    uniform vec3 camera, brushsize;
    uniform vec4 brushaxis, brushs, brusht;
    varying vec4 color;
    varying vec3 worldpos;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        if(abs(dot(worldpos, brushaxis.xyz) - brushaxis.w) > brushsize.z) discard;
        vec3 dir = worldpos - camera;
        float denom = dot(dir, brushaxis.xyz);
        if(abs(denom) < 0.0001) discard;
        float t = (brushaxis.w - dot(camera, brushaxis.xyz)) / denom;
        if(t <= 0.0) discard;
        vec3 q = camera + dir * t;
        vec2 uv = vec2((dot(q, brushs.xyz) - brushs.w) * brushsize.x, (dot(q, brusht.xyz) - brusht.w) * brushsize.y);
        if(uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) discard;
        fragcolor = texture2D(tex0, uv).r * color;
    }
]

lazyshader $SHADER_DEFAULT "prefab" [
    attribute vec4 vvertex, vcolor;
    attribute vec3 vnormal;
    uniform mat4 prefabmatrix;
    uniform mat3 prefabworld;
    varying vec3 nvec;
    varying vec4 color;
    @(msaainterpvert)

    void main(void)
    {
        gl_Position = prefabmatrix * vvertex;
        color = vcolor;
        nvec = prefabworld * vnormal;
        @(msaapackvert)
    }
] [
    varying vec3 nvec;
    varying vec4 color;
    @(msaainterpfrag)

    void main(void)
    {
        gcolor.rgb = color.rgb;
        gcolor.a = 0.0;
        vec3 normal = normalize(nvec);
        @(gnormpackdef normal packnorm)
        @(msaapackfrag)
    }
]

