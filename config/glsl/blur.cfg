////////////////////////////////////////////////
//
// separable blur
//
// The GLSL is in config/glsl/blur/. The alias below only hands it the
// options setblurshader (shader.cpp) looks shaders up by, as #defines; see
// the header of blur.frag.
//
////////////////////////////////////////////////

// blurshader <name> <radius> <x|y> <2D|2DRect>: one pass. A name containing
// "alpha" makes the alpha-weighted variant.
blurshader = [
    shader_new $SHADER_DEFAULT $arg1 [
        shader_define BLUR_RADIUS $arg2
        if (=s $arg3 "x") [shader_define BLUR_X ""]
        if (=s $arg4 "2DRect") [shader_define BLUR_RECT ""]
        if (>= (strstr $arg1 "alpha") 0) [shader_define BLUR_ALPHA ""]
        shader_include_vs "config/glsl/shared/screentexcoord.glsl"
        shader_include_vs "config/glsl/blur/blur_defs.glsl"
        shader_include_fs "config/glsl/blur/blur_defs.glsl"
        shader_include_fs "config/glsl/shared/luma.glsl"
        shader_source "config/glsl/blur/blur.vert" "config/glsl/blur/blur.frag"
    ]
]

loop+ i 1 $MAXBLURRADIUS [
    blurshader (format "blurx%1" $i) $i x 2D
    blurshader (format "blury%1" $i) $i y 2D
    blurshader (format "blurx%1rect" $i) $i x 2DRect
    blurshader (format "blury%1rect" $i) $i y 2DRect
    blurshader (format "bluralphax%1" $i) $i x 2D
    blurshader (format "bluralphay%1" $i) $i y 2D
    blurshader (format "bluralphax%1rect" $i) $i x 2DRect
    blurshader (format "bluralphay%1rect" $i) $i y 2DRect
]
