// Shaders that must be loaded before the engine can render any basic UI.

exec "config/glsl/sdf.cfg" // SDF is needed by UI

rotateuv = [
    result [
        vec2 rotateuv(vec2 uv, float rotation, vec2 mid)
        {
            float cosangle = cos(rotation);
            float sinangle = sin(rotation);
            vec2 p = uv - mid;
            return vec2(
                cosangle * p.x + sinangle * p.y + mid.x,
                cosangle * p.y - sinangle * p.x + mid.y
            );
        }
    ]
]

rotatez = [
    result [
        vec2 rotatez(vec2 uv, float c, float s) { float rx = uv.x, ry = uv.y; uv.x = c*rx-s*ry; uv.y = c*ry+s*rx; return uv; }
        vec2 rotatez(vec2 uv, float angle) { return rotatez(uv, cosf(angle), sinf(angle)); }
        vec2 rotatez(vec2 uv, vec2 sc) { return rotatez(uv, sc.x, sc.y); }
    ]
]

shader $SHADER_DEFAULT "null" [
    attribute vec4 vvertex;

    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        fragcolor = vec4(1.0, 0.0, 1.0, 1.0);
    }
]

shader $SHADER_DEFAULT "hud" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec4 diffuse = texture2D(tex0, texcoord0), color = diffuse * colorscale;
        if(color.a <= 0.0) discard;
        fragcolor = color;
    }
]

shader $SHADER_DEFAULT "hudrect" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2DRect tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec4 color = colorscale * texture2DRect(tex0, texcoord0);
        if(color.a <= 0.0) discard;
        fragcolor = color;
    }
]

shader $SHADER_DEFAULT "hudoutline" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 textparams;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        float dist = color.r * color.a;
        float border = smoothstep(textparams.x, textparams.y, dist);
        float outline = smoothstep(textparams.z, textparams.w, dist);
        vec4 diffuse = vec4(colorscale.rgb * outline, colorscale.a * border);
        if(diffuse.a <= 0.0) discard;
        fragcolor = diffuse;
    }
]

shader $SHADER_DEFAULT "hudtext" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 textparams;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        float dist = texture2D(tex0, texcoord0).r;

        @(if $textsupersample [result [
            float width = fwidth(dist);
            vec2 delta = 0.354 * fwidth(texcoord0);
            vec4 square = vec4(texcoord0 - delta, texcoord0 + delta);

            float dist1 = texture2D(tex0, square.xy).r, dist2 = texture2D(tex0, square.zw).r;
            @(if (= $textsupersample 2) [result [
                float dist3 = texture2D(tex0, square.xw).r, dist4 = texture2D(tex0, square.zy).r;
            ]])

            float border = smoothstep(textparams.x - width, textparams.y + width, dist);
            border += smoothstep(textparams.x - width, textparams.y + width, dist1);
            border += smoothstep(textparams.x - width, textparams.y + width, dist2);
            @(if (= $textsupersample 2) [result [
                border += smoothstep(textparams.x - width, textparams.y + width, dist3);
                border += smoothstep(textparams.x - width, textparams.y + width, dist4);
                border *= 0.25;
            ]] [result [
                border *= 0.45;
            ]])

            float outline = smoothstep(textparams.z - width, textparams.w + width, dist);
            outline += smoothstep(textparams.z - width, textparams.w + width, dist1);
            outline += smoothstep(textparams.z - width, textparams.w + width, dist2);
            @(if (= $textsupersample 2) [result [
                outline += smoothstep(textparams.z - width, textparams.w + width, dist3);
                outline += smoothstep(textparams.z - width, textparams.w + width, dist4);
                outline *= 0.25;
            ]] [result [
                outline *= 0.45;
            ]])
        ]] [result [
            float border = smoothstep(textparams.x, textparams.y, dist);
            float outline = smoothstep(textparams.z, textparams.w, dist);
        ]])

        vec4 diffuse = vec4(colorscale.rgb * outline, colorscale.a * border);
        if(diffuse.a <= 0.0) discard;

        fragcolor = diffuse;
    }
]

shader $SHADER_DEFAULT "hudnotexture" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 hudmatrix;
    varying vec4 color;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        color = vcolor;
    }
] [
    varying vec4 color;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        if(color.a <= 0.0) discard;
        fragcolor = color;
    }
]

shader $SHADER_DEFAULT "hudminimap" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 screenpos;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        screenpos = (hudmatrix * vvertex).xy;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform float millis;
    uniform sampler2D tex0;
    uniform float minimapparam;
    varying vec2 screenpos;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    uint hash(uint x)
    {
        x += (x << 10u);
        x ^= (x >>  6u);
        x += (x <<  3u);
        x ^= (x >> 11u);
        x += (x << 15u);

        return x;
    }

    float hash(float x) { return uintBitsToFloat(hash(floatBitsToUint(x))); }

    void main(void)
    {
        vec4 diffuse = texture2D(tex0, texcoord0), color = diffuse * colorscale;
        vec2 texel = vec2(minimapparam);

        vec4 s1 = texture2D(tex0, (texcoord0 + vec2(   0,  0.5) * texel));
        vec4 s2 = texture2D(tex0, (texcoord0 + vec2( 0.5,    0) * texel));
        vec4 s3 = texture2D(tex0, (texcoord0 + vec2(   0, -0.5) * texel));
        vec4 s4 = texture2D(tex0, (texcoord0 + vec2(-0.5,    0) * texel));

        vec4 dy = (s1 - s3) * 0.5;
        vec4 dx = (s2 - s4) * 0.5;

        float noise = clamp(hash(screenpos.x + screenpos.y + (int(millis*10)&255)), 0.5, 1.0);
        float edge = dot((sqrt(dx*dx + dy*dy) * 10.0).rgb, vec3(0.333));

        color.rgb += min(edge, 0.5) * noise;

        // CRT scan effect
        // screenpos is in -1 to 1 range
        float scanlineIntensity = 0.0;
        scanlineIntensity += abs(fract(screenpos.y * 120.0) * 2.0 - 1.0);
        color.rgb *= 1.0 - (scanlineIntensity * 0.4);

        fragcolor = color;
    }
]

// 2D value noise and fbm sampled from the noiselut composite in config/comp/noise.cfg, bound to the sampler given,
// defined here as the standard shaders need it before the composites are loaded
compositenoiselut2d = [
    result (format [
        float noise(vec2 p)
        {   // smoothly blended value noise, filtered in hardware from the lattice texture
            vec2 i = floor(p), f = p - i;
            f = f*f*(3.0 - 2.0*f);
            i = mod(i, 256.0); // the lattice repeats every 256, keeps texture coordinates precise
            return texture2DLod(%1, (i + f + 0.5)*(1.0/256.0), 0.0).a;
        }

        const mat2 octave = mat2(1.6, 1.2, -1.2, 1.6);

        float fbm3(vec2 p)
        {
            float v = 0.5*noise(p);
            p = octave*p; v += 0.25*noise(p);
            p = octave*p; v += 0.125*noise(p);
            return v / 0.875;
        }

        float fbm(vec2 p)
        {
            float v = 0.0, a = 0.5;
            for(int i = 0; i < 5; i++)
            {
                v += a*noise(p);
                p = octave*p;
                a *= 0.5;
            }
            return v / 0.96875;
        }
    ] $arg1)
]

// the menu scene's slowly drifting sky noise, before its thresholds: red is the smoke, green the cloud bank and blue the wisps,
// computed ahead in the menusky composite or in place when that isn't available
hudbackgroundsky = [
    result [
        vec3 skyfields(vec2 p, float time)
        {
            float far = fbm(p*1.5 + vec2(time*0.012, -time*0.006));
            float smoke = fbm(p*3.5 + far*2.0 - vec2(time*0.02, 0.0));
            vec2 cq = p*1.4 + vec2(time*0.025, 0.0);
            float bank = fbm3(cq*1.3 + fbm3(cq*0.8 - vec2(0.0, time*0.02))*1.6 - vec2(time*0.035, 0.0));
            float wisps = fbm(p*vec2(2.5, 5.0) + fbm3(p*2.0 - time*0.06)*1.5 + vec2(time*0.08, -time*0.015));
            return vec3(far*smoke, bank, wisps);
        }
    ]
]

// the god rays' veil of cloud, looking out from the sun along an angle to a distance, as in the fbmpolar composite
hudbackgroundveil = [
    result [
        float veilfield(vec2 dir, float t, float time) { return fbm3(dir*t*9.0 + vec2(time*0.05, -time*0.03)); }
    ]
]

// the menu figures' mist across the screen: its billows, before their thresholds, and fine wisps through them, carried along with the
// floor by two copies each drifting with it for a couple of seconds, crossfaded so neither starting over shows, flow being how far it
// moves there in that time; computed ahead in the menumist composite or in place when that isn't available, and around the feet
hudbackgroundmist = [
    result [
        vec2 mistfields(vec2 q) { return vec2(fbm(vec2(q.x*9.0, q.y*18.0) + fbm3(q*5.0)*1.2), fbm3(vec2(q.x*14.0, q.y*40.0))); }

        vec2 mistcarried(vec2 q, vec2 flow, float time)
        {
            float phase = fract(time*0.5), other = fract(time*0.5 + 0.5), blend = abs(1.0 - 2.0*phase);
            return mix(mistfields(q - flow*phase + floor(time*0.5)*vec2(3.7, 1.3)),
                       mistfields(q - flow*other + floor(time*0.5 + 0.5)*vec2(3.7, 1.3) + 9.1), blend);
        }

        // how far the floor under the mist moves in those couple of seconds, given the horizon's x, y and curve: coming in slower
        // than its streaks do, speeding up and spreading out towards the viewer
        vec2 mistfloorflow(vec2 q, vec3 horizon)
        {
            float dx = q.x - horizon.x, close = max(q.y - (horizon.y - horizon.z*dx*dx), 0.0) + 0.03;
            return 0.32*close*vec2(dx, close);
        }
    ]
]

// procedural main menu scene, uses [(0, 0), (1, 1)] coordinates
// layer 0 is the scene behind the menu figures, layer 1 is the fog drawn over them, layer 2 the mist around one of them,
// the glitch is hudbackgroundglitch
shader $SHADER_DEFAULT "hudbackground" [
    uniform mat4 hudmatrix;
    attribute vec4 vvertex;
    varying vec2 pos;

    void main()
    {
        gl_Position = hudmatrix * vvertex;
        pos = vvertex.xy;
    }
] [
    uniform float time;
    uniform float aspect;
    uniform float level;
    uniform float layer;
    uniform vec4 eclipse; // x, y, radius, crescent offset
    uniform float sunsize; // sun radius relative to the planet
    uniform vec4 horizon; // x, y, curve, glow
    uniform float beat; // how hard the horizon glow is pulsing with the music's beat
    uniform float zoom; // how far the scene is zoomed out, about the eclipse across and the scene's middle down
    uniform float middle; // where the scene's middle is down the screen
    uniform vec4 figures[6]; // on the screen: x, feet y, height of figures, then minus the fade if glitched or one plus the fade if kept clear
    uniform float mistfigure; // which figure's mist layer 2 draws
    uniform float glitch; // whether tex0 holds a copy of the frame with the figures in it
    uniform float scenefade; // how far the live scene has faded in over the baked still
    uniform float usecomp; // whether the sky noise is precomputed in the composites
    uniform vec4 letters; // the logo's lettering beside the eclipse, as the image is placed in the scene: x, y, width, height
    uniform sampler2D tex0, tex1, tex2, tex3, tex4, tex5; // frame copy, noiselut, menusky and fbmpolar composites, the lettering, menumist

    varying vec2 pos;

    fragdata(0) vec4 fragcolor;

    float hash(vec2 p)
    {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
    }

    @(compositenoiselut2d tex1)
    @(hudbackgroundsky)
    @(hudbackgroundveil)
    @(hudbackgroundmist)

    // dark and deeply saturated like the emblem, keeping the hue as it brightens and burning out sharply to white where every channel is hot
    vec3 tonemap(vec3 c)
    {
        float m = max(c.r, max(c.g, c.b)), t = 1.0 - exp(-m*0.65);
        return mix(c*(t/max(m, 1e-4)), vec3(t), smoothstep(2.0, 3.0, min(c.g, c.b)));
    }

    float jitterangle(vec2 p) { return hash(p*vec2(613.0, 457.0))*0.5236; }

    // ground plane coordinates below the curved horizon: x across, depth into the distance, height below the horizon
    vec3 ground(vec2 p)
    {
        float dx = p.x - horizon.x, edge = p.y - (horizon.y - horizon.z*dx*dx);
        float depth = 1.0 / (max(edge, 0.0) + 0.03);
        return vec3(dx*depth, depth, edge);
    }

    void main()
    {
        vec2 ps = vec2((pos.x - 0.5) / aspect, pos.y - middle); // on the screen in height units, y down, origin at the scene's middle
        vec2 p = vec2(eclipse.x + (ps.x - eclipse.x) / zoom, ps.y / zoom); // in the scene, zoomed out
        float aa = 1.5 * abs(dFdy(pos.y)) / zoom;
        float r = eclipse.z;
        float rs = r*sunsize;
        vec2 e = p - eclipse.xy, sc = eclipse.xy - vec2(0.0, r*eclipse.w), ts = sc - p;
        float ed = length(e), sd = length(ts);
        vec3 g = ground(p);
        float pulse = 0.88 + 0.08*sin(time*0.9) + 0.04*sin(time*2.3);
        // a round fisheye falloff around the scene
        float lens = 1.0 - smoothstep(0.45, 1.05, length((ps - vec2(horizon.x, 0.05))*vec2(0.8, 1.0)));

        if(layer > 1.5)
        {   // one figure's mist, drawn just after it so any figure standing in front of it covers it: the floor's clouds breaking
            // against its feet and billowing up around them to hide where they stand, carried on past with the floor where it lies,
            // coming in slower than its streaks do and spreading out towards the viewer
            vec4 f = figures[int(mistfigure + 0.5)];
            float base = f.y - f.z*(f.w > 0.5 ? 0.1 : 0.16); // where the feet stand within the preview's margin
            vec2 d = (ps - vec2(f.x, base)) / vec2(f.z*0.95, f.z*(ps.y < base ? 0.17 : 0.28));
            float mist = f.z > 0.0 ? min(exp(-dot(d, d))*1.3, 1.0) * (f.w > 0.5 ? f.w - 1.0 : -f.w) : 0.0; // fading in with the figure
            mist *= smoothstep(horizon.w*0.6, horizon.w*1.2, g.z); // kept off the glow along the horizon
            if(mist < 0.004)
            {
                fragcolor = vec4(0.0);
                return;
            }
            // moving on with the floor as the menumist composite has it, and lifting a little just where it breaks against the feet,
            // which is worked out here and eased into the rest
            vec2 feet = (ps - vec2(f.x, base)) / (f.z*vec2(0.2, 0.035));
            float lift = exp(-dot(feet, feet));
            vec2 fields = usecomp > 0.5 ? texture2DLod(tex5, pos, 0.0).rg : vec2(0.0); // composites are stored top down
            if(usecomp < 0.5 || lift > 0.005)
            {
                vec2 here = mistcarried(p, mix(mistfloorflow(p, horizon.xyz), vec2(0.0, -0.02*f.z/zoom), lift), time);
                fields = usecomp > 0.5 ? mix(fields, here, smoothstep(0.005, 0.05, lift)) : here;
            }
            float billow = smoothstep(0.3, 0.75, fields.x), wisp = fields.y;
            mist *= 0.75 + 0.25*smoothstep(0.2, 0.7, wisp);
            // lighter where the billows are thick, deep red between them
            vec3 misttone = mix(vec3(0.9, 0.02, 0.02), vec3(2.4, 0.1, 0.1), billow)*(0.7 + 0.3*wisp);
            float lit = exp(-g.z*4.0) + exp(-abs(p.x - eclipse.x)*3.0)*0.3 + mist*0.6;
            vec3 tone = mix(vec3(0.6, 0.02, 0.02)*(0.4 + lit), misttone, clamp(mist*1.5, 0.0, 1.0));
            fragcolor = vec4(tonemap(tone*pulse)*(0.4 + 0.6*lens)*level, clamp(mist*0.55, 0.0, 1.0)*scenefade); // the baked still has none
            return;
        }

        if(layer > 0.5)
        {   // drifting fog over the figures
            float fog = 0.0;
            if(g.z > 0.03)
            {
                fog = fbm(vec2(g.x*0.12 + time*0.04, g.y*0.35 - time*0.12));
                fog = smoothstep(0.3, 0.8, fog) * smoothstep(0.03, 0.2, g.z) * (0.55 + 0.45*fbm3(p*3.0 + vec2(time*0.07, 0.0)));
            }
            bool near = false;
            for(int i = 0; i < 6; i++)
            {
                vec4 f = figures[i];
                if(glitch > 0.5 && f.z > 0.0 && abs(ps.x - f.x) < f.z*0.65 && ps.y > f.y - f.z*1.1 && ps.y < f.y + f.z*0.1) near = true;
            }
            if(fog <= 0.0 && !near)
            {   // nothing here, so skip the rest
                fragcolor = vec4(0.0);
                return;
            }
            float lit = exp(-g.z*4.0) + exp(-abs(p.x - eclipse.x)*3.0)*0.3;
            vec3 fogtone = vec3(0.6, 0.02, 0.02)*(0.4 + lit);
            vec4 fogc = vec4(tonemap(fogtone*pulse), clamp(fog*0.8, 0.0, 1.0));
            fogc.rgb *= (0.4 + 0.6*lens)*level;
            fogc.a *= scenefade; // the baked still already has its own fog
            vec4 res = fogc;
            // bloom bleeding off the bright parts of the figures
            vec3 bloom = vec3(0.0);
            if(near)
            {
                for(int k = 0; k < 12; k++)
                {
                    float a = float(k)*0.5236 + jitterangle(pos);
                    vec2 dir = vec2(cos(a)*aspect, sin(a));
                    vec3 s1 = texture2D(tex0, vec2(pos.x, 1.0 - pos.y) + dir*0.006).rgb, s2 = texture2D(tex0, vec2(pos.x, 1.0 - pos.y) + dir*0.016).rgb;
                    bloom += vec3(max(s1.r - 0.85 - (s1.g + s1.b)*0.7, 0.0)*3.6 + max(s2.r - 0.85 - (s2.g + s2.b)*0.7, 0.0)*3.0);
                }
                bloom *= vec3(1.0, 0.04, 0.04) * 0.1;
            }
            float ba = clamp(max(bloom.r, max(bloom.g, bloom.b)), 0.0, 1.0);
            if(ba > 0.0)
            {
                vec3 rgb = res.rgb*res.a*(1.0 - ba) + bloom;
                res.a = res.a + ba*(1.0 - res.a);
                res.rgb = rgb / max(res.a, 1e-4);
            }
            fragcolor = res;
            return;
        }

        vec3 col = vec3(0.0);
        float spin = time*0.008, cs = cos(spin), sn = sin(spin);
        vec2 dir = mat2(cs, sn, -sn, cs) * (e / max(ed, 1e-4));
        if(g.z < 0.004)
        {   // only the sky above the floor
        vec3 fields;
        if(usecomp > 0.5) fields = texture2DLod(tex2, pos, 0.0).rgb; // composites are stored top down
        else fields = skyfields(p, time);

        // far layer: dark mottled smoke
        col = vec3(0.045, 0.002, 0.002) * (0.4 + 1.3*fields.r);

        // stars: pinpricks scattered across the sky, twinkling, lost in the sun's glare and the haze over the horizon
        float starfade = smoothstep(0.12, 0.45, sd) * smoothstep(0.02, 0.15, -g.z) * (1.1 - fields.r);
        if(starfade > 0.0)
        {
            float px = abs(dFdy(pos.y)) / zoom;
            for(int i = 0; i < 2; i++)
            {
                float scale = i == 0 ? 70.0 : 30.0;
                vec2 q = p*scale + float(i)*17.3, cell = floor(q);
                float h = hash(cell + float(i)*31.7);
                if(h < 0.8) continue;
                vec2 at = vec2(hash(cell + 1.7), hash(cell + 8.3))*0.7 + 0.15;
                float size = px*(i == 0 ? 0.7 : 1.1)*(0.7 + 0.6*hash(cell + 4.1));
                float star = exp(-pow(length(fract(q) - at)/(scale*size), 2.0));
                float twinkle = 0.5 + 0.5*sin(time*(0.8 + 2.0*hash(cell + 6.6)) + h*40.0);
                vec3 tint = mix(vec3(1.0, 0.15, 0.15), vec3(1.0), hash(cell + 9.9));
                col += tint * star * twinkle*twinkle * (i == 0 ? 0.9 : 2.4) * starfade;
            }
        }

        // sunburst: smoky streaks radiating from the eclipse, crimson shading into deep red
        float lr = log(ed + 0.02);
        float burst = fbm(dir*4.5 + vec2(lr*0.5 - time*0.03, time*0.012));
        float burstfall = exp(-max(ed - r, 0.0)*2.6);
        vec3 burstcol = mix(vec3(0.36, 0.01, 0.01), vec3(0.22, 0.0, 0.0), smoothstep(0.45, 0.75, fbm3(dir*2.0 + 3.0)));
        col += burstcol * smoothstep(0.42, 0.8, burst) * burstfall * pulse;
        col *= 1.0 - 0.55*smoothstep(0.55, 0.85, 1.0 - burst)*burstfall;

        // mid layer: a cloud bank drifting across, its edges lit from the eclipse
        float bank = smoothstep(0.38, 0.75, fields.g);
        vec3 bankcol = vec3(0.1, 0.002, 0.002)*(0.5 + fields.r) + vec3(0.45, 0.008, 0.008)*exp(-sd*2.5)*(0.5 + 0.5*fields.b);
        col = col*(1.0 - bank*0.45) + bankcol*bank*0.7;

        // god rays: the crescent's glow streaked out through a fine veil of cloud
        // only the stretch near the sun adds anything, so just that is sampled, scaled to the whole line
        float shafts = 0.0;
        if(sd < 1.4)
        {
            float jitter = hash(pos*vec2(731.0, 377.0) + fract(time*7.0)), reach = min(sd, 0.4);
            vec2 away = -ts/max(sd, 1e-4);
            float angle = atan(away.y, away.x)*(1.0/6.2831853);
            for(int i = 0; i < 8; i++)
            {
                float t = reach*(float(i) + jitter)/8.0;
                float veil;
                if(usecomp > 0.5) veil = texture2DLod(tex3, vec2(angle, t/0.4), 0.0).r;
                else veil = veilfield(away, t, time);
                veil = smoothstep(0.3, 0.5, veil);
                shafts += (1.0 - veil) * exp(-t*9.0);
            }
            shafts *= exp(-sd*1.5) * reach / (8.0*max(sd, 1e-4));
        }
        col += mix(vec3(1.0, 0.04, 0.04), vec3(0.55, 0.0, 0.0), smoothstep(0.1, 0.5, sd)) * shafts * 0.6 * pulse;

        // near layer: thin wisps drifting quickly past
        col += vec3(0.25, 0.01, 0.01) * smoothstep(0.6, 0.85, fields.b) * (0.15 + exp(-sd*3.0));
        }

        // the eclipse: a hot crescent over a planet lit red by it
        float planet = smoothstep(r + aa, r - aa, ed);
        float sun = smoothstep(rs + aa, rs - aa, sd) * (1.0 - planet);
        float outside = 1.0 - planet;
        float above = smoothstep(0.3, -0.6, dot(normalize(p - eclipse.xy + 1e-4), vec2(0.0, 1.0)));
        col += (vec3(1.0, 0.03, 0.03)*exp(-max(sd - rs, 0.0)*14.0)*(0.5 + 0.5*above) + vec3(2.5, 0.1, 0.1)*exp(-max(sd - rs, 0.0)*45.0)) * outside * pulse;
        // solar prominences: flame-like wisps and fine fibres rising off the sun's limb, as in the logo, reaching out much further
        // towards the lettering beside the eclipse and streaming on behind it, as if it hung there in space
        float lift = (sd - rs)/rs;
        vec2 along = normalize(eclipse.xy + vec2(4.15, -0.135)*r - sc); // from the sun to the middle of the lettering, see calcbackgroundlogo
        float down = dot(-ts, along)/rs, across = (-ts.x*along.y + ts.y*along.x)/rs;
        float towards = down > 0.0 ? exp(-pow(across/(1.2 + down*0.06), 2.0)) : 0.0; // a band as tall as the lettering
        if(lift > 0.0 && lift < 3.0 + 6.5*towards)
        {
            vec2 u = -ts/max(sd, 1e-4);
            float rise = lift*0.9 - time*0.2;
            float flame = fbm(u*3.0 + fbm3(u*2.0 + lift*0.5 - time*0.12)*1.0 + vec2(rise, -rise*0.6));
            flame = smoothstep(0.42, 0.7, flame) * exp(-lift*mix(1.4, 0.18, towards)) * (1.0 + 1.5*towards) * smoothstep(3.0 + 6.5*towards, 2.0 + 4.0*towards, lift);
            float fibres = smoothstep(0.3, 0.7, noise(u*60.0 + vec2(time*0.08, 0.0)) * noise(u*20.0 - lift*3.0 + time*0.3) * 2.0) * exp(-lift*mix(4.5, 0.4, towards)) * (1.0 + towards);
            col += vec3(2.0, 0.04, 0.04) * (flame*1.5 + fibres*0.6) * outside * pulse;
        }
        // and wisps of the same flame trailing off the lettering's edges, carried on away from the sun, looking back along the flow
        // for a letter upstream, wavering more the further the flame has come from it
        vec2 luv = (p - letters.xy) / letters.zw;
        if(luv.x > -0.05 && luv.x < 1.2 && luv.y > -0.3 && luv.y < 1.15)
        {
            vec2 n = p / r, drift = along*time*0.5;
            float wisps = 0.0, jitter = hash(pos*vec2(531.0, 419.0) + fract(time*3.0));
            vec2 waver = (vec2(fbm3(n*3.2 - drift*1.4), fbm3(n*3.2 + 3.1 - drift*1.4)) - 0.5) * r * 1.6;
            for(int k = 0; k < 8; k++)
            {
                float t = (float(k) + jitter)/8.0; // spread between the steps so they don't show as copies of the letters
                vec2 q = (p - along*t*r*1.4 + waver*t - letters.xy) / letters.zw;
                wisps += smoothstep(0.45, 0.9, texture2DLod(tex4, q, 1.0 + 2.0*t).a) * (1.0 - t);
            }
            wisps *= 0.4 * smoothstep(0.3, 0.8, fbm(n*2.6 - drift*1.8) * (0.6 + 0.8*fbm3(n*7.0 - drift*2.4)));
            col += vec3(2.2, 0.04, 0.04) * wisps * outside * pulse;
        }
        col = mix(col, vec3(4.0), sun);
        if(planet > 0.0)
        {
            // a sphere: rough ground wrapped around it and slowly turning, dimly lit on the side facing the sun and black on the far side
            vec2 n = e / r;
            float nz = sqrt(clamp(1.0 - dot(n, n), 0.0, 1.0));
            vec3 normal = vec3(n.x, -n.y, nz);
            vec2 sph = vec2(atan(n.x, nz) + time*0.01, asin(clamp(-n.y, -1.0, 1.0)))*1.5;
            float rock = fbm(sph*2.2 + 4.0) * (0.5 + 0.5*fbm(sph*7.0 - 2.0));
            // fine relief: the normal bent by the slope of finer noise, so the ground catches the light
            float detail = fbm3(sph*14.0);
            vec2 slope = vec2(fbm3(sph*14.0 + vec2(0.04, 0.0)), fbm3(sph*14.0 + vec2(0.0, 0.04))) - detail;
            vec3 bumped = normalize(normal - vec3(slope.x, -slope.y, 0.0)*8.0);
            vec3 light = normalize(vec3(0.0, 1.0, 0.7));
            float diffuse = max(dot(bumped, light), 0.0), sunward = clamp(dot(normal, light)*0.5 + 0.5, 0.0, 1.0);
            vec3 surface = vec3(0.7, 0.015, 0.015) * pow(diffuse, 2.0) * (0.35 + 0.9*rock) * (0.6 + 0.8*detail);
            surface += vec3(0.05, 0.0, 0.0) * pow(max(-normal.y, 0.0), 2.0) * (0.5 + rock); // faint bounce off the glowing horizon below
            // sunlight scattering through the air over the top of the planet, under the crescent
            surface += vec3(0.9, 0.02, 0.02) * pow(1.0 - nz, 5.0) * smoothstep(-0.2, 0.9, -n.y) * 1.6;
            surface += vec3(0.7, 0.015, 0.015) * pow(1.0 - nz, 8.0) * (0.3 + 0.7*sunward); // thin glowing atmosphere round the whole limb
            col = mix(col, surface, planet);
        }

        // lens ghosts trailing from the sun
        for(int i = 0; i < 4; i++)
        {
            float f = 0.6 + float(i)*0.45, gr = 0.025 + 0.02*float(i);
            float gd = length(p - mix(sc, vec2(0.1, -0.05), f));
            float ghost = smoothstep(gr, gr*0.75, gd) * (0.35 + 0.65*smoothstep(gr*0.4, gr, gd));
            col += mix(vec3(0.5, 0.02, 0.02), vec3(0.8, 0.04, 0.04), float(i)/3.0) * ghost * 0.04 * pulse;
        }

        // soft clouds drifting in the sky behind the figures, in front of the eclipse, glowing where the sun is behind them
        if(g.z < -0.06 && g.z > -0.95)
        {
            float above = -g.z;
            float layer = smoothstep(0.08, 0.22, above) * smoothstep(0.9, 0.5, above);
            vec2 cp = vec2(p.x*2.2 + time*0.018, p.y*3.0);
            float warp = fbm3(cp*0.7 - vec2(time*0.01, 0.0));
            float cloud = smoothstep(0.42, 0.72, fbm(cp + warp*1.2)) * layer;
            if(cloud > 0.0)
            {
                float glow = exp(-sd*2.2), body = fbm3(cp*2.0 + 5.0);
                vec3 cloudcol = vec3(0.32, 0.01, 0.01)*(0.6 + 0.8*body) + vec3(1.1, 0.05, 0.05)*glow*(0.4 + 0.6*body);
                col = mix(col, max(col, cloudcol*pulse), cloud*0.85);
            }
        }

        // the horizon glows up into the sky, swelling on the beat
        float upward = max(-g.z, 0.0), beatglow = 1.0 + 0.5*beat;
        col += (vec3(1.5, 0.06, 0.06)*exp(-upward/0.018) + vec3(0.7, 0.02, 0.02)*exp(-upward/(0.07*(1.0 + 0.3*beat)))*0.4) * outside * pulse * beatglow;

        // the ground: rough lit dirt streaking towards the viewer, a thick hot band along the horizon and fog pooling on it
        if(g.z > -0.004)
        {
        float streak = fbm(vec2(g.x*0.3, g.y*2.5 + time*0.8)) * (0.45 + 0.55*noise(vec2(g.x*2.0, g.y*16.0 + time*4.0)));
        float rough = fbm(vec2(g.x*1.2, g.y*4.0 + time*0.8));
        float band = exp(-g.z / (horizon.w*1.2)) * beatglow, core = exp(-pow((g.z - horizon.w*0.35) / (horizon.w*0.35), 2.0)) * (1.0 + 0.15*beat);
        vec3 floorcol = vec3(0.5, 0.018, 0.018) * (0.08 + 1.8*rough*rough + 0.6*streak) * exp(-g.z*1.1);
        floorcol += vec3(0.8, 0.02, 0.02) * band * (0.4 + 0.9*streak);
        // the hot core: red glow with a hard white edge, as round the emblem's sun
        floorcol += vec3(2.5, 0.03, 0.03) * core * (0.75 + 0.4*streak);
        floorcol = mix(floorcol, vec3(4.0), smoothstep(0.55, 0.7, core*(0.75 + 0.4*streak)));
        float groundfog = smoothstep(0.35, 0.85, fbm(vec2(g.x*0.1 + time*0.05, g.y*0.5 - time*0.1)));
        floorcol += vec3(0.55, 0.022, 0.022) * groundfog * (0.25 + band);
        col = mix(col, floorcol * pulse, smoothstep(-0.004, 0.004, g.z));
        }

        // drifting bokeh specks
        for(int i = 0; i < 2; i++)
        {
            float scale = i == 0 ? 9.0 : 5.0;
            vec2 q = p*scale + vec2(time*0.012, -time*0.02)*scale + float(i)*7.7;
            vec2 cell = floor(q), f = fract(q) - 0.5;
            float h = hash(cell + float(i)*13.0);
            if(h > 0.88)
            {
                float d = length(f - (vec2(hash(cell + 3.1), hash(cell + 5.7)) - 0.5)*0.4) / mix(0.08, 0.22, hash(cell + 9.3));
                vec3 tint = mix(vec3(1.0, 0.02, 0.02), vec3(1.0, 0.08, 0.08), hash(cell + 11.9));
                col += tint * smoothstep(1.0, 0.85, d) * (0.5 + 0.5*smoothstep(0.6, 1.0, d)) * (0.6 + 0.4*sin(time*0.7 + h*40.0)) * 0.04;
            }
        }

        // tonemap, lens falloff and grain
        col = tonemap(col) * (0.2 + 0.8*lens);
        col += (hash(pos*vec2(1913.0, 1171.0) + fract(time)) - 0.5) * 0.012;

        fragcolor = vec4(col * level, 1.0);
    }
]

// the menu scene's glitch: rectangular glass columns around the flanking figures, each refracting what's behind it,
// drawn as a quad per column from the far to the near, set up in the vertex shader
shader $SHADER_DEFAULT "hudbackgroundglitch" [
    uniform mat4 hudmatrix;
    uniform float time;
    uniform float aspect;
    uniform vec4 horizon; // x, y, curve, glow
    uniform float middle; // where the scene's middle is down the screen
    uniform vec4 figures[6]; // x, feet y, height of figures, then minus the fade if glitched or one plus the fade if kept clear
    attribute vec4 vvertex; // corner across and down, figure, column
    varying vec2 pos;
    flat varying vec4 column; // centre, width, top, bottom
    flat varying vec4 info; // seed, depth, opacity
    flat varying float height; // of the figure

    float hash(vec2 p)
    {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
    }

    void main()
    {
        int i = int(vvertex.z);
        float j = vvertex.w;
        vec4 f = figures[i];
        float fade = clamp(-f.w, 0.0, 1.0);
        gl_Position = vec4(2.0, 2.0, 0.0, 1.0); // off screen unless the column is showing
        pos = vec2(0.0);
        column = info = vec4(0.0);
        height = 0.0;
        if(f.z <= 0.0 || f.w > 0.5 || fade <= 0.0) return;
        // fewer columns when the figures are squeezed together, so the group keeps the same density
        float gap = 1e3;
        for(int k = 0; k < 6; k++) if(k != i && figures[k].z > 0.0 && figures[k].w < 0.5) gap = min(gap, abs(figures[k].x - f.x));
        float count = 9.0*clamp(gap/(f.z*0.62), 0.35, 1.0);
        if(j >= count) return;
        // each column lives for a second or two: fading in somewhere over the figure, holding, then fading out
        vec2 slot = vec2(float(i)*7.13, j*3.31);
        float life = time*(0.9 + 0.7*hash(slot)) + hash(slot + 5.1), cycle = floor(life), age = fract(life);
        float shown = smoothstep(0.0, 0.2, age)*smoothstep(1.0, 0.8, age);
        if(shown <= 0.0) return;
        vec2 id = slot + cycle*vec2(1.37, 2.11);
        float h1 = hash(id), h2 = hash(id + 11.7), h3 = hash(id + 23.1), h5 = hash(id + 41.9);
        // standing at its own depth around the figure, drawn far to near: nearer columns are bigger and stand lower on the floor
        float depth = clamp((j + hash(id + 3.3))/count, 0.0, 1.0), near = mix(0.7, 1.12, depth);
        float hy = horizon.y - horizon.z*(f.x - horizon.x)*(f.x - horizon.x);
        float w = f.z*(0.042 + 0.038*h2)*near;
        float u = h1*2.0 - 1.0;
        float bx = f.x + sign(u)*pow(abs(u), 1.6)*f.z*0.3*mix(0.9, 1.05, depth); // mostly over the body, some out along the arms
        float bottom = hy + (f.y - hy)*near + f.z*(0.12*h5 - 0.02)*near;
        float top = bottom - f.z*near*(h3 < 0.2 ? 0.7 + 0.5*h3 : 0.95 + 0.2*h3);
        // kept to the area around the figure
        vec2 lo = vec2(max(bx - w*0.5, f.x - f.z*0.65), max(top, f.y - f.z*1.5)), hi = vec2(min(bx + w*0.5, f.x + f.z*0.65), min(bottom, f.y + f.z*0.4));
        if(hi.x <= lo.x || hi.y <= lo.y) return;
        vec2 p = mix(lo, hi, vvertex.xy);
        pos = vec2(p.x*aspect + 0.5, p.y + middle);
        gl_Position = hudmatrix * vec4(pos, 0.0, 1.0);
        column = vec4(bx, w, top, bottom);
        info = vec4(id, depth, fade*shown);
        height = f.z;
    }
] [
    uniform float time;
    uniform float aspect;
    uniform float middle; // where the scene's middle is down the screen
    uniform sampler2D tex0; // the frame with the figures in it
    varying vec2 pos;
    flat varying vec4 column;
    flat varying vec4 info;
    flat varying float height;

    fragdata(0) vec4 fragcolor;

    float hash(vec2 p)
    {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
    }

    // dispersion kept to the scene's palette: one side fringes red, the other white
    vec3 refractfetch(vec2 uv, float split)
    {
        vec3 l = vec3(0.299, 0.587, 0.114);
        vec3 mid = texture2D(tex0, vec2(uv.x, 1.0 - uv.y)).rgb;
        float a = dot(texture2D(tex0, vec2(uv.x + split, 1.0 - uv.y)).rgb, l), b = dot(texture2D(tex0, vec2(uv.x - split, 1.0 - uv.y)).rgb, l), m = dot(mid, l);
        return mid + vec3(max(a - m, 0.0)*1.4, 0.0, 0.0) + vec3(0.6)*max(b - m, 0.0);
    }

    void main()
    {
        vec2 p = vec2((pos.x - 0.5) / aspect, pos.y - middle);
        float px = abs(dFdy(pos.y));
        float bx = column.x, w = column.y, top = column.z, bottom = column.w, fz = height, depth = info.z;
        vec2 id = info.xy;
        float h2 = hash(id + 11.7);
        float sx = (p.x - bx) / (w*0.5);
        float v = (p.y - top) / (bottom - top), edgepx = px / (w*0.5);

        // a prism: two or three flat faces, each a lens bending its own view of what's behind
        float seamat = (h2 - 0.5)*0.8, threeface = step(0.55, hash(id + 61.3));
        float face = sx < seamat ? 0.0 : 1.0;
        if(threeface > 0.5 && sx > seamat + (1.0 - seamat)*0.5) face = 2.0;
        float lo = face < 0.5 ? -1.0 : (face < 1.5 ? seamat : seamat + (1.0 - seamat)*0.5);
        float hi = face < 0.5 ? seamat : (face < 1.5 && threeface > 0.5 ? seamat + (1.0 - seamat)*0.5 : 1.0);
        float fu = ((sx - lo)/(hi - lo))*2.0 - 1.0; // across this face
        vec2 fid = id + face*vec2(3.7, 1.9);
        float fa = hash(fid + 0.3), fb = hash(fid + 7.7), fc = hash(fid + 13.1);

        // how hard each face bends what's behind, different for each and slowly swelling and easing
        float bend = (1.1 + 1.6*fb)*(0.7 + 0.3*sin(time*(0.3 + 0.4*fa) + fc*6.28));
        float facecentre = bx + (lo + hi)*0.25*w;
        // the view through is magnified and flipped about each face, bending hardest at its edges
        vec2 tuv = vec2(facecentre*aspect + 0.5, pos.y);
        tuv.x -= fu*(hi - lo)*0.5*w*bend*aspect;
        tuv.x += (fu*fu*fu*0.35 + sin(v*5.0 + fc*6.28 + time*0.4)*0.12)*w*bend*aspect;
        tuv.y += sin(fu*1.6 + fc*4.0)*fz*0.02*bend - (v - 0.5)*fz*0.06*(bend - 1.0);
        // bending up from the straight view as the column fades in, and back down as it fades out
        tuv = mix(pos, tuv, info.w);
        // softened by the glass, with the colour dispersing most at the edges of each face
        float split = 0.0012*abs(fu)*bend*info.w*aspect;
        vec3 c = (refractfetch(tuv, split) + refractfetch(tuv + vec2(0.0, 0.0025), split) + refractfetch(tuv - vec2(0.0, 0.0025), split)) / 3.0;
        vec3 behind = texture2D(tex0, vec2(pos.x, 1.0 - pos.y)).rgb;

        // red tinted glass, each face catching the light a little differently, darker where the faces turn away
        float shade = (0.9 + 0.1*fb) * (1.0 - 0.15*pow(abs(fu), 4.0));
        c *= vec3(1.0, 0.88, 0.88) * shade * (0.97 + 0.05*v);
        float sheen = exp(-pow((fu + 0.4 - 0.5*fa)*3.5, 2.0));
        c += vec3(0.4, 0.02, 0.02)*sheen*0.25;

        // faint edges: the seams between faces, the column's sides and its top
        float edges = smoothstep(1.0 - 2.0*edgepx, 1.0, abs(sx));
        float seam = smoothstep(1.5*edgepx, 0.0, min(abs(sx - seamat), threeface > 0.5 ? abs(sx - (seamat + (1.0 - seamat)*0.5)) : 1.0));
        float cap = smoothstep(2.0*px, 0.0, p.y - top);
        c += vec3(1.0, 0.08, 0.08)*(edges*0.15 + seam*0.12 + cap*0.25);

        // further columns sink into the haze, and all fade in with the figure, blended over those drawn before
        c = mix(c, behind*0.85 + vec3(0.12, 0.005, 0.005), (1.0 - depth)*0.4);
        fragcolor = vec4(c, info.w);
    }
]
