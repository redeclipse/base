// shadowmaptype:
//    a -> transparent
//    m -> alpha-mask
//    n -> normalmap

smtopt = [ >= (strstr $shadowmaptype $arg1) 0 ]

shadowmapworldvariantshader = [
    local shadowmaptype
    shadowmaptype = $arg2
    srow = -1
    if (smtopt "m") [
        srow = 0
    ]
    if (smtopt "n") [
        srow = 1
    ]
    variantshader_new $SHADER_WORLD $arg1 $srow 0 [
        if (smtopt "a") [shader_define SM_ALPHA ""]
        if (smtopt "m") [shader_define SM_ALPHAMASK ""]
        if (smtopt "n") [shader_define SM_NORMALMAP ""]
        shader_source "config/glsl/world/shadowmap.vert" "config/glsl/world/shadowmap.frag"
    ]
]

shadowmapshader = [
    defershader $SHADER_WORLD $arg1 [
        shadowmapworldvariantshader @arg1 @arg2
        shadowmapworldvariantshader @arg1 @(concatword $arg2 "m")
        shadowmapworldvariantshader @arg1 @(concatword $arg2 "mn")
    ]
]

shadowmapshader "smalphaworld" "a"

defershader $SHADER_WORLD "rsmworld" [
    loop i 2 [
        variantshader_new $SHADER_WORLD "rsmworld" (- $i 1) 0 [
            if $i [shader_define RSM_BLEND ""]
            shader_source "config/glsl/world/rsm.vert" "config/glsl/world/rsm.frag"
        ]
    ]
]
