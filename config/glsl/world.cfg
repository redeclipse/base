////////////////////////////////////////////////////////
//
// world shaders
//
// The GLSL is in config/glsl/world/. The variant aliases below stage the
// slot params and hand the GLSL the type letters and engine state as
// #defines; see the header of world/world.frag.
//
///////////////////////////////////////////////////////

// worldtype:
//    e -> reserve envmap texture slot
//    r -> envmap reflection
//    R -> modulate envmap reflection with spec map
//    s -> spec
//    S -> spec map
//    g -> glow
//    G -> pulse glow
//    b -> blendmap
//    a -> transparent
//    A -> refractive
//    m -> alpha-mask
//    T -> triplanar
//    d -> detail
//    v -> displacement

wtopt = [ >= (strstr $worldtype $arg1) 0 ]

worldvariantshader = [
    local worldtype
    worldtype = $arg2
    stype = $SHADER_WORLD
    if (wtopt "e") [
        stype = (| $stype $SHADER_ENVMAP)
    ]
    srow = -1
    if (wtopt "G") [
        stype = (| $stype $SHADER_DYNAMIC)
        defuniformparam "glowcolor" 1 1 1 // glow color
        defuniformparam "pulseglowspeed" 1     // pulse frequency (Hz)
        defuniformparam "pulseglowcolor" 0 0 0 // pulse glow color
        defuniformparam "pulseglowoffset" 0 // pulse glow offset
    ] [if (wtopt "g") [
        defuniformparam "glowcolor" 1 1 1  // glow color
    ]]
    if (wtopt "R") [
        defuniformparam "envmin" 0 0 0 // minimum reflectivity
        defuniformparam "envscale" 1 1 1 // reflectivity map multiplier
    ] [if (wtopt "r") [
        defuniformparam "envmin" 0 0 0 // minimum reflectivity
        defuniformparam "envscale" 0.2 0.2 0.2 // reflectivity
    ]]
    defuniformparam "gloss" 1 // glossiness
    if (wtopt "S") [
        defuniformparam "specscale" 2 2 2 // spec map multiplier
    ] [if (wtopt "s") [
        defuniformparam "specscale" 1 1 1 // spec multiplier
    ]]
    if (wtopt "T") [
        defuniformparam "triplanarbias" 0.3 0.3 0.3
        stype = (| $stype $SHADER_TRIPLANAR)
    ]
    if (wtopt "b") [
        srow = 0
    ]
    if (wtopt "a") [
        if (wtopt "A") [stype = (| $stype $SHADER_REFRACT)]
        srow = 1
    ]
    if (wtopt "v") [
        defuniformparam "dispscale" 0.125 0.125 0.125 0.125 // displacement scale modifier
        defuniformparam "dispscroll" 0.0 0.125 0.25 -0.25 // displacement scroll modifier
        defuniformparam "dispcontrib" 1.0 1.0 0.125 // displacement texture contribution
    ]
    variantshader_new $stype $arg1 $srow 0 [
        worldvariantdefines $worldtype
        shader_source "config/glsl/world/world.vert" "config/glsl/world/world.frag"
    ]
]

// worldvariantdefines <type>: the defines and includes of a world or bump
// shader body (worldvariantshader, bumpvariantshader).
worldvariantdefines = [
    local worldtype
    worldtype = $arg1
    if (wtopt "r") [shader_define WORLD_REFLECT ""]
    if (wtopt "R") [shader_define WORLD_REFLECT_SPECMAP ""]
    if (wtopt "s") [shader_define WORLD_SPEC ""]
    if (wtopt "S") [shader_define WORLD_SPECMAP ""]
    if (wtopt "g") [shader_define WORLD_GLOW ""]
    if (wtopt "G") [shader_define WORLD_PULSEGLOW ""]
    if (wtopt "b") [shader_define WORLD_BLEND ""]
    if (wtopt "a") [shader_define WORLD_ALPHA ""]
    if (wtopt "A") [shader_define WORLD_REFRACT ""]
    if (wtopt "m") [shader_define WORLD_ALPHAMASK ""]
    if (wtopt "T") [shader_define WORLD_TRIPLANAR ""]
    if (wtopt "d") [shader_define WORLD_DETAIL ""]
    if (wtopt "v") [shader_define WORLD_DISPLACE ""]
    if (wtopt "p") [shader_define WORLD_PARALLAX ""]
    shader_define MSAA_LIGHT $msaalight
    shader_define MSAA_SAMPLES $msaasamples
    shader_define GDEPTH_FORMAT $gdepthformat
    shader_define USEPACKNORM $usepacknorm
    shader_include_vs "config/glsl/world/world_defs.glsl"
    shader_include_vs "config/glsl/shared/gbuffer.glsl"
    shader_include_fs "config/glsl/world/world_defs.glsl"
    shader_include_fs "config/glsl/shared/gfetch.glsl"
    shader_include_fs "config/glsl/shared/gdepth.glsl"
    shader_include_fs "config/glsl/shared/gbuffer.glsl"
    shader_include_fs "config/glsl/shared/gnormal.glsl"
    shader_include_fs "config/glsl/shared/gcolor.glsl"
    // The engine reads the output declarations from the text, ignoring #if,
    // so each output set has its own file.
    shader_include_fs (gbufferoutputs)
]

worldshaders = []

// 1:<hints>
findworldshader = [
    listfind i $worldshaders [
        && [= (strlen $arg1) (strlen (at $i 1))] [strhaschars $arg1 (at $i 1)]
    ]
]

worldshader = [
    worldtype = $arg2
    stype = $SHADER_WORLD
    if (wtopt "e") [
        stype = (| $stype $SHADER_ENVMAP)
    ]
    if (wtopt "T") [
        stype = (| $stype $SHADER_TRIPLANAR)
    ]
    defershader $stype $arg1 [
        worldvariantshader @arg1 @arg2
        worldvariantshader @arg1 @(concatword $arg2 "b")
        worldvariantshader @arg1 @(concatword $arg2 "a")
        worldvariantshader @arg1 @(concatword $arg2 "aA")
    ]

    append worldshaders [[@@arg1 @@arg2]]
]

