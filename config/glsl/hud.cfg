shader $SHADER_DEFAULT "hudaura" [
    attribute vec4 vvertex;
    uniform mat4 hudmatrix;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 auraparams; // x = 1/width, y = 1/height, z = glow mipmap level, w = brightness
    uniform vec2 auracolour; // x = blend, y = hidden fill

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy * auraparams.xy;
        vec4 mask = texture2DLod(tex0, uv, 0.0); // rgb = aura colour, a = visible coverage
        if(mask.a >= 1.0) discard; // the model is visible here

        if(mask.a <= 0.0 && max(mask.r, max(mask.g, mask.b)) > 0.0)
        {   // an on-top model hidden behind something
            if(auracolour.y <= 0.0) discard;
            fragcolor = vec4(mask.rgb * (auracolour.x * auracolour.y), 0.0);
            return;
        }

        // the mipmaps spread the silhouette out, wider levels add a softer tail
        vec3 glow = texture2DLod(tex0, uv, auraparams.z).rgb * 0.5 +
            texture2DLod(tex0, uv, auraparams.z + 1.0).rgb * 0.3 +
            texture2DLod(tex0, uv, auraparams.z + 2.0).rgb * 0.2;

        float peak = max(glow.r, max(glow.g, glow.b));
        if(peak <= 0.002) discard;

        // keep the hue while letting the edge saturate so thin and thick parts glow alike, the glow sits behind partly covered edges
        fragcolor = vec4(glow * (min(peak * auraparams.w, 1.0) / peak * auracolour.x * (1.0 - mask.a)), 0.0);
    }
]

shader $SHADER_DEFAULT "hudvisor" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2DRect tex0;
    uniform vec4 visorparams, visorsize;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        // WARNING: This program MUST produce the same
        // results as the engine 'visorsurf.coords()' for cursor projection

        vec2 uv = texcoord0.xy;

        uv *= visorsize.zw;

        uv -= vec2(0.5);
        uv *= visorparams.zw;

        float l = length(uv);
        uv.xy *= (1.0 + visorparams.x * visorparams.y * visorparams.y);
        uv.xy /= (1.0 + visorparams.x + l * l);

        uv += vec2(0.5);

        uv *= visorsize.xy;

        vec4 diffuse = texture2DRect(tex0, uv);

        if(diffuse.a <= 0.0) discard;

        fragcolor = diffuse * colorscale;
    }
]

hudblit = [
    shader $SHADER_DEFAULT $arg1 [
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        uniform mat4 hudmatrix;
        varying vec2 texcoord0;

        void main(void)
        {
            gl_Position = hudmatrix * vvertex;
            texcoord0 = vtexcoord0;
        }
    ] [
        uniform float visortime;
        uniform vec4 visorsize;
        uniform sampler2DRect tex0;

        @(if (>= (strstr $arg1 "glass") 0) [result [
            uniform sampler2DRect tex1, tex2;
            uniform vec4 blitglass;
            uniform vec2 blitscale;
            #define blittex tex1
        ]] [result [
            #define blittex tex0
        ]])
        uniform vec3 visorfx; // x = glitch, y = saturate, z = narrow
        varying vec2 texcoord0;

        fragdata(0) vec4 fragcolor;

        void main(void)
        {
            vec3 outcolor = texture2DRect(blittex, texcoord0).rgb;

            vec2 cuv = texcoord0 * visorsize.zw * 2.0 - 1.0;
            float dist = visorfx.z > 0.0 ? clamp(distance(vec2(0.0), cuv) * visorfx.z, 0.0, 1.0) : 1.0;

            if(dist > 0.0 && visorfx.x > 0.0)
            {
                float offset = clamp(visorfx.x * dist, 0.0, 1.0),
                    jitter = (fract(sin(texcoord0.y * 0.05 + visortime) * 5000.0) - 0.5) * offset * 0.005 * visorsize.x;
                outcolor.rgb = mix(outcolor.rgb, texture2DRect(blittex, texcoord0 + vec2(jitter, 0.0)).rgb, offset * 0.75);
            }

            @(if (>= (strstr $arg1 "glass") 0) [result [
                float blitamt = clamp(texture2DRect(tex0, texcoord0).a * blitglass.z, blitglass.x, blitglass.y);

                if(dist > 0.0 && blitamt < 1.0 && blitglass.w > 0.0) blitamt += (blitglass.w * dist) * (1.0 - blitamt);
                
                if(blitamt > 0.0)
                {
                    vec2 glasscuv = texcoord0 * blitscale;
                    vec3 glasscolor = texture2DRect(tex2, glasscuv).rgb;

                    if(dist > 0.0 && visorfx.x > 0.0)
                    {
                        float offset = clamp(visorfx.x * dist, 0.0, 1.0),
                            jitter = (fract(sin(glasscuv.x * 0.05 + visortime) * 5000.0) - 0.5) * offset * 0.005 * visorsize.x * blitscale.x;
                        glasscolor.rgb = mix(glasscolor.rgb, texture2DRect(tex2, glasscuv + vec2(jitter, 0.0)).rgb, offset * 0.75);
                    }

                    outcolor = mix(outcolor, glasscolor, clamp(blitamt, 0.0, 1.0));
                }
            ]])

            if(dist > 0.0)
            {
                if(visorfx.y > 1.0)
                    outcolor = mix(outcolor, outcolor * visorfx.y, dist);
                else if(visorfx.y < 1.0)
                    outcolor = mix(outcolor, vec3(dot(outcolor, vec3(@lumweights))), dist * (1.0 - visorfx.y));
            }

            fragcolor = vec4(outcolor, 1.0);
        }
    ]
]
hudblit "hudblit"
hudblit "hudblitglass"

shader $SHADER_DEFAULT "hudrender" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;

    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform float visortime;
    uniform sampler2DRect tex0;
    uniform vec4 visorsize;
    uniform vec3 visorfx; // x = glitch, y = saturate, z = narrow
    varying vec2 texcoord0;
    varying vec4 colorscale;

    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec4 outcolor = texture2DRect(tex0, texcoord0);

        vec2 cuv = texcoord0 * visorsize.zw * 2.0 - 1.0;
        float dist = visorfx.z > 0.0 ? clamp(distance(vec2(0.0), cuv) * visorfx.z, 0.0, 1.0) : 1.0;

        if(dist > 0.0)
        {
            if(visorfx.x > 0.0)
            {
                float offset = clamp(visorfx.x * dist, 0.0, 1.0),
                      jitter = (fract(sin(texcoord0.y * 0.05 + visortime) * 5000.0) - 0.5) * offset * 0.005 * visorsize.x;
                outcolor.rgb = mix(outcolor.rgb, texture2DRect(tex0, texcoord0 + vec2(jitter, 0.0)).rgb, offset * 0.75);
            }

            if(outcolor.a <= 0.0) discard;

            if(visorfx.y > 1.0)
                outcolor.rgb = mix(outcolor.rgb, outcolor.rgb * visorfx.y, dist);
            else if(visorfx.y < 1.0)
                outcolor.rgb = mix(outcolor.rgb, vec3(dot(outcolor.rgb, vec3(@lumweights))), dist * (1.0 - visorfx.y));
        }
        
        if(outcolor.a <= 0.0) discard;
        
        fragcolor = colorscale * outcolor;
    }
]
