////////////////////////////////////////////////
//
// decals
//
// The GLSL is in config/glsl/decal/. decalvariantshader below stages the
// slot params and hands the GLSL the type letters and engine state as
// #defines; see the header of decal.frag.
//
////////////////////////////////////////////////

// decaltype:
//    e -> reserve envmap texture slot
//    r -> envmap reflection
//    R -> modulate reflection with spec map
//    s -> spec
//    S -> spec map
//    n -> normal map
//    p -> parallax
//    g -> glow
//    G -> pulse glow
//    b -> keep normals
//    v -> displacement
//    0 -> pass 0
//    1 -> pass 1

dtopt = [ >= (strstr $decaltype $arg1) 0 ]

decalvariantshader = [
    local decaltype
    decaltype = $arg2
    stype = $SHADER_WORLD
    if (dtopt "e") [
        stype = (| $stype $SHADER_ENVMAP)
    ]
    srow = (? (dtopt "1") 0 -1)
    if (dtopt "G") [
        stype = (| $stype $SHADER_DYNAMIC)
        defuniformparam "glowcolor" 1 1 1 // glow color
        defuniformparam "pulseglowspeed" 1     // pulse frequency (Hz)
        defuniformparam "pulseglowcolor" 0 0 0 // pulse glow color
    ] [if (dtopt "g") [
        defuniformparam "glowcolor" 1 1 1  // glow color
    ]]
    if (dtopt "R") [
        defuniformparam "envscale" 1 1 1 // reflectivity map multiplier
    ] [if (dtopt "r") [
        defuniformparam "envscale" 0.2 0.2 0.2 // reflectivity
    ]]
    reuseuniformparam "gloss" 1 // glossiness
    if (dtopt "S") [
        defuniformparam "specscale" 2 2 2 // spec map multiplier
    ] [if (dtopt "s") [
        defuniformparam "specscale" 1 1 1 // spec multiplier
    ]]
    if (dtopt "p") [
        defuniformparam "parallaxscale" 0.06 -0.03 // parallax scaling
    ]
    if (dtopt "n") [
        defuniformparam "bumpblend" 1 // alpha-blend strength for normals
    ]
    if (dtopt "v") [
        defuniformparam "dispscale" 0.125 0.125 0.125 0.125 // displacement scale modifier
        defuniformparam "dispscroll" 0.0 0.125 0.25 -0.25 // displacement scroll modifier
        defuniformparam "dispcontrib" 1.0 1.0 0.125 // displacement texture contribution
    ]
    variantshader_new $stype $arg1 $srow 0 [
        if (dtopt "r") [shader_define DECAL_REFLECT ""]
        if (dtopt "R") [shader_define DECAL_REFLECT_SPECMAP ""]
        if (dtopt "s") [shader_define DECAL_SPEC ""]
        if (dtopt "S") [shader_define DECAL_SPECMAP ""]
        if (dtopt "n") [shader_define DECAL_NORMALMAP ""]
        if (dtopt "p") [shader_define DECAL_PARALLAX ""]
        if (dtopt "g") [shader_define DECAL_GLOW ""]
        if (dtopt "G") [shader_define DECAL_PULSEGLOW ""]
        if (dtopt "b") [shader_define DECAL_KEEPNORMALS ""]
        if (dtopt "v") [shader_define DECAL_DISPLACE ""]
        if (dtopt "0") [shader_define DECAL_PASS0 ""]
        if (dtopt "1") [shader_define DECAL_PASS1 ""]
        shader_define USEPACKNORM $usepacknorm
        shader_include_fs "config/glsl/shared/gcolor.glsl"
        shader_include_fs "config/glsl/shared/gnormal.glsl"
        // The engine reads the output declarations from the text, ignoring
        // #if, so each output set has its own file.
        shader_include_fs (concatword "config/glsl/decal/out_" (cond [dtopt "0"] [result pass0] [dtopt "1"] [? $usepacknorm pass1 pass1_blend] [result single]) ".glsl")
        shader_source "config/glsl/decal/decal.vert" "config/glsl/decal/decal.frag"
    ]
]

decalshaders = []

// 1:<hints>
finddecalshader = [
    listfind i $decalshaders [
        && [= (strlen $arg1) (strlen (at $i 1))] [strhaschars $arg1 (at $i 1)]
    ]
]

decalshader = [
    decaltype = $arg2
    stype = $SHADER_WORLD
    if (dtopt "e") [
        stype = (| $stype $SHADER_ENVMAP)
    ]
    defershader $stype $arg1 [
        if $maxdualdrawbufs [
            decalvariantshader @@arg1 @@(concatword $arg2 "0")
            if @@(! (dtopt "b")) [
                decalvariantshader @@@arg1 @@@(concatword $arg2 "1")
            ]
        ] [
            decalvariantshader @@arg1 @@arg2
        ]
    ]

    append decalshaders [[@@arg1 @@arg2]]
]

