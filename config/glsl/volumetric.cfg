////////////////////////////////////////////////
//
// volumetric lights
//
// The GLSL is in config/glsl/volumetric/. The aliases below hand it the
// variant row, the step count, the type letters and the engine state as
// #defines; volumetric.frag and bilateral.frag list them.
//
////////////////////////////////////////////////

// volumetrictype, from loadvolumetricshader (renderlights.cpp):
//    p -> shadowed lights
//    P -> colour-shadowed lights
//    s -> spotlights
//    G -> 5x5 weighted gather filter
//    g -> 3x3 weighted gather filter
//    E -> 5x5 weighted bilinear filter
//    F -> 3x3 weighted bilinear filter
//    f -> 4x rotated grid filter
//    N -> no filtering
// The filter only picks the shadow atlas to read; the ray march takes a
// single sample per step.
volopt = [ >= (strstr $volumetrictype $arg1) 0 ]

// volumetricvariantshader <name> <row> <type> <steps>
volumetricvariantshader = [
    local volumetrictype
    volumetrictype = $arg3
    variantshader_new $SHADER_DEFAULT $arg1 $arg2 0 [
        shader_define VOL_ROW $arg2
        shader_define VOL_STEPS $arg4
        if (volopt "p") [shader_define VOL_SHADOW ""]
        if (volopt "G") [shader_define SMFILTER_GATHER5 ""]
        if (volopt "g") [shader_define SMFILTER_GATHER3 ""]
        if (volopt "E") [shader_define SMFILTER_BILINEAR5 ""]
        if (volopt "F") [shader_define SMFILTER_BILINEAR3 ""]
        if (volopt "f") [shader_define SMFILTER_ROTATED ""]
        shader_define SMFILTER_SINGLE ""
        shader_define SMFILTER_COLOR ""
        shader_define GFETCH_MS $msaalight
        shader_define GDEPTH_FORMAT $gdepthformat
        shader_define USETEXGATHER $usetexgather
        shader_include_fs "config/glsl/shared/gfetch.glsl"
        shader_include_fs "config/glsl/shared/gdepth.glsl"
        shader_include_fs "config/glsl/shared/smfilter.glsl"
        shader_include_fs "config/glsl/volumetric/volumetric_steps.glsl"
        // Only the parent has a vertex stage; the rows reuse it.
        shader_source (? (< $arg2 0) "config/glsl/volumetric/volumetric.vert") "config/glsl/volumetric/volumetric.frag"
    ]
]

// volumetricshader <filter+s> <p|pP> <steps>: the parent (unshadowed point
// lights) and one row per light kind rendervolumetric (renderlights.cpp)
// picks: 0/1 shadowed/colour-shadowed point, 2 spot, 3/4 shadowed/colour-shadowed spot.
volumetricshader = [
    volumetrictype = (concatword $arg1 $arg2)
    shadername = (concatword "volumetric" $volumetrictype $arg3)
    volumetricvariantshader $shadername -1 $arg1 $arg3
    volumetricvariantshader $shadername 0 (concatword $arg1 $arg2) $arg3
    if (volopt "P") [
      volumetricvariantshader $shadername 1 (concatword $arg1 $arg2) $arg3
    ]
    if (volopt "s") [
        volumetricvariantshader $shadername 2 $arg1 $arg3
        volumetricvariantshader $shadername 3 (concatword $arg1 $arg2) $arg3
        if (volopt "P") [
            volumetricvariantshader $shadername 4 (concatword $arg1 $arg2) $arg3
        ]
    ]
]

// volumetricbilateralvariantshader <name> <taps> <reduce> <x|y>
volumetricbilateralvariantshader = [
    shader_new $SHADER_DEFAULT $arg1 [
        shader_define VOLBILATERAL_TAPS $arg2
        shader_define BILATERAL_REDUCE $arg3
        if (=s $arg4 "x") [shader_define BILATERAL_X ""]
        shader_define GFETCH_MS $msaalight
        shader_define GDEPTH_FORMAT $gdepthformat
        shader_define TEXRECT_MINOFFSET $mintexrectoffset
        shader_define TEXRECT_MAXOFFSET $maxtexrectoffset
        shader_include_vs "config/glsl/shared/screentexcoord.glsl"
        shader_include_fs "config/glsl/shared/gfetch.glsl"
        shader_include_fs "config/glsl/shared/gdepth.glsl"
        shader_include_fs "config/glsl/shared/bilateral.glsl"
        shader_source "config/glsl/shared/bilateral.vert" "config/glsl/volumetric/bilateral.frag"
    ]
]

// volumetricbilateralshader <taps> <reduce>, from loadvolumetricshaders.
volumetricbilateralshader = [
    volumetricbilateralvariantshader (concatword "volumetricbilateralx" $arg1 $arg2) $arg1 $arg2 x
    volumetricbilateralvariantshader (concatword "volumetricbilateraly" $arg1 $arg2) $arg1 $arg2 y
]
