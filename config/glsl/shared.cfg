lazyshader = [
    defershader $arg1 $arg2 [
        shader @arg1 @arg2 [@@arg3] [@@arg4]
    ]
]

// lazyshader_new <type> <name> <body>: shader_new, compiled on first use like lazyshader.
// The body runs when the shader is forced, so it reads engine state then.
lazyshader_new = [
    defershader $arg1 $arg2 [
        shader_new @arg1 @arg2 [@@arg3]
    ]
]

ginterpdepth = [
    result [
        uniform vec2 lineardepthscale;
        uniform vec3 gdepthpackparams;
        varying float lineardepth;
    ]
]

ginterpvert = [
    if (|| $gdepthformat $arg1) [ginterpdepth]
]
msaainterpvert = [ginterpvert $msaasamples]

ginterpfrag = [
    result [
        fragdata(0) vec4 gcolor;
        fragdata(1) vec4 gnormal;
        @(? $gdepthformat [
            fragdata(2) vec4 gdepth;
            fragdata(3) vec4 gglow;
        ] [
            fragdata(2) vec4 gglow;
        ])
        @(if (|| $gdepthformat $arg1) [ginterpdepth])
    ]
]
msaainterpfrag = [ginterpfrag $msaasamples]

// gbufferoutputs: the include holding ginterpfrag's output declarations for
// $gdepthformat, for shader_include_fs (config/glsl/shared/gbuffer.glsl).
gbufferoutputs = [
    ? $gdepthformat "config/glsl/shared/gbuffer_out_depth.glsl" "config/glsl/shared/gbuffer_out.glsl"
]

gdepthpackvert = [
    if (|| $gdepthformat $arg1) [result [
        lineardepth = dot(lineardepthscale, gl_Position.zw);
    ]]
]
msaapackvert = [gdepthpackvert $msaasamples]

gpackdepth = [
    result [
        vec3 @arg1 = @arg2 * gdepthpackparams;
        @arg1 = vec3(@arg1.x, fract(@arg1.yz));
        @arg1.xy -= @arg1.yz * (1.0/255.0);
    ]
]

ghashdepth = [
    if $arg3 [
        arg1 = [(@arg1 + 5.0*@arg3)]
    ]
    if $arg2 [result [
        @arg2*0.76 + mix(0.75, 0.25, @arg2)*fract(@arg1*mix(-1.0/192.0, -1.0/64.0, @arg2))
    ]] [result [
        0.75*fract(@arg1*(-1.0/192.0))
    ]]
]

gdepthpackfrag = [
    result [
        @(if (= $gdepthformat 1) [result [
            @(gpackdepth packdepth lineardepth)
            gdepth.rgb = packdepth;
            gdepth.a = @(? $arg2 $arg2 [0.0]);
        ]] [? (> $gdepthformat 1) [
            gdepth.r = lineardepth;
        ]])
        @(if $usepacknorm [result [
            gnormal.a = @(if $arg1 [ghashdepth lineardepth $arg2 $arg3] [? $arg2 $arg2 [0.0]]);
        ]])
    ]
]
msaapackfrag = [gdepthpackfrag $msaasamples $arg1 $arg2]

gspecpack = [
    result [
        gcolor.a = @(if $arg3 [result [@arg3 *]]) (@arg1 * 85.0/255.0 + 0.5/255.0) @(if $arg2 [result [+ @(if $arg3 [result [@arg4 *]]) 84.0/255.0*clamp(1.5 - 1.5/(1.0 + @arg2), 0.0, 1.0)]]); 
    ]
]

gnormpack = [
    if $usepacknorm [result [
        gnormal.rgb = @arg1 @(if $arg2 [result [* sqrt(0.25 + 0.5*(@arg2))]]) * 0.5 + 0.5;
    ]] [result [
        gnormal.rgb = @arg1*0.5 + 0.5;
        gnormal.a = @(if $arg2 [result [(@arg2)]] [result [1.0]]);
    ]]
]

gnormpackdef = [
    result [
        #ifdef @arg2
            @(gnormpack $arg1 $arg2)
        #else
            @(gnormpack $arg1)
        #endif
    ]
]

gglowpack = [
    result [
        @(if $arg1 [result [
            float colork = max(gcolor.r, max(gcolor.g, gcolor.b)), glowk = max(@arg1.r, max(@arg1.g, @arg1.b));
        ]])
        glowk /= glowk + colork + 1.0e-3;
        gcolor.rgb = @(if $arg1 [result [mix(gcolor.rgb, @arg1, glowk)]] [result [gcolor.rgb]]) * (1.0 - 2.0*glowk*(glowk - 1.0));
        #define @arg2 1.0-glowk
    ]
]

// how much of the world haze colour a surface takes at a distance; hazetint.a stays 0 until the opaque scene has been tinted,
// so only what is drawn after it tints itself
hazetintdefs = [
    result [
        uniform vec4 hazetint;
        uniform vec3 hazetintparams;
        float hazeamount(float dist)
        {
            float offset = dist - hazetintparams.x;
            return clamp(offset*hazetintparams.y, 0.0, 1.0) * clamp(offset*hazetintparams.z, 0.0, 1.0) * hazetint.a;
        }
    ]
]

// unpacknorm and unpackspec: config/glsl/ui.cfg still uses them. Keep them
// in step with GNORMAL_UNPACK_SCALE (shared/gnormal.glsl) and GSPEC_UNPACK
// (shared/gcolor.glsl) until it is ported.
unpacknormbias = 0.005
unpacknormscale = (+f 1 (*f 2 $unpacknormbias))
unpacknorm = [
    result [
        @arg1 = clamp(@arg1 * @(divf $unpacknormscale 0.5) - @(+f (*f $unpacknormscale (divf 0.25 0.5)) $unpacknormbias), 0.0, 1.0);
    ]
]

unpackspec = [
    result [
        vec3 camdir = normalize(camera - pos.xyz);
        float facing = 2.0*dot(normal.xyz, camdir);
        float specscale = min(3.0*(diffuse.a + 0.5/255.0), 2.999), gloss = floor(specscale);
        specscale -= gloss;
        specscale = (0.35 + 0.15*gloss) * specscale / (1.5 - specscale);
        gloss = 5.0 + 17.0*gloss;
    ]
]

gdepthunpackparams = [
    result [
        uniform vec3 gdepthscale;
        uniform vec3 gdepthunpackparams;
    ]
]

gdepthunpack = [
    if $arg6 [
        if $arg7 [result [
            vec3 @[arg7] = @[arg2].rgb;
            float @[arg1] = dot(@[arg7], gdepthunpackparams); 
            @arg3
        ]] [result [
            float @[arg1] = dot(@[arg2].rgb, gdepthunpackparams); 
            @arg3
        ]]
    ] [if (|| $gdepthformat $arg5) [
        if (|| (> $gdepthformat 1) $arg5) [result [
            float @[arg1] = @[arg2].r;
            @arg3
        ]] [result [
            float @[arg1] = dot(@[arg2].rgb, gdepthunpackparams); 
            @arg3
        ]]
    ] [if (=s $arg4 []) [result [
        float @[arg1] = gdepthscale.x / (@[arg2].r*gdepthscale.y + gdepthscale.z);
    ]] [result [
        float @[arg1] = @[arg2].r;
        @arg4
    ]]]]
]

gdepthunpackortho = [
    result [
        float @[arg1] = @(if (= $gdepthformat 1) [result [dot(@[arg2].rgb, gdepthunpackparams)]] [result [@[arg2].r]]);
        @arg3
    ]
]

gfetchdefs = [
    gfetchprefix = (? $arg3 $arg3 "gfetch")
    if (? (>= $numargs 2) $arg2 $msaalight) [result [
        uniform sampler2DMS @(prettylist $arg1);
        #define @[gfetchprefix]sample 0
        #define @[gfetchprefix](sampler, coords) texelFetch(sampler, ivec2(coords), @[gfetchprefix]sample)
        #define @[gfetchprefix]offset(sampler, coords, offset) texelFetch(sampler, ivec2(coords) + offset, @[gfetchprefix]sample)
        #define @[gfetchprefix]proj(sampler, coords) texelFetch(sampler, ivec2(coords.xy / coords.z), @[gfetchprefix]sample)
        @(if (! $arg3) [gdepthunpackparams])
    ]] [result [
        uniform sampler2DRect @(prettylist $arg1);
        #define @[gfetchprefix](sampler, coords) texture2DRect(sampler, coords)
        #define @[gfetchprefix]offset(sampler, coords, offset) texture2DRectOffset(sampler, coords, offset)
        #define @[gfetchprefix]proj(sampler, coords) texture2DRectProj(sampler, coords)
        @(if (! $arg3) [gdepthunpackparams])
    ]]
]

screentexcoord = [
    result [
        uniform vec4 screentexcoord@arg1;
        #define vtexcoord@arg1 (vvertex.xy * screentexcoord@arg1.xy + screentexcoord@arg1.zw)
    ]
]

rottexcoord = [
    result [
        @[arg1] = @[arg2].x * @[arg1].xy + @[arg2].yz * @[arg1].yx;
    ]
]

// A face with a touch texture shows it over its own texture on the tiles that have been touched, the shader half of
// touchtexstate in renderva.cpp. The face is drawn first, faded out by how lit its tile is, then its touch texture
// adds itself back in by the same amount. A tile is one repeat of the touch texture on one plane, kept in a table
// hashed by where it lies on the touch texture and which texture it is, so fragments carry their world position in
// touchpos to find their tile and tell which plane they lie on.
touchtexdefs = [
    result [
        uniform vec4 touchtexparams; // 1 drawing a face under its touch texture or 2 drawing the touch texture, else 0; its index; the time now; how far to probe
        uniform vec4 touchtexgen[2]; // where a position lies on the touch texture, in repeats
        uniform vec2 touchtexmatch; // how far from a lit tile's plane a fragment may be and how closely it must face the same way
        uniform sampler2D touchtexmap;
        varying vec3 touchpos;

        float touchtexweight()
        {
            if(touchtexparams.x < 0.5) return 1.0;
            vec3 n = cross(dFdx(touchpos), dFdy(touchpos));
            vec2 tile = floor(vec2(dot(touchtexgen[0].xyz, touchpos) + touchtexgen[0].w, dot(touchtexgen[1].xyz, touchpos) + touchtexgen[1].w));
            ivec2 size = textureSize(touchtexmap, 0);
            uint rowslots = uint(size.x / 3), mask = rowslots * uint(size.y) - 1u;
            uint h = (uint(int(tile.x)) * 73856093u) ^ (uint(int(tile.y)) * 19349663u) ^ (uint(int(touchtexparams.y)) * 83492791u);
            float lit = 0.0;
            for(int i = 0; i < int(touchtexparams.w); i++)
            {
                uint slot = (h + uint(i)) & mask;
                ivec2 at = ivec2(int(slot % rowslots) * 3, int(slot / rowslots));
                vec4 t = texelFetch(touchtexmap, at, 0);
                if(t.z < 0.0) break; // no tile lies past an empty slot
                if(t.z != touchtexparams.y || t.xy != tile) continue;
                vec4 p = texelFetch(touchtexmap, at + ivec2(1, 0), 0);
                if(abs(dot(p.xyz, touchpos) - t.w) < touchtexmatch.x && abs(dot(p.xyz, n)) > touchtexmatch.y*length(n))
                {
                    lit = clamp((p.w - touchtexparams.z) / texelFetch(touchtexmap, at + ivec2(2, 0), 0).x, 0.0, 1.0);
                    break;
                }
            }
            return touchtexparams.x > 1.5 ? lit : 1.0 - lit;
        }
    ]
]

// the start of a world shader, so a touch texture leaves its unlit tiles before it is shaded
touchtexbegin = [
    result [
        float touchw = touchtexweight();
        if(touchtexparams.x > 1.5 && touchw <= 0.0) discard;
    ]
]

// the end of a world shader: arg1 is whether it is see through, which keeps its glow apart from its colour
touchtexapply = [
    result [
        gcolor *= touchw;
        @(if $usepacknorm [result [
            gnormal.rgb *= touchw;
            if(touchtexparams.x > 1.5) gnormal.a = 0.0;
        ]] [result [
            gnormal *= touchw;
        ]])
        @(? $arg1 [gglow *= touchw;])
    ]
]

// The blendmap lookup, the shader half of blendslice in octa.h and the textures built in blend.cpp. A blended face's
// fragments carry their world position and the face's orientation in blendpos; the face reads the slice just in
// front of it along its own axis. arg1 is the atlas sampler.
blendmapdefs = [
    result [
        uniform vec4 blendmapparams, blendindexparams, blendatlasparams;
        uniform sampler2D blendindex;

        // an entry's two halves, high then low: a high half of 65535 holds a value, otherwise the entry is an index
        vec2 blendindexfetch(float i)
        {
            float row = floor((i + 0.5) * blendindexparams.y);
            float col = i - row * blendindexparams.x;
            return floor(texture2D(blendindex, vec2((col + 0.5) * blendindexparams.y, (row + 0.5) * blendindexparams.z)).rg * 65535.0 + 0.5);
        }

        float blendlookup(vec4 bpos)
        {
            float orient = floor(bpos.w + 0.5), dim = floor(orient * 0.5);
            float depth;
            vec2 across;
            if(dim < 0.5) { depth = bpos.x; across = bpos.yz; }
            else if(dim < 1.5) { depth = bpos.y; across = bpos.zx; }
            else { depth = bpos.z; across = bpos.xy; }
            float slice = orient - dim * 2.0 > 0.5 ? floor((depth + 4.0 - 0.0625) * 0.25) : floor((depth + 0.0625) * 0.25) - 1.0;
            float pagedepth = floor(slice / blendmapparams.w);
            vec2 pageacross = floor(across * 0.015625);
            vec3 page = dim < 0.5 ? vec3(pagedepth, pageacross.x, pageacross.y) : (dim < 1.5 ? vec3(pageacross.y, pagedepth, pageacross.x) : vec3(pageacross.x, pageacross.y, pagedepth));
            vec3 region = floor(page / blendmapparams.y);
            float rootsize = blendmapparams.x;
            if(min(page.x, min(page.y, page.z)) < 0.0 || max(region.x, max(region.y, region.z)) >= rootsize) return 1.0;
            vec3 inregion = page - region * blendmapparams.y, chunkpages = vec3(blendmapparams.y / blendmapparams.z);
            vec3 chunk = floor(inregion / chunkpages), inchunk = inregion - chunk * chunkpages;
            float tablesize = blendmapparams.z;
            vec2 entry = blendindexfetch(((dim * rootsize + region.z) * rootsize + region.y) * rootsize + region.x);
            if(entry.x >= 65535.0) return entry.y * (1.0/255.0);
            entry = blendindexfetch(entry.x * 65536.0 + entry.y + (chunk.z * tablesize + chunk.y) * tablesize + chunk.x);
            if(entry.x >= 65535.0) return entry.y * (1.0/255.0);
            entry = blendindexfetch(entry.x * 65536.0 + entry.y + (inchunk.z * tablesize + inchunk.y) * tablesize + inchunk.x);
            if(entry.x >= 65535.0) return entry.y * (1.0/255.0);
            entry = blendindexfetch(entry.x * 65536.0 + entry.y + slice - pagedepth * blendmapparams.w);
            if(entry.x >= 65535.0) return entry.y * (1.0/255.0);
            float tile = entry.x * 65536.0 + entry.y, row = floor((tile + 0.5) / blendatlasparams.x);
            vec2 texel = vec2(tile - row * blendatlasparams.x, row) * 18.0 + 1.0 + (across - pageacross * 64.0) * 0.25;
            return texture2D(@[arg1], texel * blendatlasparams.yz).r;
        }
    ]
]

lumweights = "0.2126, 0.7152, 0.0722"
//lumweights = "0.299, 0.587, 0.114"
