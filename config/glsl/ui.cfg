////////////////////////////////////////////////
//
// UI shaders
//
////////////////////////////////////////////////

lazyshader $SHADER_DEFAULT "modelpreview" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    varying vec2 texcoord0;

    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    @(gfetchdefs [tex0 tex1 tex3])
    uniform vec3 camera;
    uniform mat4 worldmatrix;
    uniform vec4 lightscale;
    uniform vec3 sunlightdir;
    uniform vec3 sunlightcolor;
    uniform vec3 exlightdir;
    uniform vec3 exlightcolor;
    uniform float cutout;
    uniform float opacity;
    uniform vec4 rimlight; // colour, sharpness
    uniform float glowboost;
    uniform vec4 grade; // colour, amount
    uniform vec3 ssstep; // gbuffer texels per pixel, taps across each side of it
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;

    // shades the model at a point in the gbuffer, false where it isn't covered
    bool shadetap(vec2 tc, out vec3 light)
    {
        light = vec3(0.0);
        vec4 normal = gfetch(tex1, tc);
        if(normal.x + normal.y == cutout) return false;

        normal.xyz = normal.xyz*2.0 - 1.0;
        @(if $usepacknorm [result [
            float glowscale = dot(normal.xyz, normal.xyz);
            normal.xyz *= inversesqrt(glowscale);
            @(unpacknorm glowscale)
        ]] [result [
           #define glowscale normal.a
        ]])

        vec4 diffuse = gfetch(tex0, tc);
        vec3 glow = diffuse.rgb * (1.0 - glowscale);
        diffuse.rgb *= glowscale;

        light = diffuse.rgb * lightscale.rgb;
        // boosted glow whitens towards a hot core
        light += mix(glow.rgb, vec3(max(glow.r, max(glow.g, glow.b))), min(glowboost*0.3, 0.8)) * lightscale.a * (1.0 + glowboost);

        if(sunlightdir.x != 0.0 || sunlightdir.y != 0.0 || sunlightdir.z != 0.0)
        {
            float sunfacing = dot(sunlightdir, normal.xyz);
            if(sunfacing > 0.0)
            {
                @(gdepthunpack depth [gfetch(tex3, tc)] [
                    vec3 pos = (worldmatrix * vec4(depth*tc, depth, 1.0)).xyz;
                ] [
                    vec4 pos = worldmatrix * vec4(tc, depth, 1.0);
                    pos.xyz /= pos.w;
                ])
                @(unpackspec)
                float sunspec = pow(clamp(sunfacing*facing - dot(camdir, sunlightdir), 0.0, 1.0), gloss) * specscale;
                light += (diffuse.rgb*sunfacing + sunspec) * sunlightcolor;
            }
        }

        if(exlightdir.x != 0.0 || exlightdir.y != 0.0 || exlightdir.z != 0.0)
        {
            float exfacing = dot(exlightdir, normal.xyz);
            if(exfacing > 0.0)
            {
                @(gdepthunpack depth [gfetch(tex3, tc)] [
                    vec3 pos = (worldmatrix * vec4(depth*tc, depth, 1.0)).xyz;
                ] [
                    vec4 pos = worldmatrix * vec4(tc, depth, 1.0);
                    pos.xyz /= pos.w;
                ])
                @(unpackspec)
                float exspec = pow(clamp(exfacing*facing - dot(camdir, exlightdir), 0.0, 1.0), gloss) * specscale;
                light += (diffuse.rgb*exfacing + exspec) * exlightcolor;
            }
        }

        if(rimlight.r + rimlight.g + rimlight.b > 0.0)
        {   // light catching the silhouette, as from a bright backdrop
            @(gdepthunpack depth [gfetch(tex3, tc)] [
                vec3 pos = (worldmatrix * vec4(depth*tc, depth, 1.0)).xyz;
            ] [
                vec4 pos = worldmatrix * vec4(tc, depth, 1.0);
                pos.xyz /= pos.w;
            ])
            float rim = pow(1.0 - clamp(dot(normal.xyz, normalize(camera - pos.xyz)), 0.0, 1.0), rimlight.a);
            light += rimlight.rgb * rim * (0.5 + diffuse.rgb) * 1.6;
        }

        if(grade.a > 0.0)
        {   // light the model as if by one coloured source: brightness kept, shadows deepening and highlights burning to white
            float luma = dot(light, vec3(0.299, 0.587, 0.114));
            vec3 ramp = grade.rgb * luma * 1.7 + vec3(max(luma - 0.75, 0.0)) * 0.8;
            light = mix(light, ramp, grade.a);
        }

        return true;
    }

    void main(void)
    {
        vec3 light;
        if(ssstep.z > 1.0)
        {   // a tap on each texel the pixel covers, averaging those on the model and covering by how many were, each clipped
            // as the screen would first, else a rim far brighter than white still saturates any pixel it touches and stays thin
            vec3 tap, sum = vec3(0.0);
            float covered = 0.0;
            for(int iy = 0; iy < 4; iy++)
            {
                if(float(iy) >= ssstep.z) break;
                for(int ix = 0; ix < 4; ix++)
                {
                    if(float(ix) >= ssstep.z) break;
                    vec2 offset = (vec2(float(ix), float(iy)) + 0.5)/ssstep.z - 0.5;
                    if(shadetap(texcoord0 + offset*ssstep.xy, tap)) { sum += min(tap, vec3(1.0)); covered += 1.0; }
                }
            }
            if(covered <= 0.0) discard;
            fragcolor.rgb = sum / covered;
            fragcolor.a = opacity * covered / (ssstep.z*ssstep.z);
        }
        else
        {
            if(!shadetap(texcoord0, light)) discard;
            fragcolor.rgb = light;
            fragcolor.a = opacity;
        }
    }
]
