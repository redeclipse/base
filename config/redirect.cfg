// Redirects: what to read in place of a file that has been removed, see doc/engine-systems.md
// fileredirect "removed" "replacement"
// A Redirect is only used when the removed file can't be found anywhere, so a copy that still exists always wins.
// The removed path can use * and ? wildcards and | between alternatives, and the replacement fills in
// what each wildcard matched, numbered from the left, as $1 to $9 ($$ for a literal $).
// Composites match their whole <comp...>name args string, and can stand in for a texture file or be stood in for.
