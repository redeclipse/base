// decals drawn by composites, see config/comp/ and config/map/texcomp.cfg for the textures they match

// the scoreboard, for both teams and for each, and the match ticker
setshader glowdecal
texture decal "<comp:100>scoreboard"
texture g "<comp:100>scoreboard"

setshader glowdecal
texture decal "<comp:100>scoreboard [teamid = 1]"
texture g "<comp:100>scoreboard [teamid = 1]"

setshader glowdecal
texture decal "<comp:100>scoreboard [teamid = 2]"
texture g "<comp:100>scoreboard [teamid = 2]"

setshader glowdecal
texture decal "<comp:1>ticker"
texture g "<comp:1>ticker"

// the flag signs, one across the middle of each, red, blue, green and yellow: the arrow on the left pointing left, then
// on the right pointing right
loop i 8 [
    setshader stddecal
    texture decal (format "<comp:0,-128>flagsign [colour = %1; dir = %2; rows = 1]" (at "0xAB0B00 0x147AB3 0x09BE02 0xFAD824" (div $i 2)) (mod $i 2))
]
