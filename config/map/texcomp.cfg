// textures drawn by composites, see config/comp/
texgroup "composites"

// the scoreboard, for both teams and for each, and the match ticker
setshader glowworld
texture 0 "<comp:100>scoreboard"
texture g "<comp:100>scoreboard"

setshader glowworld
texture 0 "<comp:100>scoreboard [teamid = 1]"
texture g "<comp:100>scoreboard [teamid = 1]"

setshader glowworld
texture 0 "<comp:100>scoreboard [teamid = 2]"
texture g "<comp:100>scoreboard [teamid = 2]"

setshader glowworld
texture 0 "<comp:1>ticker"
texture g "<comp:1>ticker"

// the flag signs, in place of luckystrike's removed ones, red, blue, green and yellow: the arrow on the left pointing
// left, then on the right pointing right
loop i 8 [
    setshader stdworld
    texture c (format "<comp:0,-128>flagsign [colour = %1; dir = %2]" (at "0xAB0B00 0x147AB3 0x09BE02 0xFAD824" (div $i 2)) (mod $i 2)) 0 0 0 1
]
