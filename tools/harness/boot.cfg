// Red Eclipse UI test harness -- in-game command channel.
//
// Loaded at startup by tools/harness/harness.ps1 via:  -x"exec tools/harness/boot.cfg"
//
// Polls <home>/harness/cmd_<n>.cfg and executes each file exactly once, in order.
// The driver writes those files; results come back through log.txt.
//
// Deliberately contains no '#' and no '@' -- see AGENTS.md, "CubeScript traps".

harnessseq = 0
harnessgen = 0

harnesspoll = [
    // Retire this chain if a newer generation has started.
    if (= $arg1 $harnessgen) [
        // 'exec' searches the home dir (unlike 'exists'); the explicit "0 0"
        // silences the "Could not read" message on every miss -- the msg arg
        // defaults to INT_MIN, which is truthy.
        if (exec (concatword "harness/cmd_" $harnessseq ".cfg") 0 0) [
            harnessseq = (+ $harnessseq 1)
        ]

        // 'concat' bakes the generation in now; '@' substitution would be
        // nesting-depth dependent and brittle here.
        sleep 50 (concat harnesspoll $harnessgen)
    ]
]

// Bumping the generation makes any older poll chain retire itself, so this is
// safe to call again after a map load or any other interruption.
harnessrestart = [
    harnessgen = (+ $harnessgen 1)
    harnesspoll $harnessgen
]

// Screenshots come back black unless the window keeps rendering while unfocused.
renderunfocused 1

// The default 0.03 cursor is only a few pixels in a screenshot, which makes it
// hard to see where a synthetic click actually landed. These are persisted
// vars, but the harness runs in its own home dir so this cannot leak into a
// normal profile.
cursorsize     0.08
editcursorsize 0.08
speccursorsize 0.08
tvcursorsize   0.08

echo "HARNESS_READY"
harnessrestart
