// Task 4 verification.
//
// NOTE: the brief's original script here was `newmap 12`. As with Tasks 2 and
// 3 (see task2-eddumpstate.cfg), that is not a live entry point on a cold
// harness boot: `newmap` (src/engine/world.cpp emptymap()) requires editmode
// already true, which never holds right after boot.cfg. `edit <name>`
// (config/setup.cfg:29) is the real entry point -- it locally connects and
// loads/creates the named map -- after which `edittoggle` actually engages
// the editor.
edit task4_wrappers_test
sleep 500 [
    if (! $editing) [ edittoggle ]
    sleep 300 [
        echo (concatword "T4_CUBE=" (edselcube 512 512 512))
        echo (concatword "T4_HAVESEL=" $hassel)
        echo (concatword "T4_BOX=" (edselbox 512 512 512 2 2 2))
        echo (concatword "T4_OOB=" (edselbox -9999 -9999 -9999 1 1 1))
        eddumpstate
    ]
]
