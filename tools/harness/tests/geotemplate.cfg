// Helpers for tools/harness/geotemplate-selftest.ps1 (edit mode only: they
// select entities). Loaded with: exec "tools/harness/tests/geotemplate.cfg" 0 0

// 1:<type> -- number of entities of that type
geot_count = [
    local _n
    _n = 0
    entcancel
    entselect 1
    entloopread [if (=s (at (entget) 0) $arg1) [_n = (+ $_n 1)]]
    entcancel
    result $_n
]

// "type:count" for every entity type present, in order of first appearance
geot_hist = [
    local _types _counts _t _k
    _types = []
    _counts = []
    entcancel
    entselect 1
    entloopread [
        _t = (at (entget) 0)
        _k = (indexof $_types $_t)
        if (< $_k 0) [
            _types = (concat $_types $_t)
            _counts = (concat $_counts 1)
        ] [
            _counts = (listsplice $_counts (+ (at $_counts $_k) 1) $_k 1)
        ]
    ]
    entcancel
    result (loopconcat i (listlen $_types) [concatword (at $_types $i) ":" (at $_counts $i)])
]

// 1:<type> 2:<attrs> 3:<x> 4:<y> 5:<z> -- new entity at an exact position, returns its index
geot_newent = [
    local _i
    entcancel
    _i = (newent $arg1 $arg2)
    entpos $arg3 $arg4 $arg5
    entcancel
    result $_i
]

// 1:<index> 2:<x> 3:<y> 4:<z>
geot_moveent = [
    entcancel
    enttoggleidx $arg1
    entpos $arg2 $arg3 $arg4
    entcancel
]

// 1:<index> 2:<attr> 3:<value>
geot_setattr = [
    entcancel
    enttoggleidx $arg1
    entattr $arg2 $arg3
    entcancel
]

// 1:<index>
geot_delent = [
    entcancel
    enttoggleidx $arg1
    delent
    entcancel
]

// 1:<index> -- "type attr0 attr1 ..."
geot_get = [
    local _s
    entcancel
    enttoggleidx $arg1
    entloopread [_s = (entget)]
    entcancel
    result $_s
]

// 1:<type> [2:<position in "entget"> 3:<value>] -- index of the first entity of
// that type (whose entget field matches), or -1. Entity indices change when a
// map is saved and reloaded (the loaded entities come back ordered by type).
geot_find = [
    local _r _g
    _r = -1
    loop i 64 [
        if (< $_r 0) [
            _g = (geot_get $i)
            if (=s (at $_g 0) $arg1) [
                if (|| (=s $arg2 "") (=s (at $_g $arg2) $arg3)) [_r = $i]
            ]
        ]
    ]
    result $_r
]
