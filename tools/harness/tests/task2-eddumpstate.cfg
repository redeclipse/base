// Task 2 verification. Needs a loaded map and edit mode.
//
// NOTE: the brief's original script here was `newmap 12` followed by a
// conditional `edittoggle`. On a cold harness boot that never reaches edit
// mode: `newmap` (src/engine/world.cpp emptymap()) requires editmode already
// true, and `edittoggle` (src/engine/octaedit.cpp toggleedit()) requires
// connected() to be true first -- neither holds right after boot.cfg, which
// never connects. `edit <name>` is the real entry point the game's own "New
// Map" UI uses (config/ui/game/editor.cfg -> config/setup.cfg:29 `edit = [
// start $arg1 $G_EDITING $arg2 ]`): it locally connects, starts a G_EDITING
// game and loads/creates the named map, after which `edittoggle` (F2's bind)
// actually engages the editor. See task-2-report.md for the full trace.
edit task2_eddumpstate_test
sleep 500 [
    if (! $editing) [ edittoggle ]
    // Place a real entity so the EDENT hover/sel lines and the returned/
    // reported count get exercised too, not just the zero-entity case.
    sleep 300 [
        newent "playerstart" ""
        sleep 300 [ eddumpstate ]
    ]
]
