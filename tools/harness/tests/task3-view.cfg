// Task 3 verification. Needs a loaded map and edit mode.
//
// NOTE: the brief's original script here was `newmap 12`. As with Task 2
// (see task2-eddumpstate.cfg), that is not a live entry point on a cold
// harness boot: `newmap` (src/engine/world.cpp emptymap()) requires
// editmode already true, which never holds right after boot.cfg. `edit
// <name>` (config/setup.cfg:29) is the real entry point -- it locally
// connects and loads/creates the named map -- after which `edittoggle`
// actually engages the editor.
edit task3_view_test
sleep 500 [
    if (! $editing) [ edittoggle ]
    sleep 300 [
        edgoto 512 512 512
        edaim 90 0
        sleep 100 [
            echo (concatword "T3_POS=" $cameraposx " " $cameraposy " " $cameraposz)
            echo (concatword "T3_YAW=" $camerayaw " PITCH=" $camerapitch)
            edframe 512 512 512 100 0 0
            sleep 100 [
                echo (concatword "T3_FRAMEPOS=" $cameraposx " " $cameraposy " " $cameraposz)
                echo (concatword "T3_FRAMEYAW=" $camerayaw)
                echo (concatword "T3_BADENT=" (edlookatent 99999))
                // ednudge's "right" axis, at a known yaw where the answer is
                // hand-checkable: facing +Y (yaw 0), right is -X, so nudging
                // 64 right from x=512 must land at x=448, not 576.
                edgoto 512 512 512
                edaim 0 0
                sleep 100 [
                    ednudge 0 64 0
                    sleep 100 [
                        echo (concatword "T3_NUDGEX=" $cameraposx)
                    ]
                ]
            ]
        ]
    ]
]
