// Task 7 verification.
//
// NOTE: the brief's original script here was `newmap 12`. As with Task 2/3
// (see task2-eddumpstate.cfg, task3-view.cfg), that is not a live entry point
// on a cold harness boot: `newmap` (src/engine/world.cpp emptymap()) requires
// editmode already true, which never holds right after boot.cfg. `edit
// <name>` (config/setup.cfg:29) is the real entry point; `edh_enter` then
// engages the editor itself.
edit task7_editorcfg_test
sleep 500 [
    edh_enter
    sleep 300 [
        echo (concatword "T7_EDITING=" $editing)
        edh_cursor 1
        sleep 300 [
            echo (concatword "T7_FREE_ON=" (? $ui_freecursor 1 0))
            edh_cursor 1
            sleep 200 [
                echo (concatword "T7_IDEMPOTENT=" (? $ui_freecursor 1 0))
                edh_cursor 0
                sleep 300 [ echo (concatword "T7_FREE_OFF=" (? $ui_freecursor 1 0)) ]
            ]
        ]
    ]
]
