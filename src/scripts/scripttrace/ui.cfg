// loaded by client.cfg: a UI whose build, on-show and click handler fail
newui scripttrace $SURFACE_FOREGROUND [
    uizindex 100
    uiallowinput 1
    uitarget 0.6 0.6 [
        uirelease [
            nosuchclick
        ]
    ]
    nosuchbuild
] [
    sleep 100 [ nosuchtimer ]
    exec scripttrace/missing3.cfg 0 1
]
bindhelper = [
    nosuchbind
]
newui scripttracewarn $SURFACE_FOREGROUND [
    uihlistspace 0.1
]
