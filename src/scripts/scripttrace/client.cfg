// run by run.sh in the client: UI, timer, bind, console and map config origins, with and without dbgscriptlines
exec scripttrace/ui.cfg
bind F9 [ bindhelper ]
sleep 3000 [
    showui scripttrace
    inputcursor 0.5 0.5
    sleep 1000 [
        inputpress MOUSE1 100
        sleep 1000 [
            hideui scripttrace
            dbgscriptlines 1
            showui scripttrace
            sleep 1000 [
                inputpress MOUSE1 100
                sleep 1000 [
                    hideui scripttrace
                    dbgscriptlines 0
                    inputpress F9 100
                    sleep 500 [
                        inputpress BACKQUOTE 100
                        sleep 500 [
                            inputtext "nosuchconsole"
                            sleep 300 [
                                inputpress RETURN 100
                                sleep 1000 [
                                    map scripttrace
                                    sleep 4000 [ echo SCRIPTTRACE-DONE; quit ]
                                ]
                            ]
                        ]
                    ]
                ]
            ]
        ]
    ]
]
