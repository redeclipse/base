// run by run.sh in a dedicated server: errors while loading a file, in aliases it defines, and from commands
nosuchload
helper = [
    echo in helper
    nosuchhelper
]
outer = [
    // a comment line
    helper
]
outer
alias defined [nosuchdefined]
defined
lookup = [ echo $nosuchlookup ]
lookup
reader = [
    exec scripttrace/missing1.cfg 0 1
    exec scripttrace/missing2.cfg 0 1
]
reader
dbgalias 3
deep1 = [deep2]; deep2 = [deep3]; deep3 = [deep4]; deep4 = [nosuchdeep]
deep1
dbgalias 20
loop i 5 [ nosuchrepeat ]
nosuchafter
broken = [
    echo (
]
broken
nodebug [ nosuchquiet ]
dbgscript 0
nosuchoff
dbgscript 1
shadowed = [
    nosuchshadowed
]
do [ local shadowed; shadowed = [ echo a local ] ]
shadowed
echo stray )
echo SCRIPTTRACE-DONE
