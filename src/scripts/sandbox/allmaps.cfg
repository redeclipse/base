// run by allmaps.sh as the user: loads each map in sandboxmaps for a few seconds, so its config, triggers and composites run
sandboxnext = [
    if (listlen $sandboxmaps) [
        sandboxmap = (at $sandboxmaps 0)
        sandboxmaps = (sublist $sandboxmaps 1)
        echo SANDBOX-MAP $sandboxmap
        map $sandboxmap
        sleep 4000 [sandboxnext]
    ] [
        echo SANDBOX-DONE
        quit
    ]
]
sleep 3000 [sandboxnext]
