// run by run.sh as the user: loads the scratch map, whose config is the case, then checks the sentinel
// a case escapes the Sandbox when its Map script manages to bind F12, which Map script may never do
sleep 3000 [
    map sandbox
    sleep 4000 [
        if (>= (strlen $sandboxuser) 1) [exec $sandboxuser]
        sleep 1000 [
            echo (concatword "SANDBOX-RESULT " (? (strlen (getbind F12)) "ESCAPED " "CONTAINED ") (getbind F12))
            echo SANDBOX-DONE
            quit
        ]
    ]
]
