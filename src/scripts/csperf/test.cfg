// CubeScript benchmark scenes, run by drive.sh with -x"exec <this file>"
// each scene waits, prints CSPERF-START, measures for 12 seconds, then reports
// the csperf* commands only exist in a -DCSPERF build; the fps samples work in any build

csperfbegin = [
    screenshot
    echo (concat "CSPERF-START" $arg1)
    csfpstotal = 0
    csfpscount = 0
    if (identexists csperfreset) [csperfreset]
    csperfsample
]

csperfsample = [
    csfpstotal = (+ $csfpstotal (getfps))
    csfpscount = (+ $csfpscount 1)
    if (< $csfpscount 12) [sleep 1000 csperfsample]
]

csperfend = [
    echo (format "CSFPS %1 fps=%2" $arg1 (divf $csfpstotal (max $csfpscount 1)))
    if (identexists csperfreport) [csperfreport $arg1]
    if (identexists csperfdump) [csperfdump (concatword "csperf-" $arg1 ".txt")]
]

sleep 8000 [
    csperfbegin menu
    sleep 12000 [
        csperfend menu
        gameui_open ui_gameui_player
        sleep 3000 [
            csperfbegin player
            sleep 12000 [
                csperfend player
                gameui_open ui_gameui_maps
                sleep 3000 [
                    csperfbegin maps
                    sleep 12000 [
                        csperfend maps
                        mode 2 0; map bloodlust
                        sleep 12000 [
                            if (identexists csperfcam) [csperfcam]
                            csperfbegin match
                            sleep 12000 [csperfend match; quit]
                        ]
                    ]
                ]
            ]
        ]
    ]
]
