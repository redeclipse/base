// Example master server email templates.
// Copy this file to your master server's home directory and load it from servinit.cfg with:
//     exec "mail.cfg"
//
// Syntax: mastermaildef <type> [ subject ] [ text ] [ html ]
// Any block left empty falls back to the built-in default (or plain text only if [ html ] is empty).
// Leading and trailing whitespace on each line (and outer blank lines) is trimmed automatically.
// Dynamic values are passed as $arg1..$argN ($arg1 is the subject) and must be escaped with htmlescape in HTML.

mail_text_wrap = [
    format [
        %1
        --
        %2: %3
        Account: %3/account
        Discord: %3/discord
        Guidelines: %3/guidelines
        Privacy Policy: %3/privacy
        License: %3/license
        Trademark Policy: %3/trademark
    ] $arg1 $versionname (concatword "https://" $versionurl)
]

mail_html_wrap = [
    format [
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>%1</title>
            <style>
                body {
                    margin: 0;
                    padding: 0;
                    background-color: #340201;
                    color: #e6e6e6;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                    font-size: 16px;
                    font-weight: 400;
                    line-height: 1.6;
                    letter-spacing: 0.002em;
                }
                a, a:link, a:visited { color: #ff8080; text-decoration: none; }
                a:hover, a:active, a:focus { color: #fff0f0; text-decoration: underline; }
                h1 {
                    margin: 0 0 18px 0;
                    padding: 0 0 12px 0;
                    font-size: 20px;
                    font-weight: 600;
                    line-height: 1.3;
                    color: #ffb2b2;
                    text-shadow: -1px -1px 4px #ff0000;
                    border-bottom: 1px solid rgba(255, 160, 160, 0.18);
                }
                p { margin: 0 0 16px 0; color: #e6e6e6; }
                p.muted { color: #beaaaa; font-size: 13px; }
                strong { color: #f0e0e0; }
                code {
                    background-color: rgba(0, 0, 0, 0.5);
                    border: 1px solid rgba(255, 160, 160, 0.18);
                    border-radius: 3px;
                    padding: 1px 5px;
                    color: #f0e0e0;
                    font-size: 14px;
                }
                .outer {
                    width: 100%%;
                    background-color: #340201;
                    background-image: radial-gradient(ellipse at top, #5c0806 0%%, #340201 55%%, #1c0101 100%%);
                }
                .outer-cell { padding: 28px 12px; }
                .card {
                    width: 100%%;
                    max-width: 600px;
                    background-color: rgba(16, 16, 16, 0.92);
                    border: 1px solid #780000;
                    border-radius: 4px;
                    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
                    overflow: hidden;
                }
                .header {
                    padding: 20px 28px;
                    background-color: rgba(0, 0, 0, 0.35);
                    border-bottom: 1px solid #780000;
                }
                .header a { text-decoration: none; }
                .header img { display: block; margin: 0 auto; max-width: 100%%; height: auto; border: 0; }
                .content { padding: 24px 28px; color: #e6e6e6; }
                .cta { margin: 20px 0 16px 0; }
                .cta-cell {
                    background-color: #960000;
                    border: 1px solid #ff4040;
                    border-radius: 4px;
                }
                .cta-btn, .cta-btn:link, .cta-btn:visited {
                    display: inline-block;
                    padding: 9px 22px;
                    color: #ffffff;
                    font-weight: 600;
                    text-decoration: none;
                    font-size: 15px;
                }
                .cta-btn:hover { background-color: #be0000; color: #ffffff; text-decoration: none; }
                .fallback { color: #beaaaa; font-size: 12px; word-break: break-all; }
                .fallback a { word-break: break-all; text-decoration: underline; }
                .footer {
                    padding: 14px 24px;
                    background-color: #080808;
                    border-top: 1px solid rgba(255, 160, 160, 0.18);
                    color: #beaaaa;
                    font-size: 13px;
                    line-height: 1.6;
                }
                .footer a, .footer a:link, .footer a:visited { font-weight: 600; color: #ff6060; text-decoration: none; }
                .footer a:hover { color: #fff0f0; text-decoration: underline; }
                .footer .legal { font-size: 12px; }
                .footer .legal a, .footer .legal a:link, .footer .legal a:visited { font-weight: 400; color: #beaaaa; }
                .footer .legal a:hover { color: #fff0f0; text-decoration: underline; }
            </style>
        </head>
        <body bgcolor="#340201">
            <table class="outer" role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" bgcolor="#340201">
                <tr>
                    <td class="outer-cell" align="center">
                        <table class="card" role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" bgcolor="#101010">
                            <tr>
                                <td class="header" align="center" bgcolor="#0a0a0a">
                                    <a href="%3">
                                        <img src="%3/bits/regular.png" alt="%5" width="240">
                                    </a>
                                </td>
                            </tr>
                            <tr>
                                <td class="content">
                                    <h1>%1</h1>
                                    %2
                                </td>
                            </tr>
                            <tr>
                                <td class="footer" align="center" bgcolor="#080808">
                                    <strong>%5</strong> &middot;
                                    <a href="%3">%4</a> &middot;
                                    <a href="%3/account">Account</a> &middot;
                                    <a href="%3/discord">Discord</a><br>
                                    <span class="legal">
                                        <a href="%3/guidelines">Guidelines</a> &middot;
                                        <a href="%3/privacy">Privacy Policy</a> &middot;
                                        <a href="%3/license">License</a> &middot;
                                        <a href="%3/trademark">Trademark Policy</a>
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </body>
        </html>
    ] (htmlescape $arg1) $arg2 (htmlescape (concatword "https://" $versionurl)) (htmlescape $versionurl) (htmlescape $versionname)
]

mail_html_cta = [
    format [
        <table class="cta" role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td class="cta-cell" align="center" bgcolor="#960000">
                    <a class="cta-btn" href="%2">%1</a>
                </td>
            </tr>
        </table>
        <p class="fallback">
            Or copy this link:<br>
            <a href="%2">%2</a>
        </p>
    ] (htmlescape $arg1) (htmlescape $arg2)
]

mail_html_link = [
    format [<a href="%2">%1</a>] (htmlescape $arg1) (htmlescape $arg2)
]

// register: $arg1=subject, $arg2=handle, $arg3=days, $arg4=activateurl, $arg5=cancelurl, $arg6=game
mastermaildef "register" [
    format "Activate your %1 account %2" $versionname $arg2
] [
    mail_text_wrap (format [
        Hello,

        Someone, hopefully you, registered the %6 account "%1" with this email address.

        To activate it, follow this link within %2 days:
        %3

        Once it's activated, the page gives you the account's key and how to use it in the game.%4

        If this wasn't you, follow this link and the registration is removed straight away:
        %5

        Otherwise you can ignore this email, and the registration is removed after %2 days.
    ] $arg2 $arg3 $arg4 (? $arg6 " If the game you registered from is still running, it collects the key itself." "") $arg5 $versionname)
] [
    local game
    game = (? $arg6 " If the game you registered from is still running, it collects the key itself." "")
    mail_html_wrap $arg1 (format [
        <p>Hello,</p>
        <p>Someone, hopefully you, registered the %6 account <strong>%1</strong> with this email address.</p>
        <p>To activate it, follow the button below within %2 days:</p>
        %3
        <p>Once it's activated, the page gives you the account's key and how to use it in the game.%4</p>
        <p class="muted">If this wasn't you, %5 and the registration is removed straight away. Otherwise you can ignore this email, and the registration is removed after %2 days.</p>
    ] (htmlescape $arg2) $arg3 (mail_html_cta "Activate Account" $arg4) $game (mail_html_link "cancel this registration" $arg5) (htmlescape $versionname))
]

// reset: $arg1=subject, $arg2=handle, $arg3=hours, $arg4=reseturl
mastermaildef "reset" [
    format "Reset the key of your %1 account %2" $versionname $arg2
] [
    mail_text_wrap (format [
        Hello,

        Someone, hopefully you, asked for a new key for the %4 account "%1".

        To get one, follow this link within %2 hours:
        %3

        The new key replaces the old one, which stops working, and signs the account out of every browser and device that remembered it.

        If this wasn't you, ignore this email and nothing changes.
    ] $arg2 $arg3 $arg4 $versionname)
] [
    mail_html_wrap $arg1 (format [
        <p>Hello,</p>
        <p>Someone, hopefully you, asked for a new key for the %4 account <strong>%1</strong>.</p>
        <p>To get one, follow the button below within %2 hours:</p>
        %3
        <p>The new key replaces the old one, which stops working, and signs the account out of every browser and device that remembered it.</p>
        <p class="muted">If this wasn't you, ignore this email and nothing changes.</p>
    ] (htmlescape $arg2) $arg3 (mail_html_cta "Reset Account Key" $arg4) (htmlescape $versionname))
]

// server: $arg1=subject, $arg2=handle, $arg3=owner, $arg4=level, $arg5=days, $arg6=serverurl
mastermaildef "server" [
    format "%1 %2 server account %3" (? (strlen $arg4) "Your" "A new key for your") $versionname $arg2
] [
    local intro owner
    owner = (? (strlen $arg3) (format " (%1)" $arg3) "")
    if (strlen $arg4) [
        intro = (format [An administrator of the %3 master server made the server account "%1" with you%2 as its owner.] $arg2 $owner $versionname)
    ] [
        intro = (format [A new key was asked for the %2 server account "%1".] $arg2 $versionname)
    ]
    mail_text_wrap (format [
        Hello,

        %1

        To get its key, follow this link within %2 days:
        %3

        The page gives you a line to put in secrets.cfg in your server's home folder, which the server reads when it starts and on rehash, and signs in to the master server with.%4

        If you weren't expecting this, you can ignore this email, and the link stops working after %2 days.
    ] $intro $arg5 $arg6 (? (strlen $arg4) "" " The old key keeps working until you follow the link."))
] [
    local intro owner handle vname
    handle = (htmlescape $arg2)
    vname = (htmlescape $versionname)
    owner = (? (strlen $arg3) (format " (%1)" (htmlescape $arg3)) "")
    if (strlen $arg4) [
        intro = (format [An administrator of the %3 master server made the server account <strong>%1</strong> with you%2 as its owner.] $handle $owner $vname)
    ] [
        intro = (format [A new key was asked for the %2 server account <strong>%1</strong>.] $handle $vname)
    ]
    mail_html_wrap $arg1 (format [
        <p>Hello,</p>
        <p>%1</p>
        <p>To get its key, follow the button below within %2 days:</p>
        %3
        <p>The page gives you a line to put in <code>secrets.cfg</code> in your server's home folder, which the server reads when it starts and on rehash, and signs in to the master server with.%4</p>
        <p class="muted">If you weren't expecting this, you can ignore this email, and the link stops working after %2 days.</p>
    ] $intro $arg5 (mail_html_cta "Get Server Key" $arg6) (? (strlen $arg4) "" " The old key keeps working until you follow the link."))
]

// emailconfirm: $arg1=subject, $arg2=handle, $arg3=hours, $arg4=confirmurl
mastermaildef "emailconfirm" [
    format "Confirm the new email address of your %1 account %2" $versionname $arg2
] [
    mail_text_wrap (format [
        Hello,

        The %4 account "%1" asked to use this email address from now on.

        To confirm it, follow this link within %2 hours:
        %3

        If this wasn't you, ignore this email and nothing changes.
    ] $arg2 $arg3 $arg4 $versionname)
] [
    mail_html_wrap $arg1 (format [
        <p>Hello,</p>
        <p>The %4 account <strong>%1</strong> asked to use this email address from now on.</p>
        <p>To confirm it, follow the button below within %2 hours:</p>
        %3
        <p class="muted">If this wasn't you, ignore this email and nothing changes.</p>
    ] (htmlescape $arg2) $arg3 (mail_html_cta "Confirm Email Address" $arg4) (htmlescape $versionname))
]

// emailcancel: $arg1=subject, $arg2=handle, $arg3=newemail, $arg4=cancelurl
mastermaildef "emailcancel" [
    format "The email address of your %1 account %2 is changing" $versionname $arg2
] [
    mail_text_wrap (format [
        Hello,

        The %4 account "%1" asked to use another email address, %2, instead of this one. It changes once that address confirms it.

        If this wasn't you, follow this link to stop it, then reset the account's key to sign out whoever asked:
        %3
    ] $arg2 $arg3 $arg4 $versionname)
] [
    mail_html_wrap $arg1 (format [
        <p>Hello,</p>
        <p>The %4 account <strong>%1</strong> asked to use another email address, <strong>%2</strong>, instead of this one. It changes once that address confirms it.</p>
        <p>If this wasn't you, follow the button below to stop it, then reset the account's key to sign out whoever asked:</p>
        %3
    ] (htmlescape $arg2) (htmlescape $arg3) (mail_html_cta "Stop Email Change" $arg4) (htmlescape $versionname))
]

// deleted: $arg1=subject, $arg2=handle
mastermaildef "deleted" [
    format "Your %1 account %2 was deleted" $versionname $arg2
] [
    mail_text_wrap (format [
        Hello,

        The %2 account "%1" was deleted, as asked for by someone signed in to it. Its key no longer works, and its handle is free for anyone to register.
    ] $arg2 $versionname)
] [
    mail_html_wrap $arg1 (format [
        <p>Hello,</p>
        <p>The %2 account <strong>%1</strong> was deleted, as asked for by someone signed in to it. Its key no longer works, and its handle is free for anyone to register.</p>
    ] (htmlescape $arg2) (htmlescape $versionname))
]

// test: $arg1=subject, $arg2=by
mastermaildef "test" [
    format "%1 master server test" $versionname
] [
    mail_text_wrap (format [
        This is a test from the %2 master server, asked for by %1.
    ] $arg2 $versionname)
] [
    mail_html_wrap $arg1 (format [
        <p>This is a test from the %2 master server, asked for by <strong>%1</strong>.</p>
    ] (htmlescape $arg2) (htmlescape $versionname))
]
