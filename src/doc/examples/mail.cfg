// Example master server email templates.
// Copy this file to your master server's home directory and load it from servinit.cfg with:
//     exec "mail.cfg"
//
// Syntax: mastermaildef <type> [ subject ] [ text ] [ html ]
// Any block left empty falls back to the built-in default (or plain text only if [ html ] is empty).
// Leading and trailing whitespace on each line (and outer blank lines) is trimmed automatically.
// Dynamic values are passed as $arg1..$argN ($arg1 is the subject) and must be escaped with htmlescape in HTML.

mail_site_url = "https://www.redeclipse.net"

mail_html_wrap = [
    format [
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>%1</title>
        </head>
        <body style="margin:0;padding:0;background-color:#340201;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;">
            <table role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" style="background-color:#340201;">
                <tr>
                    <td align="center" style="padding:24px 12px;">
                        <table role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#140606;border:1px solid #5a1a1a;border-radius:6px;">
                            <tr>
                                <td align="center" style="padding:24px 28px 18px 28px;border-bottom:1px solid #5a1a1a;">
                                    <a href="https://www.redeclipse.net" style="text-decoration:none;">
                                        <img src="https://www.redeclipse.net/bits/redeclipse-regular.png" alt="Red Eclipse" width="260" style="display:block;margin:0 auto;max-width:100%%;height:auto;border:0;">
                                    </a>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:24px 28px;color:#e6e6e6;">
                                    %2
                                </td>
                            </tr>
                            <tr>
                                <td align="center" style="padding:16px 28px;border-top:1px solid #5a1a1a;color:#beaaaa;font-size:12px;line-height:1.7;">
                                    Red Eclipse &middot;
                                    <a href="https://www.redeclipse.net" style="color:#ff8080;text-decoration:none;">www.redeclipse.net</a> &middot;
                                    <a href="https://www.redeclipse.net/account" style="color:#ff8080;text-decoration:none;">Account</a> &middot;
                                    <a href="https://www.redeclipse.net/discord" style="color:#ff8080;text-decoration:none;">Discord</a><br>
                                    <a href="https://www.redeclipse.net/guidelines" style="color:#beaaaa;text-decoration:underline;">Guidelines</a> &middot;
                                    <a href="https://www.redeclipse.net/privacy" style="color:#beaaaa;text-decoration:underline;">Privacy Policy</a> &middot;
                                    <a href="https://www.redeclipse.net/license" style="color:#beaaaa;text-decoration:underline;">License</a> &middot;
                                    <a href="https://www.redeclipse.net/trademark" style="color:#beaaaa;text-decoration:underline;">Trademark Policy</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </body>
        </html>
    ] (htmlescape $arg1) $arg2
]

mail_html_cta = [
    format [
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0 16px 0;">
            <tr>
                <td align="center" style="background-color:#960000;border:1px solid #ff4040;border-radius:4px;">
                    <a href="%2" style="display:inline-block;padding:10px 22px;color:#ffffff;font-weight:bold;text-decoration:none;font-size:15px;">%1</a>
                </td>
            </tr>
        </table>
        <p style="margin:0 0 16px 0;color:#beaaaa;font-size:12px;word-break:break-all;">
            Or copy this link:<br>
            <a href="%2" style="color:#ff8080;text-decoration:underline;word-break:break-all;">%2</a>
        </p>
    ] (htmlescape $arg1) (htmlescape $arg2)
]

mail_html_link = [
    format [<a href="%2" style="color:#ff8080;text-decoration:underline;">%1</a>] (htmlescape $arg1) (htmlescape $arg2)
]

// register: $arg1=subject, $arg2=handle, $arg3=days, $arg4=activateurl, $arg5=cancelurl, $arg6=game
mastermaildef "register" [
    format "Activate your Red Eclipse account %1" $arg2
] [
    format [
        Hello,

        Someone, hopefully you, registered the Red Eclipse account "%1" with this email address.

        To activate it, follow this link within %2 days:
        %3

        Once it's activated, the page gives you the account's key and how to use it in the game.%4

        If this wasn't you, follow this link and the registration is removed straight away:
        %5

        Otherwise you can ignore this email, and the registration is removed after %2 days.

        Red Eclipse
        %6
    ] $arg2 $arg3 $arg4 (? $arg6 " If the game you registered from is still running, it collects the key itself." "") $arg5 $mail_site_url
] [
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Hello,</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Someone, hopefully you, registered the Red Eclipse account <strong>%1</strong> with this email address.</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">To activate it, follow the button below within %2 days:</p>
        %3
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Once it's activated, the page gives you the account's key and how to use it in the game.%4</p>
        <p style="margin:0 0 16px 0;color:#beaaaa;font-size:13px;">If this wasn't you, %5 and the registration is removed straight away. Otherwise you can ignore this email, and the registration is removed after %2 days.</p>
    ] (htmlescape $arg2) $arg3 (mail_html_cta "Activate Account" $arg4) (? $arg6 " If the game you registered from is still running, it collects the key itself." "") (mail_html_link "cancel this registration" $arg5))
]

// reset: $arg1=subject, $arg2=handle, $arg3=hours, $arg4=reseturl
mastermaildef "reset" [
    format "Reset the key of your Red Eclipse account %1" $arg2
] [
    format [
        Hello,

        Someone, hopefully you, asked for a new key for the Red Eclipse account "%1".

        To get one, follow this link within %2 hours:
        %3

        The new key replaces the old one, which stops working, and signs the account out of every browser and device that remembered it.

        If this wasn't you, ignore this email and nothing changes.

        Red Eclipse
        %4
    ] $arg2 $arg3 $arg4 $mail_site_url
] [
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Hello,</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Someone, hopefully you, asked for a new key for the Red Eclipse account <strong>%1</strong>.</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">To get one, follow the button below within %2 hours:</p>
        %3
        <p style="margin:0 0 16px 0;color:#e6e6e6;">The new key replaces the old one, which stops working, and signs the account out of every browser and device that remembered it.</p>
        <p style="margin:0 0 16px 0;color:#beaaaa;font-size:13px;">If this wasn't you, ignore this email and nothing changes.</p>
    ] (htmlescape $arg2) $arg3 (mail_html_cta "Reset Account Key" $arg4))
]

// server: $arg1=subject, $arg2=handle, $arg3=owner, $arg4=level, $arg5=days, $arg6=serverurl
mastermaildef "server" [
    format "%1 Red Eclipse server account %2" (? (strlen $arg4) "Your" "A new key for your") $arg2
] [
    local intro owner
    owner = (? (strlen $arg3) (format " (%1)" $arg3) "")
    if (strlen $arg4) [
        intro = (format [An administrator of the Red Eclipse master server made the server account "%1" with you%2 as its owner.] $arg2 $owner)
    ] [
        intro = (format [A new key was asked for the Red Eclipse server account "%1".] $arg2)
    ]
    format [
        Hello,

        %1

        To get its key, follow this link within %2 days:
        %3

        The page gives you a line to put in secrets.cfg in your server's home folder, which the server reads when it starts and on rehash, and signs in to the master server with.%4

        If you weren't expecting this, you can ignore this email, and the link stops working after %2 days.

        Red Eclipse
        %5
    ] $intro $arg5 $arg6 (? (strlen $arg4) "" " The old key keeps working until you follow the link.") $mail_site_url
] [
    local intro owner handle
    handle = (htmlescape $arg2)
    owner = (? (strlen $arg3) (format " (%1)" (htmlescape $arg3)) "")
    if (strlen $arg4) [
        intro = (format [An administrator of the Red Eclipse master server made the server account <strong>%1</strong> with you%2 as its owner.] $handle $owner)
    ] [
        intro = (format [A new key was asked for the Red Eclipse server account <strong>%1</strong>.] $handle)
    ]
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Hello,</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">%1</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">To get its key, follow the button below within %2 days:</p>
        %3
        <p style="margin:0 0 16px 0;color:#e6e6e6;">The page gives you a line to put in <code>secrets.cfg</code> in your server's home folder, which the server reads when it starts and on rehash, and signs in to the master server with.%4</p>
        <p style="margin:0 0 16px 0;color:#beaaaa;font-size:13px;">If you weren't expecting this, you can ignore this email, and the link stops working after %2 days.</p>
    ] $intro $arg5 (mail_html_cta "Get Server Key" $arg6) (? (strlen $arg4) "" " The old key keeps working until you follow the link."))
]

// emailconfirm: $arg1=subject, $arg2=handle, $arg3=hours, $arg4=confirmurl
mastermaildef "emailconfirm" [
    format "Confirm the new email address of your Red Eclipse account %1" $arg2
] [
    format [
        Hello,

        The Red Eclipse account "%1" asked to use this email address from now on.

        To confirm it, follow this link within %2 hours:
        %3

        If this wasn't you, ignore this email and nothing changes.

        Red Eclipse
        %4
    ] $arg2 $arg3 $arg4 $mail_site_url
] [
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Hello,</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">The Red Eclipse account <strong>%1</strong> asked to use this email address from now on.</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">To confirm it, follow the button below within %2 hours:</p>
        %3
        <p style="margin:0 0 16px 0;color:#beaaaa;font-size:13px;">If this wasn't you, ignore this email and nothing changes.</p>
    ] (htmlescape $arg2) $arg3 (mail_html_cta "Confirm Email Address" $arg4))
]

// emailcancel: $arg1=subject, $arg2=handle, $arg3=newemail, $arg4=cancelurl
mastermaildef "emailcancel" [
    format "The email address of your Red Eclipse account %1 is changing" $arg2
] [
    format [
        Hello,

        The Red Eclipse account "%1" asked to use another email address, %2, instead of this one. It changes once that address confirms it.

        If this wasn't you, follow this link to stop it, then reset the account's key to sign out whoever asked:
        %3

        Red Eclipse
        %4
    ] $arg2 $arg3 $arg4 $mail_site_url
] [
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Hello,</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">The Red Eclipse account <strong>%1</strong> asked to use another email address, <strong>%2</strong>, instead of this one. It changes once that address confirms it.</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">If this wasn't you, follow the button below to stop it, then reset the account's key to sign out whoever asked:</p>
        %3
    ] (htmlescape $arg2) (htmlescape $arg3) (mail_html_cta "Stop Email Change" $arg4))
]

// deleted: $arg1=subject, $arg2=handle
mastermaildef "deleted" [
    format "Your Red Eclipse account %1 was deleted" $arg2
] [
    format [
        Hello,

        The Red Eclipse account "%1" was deleted, as asked for by someone signed in to it. Its key no longer works, and its handle is free for anyone to register.

        Red Eclipse
        %2
    ] $arg2 $mail_site_url
] [
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">Hello,</p>
        <p style="margin:0 0 16px 0;color:#e6e6e6;">The Red Eclipse account <strong>%1</strong> was deleted, as asked for by someone signed in to it. Its key no longer works, and its handle is free for anyone to register.</p>
    ] (htmlescape $arg2))
]

// test: $arg1=subject, $arg2=by
mastermaildef "test" [
    result "Red Eclipse master server test"
] [
    format [
        This is a test from the Red Eclipse master server, asked for by %1.
    ] $arg2
] [
    mail_html_wrap $arg1 (format [
        <p style="margin:0 0 16px 0;color:#e6e6e6;">This is a test from the Red Eclipse master server, asked for by <strong>%1</strong>.</p>
    ] (htmlescape $arg2))
]
